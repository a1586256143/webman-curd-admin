ard) {\n                    $card-&gt;descriptions(function (Descriptions $d) {\n                        $d-&gt;border(true)-&gt;column(2);\n                        $d-&gt;item(&#39;账户名称&#39;, &#39;{{info.name}}&#39;);\n                        $d-&gt;item(&#39;接入渠道&#39;, &#39;{{info.channel_text}}&#39;);\n                    });\n                });\n            });\n        });\n\n        $page-&gt;row(function (Row $row) {                  // 第二行：接口凭证\n            $row-&gt;col(24, function (Col $col) {\n                $col-&gt;card(&#39;接口凭证&#39;, function (Card $card) {\n                    $card-&gt;copyText(&#39;{{info.api_key}}&#39;, &#39;Api Key&#39;);   // 等宽 + 一键复制\n                    $card-&gt;alert(null, &#39;{{info.notice}}&#39;)\n                        -&gt;type(&#39;{{info.notice_type}}&#39;)-&gt;closable(false);\n                });\n            });\n        });\n\n        return $page;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 数据接口\u003c/strong> \u003ccode>GET /api/schema/my-info\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function myInfo(Request $request)\n{\n    $user = $request-&gt;user;                               // AuthCheck 注入的登录用户\n    $row  = HfPlatformAccount::query()\n        -&gt;where(&#39;account&#39;, (string)$user-&gt;username)       // 归属口径：account = 登录用户名\n        -&gt;where(&#39;status&#39;, 1)\n        -&gt;first();\n\n    return json([&#39;code&#39; =&gt; 200, &#39;msg&#39; =&gt; &#39;ok&#39;, &#39;data&#39; =&gt; $row ? [\n        &#39;username&#39;    =&gt; (string)$user-&gt;username,\n        &#39;account&#39;     =&gt; (string)$row-&gt;account,\n        &#39;name&#39;        =&gt; (string)$row-&gt;name,\n        &#39;api_key&#39;     =&gt; (string)$row-&gt;api_key,\n        &#39;amount&#39;      =&gt; round((float)$row-&gt;amount, 2),   // statistic 要数字\n        &#39;channel_text&#39;=&gt; &#39;中核英科&#39;,\n        &#39;notice_type&#39; =&gt; &#39;info&#39;,\n        &#39;notice&#39;      =&gt; &#39;Api Key 是接口调用的唯一凭证，请勿泄露。&#39;,\n    ] : [\n        &#39;username&#39;    =&gt; (string)$user-&gt;username,\n        &#39;account&#39;     =&gt; &#39;—&#39;, &#39;name&#39; =&gt; &#39;—&#39;, &#39;api_key&#39; =&gt; &#39;—&#39;, &#39;amount&#39; =&gt; 0,\n        &#39;channel_text&#39;=&gt; &#39;—&#39;,\n        &#39;notice_type&#39; =&gt; &#39;warning&#39;,\n        &#39;notice&#39;      =&gt; &#39;未找到与登录账号「&#39; . $user-&gt;username . &#39;」关联的平台账户，请联系管理员开通。&#39;,\n    ]]);\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 注册两处\u003c/strong>（宿主 \u003ccode>config/route.php\u003c/code>）\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 顶部：页面声明（页面引擎在插件，业务侧只声明）\nPageRegistry::register(&#39;my-info&#39;, [\\app\\controller\\admin\\api\\page\\MyInfoPage::class, &#39;schema&#39;]);\n\n// /api 分组内：数据接口（自动带 AuthCheck + PermissionCheck）\nRoute::get(&#39;/schema/my-info&#39;, [\\app\\controller\\admin\\api\\SchemaPageDataController::class, &#39;myInfo&#39;]);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>④ 建菜单\u003c/strong>：菜单管理页新增一条，\u003ccode>path = /custom-page/my-info\u003c/code>（\u003ccode>php start.php restart\u003c/code> 后生效）。\u003c/p>\n\u003cp>\u003cstrong>⑤ 访问\u003c/strong>：\u003ccode>http://&lt;宿主域名&gt;/app/curd/custom-page/my-info\u003c/code>，或直接点侧边栏菜单。\u003c/p>\n\u003cp>两个设计要点：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Schema 没有逻辑分支\u003c/strong>：页面结构固定，&quot;有没有账户&quot;由数据接口返回占位值 + \u003ccode>notice/notice_type\u003c/code> 表达。\n连 \u003ccode>alert\u003c/code> 的 \u003ccode>type\u003c/code> 都能用占位符（\u003ccode>-&gt;type(&#39;{{info.notice_type}}&#39;)\u003c/code>），所以同一套结构既能显示 info 提示，\n也能显示 warning 警告，页面代码完全不用改；\u003c/li>\n\u003cli>\u003cstrong>权限天然够用\u003c/strong>：\u003ccode>/api/custom/\u003c/code> 与 \u003ccode>/api/schema/\u003c/code> 在 \u003ccode>PermissionCheck\u003c/code> 白名单内（仅要求登录），\n因此任何账号都能打开这一页、看到自己那条数据，\u003cstrong>不需要额外配权限节点\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-48\">3. CURD 业务页 DSL\u003c/h2>\n\u003ch3 id=\"h-49\">3.1 新增一个 CURD 页（五步）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Model\u003c/strong>（业务 \u003ccode>app/model/\u003c/code>）：extends 平台 BaseModel、设 \u003ccode>$table\u003c/code>，必要时加常量字典；\u003c/li>\n\u003cli>\u003cstrong>Controller\u003c/strong>（业务 \u003ccode>app/controller/admin/api/\u003c/code>）：extends \u003ccode>BaseAdminController\u003c/code>，声明 \u003ccode>$modelClass / $title\u003c/code>，实现 \u003ccode>grid()\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>路由\u003c/strong>（业务 \u003ccode>config/route.php\u003c/code>）：\u003ccode>RouteControllerRegistry::registerMany([&#39;/xxx&#39; =&gt; XxxController::class])\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>菜单\u003c/strong>：\u003ccode>php webman make:permission --name … --slug … --type 1 --path /xxx --icon … --sort n\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>功能声明\u003c/strong>：全部在 \u003ccode>grid()\u003c/code> 里流式拼装（列/搜索/表单/操作/汇总/导出开关）。\u003c/li>\n\u003c/ol>\n\u003cp>参考完整实现：\u003ccode>app/controller/admin/api/MROrdersController.php\u003c/code>（话费订单）。\u003c/p>\n\u003ch3 id=\"h-50\">3.2 控制器骨架\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">class MROrdersController extends BaseAdminController\n{\n    protected string $modelClass = MobileRechargeOrder::class;  // ① 模型（grid 支持传 model，可不写 model()）\n    protected string $title = &#39;话费订单&#39;;\n\n    protected function grid(): Grid\n    {\n        $grid = new Grid(new MobileRechargeOrder(), $this-&gt;title);\n        $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);                   // ② 列表默认排序\n\n        // ③ 列 / 搜索 / 表单 / 操作 / 汇总 ……\n        return $grid;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-51\">3.3 常用列 \u003ccode>grid()-&gt;column($prop, $label)\u003c/code>\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>-&gt;width(int)\u003c/code> / \u003ccode>-&gt;minWidth(int)\u003c/code> / \u003ccode>-&gt;align(&#39;center&#39;)\u003c/code> / \u003ccode>-&gt;fixed(&#39;right&#39;)\u003c/code>\u003c/td>\n\u003ctd>布局\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;map([0=&gt;&#39;否&#39;,1=&gt;&#39;是&#39;])\u003c/code>\u003c/td>\n\u003ctd>值→文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;label([0=&gt;&#39;danger&#39;,1=&gt;&#39;success&#39;])\u003c/code>\u003c/td>\n\u003ctd>值→el-tag 颜色（配合 map 成徽标）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;display(fn() =&gt; …)\u003c/code>\u003c/td>\n\u003ctd>自定义渲染：回调内 \u003ccode>$this\u003c/code> 即当前行，可访问 \u003ccode>$this-&gt;status\u003c/code> 等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;prefix(&#39;￥&#39;)\u003c/code>\u003c/td>\n\u003ctd>前缀文案（金额）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;datetime()\u003c/code> / \u003ccode>-&gt;date()\u003c/code>\u003c/td>\n\u003ctd>时间格式化显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;image(int $w, int $h)\u003c/code> / \u003ccode>-&gt;staticHost()\u003c/code> / \u003ccode>-&gt;open(&#39;_blank&#39;)\u003c/code>\u003c/td>\n\u003ctd>图片列 / 静态资源 host / 点击新窗口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;href(...)\u003c/code> / \u003ccode>-&gt;href(callable)\u003c/code>\u003c/td>\n\u003ctd>单元格链接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;switch()\u003c/code>\u003c/td>\n\u003ctd>行内开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;remote($table, $valueKey=&#39;id&#39;, $labelKey=&#39;name&#39;)\u003c/code>\u003c/td>\n\u003ctd>关联表翻译（跨库由统一接口代替时自行 display）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;limit(int)\u003c/code>（截断）、\u003ccode>-&gt;hidden()\u003c/code>（默认隐藏可配置显示）、\u003ccode>-&gt;sortable()\u003c/code>\u003c/td>\n\u003ctd>其它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;editable($type=&#39;input&#39;, $options)\u003c/code>\u003c/td>\n\u003ctd>单元格编辑\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-52\">3.4 搜索 \u003ccode>grid()-&gt;filter(callable)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;like(&#39;remark&#39;, &#39;备注&#39;);                       // 模糊\n    $filter-&gt;equal(&#39;mobile&#39;, &#39;手机号&#39;);                    // 精确\n    $filter-&gt;select(&#39;status&#39;, &#39;状态&#39;)-&gt;options(self::STATUS); // 下拉\n    $filter-&gt;dateRange(&#39;created_at&#39;, &#39;创建时间&#39;);          // 日期区间\n    $filter-&gt;between(&#39;money&#39;, &#39;充值金额&#39;);                 // 数值区间\n    $filter-&gt;where(function ($q, $v) { … }, &#39;自定义&#39;, &#39;prop&#39;); // 任意条件（prop 传空为只读标签项）\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-53\">3.5 表单 \u003ccode>grid()-&gt;form(callable)\u003c/code>（新增+编辑共用）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;mobile&#39;, &#39;手机号&#39;)-&gt;required()-&gt;rules(&#39;required|regex:/^\\d+$/|min:11&#39;);\n    $form-&gt;select(&#39;platform&#39;, &#39;充值平台&#39;)-&gt;options(self::PLATFORM)-&gt;default(2);\n    $form-&gt;number(&#39;money&#39;, &#39;充值金额&#39;)-&gt;default(0)-&gt;min(0);\n    $form-&gt;textarea(&#39;remark&#39;, &#39;备注&#39;);\n    $form-&gt;datetime(&#39;created_at&#39;, &#39;时间&#39;);\n    $form-&gt;switch(&#39;new_system&#39;, &#39;新系统&#39;);\n    $form-&gt;remote(&#39;business_id&#39;, &#39;业务&#39;, &#39;a_businesses&#39;, &#39;id&#39;, &#39;name&#39;); // 远程下拉\n});\n\u003c/code>\u003c/pre>\n\u003cp>字段通用链式能力（\u003ccode>Field\u003c/code>）：\u003ccode>required / placeholder / help / default / addDefault / editDefault / disabled / addDisabled / editDisabled / hidden / addHidden / addOnly / editOnly / options(map) / multiple / filterable / span / full / row / rules / min / max / step / config(extra)\u003c/code>，支持\u003cstrong>动态显隐\u003c/strong>：\u003ccode>-&gt;when(父值, cb)\u003c/code> / \u003ccode>-&gt;addVisibleWhen([...])\u003c/code>。\n其中 \u003ccode>addOnly()\u003c/code> = 仅新增场景展示并提交、\u003ccode>editOnly()\u003c/code> = 仅编辑场景（也可以用 \u003ccode>if ($form-&gt;isCreate())\u003c/code> 包裹字段，见 3.5.1，效果等价且更好读）。\u003c/p>\n\u003cp>表单级：\u003ccode>$form-&gt;columns(int)\u003c/code>（栅格列数）、\u003ccode>$form-&gt;width/height\u003c/code>、\u003ccode>confirm\u003c/code>、\u003ccode>isCreate()\u003c/code> / \u003ccode>isEdit()\u003c/code>（\u003cstrong>场景判断，写在 \u003ccode>if\u003c/code> 里\u003c/strong>，见 3.5.1）；\u003ccode>Grid::addForm / editForm\u003c/code> 可拆分新增/编辑差异、\u003ccode>setFormTabs / setFormSteps\u003c/code> 分 Tab/分步。\u003c/p>\n\u003ch4 id=\"h-54\">3.5.1 场景字段控制：\u003ccode>if ($form-&gt;isCreate())\u003c/code> / \u003ccode>if ($form-&gt;isEdit())\u003c/code>\u003c/h4>\n\u003cp>\u003cstrong>推荐写法\u003c/strong>：把字段注册包在 \u003ccode>if\u003c/code> 里，按场景条件注册。\u003cstrong>场景块内声明的字段自动变成「仅该场景」\u003c/strong>（等价于在字段上挂 \u003ccode>-&gt;addOnly()\u003c/code> / \u003ccode>-&gt;editOnly()\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;account&#39;, &#39;账户&#39;)-&gt;required();   // 块外：两个场景都有\n    $form-&gt;text(&#39;name&#39;, &#39;名称&#39;)-&gt;required();\n\n    if ($form-&gt;isCreate()) {\n        $form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;required(); // 仅新增弹窗\n    }\n    if ($form-&gt;isEdit()) {\n        $form-&gt;text(&#39;amount&#39;, &#39;金额&#39;)-&gt;required();   // 仅编辑弹窗\n    }\n});\n\u003c/code>\u003c/pre>\n\u003cp>效果：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>弹窗\u003c/th>\n\u003cth>渲染 / 提交的字段\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新增\u003c/td>\n\u003ctd>account、name、password\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑\u003c/td>\n\u003ctd>account、name、amount\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>块外字段两个场景共用，\u003cstrong>不需要任何白名单\u003c/strong>：以后新增字段也不会&quot;漏字段&quot;（这正是白名单写法最容易踩的坑）。\u003c/li>\n\u003cli>前端不渲染、不回显、不提交；后端 \u003ccode>add()/update()\u003c/code> 按同一份配置剔除，校验规则同步收敛 —— 抓包往 \u003ccode>update\u003c/code> 强塞 \u003ccode>password=xxx\u003c/code> 也写不进库。\u003c/li>\n\u003cli>\u003ccode>if / else\u003c/code> 同样支持（\u003ccode>else\u003c/code> 块里的字段自动成为另一个场景专属）。\u003c/li>\n\u003cli>未指定场景时（如 \u003ccode>Action::form()\u003c/code> 的行级弹窗只有一份表单）两个判断都返回 \u003ccode>true\u003c/code>，两段都注册。\u003c/li>\n\u003cli>回调里\u003cstrong>没用\u003c/strong>场景判断时只执行一次回调，行为与开销和以前完全一致（用到时才会按另一个场景多执行一次再合并）。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>兼容旧写法（场景白名单）\u003c/strong>：\u003ccode>isCreate(...)\u003c/code> / \u003ccode>isEdit(...)\u003c/code> 传字段名时仍是白名单语义 —— 该场景\u003cstrong>只\u003c/strong>保留列出的字段，支持可变参数、数组、回调动态控制：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;mobile&#39;, &#39;手机号&#39;);\n    $form-&gt;text(&#39;price&#39;, &#39;价格&#39;);\n    $form-&gt;hidden(&#39;uid&#39;, &#39;UID&#39;);\n\n    $form-&gt;isCreate(&#39;mobile&#39;);                 // 创建时：仅展示/提交 mobile（price 不存在）\n    $form-&gt;isEdit(&#39;mobile&#39;, &#39;price&#39;);          // 编辑时：展示/提交 mobile + price\n    // $form-&gt;isCreate([&#39;mobile&#39;]);            // 数组写法等价\n    // $form-&gt;isCreate(fn($ctx) =&gt; [&#39;mobile&#39;]);// 回调动态控制，$ctx = [&#39;mode&#39; =&gt; &#39;create&#39;|&#39;edit&#39;]\n});\n\u003c/code>\u003c/pre>\n\u003cp>未声明的场景不限制（全部字段可用）；不传字段时按 \u003ccode>if\u003c/code> 判断语义（返回 \u003ccode>true/false\u003c/code>）。\u003c/p>\n\u003cp>\u003cstrong>严格提交（前端 + 后端双端生效）：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>场景专属字段 + 白名单外字段即提交范围\u003c/strong>：不渲染、不初始化、不提交；即使恶意客户端多提交，后端 \u003ccode>add()/update()\u003c/code> 保存前也会按同一份配置剔除，校验规则同步剔除（不会因被剔除的 required 字段而报错）。\u003c/li>\n\u003cli>\u003cstrong>disabled 不提交\u003c/strong>：\u003ccode>-&gt;disabled()\u003c/code> / \u003ccode>-&gt;addDisabled()\u003c/code> / \u003ccode>-&gt;editDisabled()\u003c/code> 生效的场景中，该字段 UI 禁用且\u003cstrong>不参与提交\u003c/strong>（前端 \u003ccode>sanitizeFormData\u003c/code> 剔除 + 后端白名单剔除）。只读展示需求照常满足，且杜绝&quot;前端禁用、抓包改值&quot;绕过。\u003c/li>\n\u003cli>\u003cstrong>例外\u003c/strong>：\u003ccode>$form-&gt;hidden(&#39;prop&#39;, ...)\u003c/code> 声明的隐藏提交字段（顶层 \u003ccode>hidden=true\u003c/code>）不受白名单/禁用影响，始终随表单提交；但它若声明在场景块内，仍只在所属场景提交。\u003c/li>\n\u003cli>条件字段（\u003ccode>-&gt;when()\u003c/code>）如需在受限场景使用，应把字段名写进白名单（或用 \u003ccode>if\u003c/code> 写法包裹）；其可见性仍由父字段值在前端实时控制。\u003c/li>\n\u003cli>数组写法的继承式控制器（\u003ccode>actions()\u003c/code> 同级的 \u003ccode>formFields()\u003c/code> 数组）可在返回的 config 里自带 \u003ccode>sceneShow: {create: [...], edit: [...]}\u003c/code> 键，前端同样生效。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>三种写法的区别，别搞混\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需求\u003c/th>\n\u003cth>正确写法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>按场景条件注册字段（\u003cstrong>推荐\u003c/strong>）\u003c/td>\n\u003ctd>\u003ccode>if ($form-&gt;isCreate()) { $form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;required(); }\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Form 级判断\u003c/strong>：块内字段自动「仅该场景」，块外字段共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某场景\u003cstrong>只\u003c/strong>要这几个字段\u003c/td>\n\u003ctd>\u003ccode>$form-&gt;isCreate(&#39;a&#39;, &#39;b&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Form 级白名单\u003c/strong>：列出的才展示/提交，没列的一律不展示不提交（\u003cstrong>列多了反而漏字段\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>某一个字段\u003c/strong>只在新增 / 只在编辑出现\u003c/td>\n\u003ctd>\u003ccode>$form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;addOnly()\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>字段级\u003c/strong>：\u003ccode>addOnly()\u003c/code> = 仅新增，\u003ccode>editOnly()\u003c/code> = 仅编辑（与 \u003ccode>if\u003c/code> 写法等价，适合不想改结构的场景）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>常见误写：\u003ccode>$form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;isCreate()\u003c/code> —— \u003ccode>isCreate()/isEdit()\u003c/code> 只存在于 \u003cstrong>Form\u003c/strong> 上，\n挂在 Field 上会抛 \u003ccode>Call to undefined method plugin\\curd\\app\\dsl\\Field::isCreate()\u003c/code>。\n另外白名单语义下「编辑时不含 password」不能写 \u003ccode>$form-&gt;isEdit(&#39;password&#39;)\u003c/code>（那等于编辑只剩 password）。\u003c/p>\n\u003c/blockquote>\n\u003cp>前端行为见 \u003ccode>GenericCurd/index.vue\u003c/code> 的 \u003ccode>resolveFieldForMode\u003c/code>（场景专属字段靠 \u003ccode>modeOnly\u003c/code>）/ \u003ccode>allFormFields\u003c/code>（白名单过滤 \u003ccode>sceneShow\u003c/code>）/ \u003ccode>sanitizeFormData\u003c/code>；后端见 \u003ccode>CurdActionsTrait\u003c/code> 的 \u003ccode>fieldWritableInMode / writableFields / filterWritableFields\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-55\">3.6 自定义操作 Action（行级/批量/全局/弹窗）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;addAction(new MrOrderRetryAction());          // 行级（默认）\n$grid-&gt;addAction(new MrOrderBatchRetryAction());     // 批量：Action 内 -&gt;batch(true)\n// $grid-&gt;addAction(…-&gt;global(true))                 // 全局按钮：工具栏右侧\n\u003c/code>\u003c/pre>\n\u003cp>Action 类（放 \u003ccode>app/controller/admin/api/actions/\u003c/code>）用 \u003ccode>init()\u003c/code> 声明外观、\u003ccode>handle()\u003c/code> 写业务：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">class MrOrderQueryStatusAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;query-status&#39;)-&gt;label(&#39;查询充值状态&#39;)-&gt;type(&#39;primary&#39;)\n            -&gt;confirm(&#39;确定要查询吗？将实时请求充值平台接口&#39;)\n            -&gt;show(function ($row) {                    // 按行控制是否显示\n                return in_array((int)$row-&gt;status, [MobileRechargeOrder::STATUS_DOING, MobileRechargeOrder::STATUS_FAILED], true);\n            });\n    }\n\n    public function handle(Request $request)\n    {\n        $row = $this-&gt;model();                          // 框架注入的当前行模型（行级 action）\n        if (!$row) return $this-&gt;error(&#39;订单不存在&#39;, 404);\n        // …… 业务逻辑（调平台 SDK 等）……\n        return $this-&gt;ok(&#39;操作成功&#39;);                   // 成功/失败统一用基类辅助方法返回\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>外观链式方法：\u003ccode>name/label/icon/type/confirm/form/modal/jump/api(url,method)/handler/params/field/show/successMsg/dialogTitle/dialogWidth/inline/batch/global/roles/permission\u003c/code>。\u003ccode>batch(true)\u003c/code> 的按钮出现在批量工具栏（需勾选行），handle 内取勾选的 id：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 批量 action 的 handle（勾选的 id 在请求里）\npublic function handle(Request $request)\n{\n    $ids = $request-&gt;post(&#39;ids&#39;, []);\n    $models = MobileRechargeOrder::query()-&gt;whereIn(&#39;id&#39;, $ids)-&gt;get();\n    // …… 逐条处理 ……\n    return $this-&gt;ok(&#39;批量重试成功，处理条数&#39; . $count);\n}\n\u003c/code>\u003c/pre>\n\u003cp>要点：\u003ccode>$this-&gt;model()\u003c/code> 是框架按请求 id 注入的\u003cstrong>当前行\u003c/strong>模型（未命中为 null），行级用；批量用 \u003ccode>$request-&gt;post(&#39;ids&#39;)\u003c/code>；\u003ccode>$this-&gt;row(&#39;字段&#39;)\u003c/code> 只在 \u003ccode>init()\u003c/code> 的闭包（show 等）里取当前渲染行数据；基类 \u003ccode>handle()\u003c/code> 未覆盖时会回退到控制器上的 \u003ccode>action{Name}(Request $request)\u003c/code>。\u003c/p>\n\u003ch4 id=\"h-56\">3.6.1 全局/批量按钮 + 表单弹窗（\u003ccode>global()/batch()\u003c/code> × \u003ccode>form()\u003c/code>）\u003c/h4>\n\u003cp>行级、批量、全局按钮都支持 \u003ccode>-&gt;form(fn($form){...})\u003c/code> 弹窗表单：点击按钮 → 弹出任意 Form DSL 字段的弹窗 → 用户填写/选文件 → 点确认 → 请求进 \u003ccode>handle(Request $request)\u003c/code>，表单值在 \u003ccode>$request-&gt;post()\u003c/code> 里。典型场景：列表工具栏「导入」按钮，点开弹窗选 Excel 文件，确认后处理。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// ① 全局导入按钮（工具栏，与新增/导出同级）\n$grid-&gt;addAction(new ImportOrdersAction());\n\nclass ImportOrdersAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;import&#39;)-&gt;label(&#39;导入订单&#39;)-&gt;icon(&#39;Upload&#39;)-&gt;type(&#39;primary&#39;)\n            -&gt;global(true)                                   // 工具栏全局按钮；批量按钮则用 -&gt;batch(true)\n            -&gt;dialogTitle(&#39;导入订单&#39;)\n            -&gt;dialogWidth(&#39;520px&#39;)\n            -&gt;form(function ($form) {                        // 弹窗内任意 Form DSL 字段\n                $form-&gt;file(&#39;import_file&#39;, &#39;选择文件&#39;)\n                    -&gt;rules(&#39;required&#39;);                     // 必填校验复用表单规则\n                $form-&gt;switch(&#39;skip_exists&#39;, &#39;跳过已存在&#39;);\n            });\n    }\n\n    public function handle(Request $request)\n    {\n        $file = $request-&gt;post(&#39;import_file&#39;);   // 已通过 /api/upload 上传后的文件相对路径\n        $skipExists = (bool)$request-&gt;post(&#39;skip_exists&#39;);\n        // 全局按钮附带当前搜索条件：$request-&gt;post(&#39;query&#39;, [])\n        // 批量按钮附带勾选主键：$request-&gt;post(&#39;ids&#39;, [])\n        // …… 解析文件、逐行入库 ……\n        return $this-&gt;ok(&#39;导入成功，共处理 &#39; . $count . &#39; 条&#39;);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>行为说明：\u003c/p>\n\u003cul>\n\u003cli>表单字段支持全部 Form DSL 能力（file/image/remote/when/isCreate 等）；文件类字段先走 \u003ccode>/api/upload\u003c/code> 上传拿到路径，\u003ccode>handle\u003c/code> 里拿到的就是路径字符串。\u003c/li>\n\u003cli>\u003ccode>global(true)\u003c/code> 提交时自动附带 \u003ccode>{ query: 当前搜索条件 }\u003c/code>；\u003ccode>batch(true)\u003c/code> 自动附带 \u003ccode>{ ids: 勾选主键 }\u003c/code>；行级自动附带 \u003ccode>{ id: 当前行主键 }\u003c/code>（\u003ccode>-&gt;field()\u003c/code> 可改字段名）。\u003c/li>\n\u003cli>无 \u003ccode>-&gt;api()\u003c/code> 时自动路由到 \u003ccode>/api/curd/model/{model}/action/{name}\u003c/code>；弹窗提交失败（接口返回错误）时弹窗保持打开，便于修改后重试。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"h-57\">3.6.2 Excel 导入字段 \u003ccode>$form-&gt;excel()\u003c/code>（multipart 直传 + 自动解析）\u003c/h4>\n\u003cp>Excel 导入推荐用专用 \u003ccode>excel\u003c/code> 字段：\u003cstrong>不走 \u003ccode>/api/upload\u003c/code>\u003c/strong>，本地选文件后以 multipart 表单把二进制直接提交到 action 接口，服务端自动解析，\u003ccode>handle\u003c/code> 里直接拿解析好的数据行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;addAction(new ImportOrdersAction());\n\nclass ImportOrdersAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;import&#39;)-&gt;label(&#39;导入订单&#39;)-&gt;global(true)\n            -&gt;form(fn($form) =&gt; $form-&gt;excel(&#39;import_file&#39;, &#39;选择文件&#39;)      // 默认 accept .xlsx/.csv，必选\n                                     -&gt;options([&#39;maxRows&#39; =&gt; 10000, &#39;sheet&#39; =&gt; 1])\n            );\n    }\n\n    public function handle(Request $request)\n    {\n        $rows = $this-&gt;excelRows(&#39;import_file&#39;);  // 首行作表头：[[&#39;手机号&#39; =&gt; &#39;138...&#39;, &#39;金额&#39; =&gt; &#39;10&#39;], ...]\n        $info = $this-&gt;excelInfo(&#39;import_file&#39;);  // [&#39;count&#39; =&gt; 2, &#39;file_name&#39; =&gt; &#39;xx.xlsx&#39;, &#39;sheets&#39; =&gt; 1]\n        // …… 逐行业务处理 ……\n        return $this-&gt;ok(&#39;导入成功，共解析 &#39; . $info[&#39;count&#39;] . &#39; 行&#39;);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>excel($prop, $label, $options)\u003c/code> 的 \u003ccode>$options\u003c/code>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>required\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>前端必选校验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>accept\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.xlsx,.csv\u003c/code>\u003c/td>\n\u003ctd>可选文件格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>maxRows\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>5000\u003c/code>\u003c/td>\n\u003ctd>最大解析行数（不含表头，超出抛异常）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sheet\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>解析第几个工作表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>解析规则\u003c/strong>（内置轻量解析器 \u003ccode>ExcelParser\u003c/code>，零 composer 依赖，需 PHP \u003ccode>zip\u003c/code> + \u003ccode>SimpleXML\u003c/code> 扩展）：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>.xlsx\u003c/code>：Office Open XML，覆盖 sharedStrings / inlineStr / 数字 / 公式结果字符串；\u003ccode>.csv\u003c/code>：自动识别 UTF-8 BOM 与 GBK 编码\u003c/li>\n\u003cli>首行为表头（空表头自动用 A/B/C 兜底），每行输出为 \u003ccode>[&#39;表头&#39; =&gt; 值]\u003c/code> 关联数组，整行为空自动跳过\u003c/li>\n\u003cli>日期单元格读出的是 Excel 序列数字（如 \u003ccode>45210.5\u003c/code>），需要日期请用文本格式存储或业务侧自行换算\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>取用方式（双写法同一 API）\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>Action 类写法：\u003ccode>handle()\u003c/code> 内 \u003ccode>$this-&gt;excelRows(&#39;prop&#39;)\u003c/code> / \u003ccode>$this-&gt;excelInfo(&#39;prop&#39;)\u003c/code>\u003c/li>\n\u003cli>数组式继承控制器（\u003ccode>actions(): array\u003c/code> 里写 \u003ccode>&#39;type&#39; =&gt; &#39;excel&#39;\u003c/code> 字段）：\u003ccode>actionXxx()\u003c/code> 内同样 \u003ccode>$this-&gt;excelRows(&#39;prop&#39;)\u003c/code> / \u003ccode>$this-&gt;excelInfo(&#39;prop&#39;)\u003c/code>（trait 提供）\u003c/li>\n\u003cli>未上传文件时 \u003ccode>excelRows()\u003c/code> 返回空数组，业务自行判断报错\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-58\">3.7 列表头汇总条 \u003ccode>grid()-&gt;summary(callable)\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;summary(function ($query) {\n    $q = clone $query;                                  // $query = 当前筛选后的列表查询，随筛选自动刷新\n    $money = (float)(clone $q)-&gt;where(&#39;status&#39;, 2)-&gt;sum(&#39;money&#39;);\n    return &#39;&lt;span&gt;成功单合计：&lt;b&gt;￥&#39; . number_format($money, 2) . &#39;&lt;/b&gt;&lt;/span&gt;&#39;; // 返回 HTML\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-59\">3.8 其它常用开关\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;disableCreate() / disableEdit() / disableDelete() / disableView()\n     / disableExport() / disableBatchDelete();      // 按需关能力\n$grid-&gt;setDialogWidth(&#39;700px&#39;);                     // 弹窗宽\n$grid-&gt;setCustomCss($css) / setCustomJs($js);       // 页面注入 css/js\n$grid-&gt;setRowStyle(fn($row) =&gt; [...]) / setRowClass(...); // 行样式\n$grid-&gt;setRules([...]);                             // 提交前校验（参考后端 rules 格式）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>导出\u003c/strong>：工具栏「导出」下拉（当前页 / 当前选择 / 全部）为框架同步导出，随当前筛选条件导出 CSV，无需额外配置（不实现异步导出任务）。\u003c/p>\n\u003cp>\u003cstrong>导出哪几列\u003c/strong>（只收窄、不放宽，最终列 = 三者交集，顺序始终按 grid 定义）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>口径\u003c/th>\n\u003cth>写法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>跟随用户列设置（默认）\u003c/td>\n\u003ctd>无需配置\u003c/td>\n\u003ctd>前端把「列配置」当前勾选的 prop 以 \u003ccode>_columns=prop1,prop2\u003c/code> 随导出请求下发，后端取交集。\u003ccode>-&gt;hidden()\u003c/code> 列默认不在勾选集合里，\u003cstrong>所以不再进 CSV\u003c/strong>；用户手动在「列配置」里勾上，它就跟着导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定白名单（逐页硬约束）\u003c/td>\n\u003ctd>控制器里 \u003ccode>protected function exportColumns(): array { return [&#39;id&#39;,&#39;money&#39;,&#39;channel&#39;]; }\u003c/code>\u003c/td>\n\u003ctd>开发者口径，优先级最高；与用户勾选取交集，未勾选的不会出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不做限制\u003c/td>\n\u003ctd>以上都不涉及\u003c/td>\n\u003ctd>接口直连（不带 \u003ccode>_columns\u003c/code>）或参数解析为空时按 grid 全列导出（含 \u003ccode>hidden\u003c/code>），保持历史行为\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>无 grid 配置的动态 CURD 页会回退到「表字段」，该回退路径同样受 \u003ccode>_columns\u003c/code> 约束。\u003c/p>\n\u003cp>\u003cstrong>导出文件名\u003c/strong>：默认 \u003ccode>{页面标题}_{YmdHis}.csv\u003c/code>，标题与 \u003ccode>/api/curd/config\u003c/code> 返回的 \u003ccode>data.title\u003c/code> \u003cstrong>同源\u003c/strong>\n（控制器 \u003ccode>$title\u003c/code> → 落库配置 \u003ccode>curd_configs.title\u003c/code> → 表名兜底）。响应同时给两个头：\u003c/p>\n\u003cpre>\u003ccode>Content-Disposition: attachment; filename=&quot;hf_accoount_waters_20260918205603.csv&quot;;\n                     filename*=UTF-8&#39;&#39;%E8%AF%9D%E8%B4%B9%E6%B5%81%E6%B0%B4_20260918205603.csv\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>现代浏览器读 \u003ccode>filename*\u003c/code>，拿到中文标题（如 \u003ccode>话费流水_….csv\u003c/code>）；\u003ccode>filename\u003c/code> 是给老客户端（不认 \u003ccode>filename*\u003c/code>）的 ASCII 兜底。\u003c/li>\n\u003cli>中文标题剥掉非 ASCII 后为空 → ASCII 兜底\u003cstrong>退回表名\u003c/strong>（\u003ccode>hf_accoount_waters\u003c/code>），不会退化成一串下划线。\u003c/li>\n\u003cli>前端 blob 下载名（\u003ccode>link.download\u003c/code>）由前端自己拼一份同名文件（浏览器不读 \u003ccode>Content-Disposition\u003c/code>），两边规则一致。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>单次导出上限\u003c/strong>：超过则\u003cstrong>直接报错\u003c/strong>（\u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;本次将导出 N 条，超过单次导出上限 M 条…&quot;}\u003c/code>），不做静默截断。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>键\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>宿主 \u003ccode>config/curd-admin.php\u003c/code>（推荐）\u003c/td>\n\u003ctd>\u003ccode>&#39;export_max_rows&#39; =&gt; 100000\u003c/code>\u003c/td>\n\u003ctd>与 \u003ccode>upload_path\u003c/code> / \u003ccode>site\u003c/code> 同一个宿主配置文件，运维改这一个即可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件 \u003ccode>config/curd.php\u003c/code>（本文件内置默认）\u003c/td>\n\u003ctd>\u003ccode>&#39;export_max_rows&#39; =&gt; 100000\u003c/code>\u003c/td>\n\u003ctd>兜底值；宿主 \u003ccode>config/curd-admin.php\u003c/code> 的同名顶层键会覆盖它\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>\u003ccode>&lt;= 0\u003c/code> = 不限制。\u003c/li>\n\u003cli>校验按\u003cstrong>实际命中条数\u003c/strong>：导出当前页按 \u003ccode>min(总数, size)\u003c/code>，导出选中按选中条数，导出全部按筛选后总数。\u003c/li>\n\u003cli>前端会嗅探响应类型：拿到 JSON 就当错误提示，不会把报错内容当 CSV 下载下来（\u003ccode>dynamicCurd/index.vue\u003c/code> 的 \u003ccode>export\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-60\">4. 菜单 / 权限 / 生效\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>菜单命令\u003c/strong>：\u003ccode>php webman make:permission --name 页面名 --slug 唯一slug --type 1 --path &lt;path&gt; --icon &lt;el-icon名&gt; --sort n\u003c/code>；\u003ccode>--type 1\u003c/code> 为菜单页。删除/更新菜单在后台「菜单管理」或 \u003ccode>php webman make:permission\u003c/code> 交互内处理。\u003c/li>\n\u003cli>\u003cstrong>path 取值\u003c/strong>：CURD 页 = registerMany key（\u003ccode>/mobile-recharge-orders\u003c/code>）；Schema/.vue 页 = \u003ccode>/custom-page/&lt;name&gt;\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>鉴权中间件\u003c/strong>：CURD 与 custom 路由都挂在统一 \u003ccode>CorsMiddleware + AuthCheck + PermissionCheck\u003c/code> 上。白名单段（仅需登录、不校验权限节点）：\u003ccode>/api/auth/\u003c/code>、\u003ccode>/api/menu\u003c/code>、\u003ccode>/api/curd/config\u003c/code>、\u003ccode>/api/admin/\u003c/code>、\u003ccode>/api/custom/\u003c/code>、\u003ccode>/api/schema/\u003c/code>（业务 Schema 数据接口段，白名单在 \u003ccode>app/middleware/PermissionCheck.php\u003c/code>）。\u003c/li>\n\u003cli>\u003cstrong>接口加密\u003c/strong>：请求/响应默认走 RSA+AES 信封（\u003ccode>ApiCrypto\u003c/code> 全局中间件，\u003ccode>X-Encrypt-Data\u003c/code> / \u003ccode>{data:...}\u003c/code>），前端 \u003ccode>request\u003c/code> 拦截器透明处理——\u003cstrong>DSL 层无感知\u003c/strong>。数据接口直接返回 \u003ccode>json([&#39;code&#39;=&gt;200,&#39;msg&#39;=&gt;&#39;ok&#39;,&#39;data&#39;=&gt;...])\u003c/code> 即可。\u003c/li>\n\u003cli>\u003cstrong>生效方式\u003c/strong>：\u003cul>\n\u003cli>新增/修改 PHP 类、路由、注册 → \u003ccode>php start.php restart\u003c/code>（改 config 与常驻内存类需重启；纯路由/页面内容 reload 亦可）；\u003c/li>\n\u003cli>Schema 页面类改内容、\u003ccode>.vue\u003c/code> 文件改内容 → 仅后端改文件，\u003cstrong>前端无需重新构建\u003c/strong>（协议运行时拉取）；\u003c/li>\n\u003cli>前端组件注册表/渲染器改动 → 走前端 dev（9528）或重新 \u003ccode>npm run build\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-61\">4.1 权限被拒时不泄露内部结构（安全约定）\u003c/h3>\n\u003cp>\u003ccode>PermissionCheck\u003c/code> 命中拒绝后\u003cstrong>统一只回一句\u003c/strong>，不回显 obj / act / 路径 / 需要哪个权限节点，避免给探测者画出权限地图：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ &quot;code&quot;: 403, &quot;msg&quot;: &quot;没有权限操作，请联系管理员（编号 1739601a）&quot; }\n\u003c/code>\u003c/pre>\n\u003cp>细节全部写服务端日志（webman 原生 \u003ccode>support\\Log\u003c/code> → \u003ccode>runtime/logs/webman-YYYY-MM-DD.log\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode>[curd] 权限校验未通过 {...}\n  reason: rbac-denied            # 有权限节点但不匹配\n  user_id: 39  username: xxx\n  method: POST  path: /api/curd/model/HfGoods/add\n  need_perm: curd.HfGoods.add:*  ip: 1.2.3.4  trace: 1739601a\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>reason=unresolved-permission\u003c/code> 表示路径没能推导出 \u003ccode>obj:act\u003c/code>（控制器没注册进 \u003ccode>RouteControllerRegistry\u003c/code> / path 与注册 key 不一致）——那是\u003cstrong>配置问题\u003c/strong>，不是用户没权限。排查时拿页面上显示的「编号」去日志里 grep 即可。\u003c/p>\n\u003ch3 id=\"h-62\">4.2 自定义登录（覆盖内置 login）\u003c/h3>\n\u003cp>三种力度，按需选：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>配置项\u003c/th>\n\u003cth>改什么\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>① 只换凭据校验\u003c/td>\n\u003ctd>\u003ccode>auth_provider\u003c/code>\u003c/td>\n\u003ctd>校验逻辑（换表 / 换算法 / 对接外部账号）\u003c/td>\n\u003ctd>仍是「用户名密码 → 内置响应结构」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>② 连响应一起接管\u003c/td>\n\u003ctd>\u003ccode>login_handler\u003c/code>\u003c/td>\n\u003ctd>整个 \u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>要加风控 / 单点登录 / 额外返回字段（\u003cstrong>验证码插件已内置\u003c/strong>，见 §4.7，无需自己写；且校验发生在委派之前，自定义类不必再实现）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>③ 自己注册路由\u003c/td>\n\u003ctd>宿主 \u003ccode>config/route.php\u003c/code> 注册 \u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>路由 + 逻辑\u003c/td>\n\u003ctd>登录协议与内置完全不同（插件检测到路由已被注册即跳过自带那条）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>④ 叠加状态判定\u003c/td>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003ctd>不改登录流程，只加一层「账号还能不能用」的业务判定\u003c/td>\n\u003ctd>关联业务账户被关闭 / 合同到期 / 白名单（\u003cstrong>正交，可与 ①②③ 同时用\u003c/strong>，见下）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>②最常用，写法（token 体系仍与插件一致）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/plugin/curd/curd.php\n&#39;login_handler&#39; =&gt; \\app\\admin\\MyLogin::class,\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">namespace app\\admin;\n\nuse support\\Request;\nuse plugin\\curd\\app\\auth\\LoginIssuer;\n\nclass MyLogin\n{\n    /** 与内置 login() 同签名：收 Request，返 Response */\n    public function login(Request $request)\n    {\n        $username = (string)$request-&gt;post(&#39;username&#39;);\n        // …你自己的校验：验证码、风控、外部单点接口…\n        if (!$ok) {\n            return json([&#39;code&#39; =&gt; 401, &#39;msg&#39; =&gt; &#39;自定义登录：用户名或密码错误&#39;]);\n        }\n\n        // 签发 token + 拼标准响应（前端拿到的结构完全不变）\n        return json(LoginIssuer::issue([\n            &#39;id&#39; =&gt; $uid, &#39;username&#39; =&gt; $username, &#39;name&#39; =&gt; $name, &#39;status&#39; =&gt; 1,\n        ]));\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>要点：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>login_handler\u003c/code> 默认 \u003ccode>&#39;&#39;\u003c/code> → 走内置逻辑；\u003cstrong>类名写错/类不存在时也自动回退内置\u003c/strong>（排查先看类名是否真的被加载，注意 webman 常驻内存要 \u003ccode>restart\u003c/code>）；\u003c/li>\n\u003cli>\u003ccode>LoginIssuer::issue($identity, $ttl = 604800)\u003c/code> 负责写 \u003ccode>admin_tokens\u003c/code> 表并返回 \u003ccode>{code,msg,data:{token,...}}\u003c/code>，\u003cstrong>与内置登录完全同构\u003c/strong> → \u003ccode>AuthCheck\u003c/code>、\u003ccode>/api/auth/me\u003c/code>、前端拦截器都不用改；\u003c/li>\n\u003cli>只要 token 字符串（自己拼响应）用 \u003ccode>LoginIssuer::issueToken($identity, $ttl)\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"h-63\">叠加额外状态判定：\u003ccode>auth_state_guard\u003c/code>\u003c/h4>\n\u003cp>只想在账号\u003cstrong>自身 \u003ccode>status\u003c/code> 之外\u003c/strong>再加一条业务判定（关联的业务账户被关闭、合同到期、部门撤销、白名单…）时，\n\u003cstrong>不要\u003c/strong>用 ① 自己实现 \u003ccode>auth_provider\u003c/code> 去覆盖三个方法，原因是：\u003c/p>\n\u003cul>\n\u003cli>认证链路上有三个入口都会产出「账号可用性」——\u003ccode>login()\u003c/code> / \u003ccode>identity()\u003c/code> / \u003ccode>resolveUser()\u003c/code>；\u003c/li>\n\u003cli>三者给的数据形状还不一样（前两个是\u003cstrong>身份数组\u003c/strong>，\u003ccode>resolveUser()\u003c/code> 是\u003cstrong>用户对象\u003c/strong>），判定逻辑被迫写两份；\u003c/li>\n\u003cli>\u003cstrong>漏改任一入口都不会报错\u003c/strong>，只会造成「接口能访问、但 \u003ccode>/api/auth/me\u003c/code> 状态不对」这类静默不一致。\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>auth_state_guard\u003c/code> 把判定收敛到一处，三个入口由插件统一收口：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php\n&#39;auth_state_guard&#39; =&gt; \\app\\auth\\MyGuard::class,\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">namespace app\\auth;\n\nuse plugin\\curd\\app\\auth\\AuthStateGuardInterface;\n\nclass MyGuard implements AuthStateGuardInterface\n{\n    /** $account 是规范化后的对象，固定含 id / username / name / status 四个属性 */\n    public function allowed(object $account): ?bool\n    {\n        // false = 按「已禁用」处理；true / null = 放行\n        return myBusinessCheck($account-&gt;username) ? true : false;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>返回 \u003ccode>false\u003c/code> 的账号：登录报 \u003cstrong>403「账号已被禁用」\u003c/strong>（不会含糊地报成&quot;密码错误&quot;）；已登录会话的\u003cstrong>下一次请求\u003c/strong>同样 403——\u003ccode>AuthCheck\u003c/code> 每个请求都会调进来，无缓存延迟；\u003c/li>\n\u003cli>与 \u003ccode>auth_provider\u003c/code> \u003cstrong>不冲突\u003c/strong>：前者换的是「账号从哪来」，本钩子加的是「这个账号还能不能用」。自定义 \u003ccode>auth_provider\u003c/code> 只要返回身份数组，钩子照样生效；\u003c/li>\n\u003cli>未配置 = 不启用，行为与原来完全一致（纯 opt-in）；\u003c/li>\n\u003cli>\u003cstrong>请把业务查询包在 \u003ccode>try/catch\u003c/code> 里做 fail-open\u003c/strong>（异常时放行 + 记日志）：否则业务库抖动会让所有人都登不进后台。\n反过来若希望严格（业务库不可用即拒绝），去掉 catch 里的放行即可，但要想清楚这个后果。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-64\">4.3 新建菜单「一键生成权限」\u003c/h3>\n\u003cp>后台「菜单管理 → 新增」里勾 \u003cstrong>「同时生成操作权限（一键生成）」\u003c/strong>，会在该菜单下批量创建 type=3 权限节点（不出现在侧边栏），省掉逐条手点。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>生成哪些\u003c/strong>：\u003ccode>list 列表 / add 新增 / update 编辑 / delete 删除 / batch-delete 批量删除 / export 导出\u003c/code>，可勾选子集；\u003c/li>\n\u003cli>\u003cstrong>前缀怎么来\u003c/strong>：① 表单里的「权限标识」 → ② 按 \u003ccode>path\u003c/code> 自动推导 \u003ccode>curd.{Model}\u003c/code>（选完 path 前端会实时预览「将生成的权限」）；\u003c/li>\n\u003cli>\u003cstrong>推导不出来\u003c/strong>（path 不是注册过的 CURD 页）→ \u003cstrong>不生成\u003c/strong>，接口返回 \u003ccode>warning\u003c/code> 提示手填权限标识后重试；\u003c/li>\n\u003cli>\u003cstrong>接口\u003c/strong>：\u003ccode>POST /api/menu\u003c/code>（\u003ccode>add\u003c/code> / \u003ccode>update\u003c/code> 都支持），额外字段 \u003ccode>gen_permissions=1\u003c/code>、\u003ccode>permission_ops=list,add,update\u003c/code>（不传 = 全部）；\u003c/li>\n\u003cli>\u003cstrong>幂等\u003c/strong>：已存在的 permission 直接跳过 → 老菜单可以「编辑时再勾一次」补生成；\u003c/li>\n\u003cli>\u003cstrong>预览接口\u003c/strong>：\u003ccode>GET /api/menu/permission/suggest?path=/hf-goods\u003c/code> → \u003ccode>{base:&#39;curd.HfGoods&#39;, ops:[{op,title,permission}]}\u003c/code>；\n行内快速创建传 \u003ccode>?parent_id=&lt;菜单id&gt;\u003c/code>，走的是与写入\u003cstrong>同一套\u003c/strong>前缀推导，保证「预览 = 实际写入」。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-65\">4.4 菜单行内「快速创建权限」\u003c/h3>\n\u003cp>菜单/容器行末尾的 🔑 按钮（type=3 行不显示）：\u003cstrong>只输权限名\u003c/strong>就能建一个 type=3 权限节点，比走「新增菜单」快得多。\u003c/p>\n\u003cul>\n\u003cli>弹窗填「权限名」（如 \u003ccode>审核\u003c/code>、\u003ccode>audit\u003c/code>），可选「标识后缀」（留空按权限名生成：ASCII 转小写连字符、中文原样保留），并实时预览最终 \u003ccode>permission\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>前缀自动取\u003c/strong>：父菜单自身的 \u003ccode>permission\u003c/code>（如 \u003ccode>curd.HfGoods\u003c/code>）→ 否则取父菜单已有子权限的公共前缀 → 否则按父菜单 path 推导（预览值由 \u003ccode>GET /api/menu/permission/suggest?parent_id=\u003c/code> 下发，与写入规则一致）；\u003c/li>\n\u003cli>\u003cstrong>重名\u003c/strong>返回 400：\u003ccode>权限标识已存在：curd.HfGoods.audit\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>接口\u003c/strong>：\u003ccode>POST /api/menu/permission/quick\u003c/code>，参数 \u003ccode>parent_id\u003c/code>（必填，不能是 type=3 节点）、\u003ccode>name\u003c/code>（必填）、\u003ccode>slug\u003c/code>（可选）。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-66\">4.5 URL 里只能传「已注册模型名」，猜不到别的表\u003c/h3>\n\u003cp>\u003ccode>/api/curd/model/{X}\u003c/code> 的 \u003ccode>{X}\u003c/code> \u003cstrong>不是表名\u003c/strong>，是 \u003ccode>ModelRegistry\u003c/code> 里的模型短类名（如 \u003ccode>HfGoods\u003c/code> → \u003ccode>app\\model\\HfGoods\u003c/code>，表名写在模型类里）。\n换个名字试探别的表的路子被三层堵死：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>传什么\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>已注册模型名（\u003ccode>HfAccoountWater\u003c/code>）\u003c/td>\n\u003ctd>200，正常返回（权限不足则 403）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>app/model 下\u003cstrong>存在\u003c/strong>的模型类（扫描/注册过，如 \u003ccode>AdminUser\u003c/code>）\u003c/td>\n\u003ctd>可解析，\u003cstrong>这是设计内\u003c/strong>；能不能出数据看权限（管理员 200 / 业务账号 403）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务库真实存在、但没有模型类也没登记的表（\u003ccode>admin_roles\u003c/code>、\u003ccode>hf_accoount_waters\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>{&quot;code&quot;:404,&quot;msg&quot;:&quot;模型 xxx 未注册&quot;}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>纯手写的名字（\u003ccode>NotExistThing\u003c/code>）\u003c/td>\n\u003ctd>同上 404\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>传表名\u003c/strong>（\u003ccode>admin_roles\u003c/code>）\u003c/td>\n\u003ctd>同上 404（表名一律不认）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>控制点在 \u003ccode>ModelRegistry::$allowDynamicResolve\u003c/code>（\u003cstrong>默认 false\u003c/strong>，收紧口径）：关着时只有\n①注册表里的模型 ②\u003ccode>app/model\u003c/code> 下真实存在的模型类 ③\u003ccode>dynamicAllowedTables\u003c/code>（启动时从 \u003ccode>curd_configs\u003c/code> 已登记的表灌入）能被解析；\n开了才会对未登记的表做「模型名 → 表名」反推 + eval 生成类。也就是说：\n\u003cstrong>页面能访问哪张表，取决于开发者建了多少模型/配了多少条 \u003ccode>curd_configs\u003c/code>，与数据库里有什么表无关。\u003c/strong>\u003c/p>\n\u003cp>即便模型名猜对了，仍要过 \u003ccode>PermissionCheck\u003c/code> 的 \u003ccode>curd.{模型}.{动作}\u003c/code> 校验（见 4.1），权限不足只回一句\n\u003ccode>{&quot;code&quot;:403,&quot;msg&quot;:&quot;没有权限操作，请联系管理员（编号 xxxxxx）&quot;}\u003c/code>。实测（huafei）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>请求（账号 guangzhouzeqin，非 admin）\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>HfGoods\u003c/code> / \u003ccode>HfAccoountWater\u003c/code>（已授权）\u003c/td>\n\u003ctd>200，且\u003cstrong>按账号维度隔离\u003c/strong>（\u003ccode>account_id\u003c/code> 过滤，返回 0 条也正常）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AdminUser\u003c/code> / \u003ccode>AdminMenu\u003c/code> / \u003ccode>HfPlatformAccount\u003c/code>（未授权）\u003c/td>\n\u003ctd>403 一句带过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无 token\u003c/td>\n\u003ctd>401 未登录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意\u003c/strong>：\u003ccode>app/model\u003c/code> 下被扫描注册的模型都是「可访问的候选」，能不能进看权限。像 \u003ccode>AdminUser\u003c/code> 这类表\n管理员有 \u003ccode>p,admin,*,*\u003c/code> 全通权限，列表会\u003cstrong>原样带出 \u003ccode>password\u003c/code> 哈希\u003c/strong>——如果不想暴露，应在模型 \u003ccode>$hidden\u003c/code>\n里加 \u003ccode>password\u003c/code>，或在 \u003ccode>PermissionCheck\u003c/code> 侧不给普通角色该模型的权限。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-67\">4.6 默认落地页 \u003ccode>home_page\u003c/code>（登录后 / 刷新根路径打开哪一页）\u003c/h3>\n\u003cp>后台根路径（\u003ccode>/app/curd/\u003c/code>、\u003ccode>/app/curd/?...\u003c/code>）以及\u003cstrong>每次登录成功\u003c/strong>，打开的页面都由宿主配置唯一决定（\u003ccode>?redirect=\u003c/code> 不参与，见下方口径表）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// config/curd-admin.php\n&#39;home_page&#39; =&gt; &#39;/custom-page/home&#39;,   // 相对路径，不带 /app/curd 前缀\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>取值来源（优先级）\u003c/td>\n\u003ctd>宿主 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>home_page\u003c/code> → 同文件 \u003ccode>site.home_page\u003c/code> → 插件 \u003ccode>config/curd.php\u003c/code> 的 \u003ccode>home_page\u003c/code> → \u003ccode>/dashboard\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写法\u003c/td>\n\u003ctd>\u003ccode>/custom-page/home\u003c/code>、\u003ccode>custom-page/home\u003c/code> 都行（自动补前导斜杠、折叠重复斜杠）；也支持写完整 \u003ccode>http(s)://...\u003c/code>，此时前端整页跳转\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效方式\u003c/td>\n\u003ctd>前端每次启动拉 \u003ccode>/api/config/site\u003c/code>（含 \u003ccode>home_page\u003c/code>），\u003cstrong>改配置 + \u003ccode>restart\u003c/code> 即可，无需重新构建前端\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面不存在时\u003c/td>\n\u003ctd>不阻断：该路径由通配路由交给 \u003ccode>CustomPageHost\u003c/code>，页面缺失时显示「页面加载失败」而不是白屏；配置项本身也不会回退成别的页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与菜单/权限的关系\u003c/td>\n\u003ctd>\u003cstrong>只决定打开哪个页面\u003c/strong>，不要求用户菜单里有这一项；菜单里没有也能直接打开（这正是「哪怕菜单里没有也要打开默认页」的用法）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端缓存\u003c/td>\n\u003ctd>落地页会存一份 \u003ccode>localStorage.admin_home_page\u003c/code>，冷启动（刷新时接口还没回来）也能落对页；接口成功返回后会覆盖/清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>也会影响这些地方（都用同一个 \u003ccode>getHomePath()\u003c/code>）：已登录访问 \u003ccode>/login\u003c/code>、标签栏「关闭所有 / 关闭最后一个标签」时的兜底跳转。\u003c/p>\n\u003cblockquote>\n\u003cp>顺带修掉一个老问题：前端 \u003ccode>utils/site.js\u003c/code> 原先按\u003cstrong>同名键\u003c/strong>拷贝后端字段，而后端是 \u003ccode>logo_type\u003c/code>、前端是 \u003ccode>logoType\u003c/code>，\n导致 \u003ccode>config/curd-admin.php\u003c/code> 里配 \u003ccode>logo_type\u003c/code> 一直不生效（永远按默认 icon 渲染）。现在加了 snake→camel 映射（\u003ccode>logo_type → logoType\u003c/code>、\u003ccode>home_page → homePage\u003c/code>）。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>唯一口径（v1.12.0 起）：登录成功一律打开 \u003ccode>home_page\u003c/code>，\u003ccode>?redirect=\u003c/code> 彻底不参与。\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>登录成功（无论从哪来）\u003c/td>\n\u003ctd>\u003ccode>router.push(home_page)\u003c/code>，\u003cstrong>完全不看\u003c/strong> \u003ccode>?redirect=\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未登录访问根路径 \u003ccode>/app/curd/\u003c/code>\u003c/td>\n\u003ctd>落到 \u003ccode>/app/curd/login\u003c/code>（\u003cstrong>不带任何参数\u003c/strong>）；登录后按当时配置的 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未登录访问子页 \u003ccode>/app/curd/hf-goods\u003c/code>\u003c/td>\n\u003ctd>同样落到 \u003ccode>/app/curd/login\u003c/code>（不再记录「原页」）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>token 失效（401 拦截）\u003c/td>\n\u003ctd>清 token 后跳 \u003ccode>/app/curd/login\u003c/code>（不带参数）；重新登录落 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已登录访问 \u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>回落 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动敲 \u003ccode>/app/curd/dashboard\u003c/code> 等具体页\u003c/td>\n\u003ctd>照常直达，不受影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>为什么砍掉 \u003ccode>?redirect=\u003c/code>：把「要去的页」写进 URL，它就会长期存活在书签/浏览器历史里。\n之后把 \u003ccode>home_page\u003c/code> 从 \u003ccode>/custom-page/home\u003c/code> 改成 \u003ccode>/dashboard\u003c/code>，旧 URL 仍按旧值跳 —— 表现成「改了配置没生效」，\n排查成本极高（真实踩过）。代价是\u003cstrong>登录过期后重新登录会落到 \u003ccode>home_page\u003c/code>，而不是被打断的那一页\u003c/strong>，这是刻意的取舍。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>另外两点必须知道\u003c/strong>：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>未登录访问根路径不会带参数\u003c/strong>：根路径分支先 \u003ccode>await ensureSiteConfig()\u003c/code>（\u003ccode>/api/config/site\u003c/code> 免鉴权），\n未登录直接 \u003ccode>next({ path: &#39;/login&#39;, replace: true })\u003c/code>，登录后按「那一刻」的配置算落地页。\u003c/li>\n\u003cli>\u003cstrong>侧边栏「首页」菜单与 \u003ccode>home_page\u003c/code> 无关。\u003c/strong> 那是菜单表里的数据（huafei 里 \u003ccode>menus.id=1\u003c/code>，\u003ccode>path=/dashboard\u003c/code>），\n点它永远去 \u003ccode>/dashboard\u003c/code>。要让侧边栏「首页」也指向自定义页，改菜单那一行的 \u003ccode>path\u003c/code> 即可（纯数据改动，不用动代码）。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"h-68\">4.7 登录图形验证码（webman/captcha）与「记住账号」\u003c/h3>\n\u003cp>登录页默认带图形验证码，开箱即用，\u003cstrong>无需改前端\u003c/strong>（前端产物已内置）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">composer require webman/captcha      # 宿主安装一次即可（ext-gd / ext-mbstring 必装）\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php（唯一配置文件，写同名顶层键即可）\n&#39;captcha_enabled&#39; =&gt; true,   // false = 登录页完全不显示验证码，登录接口也不再校验\n&#39;captcha_ttl&#39;     =&gt; 300,    // 有效期（秒）\n&#39;captcha_length&#39;  =&gt; 4,      // 位数（3~6，越界回落 4）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>接口契约\u003c/strong>（前端已实现，自建页面时可直接复用）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接口\u003c/th>\n\u003cth>请求\u003c/th>\n\u003cth>响应\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>GET /api/auth/captcha\u003c/code>\u003c/td>\n\u003ctd>无（免鉴权）\u003c/td>\n\u003ctd>\u003ccode>{&quot;code&quot;:200,&quot;data&quot;:{&quot;key&quot;:&quot;&lt;32位hex&gt;&quot;,&quot;image&quot;:&quot;data:image/jpeg;base64,...&quot;}}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{username, password, captcha_key, captcha_code}\u003c/code>\u003c/td>\n\u003ctd>验证码不过：\u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;验证码错误&quot;,&quot;data&quot;:{&quot;captcha&quot;:true}}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关键点\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>存哪\u003c/td>\n\u003ctd>Redis \u003ccode>curd_captcha:{key}\u003c/code> = 验证码明文（小写），TTL = \u003ccode>captcha_ttl\u003c/code>。\u003cstrong>不用 session\u003c/strong>（插件是 Bearer token 架构，不依赖 cookie，跨域开发也不用 credentials）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次性\u003c/td>\n\u003ctd>\u003ccode>Captcha::verify()\u003c/code> \u003cstrong>无论对错都删 key\u003c/strong>，杜绝「同一张图反复试探」。所以登录失败后前端会\u003cstrong>自动换一张新图\u003c/strong>（\u003ccode>loadCaptcha()\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大小写\u003c/td>\n\u003ctd>不敏感（两边都 \u003ccode>strtolower\u003c/code>）；字符集已剔除易混的 \u003ccode>i / l / o / 0 / 1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验位置\u003c/td>\n\u003ctd>在 \u003ccode>AuthController::login()\u003c/code> 的\u003cstrong>最前面\u003c/strong>，早于 \u003ccode>login_handler\u003c/code> 委派 → 自定义登录类\u003cstrong>不用自己实现验证码\u003c/strong>；确实不需要就在 \u003ccode>login_handler\u003c/code> 里关掉 \u003ccode>captcha_enabled\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端显隐\u003c/td>\n\u003ctd>由 \u003ccode>/api/config/site\u003c/code> 的 \u003ccode>captcha_enabled\u003c/code>（布尔）下发；为 \u003ccode>false\u003c/code> 时输入框与图片整块不渲染。\u003cstrong>配置请求失败时前端兜底\u003c/strong>：先不显示，一旦后端返回含「验证码」的错误 → 自动展开并拉图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点图刷新\u003c/td>\n\u003ctd>点验证码图片即换一张（\u003ccode>loadCaptcha()\u003c/code>），同时清空已输入内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关掉/应急\u003c/td>\n\u003ctd>\u003ccode>captcha_enabled =&gt; false\u003c/code> + \u003ccode>restart\u003c/code>。\u003cstrong>Redis 不可用时登录会被拒\u003c/strong>（验证码服务暂不可用）→ 这就是应急开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效方式\u003c/td>\n\u003ctd>改配置 → \u003ccode>php start.php restart\u003c/code>；\u003cstrong>前端不用重建\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>「记住账号」\u003c/strong>：登录成功后把用户名写进 \u003ccode>localStorage.admin_login_username\u003c/code>（见前端 \u003ccode>utils/remember.js\u003c/code>），\n下次打开登录页自动回填，并把光标落在密码框。\u003cstrong>只记账号不记密码\u003c/strong>；换账号登录会覆盖；退出登录\u003cstrong>不清除\u003c/strong>（否则就失去意义）。\n想彻底忘掉：清浏览器数据，或在 \u003ccode>src/views/login/index.vue\u003c/code> 里调 \u003ccode>clearRememberedUsername()\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>注意：\u003ccode>localStorage\u003c/code> 按**源（协议+域名+端口）**隔离。\u003ccode>127.0.0.1:18082\u003c/code> 与 \u003ccode>127.0.0.1:8787\u003c/code> 是两个源，\n验证时别把「另一个端口没回填」当成 bug。\u003c/p>\n\u003cp>若宿主自己实现了 \u003ccode>login_handler\u003c/code> 且\u003cstrong>不希望\u003c/strong>有验证码：把 \u003ccode>captcha_enabled\u003c/code> 设为 \u003ccode>false\u003c/code>，\n否则因为校验在委派之前，所有登录都会先被验证码拦下（表现为「明明密码对，一直提示验证码错误」）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-69\">5. 踩坑速查\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因/解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新页面 404\u003c/td>\n\u003ctd>\u003ccode>PageRegistry::register\u003c/code> 没写（或没 restart）；页面名与 name 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>props 不生效\u003c/td>\n\u003ctd>键不在前端注册表白名单 → 被丢弃；查 \u003ccode>componentRegistry.js\u003c/code> 对应 type 的 props\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面显示 \u003ccode>[未注册节点: xxx]\u003c/code>\u003c/td>\n\u003ctd>type 拼错或前端漏登记\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>collapse 不展开/展开错乱\u003c/td>\n\u003ctd>展开态渲染器托管：用 \u003ccode>-&gt;active([...])\u003c/code> 设初始 name，item 需有 \u003ccode>-&gt;name()\u003c/code> 才能精确命中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>*-item\u003c/code> 没显示\u003c/td>\n\u003ctd>条目必须直接挂在对应容器 children，不能夹在中间组件里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>statistic 显示 NaN/空\u003c/td>\n\u003ctd>整串占位取不到值时保留原文；确认数据接口返回数字、key 路径写对（\u003ccode>{{stats.amount}}\u003c/code> 是 \u003ccode>data.amount\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code> 图标不显示（空白方块）\u003c/td>\n\u003ctd>\u003ccode>-&gt;icon(&#39;xxx&#39;)\u003c/code> 的名字必须是 EP 图标名（\u003ccode>View\u003c/code>/\u003ccode>Money\u003c/code>/\u003ccode>User\u003c/code>…）；写错时 \u003ccode>getIconComponent\u003c/code> 回退为 \u003ccode>Monitor\u003c/code>，若连图标位都空则检查 \u003ccode>utils/icons\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 显示「暂无数据」\u003c/td>\n\u003ctd>\u003ccode>data\u003c/code> 取不到值（占位符未被替换、JSON 解析失败、或数组里全是非数字）→ 走空态。查 dataApi 是否返回\u003cstrong>数组\u003c/strong>、key 路径是否写对；占位符取不到时会\u003cstrong>保留原文\u003c/strong>（\u003ccode>&#39;{{stats.trend}}&#39;\u003c/code> 不是数组 → 空态）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 折线贴底/全 0\u003c/td>\n\u003ctd>数据本身全 0（如订单表为空）—— 不是 bug，30 个 0 会画成 y≈0 的平线；用 \u003ccode>-&gt;data([...])\u003c/code> 静态数组可快速自查渲染是否正常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表宽度不随侧边栏折叠变化\u003c/td>\n\u003ctd>节点组件用 \u003ccode>ResizeObserver\u003c/code> 监听容器，正常会自动重绘；若嵌在 \u003ccode>display:none\u003c/code> 的 tab 里初始化，切回时会重绘一次（ResizeObserver 触发）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Action 按钮不出现\u003c/td>\n\u003ctd>\u003ccode>-&gt;show(fn)\u003c/code> 返回 false；或 \u003ccode>-&gt;batch(true)\u003c/code> 的按钮在批量工具栏出现（需勾选行）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想改全局变量/常量后无效\u003c/td>\n\u003ctd>webman 常驻内存，改 PHP 需 \u003ccode>restart\u003c/code> 而非仅 reload\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后仍进 \u003ccode>/dashboard\u003c/code>（没走配置的 \u003ccode>home_page\u003c/code>）\u003c/td>\n\u003ctd>按顺序查：①\u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>home_page\u003c/code> 改了但没 \u003ccode>restart\u003c/code>；②前端是旧产物（登录跳转在前端，需重新构建部署）；③浏览器里是\u003cstrong>旧书签/历史\u003c/strong>（\u003ccode>login?redirect=/custom-page/home\u003c/code> 这类旧值已被忽略，见 4.6 口径表）；④从侧边栏点了「首页」菜单（那是菜单数据，与 \u003ccode>home_page\u003c/code> 无关）；⑤\u003ccode>localStorage.admin_home_page\u003c/code> 是旧值且 \u003ccode>/api/config/site\u003c/code> 请求失败（看 Network）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后落点跟「上次被拦住的那一页」不一致\u003c/td>\n\u003ctd>v1.12.0 起刻意如此：登录一律跳 \u003ccode>home_page\u003c/code>，不再回跳原页（\u003ccode>?redirect=\u003c/code> 已彻底不参与），见 4.6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 只看到「编号」看不到原因\u003c/td>\n\u003ctd>设计如此（不泄露权限结构）：拿编号 grep \u003ccode>runtime/logs/webman-*.log\u003c/code> 看 \u003ccode>reason\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 日志里 \u003ccode>reason=unresolved-permission\u003c/code>\u003c/td>\n\u003ctd>不是没权限，是路径推导不出 \u003ccode>obj:act\u003c/code>：控制器没进 \u003ccode>RouteControllerRegistry\u003c/code>，或菜单 path 与注册 key 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>勾了「一键生成权限」却没生成\u003c/td>\n\u003ctd>\u003ccode>path\u003c/code> 不是已注册的 CURD 页 → 推导不出 \u003ccode>curd.{Model}\u003c/code>；接口响应 \u003ccode>data.warning\u003c/code> 会提示，手填「权限标识」后重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「快速创建权限」报重名 400\u003c/td>\n\u003ctd>该 \u003ccode>permission\u003c/code> 已存在（含之前一键生成过的）；换个后缀名，或去菜单树里找已有节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义登录没生效\u003c/td>\n\u003ctd>\u003ccode>login_handler\u003c/code> 类名写错会静默回退内置；改 config 后需 \u003ccode>restart\u003c/code>，并确认类真的能被自动加载（PSR-4 路径/命名空间）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面报「不支持导入模块 xxx」\u003c/td>\n\u003ctd>运行时编译只放行 \u003ccode>vue\u003c/code> / \u003ccode>element-plus\u003c/code> / \u003ccode>@element-plus/icons-vue\u003c/code>；发请求改用 \u003ccode>inject(&#39;request&#39;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面 \u003ccode>&lt;style lang=&quot;scss&quot;&gt;\u003c/code> 报错\u003c/td>\n\u003ctd>浏览器端无预处理器，只能用纯 CSS（\u003ccode>scoped\u003c/code> 也会降级为全局，class 加唯一前缀）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录一直提示「验证码错误」「请输入验证码」\u003c/td>\n\u003ctd>①宿主要求验证码但自己的登录页没送 \u003ccode>captcha_key/captcha_code\u003c/code>（用了自定义 \u003ccode>login_handler\u003c/code> 且不想用验证码 → \u003ccode>captcha_enabled =&gt; false\u003c/code> 后 restart）；②前端产物是旧的（不含验证码字段）→ 重新构建部署；③\u003ccode>/api/auth/captcha\u003c/code> 返回 500「验证码生成失败：Class &quot;Webman\\Captcha...&quot; not found」→ 宿主没 \u003ccode>composer require webman/captcha\u003c/code>（见 4.7）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码位置只有一行「点击获取」，没有图片\u003c/td>\n\u003ctd>\u003ccode>/api/auth/captcha\u003c/code> 没返回有效 key，看响应 \u003ccode>msg\u003c/code>：ext-gd 未装 / 字体缺失 / Redis 不可用；点那一行可重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码输入框整块不显示（后端却仍要验证码）\u003c/td>\n\u003ctd>\u003ccode>captcha_enabled=false\u003c/code> 生效了，或 \u003ccode>/api/config/site\u003c/code> 请求失败（前端兜底不显示）——后端返回的错误里带 \u003ccode>data.captcha=true\u003c/code>，前端会\u003cstrong>自动展开并拉图\u003c/strong>，重试一次即可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换了端口打开登录页，账号没自动回填\u003c/td>\n\u003ctd>\u003ccode>localStorage\u003c/code> 按源隔离（\u003ccode>127.0.0.1:18082\u003c/code> ≠ \u003ccode>127.0.0.1:8787\u003c/code>），属正常；换端口就是另一个站点的数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自己实现 \u003ccode>auth_provider\u003c/code> 加状态判定，结果「能访问接口但 \u003ccode>/me\u003c/code> 状态不对」\u003c/td>\n\u003ctd>覆盖时漏了三个入口之一（\u003ccode>login\u003c/code> / \u003ccode>identity\u003c/code> / \u003ccode>resolveUser\u003c/code>），\u003cstrong>漏了不报错\u003c/strong>；改用 \u003ccode>auth_state_guard\u003c/code> 收口到一处（见 §4.2）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code> 配了却不生效\u003c/td>\n\u003ctd>①类名写错 / 类不存在 → \u003ccode>stateGuard()\u003c/code> 返回 null 静默跳过；②没 \u003ccode>restart\u003c/code>（配置在启动期读取）；③配的是 \u003ccode>auth_provider\u003c/code> 而非 \u003ccode>auth_state_guard\u003c/code>。排查：\u003ccode>php -r &quot;var_dump(class_exists(&#39;\\\\\\\\app\\\\\\\\auth\\\\\\\\MyGuard&#39;));&quot;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003cp>\u003cem>文档配套可运行示例：Schema → \u003ccode>app/controller/admin/api/HomePage.php\u003c/code> + \u003ccode>SchemaPageDataController\u003c/code>；CURD → \u003ccode>app/controller/admin/api/MROrdersController.php\u003c/code> + \u003ccode>app/controller/admin/api/actions/\u003c/code>；最小参考 → 安装器落位到宿主根的示例 \u003ccode>app/controller/admin/api/MyTestController.php\u003c/code>（源在 \u003ccode>examples/\u003c/code>，含完整写法注释）。插件安装 / 宿主内升级 / 生产部署见本目录《插件安装升级与生产部署》。\u003c/em>\u003c/p>\n"}];</script>
<script>
(function () {
  var DATA = window.__DOCS_DATA__ || [];
  var aside = document.getElementById('tree');
  var panels = document.getElementById('panels');
  var treeEmpty = document.getElementById('treeEmpty');
  var backTop = document.getElementById('backTop');

  // ---------- 渲染左侧栏目树（DOM 构建，天然成树/自动转义） ----------
  function buildSidebar() {
    aside.innerHTML = '';
    for (var i = 0; i < DATA.length; i++) {
      var doc = DATA[i];
      var group = document.createElement('div');
      group.className = 'doc-group';
      group.setAttribute('data-doc', i);

      var title = document.createElement('div');
      title.className = 'doc-title';
      title.setAttribute('data-doc', i);
      var dot = document.createElement('span');
      dot.className = 'dot';
      title.appendChild(dot);
      title.appendChild(document.createTextNode(doc.title));
      var fname = document.createElement('span');
      fname.className = 'fname';
      fname.textContent = doc.file;
      title.appendChild(fname);
      group.appendChild(title);

      // 嵌套目录树：rootUl 挂 2 级；3/4 级挂到最近的上级 li 下（惰性建 ul）
      var rootUl = document.createElement('ul');
      rootUl.className = 'tree';
      var lastByDepth = { 1: rootUl };
      for (var j = 0; j < doc.headings.length; j++) {
        var h = doc.headings[j];
        if (h.depth <= 1) continue;
        var li = document.createElement('li');
        var lvlClass = h.depth >= 4 ? 'lvl4' : (h.depth === 3 ? 'lvl3' : 'lvl2');
        li.className = lvlClass;
        var a = document.createElement('a');
        a.setAttribute('data-doc', i);
        a.setAttribute('data-target', h.id);
        a.textContent = h.text;
        li.appendChild(a);
        // 挂载点：向上找最近已存在的上一级
        var d = h.depth - 1;
        while (d >= 1 && !lastByDepth[d]) d--;
        var parent = d < 1 ? rootUl : lastByDepth[d];
        if (parent !== rootUl) {
          if (!parent._ul) {
            parent._ul = document.createElement('ul');
            parent.appendChild(parent._ul);
          }
          parent._ul.appendChild(li);
        } else {
          rootUl.appendChild(li);
        }
        lastByDepth[h.depth] = li;
      }
      if (rootUl.children.length) group.appendChild(rootUl);
      aside.appendChild(group);
    }
  }

  // ---------- 渲染右侧内容面板（DOM 构建，文本自动转义） ----------
  function buildPanels() {
    panels.innerHTML = '';
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];

      var sec = document.createElement('section');
      sec.className = 'doc-panel';
      sec.setAttribute('data-doc', i);

      var meta = document.createElement('div');
      meta.className = 'panel-meta';
      meta.appendChild(document.createTextNode('来源：'));
      var fnameChip = document.createElement('span');
      fnameChip.className = 'chip';
      fnameChip.textContent = d.file;
      meta.appendChild(fnameChip);
      meta.appendChild(document.createTextNode(' '));
      var timeChip = document.createElement('span');
      timeChip.className = 'chip';
      timeChip.textContent = '更新于 ' + d.mtime;
      meta.appendChild(timeChip);

      var body = document.createElement('div');
      body.className = 'doc-body';
      // 内容来自构建器渲染的 markdown HTML，受信源（仅扫描 docs/ 下文件）
      body.innerHTML = d.html;

      sec.appendChild(meta);
      sec.appendChild(body);
      panels.appendChild(sec);
    }
  }

  // ---------- 激活文档 ----------
  var currentDoc = 0;
  function setActiveDoc(idx) {
    currentDoc = idx;
    var ps = panels.querySelectorAll('.doc-panel');
    for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('active', i === idx);
    var gs = aside.querySelectorAll('.doc-group');
    for (var j = 0; j < gs.length; j++) gs[j].classList.toggle('active', j === idx);
  }

  // ---------- 跳转锚点 ----------
  function jump(targetId) {
    var el = document.getElementById(targetId);
    if (!el) return;
    var panel = el.closest('.doc-panel');
    if (panel) {
      var idx = parseInt(panel.getAttribute('data-doc'), 10);
      if (idx !== currentDoc) setActiveDoc(idx);
    }
    requestAnimationFrame(function () {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ---------- 事件绑定 ----------
  aside.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (a) { e.preventDefault(); jump(a.getAttribute('data-target')); markActive(a); return; }
    var t = e.target.closest('.doc-title');
    if (t) { var idx = parseInt(t.getAttribute('data-doc'), 10); setActiveDoc(idx); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  function markActive(a) {
    var prev = aside.querySelector('a.active');
    if (prev) prev.classList.remove('active');
    if (a) a.classList.add('active');
  }

  // 滚动高亮当前阅读标题
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var panel = panels.querySelector('.doc-panel.active');
      if (!panel) return;
      var heads = panel.querySelectorAll('.doc-body [id^="h-"]');
      var cur = null;
      for (var i = 0; i < heads.length; i++) {
        var r = heads[i].getBoundingClientRect();
        if (r.top <= 90) cur = heads[i]; else break;
      }
      if (cur) {
        var a = aside.querySelector('a[data-target="' + cur.id + '"]');
        markActive(a);
      }
      backTop.classList.toggle('show', (window.pageYOffset || document.documentElement.scrollTop) > 480);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  backTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- 关键字过滤（只过滤栏目树） ----------
  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var kw = q.value.trim().toLowerCase();
    var links = aside.querySelectorAll('.tree a');
    var groups = aside.querySelectorAll('.doc-group');
    var any = false;
    for (var i = 0; i < links.length; i++) {
      var li = links[i].closest('li');
      var hit = !kw || links[i].textContent.toLowerCase().indexOf(kw) !== -1;
      li.style.display = hit ? '' : 'none';
      if (hit) any = true;
    }
    for (var g = 0; g < groups.length; g++) {
      var vis = groups[g].querySelector('.tree li');
      groups[g].style.display = vis && vis.style.display !== 'none' ? '' : 'none';
      if (kw && !any) { /* 文档级命中也显示 */ }
    }
    // 若文档标题命中但章节没命中，展开全部章节
    if (kw) {
      for (var gg = 0; gg < groups.length; gg++) {
        var titleHit = groups[gg].querySelector('.doc-title').textContent.toLowerCase().indexOf(kw) !== -1;
        var items = groups[gg].querySelectorAll('.tree li');
        if (titleHit) { for (var k = 0; k < items.length; k++) items[k].style.display = ''; any = true; }
        else { var has = false; for (var m = 0; m < items.length; m++) { if (items[m].style.display !== 'none') has = true; } groups[gg].style.display = has ? '' : 'none'; }
      }
    }
    treeEmpty.style.display = any ? 'none' : 'block';
  });

  // ---------- 初始化 ----------
  document.getElementById('totalDocs').textContent = DATA.length + ' 篇';
  buildSidebar();
  buildPanels();
  setActiveDoc(0);
})();
</script>
</body>
</html>
