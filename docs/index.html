h>路径形态\u003c/th>\n\u003cth>谁生成\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>CURD 页\u003c/td>\n\u003ctd>\u003ccode>/package\u003c/code>、\u003ccode>/mobile-recharge-orders\u003c/code> —— 即 \u003ccode>registerMany\u003c/code> 的 key\u003c/td>\n\u003ctd>你在 \u003ccode>config/route.php\u003c/code> 定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / \u003ccode>.vue\u003c/code> 自定义页\u003c/td>\n\u003ctd>\u003ccode>/custom-page/&lt;页面名&gt;\u003c/code>\u003c/td>\n\u003ctd>前端 catch-all 命中，\u003ccode>PageRegistry\u003c/code> 注册内容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-58\">4. 后台「配置生成器」（不写代码）\u003c/h2>\n\u003cp>\u003ccode>/app/curd/curd-generator\u003c/code> 是内置可视化工具页（它自己不需要 DSL 配置）：\u003c/p>\n\u003col>\n\u003cli>选表 → 自动读字段；\u003c/li>\n\u003cli>勾列 / 搜索项 / 表单项，改标题、控件类型；\u003c/li>\n\u003cli>填页面路径（如 \u003ccode>/package\u003c/code>）与标题；\u003c/li>\n\u003cli>保存 —— 写入 \u003ccode>curd_configs\u003c/code>，\u003ccode>/api/curd/config\u003c/code> 立刻能查到该 \u003ccode>route_path\u003c/code>；\u003c/li>\n\u003cli>到「菜单管理」加菜单（path 填同一路径）并授权。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>代价\u003c/strong>：配置落库后想再用代码精调（自定义 action、\u003ccode>display\u003c/code> 闭包、\u003ccode>setCustomJs\u003c/code>）就得回到控制器写法 ——\n落库配置不读你的 \u003ccode>grid()\u003c/code>。选择标准：\u003cstrong>长期维护 / 要写逻辑 → 控制器\u003c/strong>；\u003cstrong>一次性工具页 → 生成器\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>生产环境默认关闭\u003c/strong>：\u003ccode>generator_enabled\u003c/code> 未配置时跟随调试模式（\u003ccode>APP_DEBUG=false\u003c/code> → 关闭）。\n关闭后菜单隐藏、直连 \u003ccode>/curd-generator\u003c/code> 被拦回首页、后端 5 个生成器接口返回 403。\n详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考 §generator_enabled\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-59\">5. 开箱示例「测试管理」\u003c/h2>\n\u003cp>装包时示例文件已自动落位宿主根（\u003ccode>src/Install.php\u003c/code> 的 \u003ccode>ensureExamples\u003c/code>），启用两步：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// a) 宿主 config/route.php 注册（MyTestController.php 头注释含完整写法）\nRouteControllerRegistry::registerMany([\n    &#39;/my-test&#39; =&gt; \\app\\controller\\admin\\api\\MyTestController::class,\n]);\n// b) 安装时已种好：my_test 表 + curd_configs 的 /my-test 配置 +「测试管理」菜单\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>全新项目\u003c/strong>：安装向导自动建表 + 补菜单 + 插 1 条示例数据；\u003c/li>\n\u003cli>\u003cstrong>已运行项目\u003c/strong>：跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等）补齐表与菜单；\u003c/li>\n\u003cli>\u003cstrong>删除\u003c/strong>：控制器 + \u003ccode>app/model/MyTest.php\u003c/code> + \u003ccode>bootstrap.php\u003c/code> 的「内置示例」注册段 +\n\u003ccode>menus\u003c/code> 里的「测试管理」行 + \u003ccode>my_test\u003c/code> 表（控制器头注释含完整清单）。\u003c/li>\n\u003c/ul>\n\u003cp>这个示例既是\u003cstrong>链路自检\u003c/strong>（登录 → 菜单 → 配置接口 → 数据接口 → 库表全通），也是\u003cstrong>能力样板\u003c/strong>：\n\u003ccode>display()\u003c/code> 渲染 HTML、\u003ccode>help()\u003c/code> 里写 \u003ccode>@click\u003c/code>、\u003ccode>setCustomJs()\u003c/code> 定义函数、点式字段读写 JSON 列、\n\u003ccode>copy()\u003c/code> / \u003ccode>select()\u003c/code> 行内编辑，全在这一个文件里。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-60\">6. 命令行生成 \u003ccode>make:curd\u003c/code>\u003c/h2>\n\u003cp>按\u003cstrong>数据库表结构\u003c/strong>生成 Grid + Form（字段、控件类型、标题全自动），可选顺带生成操作按钮。\n\u003cstrong>装好即可用\u003c/strong>，宿主不用改任何配置（插件在 \u003ccode>config/app.php\u003c/code> 里显式注册了命令，\n\u003ccode>plugin/curd\u003c/code> 用软链挂载也能识别；命令消失见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">FAQ §10\u003c/a>）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># 最简：按表名生成（模型 + 控制器）\nphp webman make:curd -t my_test\n\n# 指定数据库连接（表不在默认业务库时）\nphp webman make:curd -t request_sms -d mysql_business\n\n# 常用：指定类名 / 标题 / 路由，并自动写进宿主路由文件\nphp webman make:curd -t hf_goods -c HfGoods -m HfGoods --title=&#39;商品管理&#39; -r /hf-goods --register\n\n# 带操作按钮：行级审核 + 批量上架 + Excel 导入\nphp webman make:curd -t hf_goods --title=&#39;商品管理&#39; \\\n  --action=audit:审核 --bat-action=batch-on:批量上架 --import-action\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>-t --table\u003c/code>\u003c/td>\n\u003ctd>表名（必填），字段 / 类型 / 注释由 \u003ccode>SHOW FULL COLUMNS\u003c/code> 读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-d --connection\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>数据库连接名\u003c/strong>，取 \u003ccode>config/database.php\u003c/code> 的 \u003ccode>connections\u003c/code> 键（如 \u003ccode>mysql_business\u003c/code>）；默认取插件配置 \u003ccode>business_connection\u003c/code>（单库时就是主库）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-c --name\u003c/code> / \u003ccode>-m --model\u003c/code>\u003c/td>\n\u003ctd>控制器 / 模型类名，默认由表名推导（\u003ccode>my_test\u003c/code> → \u003ccode>MyTest\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-r --route\u003c/code>\u003c/td>\n\u003ctd>前端路由路径，默认 \u003ccode>/表名\u003c/code>（下划线→中划线）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--title\u003c/code>\u003c/td>\n\u003ctd>页面标题，默认取表注释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--action\u003c/code>\u003c/td>\n\u003ctd>行级操作，\u003ccode>name[:按钮标题]\u003c/code>，\u003cstrong>可重复\u003c/strong>；同时生成控制器 \u003ccode>action{Name}()\u003c/code> 骨架\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--bat-action\u003c/code>\u003c/td>\n\u003ctd>批量操作（勾选行后可用），\u003ccode>name[:按钮标题]\u003c/code>，\u003cstrong>可重复\u003c/strong>；生成 \u003ccode>action{Name}()\u003c/code> 骨架\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--import-action\u003c/code>\u003c/td>\n\u003ctd>Excel 导入按钮，\u003ccode>name[:按钮标题]\u003c/code>；不写值 = \u003ccode>import:导入\u003c/code>；生成 \u003ccode>actionImport()\u003c/code> 骨架\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--register\u003c/code>\u003c/td>\n\u003ctd>自动把 \u003ccode>RouteControllerRegistry::registerMany([...])\u003c/code> 写进 \u003cstrong>\u003ccode>config/admin-route.php\u003c/code>\u003c/strong>（不存在会按模板新建；其次旧位置项目根 \u003ccode>admin-route.php\u003c/code>，都没有才写 \u003ccode>config/route.php\u003c/code>）；先备份 \u003ccode>.bak\u003c/code>，写入后 \u003ccode>php -l\u003c/code> 自检\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-C\u003c/code>\u003c/td>\n\u003ctd>控制器目录，默认 \u003ccode>app/controller/admin/api\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-M\u003c/code>\u003c/td>\n\u003ctd>模型目录，默认 \u003ccode>app/model\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--no-model\u003c/code>\u003c/td>\n\u003ctd>只生成控制器，不生成模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-f --force\u003c/code>\u003c/td>\n\u003ctd>同名文件已存在时覆盖（默认跳过）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003ccode>-d\u003c/code> 只影响\u003cstrong>读表结构\u003c/strong>（\u003ccode>SHOW FULL COLUMNS\u003c/code>）和生成的模型 \u003ccode>$connection\u003c/code>；\n表不在默认库里时必须带上，否则报 \u003ccode>Table &#39;xxx&#39; doesn&#39;t exist\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>类型映射：\u003ccode>enum\u003c/code>→下拉、\u003ccode>set\u003c/code>→多选、\u003ccode>tinyint(1)\u003c/code>→开关、\u003ccode>text\u003c/code>→textarea、\n\u003ccode>decimal/int\u003c/code>→数字、\u003ccode>date/datetime\u003c/code>→日期，其余 text。\u003c/p>\n\u003cp>\u003cstrong>操作按钮命名推导\u003c/strong>（\u003ccode>--action=audit:审核\u003c/code> → \u003ccode>$grid-&gt;action(&#39;audit&#39;,&#39;审核&#39;)\u003c/code> → 控制器 \u003ccode>actionAudit()\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 生成的按钮配置\n$grid-&gt;action(&#39;audit&#39;, &#39;审核&#39;)-&gt;icon(&#39;Check&#39;)-&gt;confirm(&#39;确定审核该记录？&#39;)-&gt;handler(&#39;audit&#39;);\n$grid-&gt;batAction(&#39;batch-on&#39;, &#39;批量上架&#39;);                    // = action()-&gt;batch(true)\n$grid-&gt;importAction();                                       // = action(&#39;import&#39;,&#39;导入&#39;)-&gt;global(true) + excel 表单\n\n// 生成的控制器方法骨架\npublic function actionAudit(Request $request)  { /* 单行：$request-&gt;post(&#39;id&#39;) */ }\npublic function actionBatchOn(Request $request) { /* 批量：$request-&gt;post(&#39;ids&#39;) */ }\npublic function actionImport(Request $request) { /* Excel：$this-&gt;excelRows(&#39;file&#39;) */ }\n\u003c/code>\u003c/pre>\n\u003cp>按钮名 \u003ccode>batch-on\u003c/code> 会转成方法名 \u003ccode>actionBatchOn\u003c/code>（\u003ccode>-\u003c/code> / \u003ccode>_\u003c/code> 后字母大写）。\u003c/p>\n\u003cp>生成物约定：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>字段标题统一 \u003ccode>__()\u003c/code>，key 用「字段名推导的英文短语」\u003c/strong>：\u003ccode>request_order\u003c/code> → \u003ccode>__(&#39;Request order&#39;)\u003c/code>、\n\u003ccode>created_at\u003c/code> → \u003ccode>__(&#39;Created at&#39;)\u003c/code>。\u003cstrong>数据库里的中文注释不会当 key\u003c/strong>，只作为生成后给出的翻译建议\n（\u003ccode>&#39;Request order&#39; =&gt; &#39;请求订单号&#39;,\u003c/code>）。\n未命中翻译时原样显示英文 —— 想显示中文就往 \u003ccode>resource/translations/zh_CN/fields.php\u003c/code> 补，\n生成结束会列出「还没登记的 key → 中文注释」对照表。\u003c/li>\n\u003cli>\u003cstrong>页面标题\u003c/strong>：\u003ccode>--title\u003c/code> 优先，其次表注释，都没有才用表名推导。\u003c/li>\n\u003cli>\u003cstrong>不声明 \u003ccode>$modelClass\u003c/code>\u003c/strong>（框架自动从 Grid 的模型提取回填）；\u003cstrong>Grid 不传 title\u003c/strong>（自动读 \u003ccode>title()\u003c/code> 方法）；\u003c/li>\n\u003cli>\u003cstrong>不进 \u003ccode>curd_configs\u003c/code>\u003c/strong>：只在宿主路由文件注册 —— 改 \u003ccode>grid()\u003c/code> 立即生效。\u003c/li>\n\u003c/ul>\n\u003cp>生成后收尾：\u003ccode>--register\u003c/code> 已写好路由（否则手抄命令输出那一行）→ 后台「菜单管理」加菜单并授权。\u003c/p>\n\u003ch3 id=\"h-61\">6.1 后台路由单独放 \u003ccode>config/admin-route.php\u003c/code>\u003c/h3>\n\u003cp>后台页面越来越多时，\u003ccode>config/route.php\u003c/code> 会混着「项目自身接口」和「后台 CURD 页面」。可以拆开：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>放什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>\u003ccode>config/admin-route.php\u003c/code>\u003c/strong>\u003c/td>\n\u003ctd>后台页面路由（\u003ccode>RouteControllerRegistry\u003c/code>）+ 后台专用 \u003ccode>Route::group\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>项目自身的接口 / 前台路由\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode class=\"language-php\">// config/admin-route.php —— 插件自动加载，config/route.php 里不用加任何一行\nuse plugin\\curd\\app\\RouteControllerRegistry;\nuse Webman\\Route;\n\nreturn [\n    &#39;register&#39; =&gt; function () {\n        RouteControllerRegistry::registerMany([\n            &#39;/my-test&#39;  =&gt; \\app\\controller\\admin\\api\\MyTestController::class,\n            &#39;/hf-goods&#39; =&gt; \\app\\controller\\admin\\api\\HfGoodsController::class,\n        ]);\n\n        Route::group(&#39;/api/admin&#39;, function () {\n            Route::get(&#39;/stats&#39;, [\\app\\controller\\admin\\api\\AdminStatsController::class, &#39;index&#39;]);\n        })-&gt;middleware([\n            \\plugin\\curd\\app\\middleware\\CorsMiddleware::class,\n            \\plugin\\curd\\app\\middleware\\AuthCheck::class,\n            \\plugin\\curd\\app\\middleware\\PermissionCheck::class,\n        ]);\n    },\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>必须 \u003ccode>return\u003c/code> 数组，路由写在 \u003ccode>register\u003c/code> 闭包里\u003c/strong>。webman 启动时会把 \u003ccode>config/\u003c/code> 下除\n\u003ccode>route.php\u003c/code> 以外的所有 \u003ccode>.php\u003c/code> 当\u003cstrong>配置\u003c/strong>加载（\u003ccode>Config::loadFromDir\u003c/code>，早于路由初始化），此时\n\u003ccode>Route\u003c/code> 还没初始化：顶层直接 \u003ccode>Route::group()\u003c/code> 会报\n\u003ccode>Call to a member function addGroup() on null\u003c/code>；直接 \u003ccode>return function () {}\u003c/code> 又会因为\n\u003ccode>array_replace_recursive()\u003c/code> 只接受数组而报 TypeError。\n插件在路由加载阶段取出 \u003ccode>config(&#39;admin-route.register&#39;)\u003c/code> 执行，所以闭包里可以正常写路由。\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>加载顺序\u003c/strong>：\u003ccode>config/route.php\u003c/code> → \u003cstrong>\u003ccode>config/admin-route.php\u003c/code>（执行闭包）\u003c/strong> → \u003ccode>plugin/curd/config/route.php\u003c/code>，\n这里注册的同名路由优先，插件同路径路由会被冲突检测跳过。\u003c/li>\n\u003cli>\u003cstrong>文件不存在就跳过\u003c/strong>：老项目不建这个文件，行为完全不变。\u003c/li>\n\u003cli>\u003ccode>make:curd --register\u003c/code> 会自动选目标：优先 \u003ccode>config/admin-route.php\u003c/code>（不存在会按模板新建），\n其次旧位置（项目根 \u003ccode>admin-route.php\u003c/code>），都没有才写 \u003ccode>config/route.php\u003c/code>。\u003c/li>\n\u003cli>升级插件后想启用：重跑安装器会生成模板，或手动新建。\u003c/li>\n\u003cli>改完路由要 \u003ccode>php webman restart\u003c/code>（\u003ccode>reload\u003c/code> 不重新加载路由）。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>兼容旧位置\u003c/strong>：早期版本要求放\u003cstrong>项目根目录\u003c/strong> \u003ccode>admin-route.php\u003c/code>（顶层直接写 \u003ccode>Route::xxx()\u003c/code>）。\n插件仍支持：仅当 \u003ccode>config/admin-route.php\u003c/code> 不存在时才 \u003ccode>require\u003c/code> 根目录那份。新项目请用 \u003ccode>config/\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-62\">7. 业务库表结构 · 种子 · 增量 migration\u003c/h2>\n\u003ch3 id=\"h-63\">7.1 业务建表 SQL\u003c/h3>\n\u003cp>\u003ccode>install.sql\u003c/code> 默认只建认证 / 管理面那 8 张表。项目专有业务表由项目自带：放 \u003ccode>install-business.sql\u003c/code>\n到项目根，语句间用 \u003ccode>--SPLIT--\u003c/code> 分隔，\u003ccode>CREATE TABLE IF NOT EXISTS\u003c/code> 保证幂等（此文件\u003cstrong>不\u003c/strong>打包进通用包）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php plugin/curd/install.php --business-sql=install-business.sql\n\n# 多个文件（可重复或逗号分隔）\nphp plugin/curd/install.php --business-sql=sql/admin.sql --business-sql=sql/business.sql\n\n# 临时切换业务库连接（默认 business_connection，即 mysql_business）\nphp plugin/curd/install.php --business-sql=install-business.sql --business-connection=mysql_business_test\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-64\">7.2 业务种子（菜单 / 权限自动登记）\u003c/h3>\n\u003cp>把菜单 / 权限种子追加到业务 SQL 里，全用 \u003ccode>INSERT IGNORE\u003c/code> 保持幂等：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- install-business.sql\n-- 菜单：path 必须与 RouteControllerRegistry 注册的路径一致\nINSERT IGNORE INTO menus (parent_id, title, icon, path, permission, sort, type, visible)\nVALUES (0, &#39;测试管理&#39;, &#39;Monitor&#39;, &#39;/my-test&#39;, &#39;curd:MyTest&#39;, 90, 1, 1);\n--SPLIT--\n-- 权限：admin 角色已带 p,admin,*,* 通配，通常只需给其它角色补\nINSERT IGNORE INTO casbin_rule (ptype, v0, v1, v2)\nVALUES (&#39;p&#39;, &#39;yunying&#39;, &#39;curd:MyTest&#39;, &#39;*&#39;);\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表\u003c/th>\n\u003cth>关键列\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>menus\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>parent_id\u003c/code>（0 = 顶级）、\u003ccode>title\u003c/code>、\u003ccode>icon\u003c/code>（Element Plus 图标名）、\u003ccode>path\u003c/code>、\u003ccode>permission\u003c/code>、\u003ccode>sort\u003c/code>、\u003ccode>type\u003c/code>（1 = 菜单项 / 2 = 子菜单容器）、\u003ccode>visible\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>casbin_rule\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>ptype\u003c/code>（\u003ccode>p\u003c/code> = 策略 / \u003ccode>g\u003c/code> = 角色继承）、\u003ccode>v0\u003c/code>（角色）、\u003ccode>v1\u003c/code>（obj）、\u003ccode>v2\u003c/code>（act）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003ccode>path\u003c/code> 推导权限标识的规则是 \u003ccode>curd.{Model}\u003c/code>；\u003ccode>permission\u003c/code> 留空时由「一键生成权限」推导。\n详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-65\">7.3 增量 migration\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 文件命名：plugin/curd/migrations/V{版本}__{描述}.sql，版本号升序，--SPLIT-- 分隔多语句\nphp plugin/curd/migrate.php                       # 跑全部未执行迁移\nphp plugin/curd/migrate.php --connection=mysql    # 指定连接\nphp plugin/curd/migrate.php --dry-run             # 预检\n\u003c/code>\u003c/pre>\n\u003cp>已执行版本记录进 \u003ccode>{连接库}._curd_migrations\u003c/code>（唯一约束，幂等）；已发布版本\u003cstrong>只追加不修改\u003c/strong>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-66\">8. 配置写在哪个文件\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>写在哪\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>数据库连接（\u003ccode>DB_*\u003c/code>）\u003c/td>\n\u003ctd>宿主 \u003ccode>.env\u003c/code>（\u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读取；安装向导自动写）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件调参 + 站点信息 + 验证码 + 上传 + 导出上限 + 生成器开关\u003c/td>\n\u003ctd>宿主根 \u003cstrong>\u003ccode>config/curd-admin.php\u003c/code>\u003c/strong>（唯一入口）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>❌ 不再读取\u003c/td>\n\u003ctd>\u003ccode>config/curd.php\u003c/code>、\u003ccode>config/admin.php\u003c/code>（2026-09-19 已合并，存在也不生效）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>配置改完\u003cstrong>必须重启 webman\u003c/strong>（启动期读取）；\u003ccode>site\u003c/code> / \u003ccode>home_page\u003c/code> / \u003ccode>captcha_*\u003c/code> / \u003ccode>generator_enabled\u003c/code>\n这几项改完无需重建前端。全部键位与默认值见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-67\">9. 下一步\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>想做的事\u003c/th>\n\u003cth>看这篇\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>列表页做得更细（列格式化、行内编辑、HTML 渲染）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">API · Column\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表单加字段类型、联动、级联、\u003ccode>help\u003c/code> 带按钮\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">API · Form / Field\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义操作按钮（弹窗 / 调接口 / 跳转 / 批量 / 导入）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\">API · Filter / Action\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面注入自己的 JS、调用 \u003ccode>window.curd\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面 §10\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做仪表盘 / 详情页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上线\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"file":"03-配置参考.md","title":"配置参考","section":"start","sectionName":"入门与指南","mtime":"2026/10/19 17:21:24","headings":[{"depth":2,"text":"1. 配置从哪读、谁能覆盖谁","id":"h-69"},{"depth":2,"text":"2. 数据库连接","id":"h-70"},{"depth":3,"text":"想真正分库 / 想去掉 mysql_business","id":"h-71"},{"depth":2,"text":"3. 插件调参键（全量）","id":"h-72"},{"depth":2,"text":"4. 宿主管家键","id":"h-73"},{"depth":3,"text":"4.1 站点信息 site","id":"h-74"},{"depth":3,"text":"4.2 默认落地页 home_page","id":"h-75"},{"depth":3,"text":"4.3 上传与静态资源","id":"h-76"},{"depth":3,"text":"4.4 导出与验证码","id":"h-77"},{"depth":3,"text":"4.5 配置生成器开关 generator_enabled","id":"h-78"},{"depth":2,"text":"5. 路由「宿主优先」机制","id":"h-79"},{"depth":2,"text":"6. 内置前端与 page_base","id":"h-80"},{"depth":2,"text":"7. 环境变量一览","id":"h-81"}],"allHeadings":[{"depth":1,"text":"配置参考","id":"h-68"},{"depth":2,"text":"1. 配置从哪读、谁能覆盖谁","id":"h-69"},{"depth":2,"text":"2. 数据库连接","id":"h-70"},{"depth":3,"text":"想真正分库 / 想去掉 mysql_business","id":"h-71"},{"depth":2,"text":"3. 插件调参键（全量）","id":"h-72"},{"depth":2,"text":"4. 宿主管家键","id":"h-73"},{"depth":3,"text":"4.1 站点信息 site","id":"h-74"},{"depth":3,"text":"4.2 默认落地页 home_page","id":"h-75"},{"depth":3,"text":"4.3 上传与静态资源","id":"h-76"},{"depth":3,"text":"4.4 导出与验证码","id":"h-77"},{"depth":3,"text":"4.5 配置生成器开关 generator_enabled","id":"h-78"},{"depth":2,"text":"5. 路由「宿主优先」机制","id":"h-79"},{"depth":2,"text":"6. 内置前端与 page_base","id":"h-80"},{"depth":2,"text":"7. 环境变量一览","id":"h-81"}],"html":"\u003ch1 id=\"h-68\">配置参考\u003c/h1>\n\u003cp>全部可调点、默认值与覆盖规则。\u003cstrong>改完必须重启 webman\u003c/strong>（配置在启动期读取）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-69\">1. 配置从哪读、谁能覆盖谁\u003c/h2>\n\u003cp>插件以「\u003cstrong>根目录应用插件\u003c/strong>」形式分发（\u003ccode>{项目}/plugin/curd\u003c/code>），而 webman 的配置加载顺序是\n\u003ccode>config/\u003c/code> 先、\u003ccode>plugin/*/config\u003c/code> 后 —— 也就是说\u003cstrong>插件自带的配置会覆盖\n\u003ccode>config/plugin/curd/curd.php\u003c/code>\u003c/strong>。所以调参不能写在 \u003ccode>config/plugin/curd/\u003c/code> 里。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>优先级（高 → 低）\u003c/th>\n\u003cth>位置\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>宿主根 \u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>唯一推荐入口\u003c/strong>，\u003ccode>composer require\u003c/code> / Web 向导自动生成模板\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/config/curd.php\u003c/code> 的 \u003ccode>$defaults\u003c/code>\u003c/td>\n\u003ctd>插件内置默认，随包升级整体替换，\u003cstrong>不要改这里\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>合并逻辑（\u003ccode>plugin/curd/config/curd.php\u003c/code> 末尾）：宿主文件存在就\n\u003ccode>array_merge($defaults, $hostCurd)\u003c/code> —— \u003cstrong>同名顶层键被宿主覆盖，没写的键保持默认\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>旧的 \u003ccode>config/curd.php\u003c/code> 与 \u003ccode>config/admin.php\u003c/code> 已不再读取\u003c/strong>（2026-09-19 合并为一个文件）。\n这两个文件即使存在也不生效。排查「配置改了没反应」时，先确认改的是不是\n\u003ccode>config/curd-admin.php\u003c/code>，再确认有没有 \u003ccode>restart\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>插件内部读取分两类：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键的类型\u003c/th>\n\u003cth>读取方式\u003c/th>\n\u003cth>举例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>插件调参键\u003c/strong>\u003c/td>\n\u003ctd>合并进 \u003ccode>config(&#39;plugin.curd.curd.*&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>page_base\u003c/code>、\u003ccode>admin_require_permission\u003c/code>、\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>宿主管家键\u003c/strong>\u003c/td>\n\u003ctd>直接读 \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>site\u003c/code>、\u003ccode>home_page\u003c/code>、\u003ccode>upload_path\u003c/code>、\u003ccode>captcha_*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-70\">2. 数据库连接\u003c/h2>\n\u003cp>\u003cstrong>数据库信息只写在宿主 \u003ccode>.env\u003c/code> 的 5 个键\u003c/strong>，由 \u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读取：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=webman_curd\nDB_USER=root\nDB_PASSWORD=your_password\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>单库架构\u003c/strong>：认证表（\u003ccode>admin_users\u003c/code> / \u003ccode>admin_tokens\u003c/code> / \u003ccode>roles\u003c/code> / \u003ccode>admin_role_user\u003c/code> /\n\u003ccode>role_permission\u003c/code> / \u003ccode>casbin_rule\u003c/code> / \u003ccode>curd_configs\u003c/code> / \u003ccode>menus\u003c/code>）与业务表放\u003cstrong>同一个库\u003c/strong>，\n已无 \u003ccode>DB_BUSINESS_NAME\u003c/code>、无「分库选项 / 同库勾选」。\u003c/li>\n\u003cli>\u003ccode>mysql_business\u003c/code> 连接\u003cstrong>仍然保留\u003c/strong>（兼容已写死 \u003ccode>$connection = &#39;mysql_business&#39;\u003c/code> 的模型），\n其 \u003ccode>database\u003c/code> 与 \u003ccode>mysql\u003c/code> 相同（= \u003ccode>DB_NAME\u003c/code>），两个连接指向同一库，零额外开销。\u003c/li>\n\u003cli>\u003ccode>.env\u003c/code> 不进 git。Web 安装向导写 \u003ccode>.env\u003c/code> 时是\u003cstrong>按键合并\u003c/strong>，不会动其它键。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-71\">想真正分库 / 想去掉 mysql_business\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标\u003c/th>\n\u003cth>做法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>分库\u003c/td>\n\u003ctd>在 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>database.business_db\u003c/code> 填不同库名，然后重装向导或手动改 \u003ccode>config/database.php\u003c/code>；\u003ccode>.env\u003c/code> 保留 \u003ccode>DB_BUSINESS_NAME\u003c/code> 即可（插件只认 \u003ccode>admin_connection\u003c/code> / \u003ccode>business_connection\u003c/code> 两个\u003cstrong>连接名\u003c/strong>，两个连接都定义着就不冲突）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>切回单库\u003c/td>\n\u003ctd>去掉 \u003ccode>.env\u003c/code> 的 \u003ccode>DB_BUSINESS_NAME\u003c/code>，把 \u003ccode>config/database.php\u003c/code> 里 \u003ccode>mysql_business.database\u003c/code> 改成 \u003ccode>env(&#39;DB_NAME&#39;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不要这个连接\u003c/td>\n\u003ctd>在 \u003ccode>config/database.php\u003c/code> 删掉 \u003ccode>&#39;mysql_business&#39; =&gt; [...]\u003c/code> 整块；业务代码里出现 \u003ccode>Db::connection(&#39;mysql_business&#39;)\u003c/code> 的改成 \u003ccode>mysql\u003c/code>，或在每个模型里 \u003ccode>protected $connection = &#39;mysql&#39;;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-72\">3. 插件调参键（全量）\u003c/h2>\n\u003cp>默认值取自 \u003ccode>plugin/curd/config/curd.php\u003c/code> 的 \u003ccode>$defaults\u003c/code>；在宿主 \u003ccode>config/curd-admin.php\u003c/code>\n写\u003cstrong>同名顶层键\u003c/strong>即可覆盖。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>配置键\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>admin_connection\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>mysql\u003c/code>\u003c/td>\n\u003ctd>认证 / 菜单 / RBAC 库\u003cstrong>连接名\u003c/strong>（认证表所在库）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>business_connection\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>mysql_business\u003c/code>\u003c/td>\n\u003ctd>业务模型 CURD 默认连接名（单库下与 \u003ccode>mysql\u003c/code> 同库）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{根}/app/model\u003c/code>\u003c/td>\n\u003ctd>宿主业务模型扫描目录（自动登记进 \u003ccode>ModelRegistry\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model_namespace\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>app\\model\u003c/code>\u003c/td>\n\u003ctd>模型命名空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>controller_dirs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>app/controller/api\u003c/code> + \u003ccode>app/controller/admin/api\u003c/code>\u003c/td>\n\u003ctd>CURD 业务控制器扫描目录（继承 \u003ccode>BaseCurdController\u003c/code> 会自动关联模型）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vue_pages_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{根}/app/custom/pages\u003c/code>\u003c/td>\n\u003ctd>宿主业务 \u003ccode>.vue\u003c/code> 页面目录（\u003ccode>CustomPageController\u003c/code> 读取分发）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>casbin_model_path\u003c/code>\u003c/td>\n\u003ctd>插件自带 \u003ccode>config/casbin.conf\u003c/code>\u003c/td>\n\u003ctd>casbin 模型文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>base_model_class\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>plugin\\curd\\app\\model\\BaseModel\u003c/code>\u003c/td>\n\u003ctd>运行时动态生成模型的基类；宿主有增强版可改回 \u003ccode>app\\model\\BaseModel\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>allow_unresolved\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>推导不出权限标识的路径：\u003ccode>true\u003c/code> = 仅登录放行 / \u003ccode>false\u003c/code> = 403\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>export_max_rows\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>100000\u003c/code>\u003c/td>\n\u003ctd>单次导出最大行数（\u003ccode>&lt;= 0\u003c/code> 不限制）；超限返回 \u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;本次将导出 N 条，超过单次导出上限 M 条...&quot;}\u003c/code>，前端当错误提示而非下载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>display_auto_html\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>display()\u003c/code> 闭包返回值含真实 HTML 标签时自动按 HTML 渲染（逐行判断）；\u003ccode>false\u003c/code> = 关闭，闭包返回 HTML 必须显式 \u003ccode>-&gt;html()\u003c/code>。显式 \u003ccode>-&gt;html()\u003c/code> / \u003ccode>-&gt;html(false)\u003c/code> 不受此开关影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>error_message\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>服务内部错误\u003c/code>\u003c/td>\n\u003ctd>线上异常兜底的提示文案（编号自动追加）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>home_page\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/dashboard\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>默认落地页\u003c/strong>（登录成功后、以及访问后台根路径 / 刷新时打开哪一页）；详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>登录页是否显示图形验证码（关掉即前端不渲染、后端也不校验）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_ttl\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>300\u003c/code>\u003c/td>\n\u003ctd>验证码有效期（秒）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_length\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>4\u003c/code>\u003c/td>\n\u003ctd>验证码位数（3~6，越界回落 4；字符集已剔除易混的 \u003ccode>i l o 0 1\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>admin_require_permission\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/api/admin/*\u003c/code> 是否强制 RBAC 校验；\u003cstrong>生产建议 \u003ccode>true\u003c/code>\u003c/strong>（admin 角色有 \u003ccode>p,admin,*,*\u003c/code> 不受影响）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_provider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DefaultAuthProvider\u003c/code>\u003c/td>\n\u003ctd>登录提供方（可插拔，实现 \u003ccode>AuthProviderInterface\u003c/code>）；详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&#39;&#39;\u003c/code>（不启用）\u003c/td>\n\u003ctd>账号状态钩子（实现 \u003ccode>AuthStateGuardInterface\u003c/code>），在账号自身 \u003ccode>status\u003c/code> 之外叠加业务判定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>login_handler\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&#39;&#39;\u003c/code>（用内置）\u003c/td>\n\u003ctd>接管整个 \u003ccode>/api/auth/login\u003c/code> 的类名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>permission_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>权限总开关：\u003ccode>false\u003c/code> = 全部放行，且不生成 / 不下发任何权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>page_base\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/app/curd\u003c/code>\u003c/td>\n\u003ctd>内置前端 URL 前缀（改需同步用同 \u003ccode>VITE_BASE_PATH\u003c/code> 重建前端）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>public_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/public\u003c/code>\u003c/td>\n\u003ctd>内置前端产物目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>generator_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code>\u003c/td>\n\u003ctd>配置生成器（\u003ccode>/app/curd/curd-generator\u003c/code>）开关。\u003ccode>null\u003c/code> = 跟随调试模式（\u003ccode>APP_DEBUG=true\u003c/code> 开 / \u003ccode>false\u003c/code> 关）；\u003ccode>true\u003c/code> / \u003ccode>false\u003c/code> 显式强制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-73\">4. 宿主管家键\u003c/h2>\n\u003cp>这些键\u003cstrong>直接读 \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>\u003c/strong>（不走 \u003ccode>plugin.curd.curd.*\u003c/code>），同样写在\n\u003ccode>config/curd-admin.php\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-74\">4.1 站点信息 \u003ccode>site\u003c/code>\u003c/h3>\n\u003cp>前端 \u003ccode>/api/config/site\u003c/code> 读取，用于侧边栏 logo、登录页、浏览器标签：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&#39;site&#39; =&gt; [\n    &#39;title&#39;     =&gt; &#39;话费充值系统&#39;,             // 站点标题（logo 文字 / 登录页 / 浏览器标签）\n    &#39;logo&#39;      =&gt; &#39;Monitor&#39;,                 // logo_type=icon 时为 el-icon 组件名；=image 时为图片 URL\n    &#39;logo_type&#39; =&gt; &#39;icon&#39;,                    // icon | image\n    &#39;copyright&#39; =&gt; &#39;© 2022-2026 话费充值系统&#39;, // 页脚版权\n    &#39;favicon&#39;   =&gt; &#39;&#39;,                        // 浏览器标签图标 URL（空 = 用默认 favicon）\n],\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-75\">4.2 默认落地页 \u003ccode>home_page\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">&#39;home_page&#39; =&gt; &#39;/custom-page/home&#39;,   // 写「不含部署前缀」的相对路径\n// &#39;/dashboard&#39; → 内置首页（插件默认值）\n// 也可写完整 URL（http://...），前端整页跳转\n\u003c/code>\u003c/pre>\n\u003cp>优先级：\u003ccode>home_page\u003c/code> → \u003ccode>site.home_page\u003c/code> → 插件默认 \u003ccode>/dashboard\u003c/code>。\n改完\u003cstrong>即生效\u003c/strong>（前端每次启动都拉 \u003ccode>/api/config/site\u003c/code>），\u003cstrong>无需重建前端\u003c/strong>。\n只决定「打开哪一页」，不校验用户有没有该页面的菜单 / 权限。\u003c/p>\n\u003ch3 id=\"h-76\">4.3 上传与静态资源\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>示例\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>upload_path\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>uploads\u003c/code>\u003c/td>\n\u003ctd>上传目录（相对 \u003ccode>public\u003c/code>）；\u003ccode>local\u003c/code> 驱动存本机 \u003ccode>public/&lt;upload_path&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>upload_driver\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>local\u003c/code>\u003c/td>\n\u003ctd>存储驱动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image_server\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>http://127.0.0.1:8787/\u003c/code>\u003c/td>\n\u003ctd>图片 / 静态资源前缀，DSL 列与表单的 \u003ccode>staticHost\u003c/code> 拼装用它，可被 \u003ccode>-&gt;staticHost(&#39;...&#39;)\u003c/code> 单独覆盖\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-77\">4.4 导出与验证码\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">&#39;export_max_rows&#39; =&gt; 100000,   // 0 = 不限制；调小可防「全表导出」拖垮服务（同步查询 + 内存拼 CSV）\n&#39;captcha_enabled&#39; =&gt; true,     // false = 登录页完全不显示验证码，登录接口也不再校验\n&#39;captcha_ttl&#39;     =&gt; 300,      // 有效期（秒）\n&#39;captcha_length&#39;  =&gt; 4,        // 位数 3~6\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>验证码明文存 \u003cstrong>Redis\u003c/strong>（key \u003ccode>curd_captcha:{随机串}\u003c/code>，一次性，校验后即删）。\n\u003cstrong>Redis 挂了就没人能登录\u003c/strong> —— 应急把它设为 \u003ccode>false\u003c/code> 并重启即可放行。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-78\">4.5 配置生成器开关 \u003ccode>generator_enabled\u003c/code>\u003c/h3>\n\u003cp>后台「配置生成器」（\u003ccode>/app/curd/curd-generator\u003c/code>）能在运行时生成 CURD / Schema 页面配置，\n\u003cstrong>生产环境不该开着\u003c/strong>。默认按调试模式自动判定，无需配置：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>\u003ccode>APP_DEBUG\u003c/code>\u003c/th>\n\u003cth>生成器\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开发 / 测试\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>开启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生产\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>关闭\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>判定链（\u003ccode>plugin\\curd\\app\\Generator::enabled()\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode>config(&#39;curd-admin.generator_enabled&#39;)            // 宿主管家键，显式写 true/false 优先\n  → config(&#39;plugin.curd.curd.generator_enabled&#39;)  // 插件默认值（null）\n    → plugin.curd.app.debug / app.debug           // 都没配时跟随调试模式\n\u003c/code>\u003c/pre>\n\u003cp>显式开关（可选，覆盖自动判定）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// config/curd-admin.php\n&#39;generator_enabled&#39; =&gt; false,   // 生产显式关闭（APP_DEBUG 忘了关也不会漏）\n// &#39;generator_enabled&#39; =&gt; true, // 生产临时需要生成页面时打开，用完改回\n\u003c/code>\u003c/pre>\n\u003cp>关闭后\u003cstrong>三重拦截\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>菜单\u003c/td>\n\u003ctd>侧边栏不出现「配置生成器」（前端按 \u003ccode>/api/config/site\u003c/code> 的 \u003ccode>generator_enabled\u003c/code> 过滤，含降级默认菜单）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由\u003c/td>\n\u003ctd>直接访问 \u003ccode>/app/curd/curd-generator\u003c/code> 被守卫拦回首页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口\u003c/td>\n\u003ctd>\u003ccode>/api/curd/{tables,models,schema,generate,save-config}\u003c/code> 统一返回 \u003ccode>{&quot;code&quot;:403,&quot;msg&quot;:&quot;配置生成器已关闭（当前为生产模式）...&quot;}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>改完 \u003cstrong>restart\u003c/strong> 即可，前端无需重建（开关随 \u003ccode>/api/config/site\u003c/code> 下发）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-79\">5. 路由「宿主优先」机制\u003c/h2>\n\u003cp>webman 的 \u003ccode>Route\u003c/code> 对「同 method + 同 path」重复注册会\u003cstrong>直接抛异常\u003c/strong>（\u003ccode>Route conflict\u003c/code>）。\n插件因此统一用 \u003ccode>curd_route()\u003c/code> 注册路由：注册前检测该路径是否已被注册，\u003cstrong>已注册则跳过，\n保留宿主实现\u003c/strong>。\u003c/p>\n\u003cul>\n\u003cli>路由加载顺序：宿主 \u003ccode>config/route.php\u003c/code> → \u003cstrong>\u003ccode>config/admin-route.php\u003c/code>（存在时，插件执行其 \u003ccode>register\u003c/code> 闭包）\u003c/strong>\n→ \u003ccode>plugin/{name}/config/route.php\u003c/code>；\n后台自定义路由总是先于插件路由注册（插件同路径路由自动跳过）；\u003c/li>\n\u003cli>\u003cstrong>存量项目\u003c/strong>（自己注册过 \u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/config/site\u003c/code> 等）：装插件不冲突、行为不变，\n继续走宿主控制器；\u003c/li>\n\u003cli>\u003cstrong>新项目\u003c/strong>：无同名路由，插件路由全部生效 —— \u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code>、\n\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/custom/*\u003c/code>、\u003ccode>/api/options/*\u003c/code>、\u003ccode>/api/upload\u003c/code>、\u003ccode>/app/curd/*\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-80\">6. 内置前端与 \u003ccode>page_base\u003c/code>\u003c/h2>\n\u003cp>内置前端（Vue3 + Element Plus）的 dist 已放进 \u003ccode>plugin/curd/public/\u003c/code>，由\n\u003ccode>plugin/curd/app/controller/PageController.php\u003c/code> 承载：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>/app/curd/*\u003c/code> 下真实存在的文件按静态资源返回；\u003c/li>\n\u003cli>其余路径（vue-router history 路由，如 \u003ccode>/app/curd/dashboard\u003c/code>）回退 \u003ccode>index.html\u003c/code>；\u003c/li>\n\u003cli>\u003ccode>PageController\u003c/code> 做了\u003cstrong>路径穿越防护\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>改前缀：\u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>page_base\u003c/code>（默认 \u003ccode>/app/curd\u003c/code>），\n\u003cstrong>必须用相同的 \u003ccode>VITE_BASE_PATH\u003c/code> 重新构建前端\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">VITE_BASE_PATH=/your-prefix VITE_API_BASE_URL= VITE_API_ENCRYPT=false npm run build\n\u003c/code>\u003c/pre>\n\u003cp>存量 OSS / CDN 部署不受影响：不设 \u003ccode>VITE_BASE_PATH\u003c/code> 时 vite base 与旧版一致（\u003ccode>/\u003c/code> 或 OSS URL）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-81\">7. 环境变量一览\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变量\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DB_HOST\u003c/code> \u003ccode>DB_PORT\u003c/code> \u003ccode>DB_NAME\u003c/code> \u003ccode>DB_USER\u003c/code> \u003ccode>DB_PASSWORD\u003c/code>\u003c/td>\n\u003ctd>数据库连接（\u003cstrong>唯一必填组\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>APP_DEBUG\u003c/code>\u003c/td>\n\u003ctd>决定 \u003ccode>/api\u003c/code> 异常兜底走「本地暴露」还是「线上 500 + 编号」；同时是\u003cstrong>配置生成器的默认开关\u003c/strong>（\u003ccode>true\u003c/code> 开 / \u003ccode>false\u003c/code> 关）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>API_ENCRYPT\u003c/code>\u003c/td>\n\u003ctd>后端接口解密开关，\u003cstrong>默认 \u003ccode>true\u003c/code>\u003c/strong>，\u003ccode>.env\u003c/code> 设 \u003ccode>false\u003c/code> 才关（详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>❌ \u003cstrong>\u003ccode>CURD_*\u003c/code> 环境变量已全部移除\u003c/strong>。历史上的 \u003ccode>CURD_ADMIN_CONNECTION\u003c/code> /\n\u003ccode>CURD_BUSINESS_CONNECTION\u003c/code> / \u003ccode>CURD_ADMIN_REQUIRE_PERMISSION\u003c/code> 等已不再读取 ——\n插件调参统一收敛到宿主 \u003ccode>config/curd-admin.php\u003c/code>。\u003c/p>\n\u003cp>前端构建期变量（\u003ccode>VITE_BASE_PATH\u003c/code> / \u003ccode>VITE_API_BASE_URL\u003c/code> / \u003ccode>VITE_API_ENCRYPT\u003c/code> /\n\u003ccode>VITE_API_RSA_PUBLIC_KEY\u003c/code>）不是运行期配置，只在 \u003ccode>npm run build\u003c/code> 时内联。\n完整键清单见 \u003ccode>plugin/curd/env.example\u003c/code>（\u003cstrong>参考用，勿整文件覆盖宿主 \u003ccode>.env\u003c/code>\u003c/strong>）。\u003c/p>\n\u003c/blockquote>\n"},{"file":"10-DSL-Schema页面.md","title":"后台 DSL · Schema 页面","section":"guide","sectionName":"使用指南","mtime":"2026/10/18 07:37:07","headings":[{"depth":2,"text":"1. 一句话原理","id":"h-83"},{"depth":2,"text":"2. 新建一个页面（三步）","id":"h-84"},{"depth":2,"text":"3. 页面根 PageSchema","id":"h-85"},{"depth":2,"text":"4. 布局块（可任意嵌套）","id":"h-86"},{"depth":2,"text":"5. 容器块（能继续装子节点）","id":"h-87"},{"depth":2,"text":"6. 展示块（叶子，靠 props 驱动）","id":"h-88"},{"depth":2,"text":"7. 数据绑定：{{key.path}} 注入","id":"h-89"},{"depth":2,"text":"8. props 白名单与安全","id":"h-90"},{"depth":2,"text":"9. 渲染链路（改后端即生效，无需构建前端）","id":"h-91"},{"depth":2,"text":"10. 扩展新组件（前后端各一步）","id":"h-92"},{"depth":2,"text":"11. .vue 自定义页面（app/custom/pages/）—— 怎么用、怎么访问","id":"h-93"},{"depth":2,"text":"12. 完整示例：做一个「我的信息」页","id":"h-94"}],"allHeadings":[{"depth":1,"text":"后台 DSL · Schema 页面","id":"h-82"},{"depth":2,"text":"1. 一句话原理","id":"h-83"},{"depth":2,"text":"2. 新建一个页面（三步）","id":"h-84"},{"depth":2,"text":"3. 页面根 PageSchema","id":"h-85"},{"depth":2,"text":"4. 布局块（可任意嵌套）","id":"h-86"},{"depth":2,"text":"5. 容器块（能继续装子节点）","id":"h-87"},{"depth":2,"text":"6. 展示块（叶子，靠 props 驱动）","id":"h-88"},{"depth":2,"text":"7. 数据绑定：{{key.path}} 注入","id":"h-89"},{"depth":2,"text":"8. props 白名单与安全","id":"h-90"},{"depth":2,"text":"9. 渲染链路（改后端即生效，无需构建前端）","id":"h-91"},{"depth":2,"text":"10. 扩展新组件（前后端各一步）","id":"h-92"},{"depth":2,"text":"11. .vue 自定义页面（app/custom/pages/）—— 怎么用、怎么访问","id":"h-93"},{"depth":2,"text":"12. 完整示例：做一个「我的信息」页","id":"h-94"}],"html":"\u003ch1 id=\"h-82\">后台 DSL · Schema 页面\u003c/h1>\n\u003cblockquote>\n\u003cp>展示型页面（首页 / 看板）：后端 PHP 声明组件树 → 前端 \u003ccode>SchemaRenderer\u003c/code> 递归渲染。\n\u003cstrong>纯数据、无脚本\u003c/strong>，改后端即生效、前端无需重新构建。\n对应的 CURD 列表页 DSL 见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面\u003c/a>，分层与文件归属见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"0\" data-doc-anchor=\"h-13\">总览 §9 代码该写在哪\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-83\">1. 一句话原理\u003c/h2>\n\u003cp>一个页面 = 后端 PHP DSL 流式声明的一棵\u003cstrong>组件树 JSON\u003c/strong>，前端 \u003ccode>SchemaRenderer\u003c/code> 递归把它渲染成真实 Element Plus 页面。树节点统一为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ &quot;type&quot;: &quot;card&quot;, &quot;props&quot;: { &quot;header&quot;: &quot;今日概览&quot; }, &quot;children&quot;: [ … ] }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>type\u003c/code> 在\u003cstrong>前后端注册表\u003c/strong>里登记（后端 \u003ccode>plugin/curd/app/schema/blocks/\u003c/code> 的类，前端 \u003ccode>frontend/src/schema/componentRegistry.js\u003c/code>），\u003ccode>props\u003c/code> 走白名单透传。\u003cstrong>Schema 是纯数据、无脚本\u003c/strong>，比自定义 .vue 更可控。\u003c/p>\n\u003ch2 id=\"h-84\">2. 新建一个页面（三步）\u003c/h2>\n\u003cp>\u003cstrong>① 写页面类\u003c/strong>（用户级文件放 \u003ccode>app/controller/admin/api/\u003c/code>，命名如 \u003ccode>XxxPage.php\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\admin\\api;\n\nuse plugin\\curd\\app\\schema\\PageSchema;\nuse plugin\\curd\\app\\schema\\blocks\\Col;\nuse plugin\\curd\\app\\schema\\blocks\\Card;\nuse plugin\\curd\\app\\schema\\blocks\\Row;\n\nclass DashPage\n{\n    public static function schema(): PageSchema\n    {\n        $page = new PageSchema(&#39;概览看板&#39;);\n        $page-&gt;api(&#39;stats&#39;, &#39;/api/dash/stats&#39;);            // ① 数据接口（可多个）\n        $page-&gt;row(function (Row $row) {                   // ② 布局：24 栏栅格\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;今日&#39;, function (Card $card) {\n                    $card-&gt;statistic(&#39;充值额&#39;)-&gt;value(&#39;{{stats.amount}}&#39;)-&gt;prefix(&#39;¥&#39;);\n                });\n            });\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;提示&#39;, function (Card $card) {\n                    $card-&gt;alert(&#39;正常&#39;, &#39;一切正常&#39;)-&gt;type(&#39;success&#39;)-&gt;closable(false);\n                });\n            });\n        });\n        return $page;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 注册\u003c/strong>（业务 \u003ccode>config/route.php\u003c/code> 顶部，一行）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">PageRegistry::register(&#39;dash&#39;, [\\app\\controller\\admin\\api\\DashPage::class, &#39;schema&#39;]);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 建菜单\u003c/strong>，\u003ccode>path\u003c/code> 填 \u003ccode>/custom-page/dash\u003c/code> —— 后台「菜单管理」新增，或宿主带 \u003ccode>make:permission\u003c/code> 时用命令：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php webman make:permission --name 概览看板 --slug dash-page --type 1 --path /custom-page/dash --icon DataBoard --sort 3\n\u003c/code>\u003c/pre>\n\u003cp>改完 \u003ccode>php start.php restart\u003c/code>（新类 + 注册生效），刷新即可看到页面。\u003cstrong>已注册的参考实现\u003c/strong>：\u003ccode>app/controller/admin/api/HomePage.php\u003c/code>（首页，name=\u003ccode>home\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003ccode>.vue\u003c/code> 自定义页面是同一入口体系的另一形态：文件放 \u003ccode>app/custom/pages/demo.vue\u003c/code>，菜单 path \u003ccode>/custom-page/demo\u003c/code>，前端运行时编译渲染（复杂交互页用）。同名时 \u003cstrong>Schema 注册表优先\u003c/strong>于 .vue 文件。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-85\">3. 页面根 PageSchema\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new PageSchema(?string $title)\u003c/code>\u003c/td>\n\u003ctd>页面根节点（type=\u003ccode>page\u003c/code>，不参与渲染，只承载 title/dataApi/body）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code>\u003c/td>\n\u003ctd>页面标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;api(string $key, string $url, string $method = &#39;get&#39;, array $params = [])\u003c/code>\u003c/td>\n\u003ctd>声明数据接口。渲染前前端并发请求，结果放进 \u003ccode>pageData[$key]\u003c/code>，供 \u003ccode>{{key.xxx}}\u003c/code> 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;row/col/card/collapse/timeline/descriptions/divider/alert/statistic/image/text/copyText/box/lineChartStat/node\u003c/code>\u003c/td>\n\u003ctd>顶层挂载（来自 \u003ccode>HasBlocks\u003c/code> trait，下面节点通用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;toArray()\u003c/code>\u003c/td>\n\u003ctd>输出 \u003ccode>{ title, dataApi, body }\u003c/code>，由 CustomPageController 下发\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"h-86\">4. 布局块（可任意嵌套）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>透传 prop（白名单）\u003c/th>\n\u003cth>取值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;gutter(int)\u003c/code> \u003ccode>-&gt;justify(str)\u003c/code> \u003ccode>-&gt;align(str)\u003c/code>\u003c/td>\n\u003ctd>gutter/justify/align/wrap\u003c/td>\n\u003ctd>justify: start/end/center/space-around/space-between/space-evenly；align: top/middle/bottom\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;span(int 1-24)\u003c/code> \u003ccode>-&gt;offset(int)\u003c/code> \u003ccode>-&gt;moveRight(int)\u003c/code>(push) \u003ccode>-&gt;moveLeft(int)\u003c/code>(pull) \u003ccode>-&gt;responsive(&#39;md&#39;, 8)\u003c/code>\u003c/td>\n\u003ctd>span/offset/push/pull/xs/sm/md/lg/xl\u003c/td>\n\u003ctd>响应式断点同 el-col\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>子节点规则：\u003ccode>row\u003c/code> 装 \u003ccode>col\u003c/code>；\u003ccode>col\u003c/code> 纵向堆叠任意块。想缩进偏移用 \u003ccode>offset\u003c/code>，想调整顺序用 \u003ccode>moveRight/moveLeft\u003c/code>。\u003c/p>\n\u003ch2 id=\"h-87\">5. 容器块（能继续装子节点）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>子节点规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;header(string)\u003c/code>（渲染到 EP 卡片 header 插槽） \u003ccode>-&gt;shadow(&#39;always&#39;|&#39;hover&#39;|&#39;never&#39;)\u003c/code>\u003c/td>\n\u003ctd>children 进卡片正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;accordion(bool)\u003c/code> \u003ccode>-&gt;active(array $names)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(title, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CollapseItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code> \u003ccode>-&gt;name(string)\u003c/code> \u003ccode>-&gt;disabled(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children（可再嵌 row/card/描述…）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Timeline\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(ts, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>TimelineItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;timestamp(string)\u003c/code> \u003ccode>-&gt;placement(&#39;top&#39;|&#39;bottom&#39;)\u003c/code> \u003ccode>-&gt;type(&#39;primary&#39;|&#39;success&#39;|&#39;warning&#39;|&#39;danger&#39;|&#39;info&#39;)\u003c/code> \u003ccode>-&gt;color(string)\u003c/code> \u003ccode>-&gt;hollow(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;column(int)\u003c/code> \u003ccode>-&gt;border(bool)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;colon(bool)\u003c/code> \u003ccode>-&gt;size(&#39;large&#39;|&#39;default&#39;|&#39;small&#39;)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(label, content)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DescriptionsItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;span(int)\u003c/code> \u003ccode>-&gt;width(mixed)\u003c/code>\u003c/td>\n\u003ctd>值内容放 children；\u003ccode>item()\u003c/code> 传字符串自动转 Text 子节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;content(string)\u003c/code>（中央文字） \u003ccode>-&gt;contentPosition(&#39;left&#39;|&#39;center&#39;|&#39;right&#39;)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;borderStyle(str)\u003c/code>\u003c/td>\n\u003ctd>中央文字用 \u003ccode>content()\u003c/code>，子节点作默认插槽\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>条目类（\u003ccode>*-item\u003c/code>）\u003cstrong>只能\u003c/strong>作为对应容器（collapse/timeline/descriptions）的直接子节点，不可隔层——渲染器用单组件 \u003ccode>h()\u003c/code> 递归保证它们是父容器的直接相邻 VNode。\u003c/p>\n\u003ch2 id=\"h-88\">6. 展示块（叶子，靠 props 驱动）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;description(str)\u003c/code> \u003ccode>-&gt;type(&#39;success&#39;|&#39;info&#39;|&#39;warning&#39;|&#39;error&#39;)\u003c/code> \u003ccode>-&gt;closable(bool)\u003c/code> \u003ccode>-&gt;showIcon(bool)\u003c/code> \u003ccode>-&gt;center(bool)\u003c/code> \u003ccode>-&gt;effect(&#39;light&#39;|&#39;dark&#39;)\u003c/code>\u003c/td>\n\u003ctd>提示条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;prefix(str)\u003c/code> \u003ccode>-&gt;suffix(str)\u003c/code> \u003ccode>-&gt;precision(int)\u003c/code> \u003ccode>-&gt;groupSeparator(str)\u003c/code> \u003ccode>-&gt;valueStyle(array)\u003c/code>\u003c/td>\n\u003ctd>数值卡；value 整串 \u003ccode>{{}}\u003c/code> 且为数字时自动转 number\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;sub(str, $v=null)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;subValue($v)\u003c/code> \u003ccode>-&gt;icon(str)\u003c/code> \u003ccode>-&gt;color(str)\u003c/code> \u003ccode>-&gt;tag(str)\u003c/code> \u003ccode>-&gt;height(int=108)\u003c/code> \u003ccode>-&gt;group(bool=false)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>指标卡片\u003c/strong>：图标 + 大数字 + 副标题 + 右上角周期标记，仪表盘顶部并排四个的经典形态。\u003ccode>icon\u003c/code> 取 EP 图标名（\u003ccode>View\u003c/code>/\u003ccode>Money\u003c/code>/\u003ccode>User\u003c/code>/\u003ccode>Tickets\u003c/code>…，见前端 \u003ccode>utils/icons\u003c/code>）；\u003ccode>color\u003c/code> 取 \u003ccode>blue\u003c/code>/\u003ccode>green\u003c/code>/\u003ccode>red\u003c/code>/\u003ccode>orange\u003c/code>/\u003ccode>purple\u003c/code>/\u003ccode>cyan\u003c/code>，同时决定图标底色与标记配色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LineChartStat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;data(array|str)\u003c/code> \u003ccode>-&gt;categories(array|str)\u003c/code> \u003ccode>-&gt;seriesName(str=&#39;业绩&#39;)\u003c/code> \u003ccode>-&gt;color(str=&#39;#36cfc9&#39;)\u003c/code> \u003ccode>-&gt;height(int=350)\u003c/code> \u003ccode>-&gt;smooth(bool=true)\u003c/code> \u003ccode>-&gt;showMax(bool=true)\u003c/code> \u003ccode>-&gt;showAverage(bool=true)\u003c/code> \u003ccode>-&gt;areaGradient(bool=true)\u003c/code> \u003ccode>-&gt;unit(str)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>折线图统计卡\u003c/strong>：卡片标题 + 子标题 + 渐变面积折线图（峰值气泡 + 平均值虚线）。\u003ccode>data\u003c/code> 走 echarts 按需注册（不引入全量），\u003cstrong>取不到数据时显示「暂无数据」空态\u003c/strong>而非空图；鼠标悬停按\u003cstrong>轴触发\u003c/strong>给 tooltip（整列读数 + 虚线指示），\u003ccode>unit\u003c/code> 有值时读数自动带单位，\u003ccode>seriesName\u003c/code> 即 tooltip 里的系列名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;src(str)\u003c/code> \u003ccode>-&gt;fit(&#39;fill&#39;|&#39;contain&#39;|&#39;cover&#39;|&#39;none&#39;|&#39;scale-down&#39;)\u003c/code> \u003ccode>-&gt;alt(str)\u003c/code> \u003ccode>-&gt;lazy(bool)\u003c/code> \u003ccode>-&gt;previewSrcList(array)\u003c/code> \u003ccode>-&gt;previewTeleported(bool)\u003c/code>\u003c/td>\n\u003ctd>点击预览大图等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>copy-text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CopyText\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code> \u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;mono(bool=true)\u003c/code> \u003ccode>-&gt;mask(bool=false)\u003c/code> \u003ccode>-&gt;maskHead(int=4)\u003c/code> \u003ccode>-&gt;maskTail(int=4)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>可复制文本\u003c/strong>：等宽展示 + 一键复制按钮，用于 api_key / 密钥 / 回调地址等长串；\u003ccode>-&gt;mask(true)\u003c/code> 默认打码，配眼睛按钮切换明文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code>（也可 \u003ccode>new Text(&#39;内容&#39;)\u003c/code>）\u003c/td>\n\u003ctd>纯文本（渲染 span，非 EP 组件），说明文字用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>仪表盘组合示例\u003c/strong>（\u003ccode>box\u003c/code> 一排四个 + \u003ccode>line-chart-stat\u003c/code> 整行，即典型后台首页首屏）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 第一行：四个指标卡片\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;今日订单&#39;, &#39;{{stats.today_count}}&#39;)\n            -&gt;sub(&#39;今日成功&#39;, &#39;{{stats.today_success_count}}&#39;)\n            -&gt;icon(&#39;Tickets&#39;)-&gt;color(&#39;blue&#39;)-&gt;tag(&#39;日&#39;);\n    });\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;本月金额&#39;, &#39;{{stats.month_amount}}&#39;)\n            -&gt;sub(&#39;本月成功单金额&#39;)\n            -&gt;icon(&#39;Money&#39;)-&gt;color(&#39;green&#39;)-&gt;tag(&#39;月&#39;);\n    });\n    // … 另两个同理（red / orange）\n});\n\n// 第二行：折线图统计卡（data / categories 均可直接传数组或占位符）\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(24, function (Col $col) {\n        $col-&gt;lineChartStat(&#39;订单趋势&#39;)\n            -&gt;subTitle(&#39;近 30 天成功单走势&#39;)\n            -&gt;data(&#39;{{stats.trend_counts}}&#39;)      // 数据接口返回数组 → 整串注入\n            -&gt;categories(&#39;{{stats.trend_days}}&#39;)\n            -&gt;seriesName(&#39;成功单&#39;)\n            -&gt;color(&#39;#36cfc9&#39;);\n    });\n});\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>data\u003c/code> 的两种写法：① \u003ccode>-&gt;data(&#39;{{stats.trend_counts}}&#39;)\u003c/code> 由 dataApi 注入（推荐）；\n② \u003ccode>-&gt;data([20, 25, 30, …])\u003c/code> 直接写静态数组（适合演示或常量数据）。\u003ccode>categories\u003c/code> 省略时自动用 \u003ccode>1..n\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-89\">7. 数据绑定：\u003ccode>{{key.path}}\u003c/code> 注入\u003c/h2>\n\u003col>\n\u003cli>页面 \u003ccode>-&gt;api(&#39;stats&#39;, &#39;/api/xxx&#39;)\u003c/code> 声明数据源；数据接口就是一个普通控制器方法，返回统一响应 \u003ccode>{code, msg, data}\u003c/code>，渲染前前端并发请求并取 \u003cstrong>\u003ccode>data\u003c/code>\u003c/strong> 作为 \u003ccode>pageData[&#39;stats&#39;]\u003c/code>。\u003c/li>\n\u003cli>任一节点 props 的字符串里可用 \u003ccode>{{stats.today_amount}}\u003c/code> 占位：\u003cul>\n\u003cli>\u003cstrong>整串就是占位符\u003c/strong>（如 \u003ccode>value: &quot;{{stats.amount}}&quot;\u003c/code>）：数据是数字 → 注入数字（statistic 需要）；是对象/数组 → 原样注入；取不到 → \u003cstrong>保留原文\u003c/strong>（避免渲染出 undefined）；\u003c/li>\n\u003cli>占位符\u003cstrong>嵌在长文本\u003c/strong>里（如 \u003ccode>&quot;¥{{stats.amount}} 元&quot;\u003c/code>）→ 文本替换，取不到替换为空串。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>只做取值替换，不执行任何 JS\u003c/strong>。单个 dataApi 失败不阻塞整页（该键数据为空，占位保留便于定位）。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>参考数据接口：\u003ccode>SchemaPageDataController::home\u003c/code>（GET \u003ccode>/api/schema/home/stats\u003c/code>），返回 \u003ccode>today_amount / today_count / month_amount / pending_count / account_total / account_count / accounts[]\u003c/code>，与订单列表头部汇总条同口径。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-90\">8. props 白名单与安全\u003c/h2>\n\u003cp>后端 block 的 \u003ccode>-&gt;方法()\u003c/code> 本质是往 \u003ccode>props\u003c/code> 里塞键（\u003ccode>SchemaNode::set\u003c/code>）。\u003cstrong>前端渲染器只透传注册表白名单内的键\u003c/strong>（\u003ccode>componentRegistry.js\u003c/code>），其余一律丢弃——避免脏属性打到 EP 组件上、也避免任意数据注入造成意外行为。三个兜底入口：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$card-&gt;raw([&#39;bodyStyle&#39; =&gt; [&#39;padding&#39; =&gt; &#39;12px&#39;]]); // SchemaNode::raw：一次合并多个 props\n$img-&gt;set(&#39;initialIndex&#39;, 2);                        // SchemaNode::set：单个 prop（白名单外前端会忽略）\n$node-&gt;node($anyNode);                               // 挂载任意已构造好的节点\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"h-91\">9. 渲染链路（改后端即生效，无需构建前端）\u003c/h2>\n\u003cpre>\u003ccode>菜单 /custom-page/&lt;name&gt;\n  → GET /api/custom/page?name=&lt;name&gt;      (插件 CustomPageController)\n  → PageRegistry::find(name) 有 → {format:&#39;schema&#39;, schema:{…}}\n      | 无 → app/custom/pages/&lt;name&gt;.vue 有 → {format:&#39;vue&#39;, content, mtime}\n  → 前端 CustomPageHost 按 format 分派：\n      schema → 并发请求 dataApi → interpolateSchema 注入 → SchemaRenderer 递归渲染\n      vue    → dynamicSfc 运行时编译 SFC 渲染\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>渲染器三条特殊规则\u003c/strong>（\u003ccode>SchemaRenderer.vue\u003c/code>）：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>card\u003c/code> 的 \u003ccode>header\u003c/code> 不是 prop，是 EP 命名插槽 → 渲染器把 \u003ccode>props.header\u003c/code> 转成 header 插槽；\u003c/li>\n\u003cli>\u003ccode>collapse\u003c/code> 的展开状态（v-model）由渲染器 WeakMap 自托管，初始取 \u003ccode>props.activeNames\u003c/code>，页面无需写交互代码；\u003c/li>\n\u003cli>所有容器一律递归 children 到\u003cstrong>默认插槽\u003c/strong>，保证 \u003ccode>*-item\u003c/code> 是父容器的直接子 VNode（EP 结构要求）。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"h-92\">10. 扩展新组件（前后端各一步）\u003c/h2>\n\u003cp>以加一个「链接按钮」为例：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>后端\u003c/strong> \u003ccode>plugin/curd/app/schema/blocks/Button.php\u003c/code>：\u003ccode>class Button extends SchemaNode { __construct(){ $this-&gt;type=&#39;button&#39;; } public function text($v){ return $this-&gt;set(&#39;text&#39;,$v); } }\u003c/code>（并可在 \u003ccode>HasBlocks::button()\u003c/code> 加便捷入口）；\u003c/li>\n\u003cli>\u003cstrong>前端\u003c/strong> \u003ccode>componentRegistry.js\u003c/code> 登记一行：\u003ccode>button: { component: ElButton, props: [&#39;text&#39;,&#39;type&#39;,&#39;link&#39;, ...COMMON] }\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>渲染器零改动。当前已注册 type 全表 = 第 2.4~2.6 节列出的 20 个。\u003c/p>\n\u003cp>\u003cstrong>component 也可以指向自定义 Vue 组件\u003c/strong>（不限于 EP 组件）：\u003ccode>copy-text\u003c/code>、\u003ccode>box\u003c/code>、\u003ccode>line-chart-stat\u003c/code> 都是先例 ——\n\u003ccode>componentRegistry.js\u003c/code> 里 \u003ccode>&#39;copy-text&#39;: { component: CopyTextNode, props: [...] }\u003c/code>，\n\u003ccode>CopyTextNode.vue\u003c/code> 自己负责渲染与交互（渲染器仍然只按 \u003ccode>h(component, props, slots)\u003c/code> 调用，\nprops 依旧走白名单）。复制这类交互因此可以纯前端实现，后端 block 只负责摆位置与传值。\u003c/p>\n\u003cp>其中 \u003ccode>line-chart-stat\u003c/code> 还证明了\u003cstrong>图表也能内建\u003c/strong>：echarts 在节点组件内按需注册\n（\u003ccode>echarts/core\u003c/code> + LineChart/Grid/\u003cstrong>Tooltip\u003c/strong>/MarkPoint/MarkLine/Canvas，与 \u003ccode>views/dashboard\u003c/code> 共用同一份模块），\n所以加一个图表块不会引入全量 echarts（产物里 echarts 独立成 chunk，约 480 KB / gzip 160 KB）。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>按需引入下，未注册的组件会被静默忽略\u003c/strong>：\u003ccode>echarts.use([...])\u003c/code> 里少哪个，option 里写了\n对应配置也\u003cstrong>不会报错、只是没效果\u003c/strong>。典型就是 \u003ccode>line-chart-stat\u003c/code> 曾经漏注册 \u003ccode>TooltipComponent\u003c/code>\n—— \u003ccode>tooltip\u003c/code> 配了但鼠标悬停毫无反应。加图表/新特性时记得同步 \u003ccode>echarts.use([...])\u003c/code>\n（\u003ccode>TooltipComponent\u003c/code> 会连带装上 axisPointer，不用单独注册）。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正需要「图表联动、多图 k 线、下钻筛选」这类交互时，仍建议走 \u003ccode>.vue\u003c/code> 页面。\u003c/p>\n\u003ch2 id=\"h-93\">11. \u003ccode>.vue\u003c/code> 自定义页面（\u003ccode>app/custom/pages/\u003c/code>）—— 怎么用、怎么访问\u003c/h2>\n\u003cp>Schema 只适合「纯展示」。一旦要写复杂交互（自定义表格逻辑、图表联动、多步表单、第三方组件），就用 \u003ccode>.vue\u003c/code> 页面：\u003c/p>\n\u003cp>\u003cstrong>① 放文件\u003c/strong>：\u003ccode>&lt;宿主根&gt;/app/custom/pages/&lt;name&gt;.vue\u003c/code>。\u003cstrong>文件名即页面名，无需注册\u003c/strong>；支持子目录（\u003ccode>sub/foo.vue\u003c/code> → name=\u003ccode>sub/foo\u003c/code>）。目录可用 \u003ccode>config/plugin/curd/curd.php\u003c/code> 的 \u003ccode>vue_pages_dir\u003c/code> 改。\u003c/p>\n\u003cp>\u003cstrong>② 建菜单\u003c/strong>：\u003ccode>path\u003c/code> 填 \u003ccode>/custom-page/&lt;name&gt;\u003c/code>（与 Schema 页同一个入口体系）。\u003c/p>\n\u003cp>\u003cstrong>③ 怎么访问\u003c/strong>（三种都行）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>途径\u003c/th>\n\u003cth>地址\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>后台点菜单\u003c/td>\n\u003ctd>前端 catch-all 路由命中 \u003ccode>/custom-page/&lt;name&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直接开 URL\u003c/td>\n\u003ctd>\u003ccode>http://&lt;宿主域名&gt;/app/curd/custom-page/&lt;name&gt;\u003c/code>（插件内置前端挂 \u003ccode>/app/curd/\u003c/code> 前缀，history 模式）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调试接口\u003c/td>\n\u003ctd>\u003ccode>GET /api/custom/page?name=&lt;name&gt;\u003c/code> → \u003ccode>{format:&#39;vue&#39;, content, mtime}\u003c/code>；\u003ccode>GET /api/custom/pages\u003c/code> 列全部页面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>运行时约束\u003c/strong>（内容由浏览器端 \u003ccode>@vue/compiler-sfc\u003c/code> 现场编译，绕开了 Vite，因此有白名单）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>结构\u003c/td>\n\u003ctd>\u003ccode>&lt;template&gt;\u003c/code> + \u003ccode>&lt;script setup&gt;\u003c/code>（或 \u003ccode>&lt;script&gt;\u003c/code>，\u003cstrong>二选一，不能同时写\u003c/strong>）+ \u003ccode>&lt;style&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可 import 的模块\u003c/td>\n\u003ctd>\u003cstrong>仅 3 个\u003c/strong>：\u003ccode>vue\u003c/code>、\u003ccode>element-plus\u003c/code>、\u003ccode>@element-plus/icons-vue\u003c/code>。其它任意 specifier（含相对路径 \u003ccode>./x.js\u003c/code>、\u003ccode>axios\u003c/code>、\u003ccode>lodash\u003c/code>）编译期直接报「不支持导入模块」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>发请求\u003c/td>\n\u003ctd>\u003ccode>const request = inject(&#39;request&#39;)\u003c/code> 拿统一加密请求服务（自动带 token + RSA/AES 信封，签名同 axios：\u003ccode>request.get/post\u003c/code>）；\u003ccode>inject(&#39;router&#39;)\u003c/code> / \u003ccode>inject(&#39;route&#39;)\u003c/code> 同理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组件\u003c/td>\n\u003ctd>\u003ccode>element-plus\u003c/code> 全量注册到应用，模板里 \u003ccode>&lt;el-xxx&gt;\u003c/code> 直接写，\u003cstrong>不用 import 注册\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>样式\u003c/td>\n\u003ctd>\u003cstrong>只支持纯 CSS\u003c/strong>（\u003ccode>lang=&quot;scss&quot;\u003c/code> 会报错）；\u003ccode>&lt;style scoped&gt;\u003c/code> 的 scoped 语义降级为\u003cstrong>全局注入\u003c/strong>（不做属性转写）→ 页面 class 请带唯一前缀防串样式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效\u003c/td>\n\u003ctd>改 \u003ccode>.vue\u003c/code> 文件\u003cstrong>不用重新构建前端\u003c/strong>，刷新页面即取最新（后端按 \u003ccode>mtime\u003c/code> 下发内容）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>参考实现：\u003ccode>app/custom/pages/demo.vue\u003c/code>（计数器 + \u003ccode>inject(&#39;request&#39;)\u003c/code> 调 \u003ccode>/api/config/site\u003c/code> + el-table）。\u003c/p>\n\u003cp>\u003cstrong>两条路线怎么选\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Schema 页面\u003c/th>\n\u003cth>\u003ccode>.vue\u003c/code> 页面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>写在哪\u003c/td>\n\u003ctd>后端 PHP（\u003ccode>app/controller/admin/api/*Page.php\u003c/code>）\u003c/td>\n\u003ctd>前端文件（\u003ccode>app/custom/pages/*.vue\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能力\u003c/td>\n\u003ctd>组件树 + 24 栏栅格 + \u003ccode>{{key.path}}\u003c/code> 数据注入，\u003cstrong>无脚本\u003c/strong>\u003c/td>\n\u003ctd>完整 Vue 3：响应式/异步/循环/自定义逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁维护\u003c/td>\n\u003ctd>后端自己能加页面，零前端资产\u003c/td>\n\u003ctd>前端同学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>安全边界\u003c/td>\n\u003ctd>props 白名单，最可控\u003c/td>\n\u003ctd>能跑任意页面逻辑（仍是登录后可访问）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>同名时 \u003cstrong>Schema 注册表优先\u003c/strong> 于同名 \u003ccode>.vue\u003c/code> 文件。\u003c/p>\n\u003ch2 id=\"h-94\">12. 完整示例：做一个「我的信息」页\u003c/h2>\n\u003cp>需求：任何账号登录后只看到\u003cstrong>自己\u003c/strong>的 Api Key 与可用余额。\u003cstrong>全程只写后端 PHP，前端零改动。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>① 页面类\u003c/strong> \u003ccode>&lt;宿主&gt;/app/controller/admin/api/MyInfoPage.php\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">class MyInfoPage\n{\n    public static function schema(): PageSchema\n    {\n        $page = new PageSchema(&#39;我的信息&#39;);\n        $page-&gt;api(&#39;info&#39;, &#39;/api/schema/my-info&#39;);        // 数据接口见 ②\n\n        $page-&gt;row(function (Row $row) {                  // 24 栏栅格\n            $row-&gt;gutter(16);\n            $row-&gt;col(8, function (Col $col) {            // 左：余额\n                $col-&gt;card(&#39;可用余额&#39;, function (Card $card) {\n                    $card-&gt;statistic(&#39;当前可用余额&#39;)\n                        -&gt;value(&#39;{{info.amount}}&#39;)-&gt;prefix(&#39;¥&#39;)-&gt;precision(2);\n                    $card-&gt;divider();\n                    $card-&gt;descriptions(function (Descriptions $d) {\n                        $d-&gt;column(1);\n                        $d-&gt;item(&#39;登录账号&#39;, &#39;{{info.username}}&#39;);\n                        $d-&gt;item(&#39;关联账户&#39;, &#39;{{info.account}}&#39;);\n                    });\n                });\n            });\n            $row-&gt;col(16, function (Col $col) {           // 右：账户资料\n                $col-&gt;card(&#39;账户资料&#39;, function (Card $card) {\n                    $card-&gt;descriptions(function (Descriptions $d) {\n                        $d-&gt;border(true)-&gt;column(2);\n                        $d-&gt;item(&#39;账户名称&#39;, &#39;{{info.name}}&#39;);\n                        $d-&gt;item(&#39;接入渠道&#39;, &#39;{{info.channel_text}}&#39;);\n                    });\n                });\n            });\n        });\n\n        $page-&gt;row(function (Row $row) {                  // 第二行：接口凭证\n            $row-&gt;col(24, function (Col $col) {\n                $col-&gt;card(&#39;接口凭证&#39;, function (Card $card) {\n                    $card-&gt;copyText(&#39;{{info.api_key}}&#39;, &#39;Api Key&#39;);   // 等宽 + 一键复制\n                    $card-&gt;alert(null, &#39;{{info.notice}}&#39;)\n                        -&gt;type(&#39;{{info.notice_type}}&#39;)-&gt;closable(false);\n                });\n            });\n        });\n\n        return $page;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 数据接口\u003c/strong> \u003ccode>GET /api/schema/my-info\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function myInfo(Request $request)\n{\n    $user = $request-&gt;user;                               // AuthCheck 注入的登录用户\n    $row  = HfPlatformAccount::query()\n        -&gt;where(&#39;account&#39;, (string)$user-&gt;username)       // 归属口径：account = 登录用户名\n        -&gt;where(&#39;status&#39;, 1)\n        -&gt;first();\n\n    return json([&#39;code&#39; =&gt; 200, &#39;msg&#39; =&gt; &#39;ok&#39;, &#39;data&#39; =&gt; $row ? [\n        &#39;username&#39;    =&gt; (string)$user-&gt;username,\n        &#39;account&#39;     =&gt; (string)$row-&gt;account,\n        &#39;name&#39;        =&gt; (string)$row-&gt;name,\n        &#39;api_key&#39;     =&gt; (string)$row-&gt;api_key,\n        &#39;amount&#39;      =&gt; round((float)$row-&gt;amount, 2),   // statistic 要数字\n        &#39;channel_text&#39;=&gt; &#39;中核英科&#39;,\n        &#39;notice_type&#39; =&gt; &#39;info&#39;,\n        &#39;notice&#39;      =&gt; &#39;Api Key 是接口调用的唯一凭证，请勿泄露。&#39;,\n    ] : [\n        &#39;username&#39;    =&gt; (string)$user-&gt;username,\n        &#39;account&#39;     =&gt; &#39;—&#39;, &#39;name&#39; =&gt; &#39;—&#39;, &#39;api_key&#39; =&gt; &#39;—&#39;, &#39;amount&#39; =&gt; 0,\n        &#39;channel_text&#39;=&gt; &#39;—&#39;,\n        &#39;notice_type&#39; =&gt; &#39;warning&#39;,\n        &#39;notice&#39;      =&gt; &#39;未找到与登录账号「&#39; . $user-&gt;username . &#39;」关联的平台账户，请联系管理员开通。&#39;,\n    ]]);\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 注册两处\u003c/strong>（宿主 \u003ccode>config/route.php\u003c/code>）\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 顶部：页面声明（页面引擎在插件，业务侧只声明）\nPageRegistry::register(&#39;my-info&#39;, [\\app\\controller\\admin\\api\\page\\MyInfoPage::class, &#39;schema&#39;]);\n\n// /api 分组内：数据接口（自动带 AuthCheck + PermissionCheck）\nRoute::get(&#39;/schema/my-info&#39;, [\\app\\controller\\admin\\api\\SchemaPageDataController::class, &#39;myInfo&#39;]);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>④ 建菜单\u003c/strong>：菜单管理页新增一条，\u003ccode>path = /custom-page/my-info\u003c/code>（\u003ccode>php start.php restart\u003c/code> 后生效）。\u003c/p>\n\u003cp>\u003cstrong>⑤ 访问\u003c/strong>：\u003ccode>http://&lt;宿主域名&gt;/app/curd/custom-page/my-info\u003c/code>，或直接点侧边栏菜单。\u003c/p>\n\u003cp>两个设计要点：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Schema 没有逻辑分支\u003c/strong>：页面结构固定，&quot;有没有账户&quot;由数据接口返回占位值 + \u003ccode>notice/notice_type\u003c/code> 表达。\n连 \u003ccode>alert\u003c/code> 的 \u003ccode>type\u003c/code> 都能用占位符（\u003ccode>-&gt;type(&#39;{{info.notice_type}}&#39;)\u003c/code>），所以同一套结构既能显示 info 提示，\n也能显示 warning 警告，页面代码完全不用改；\u003c/li>\n\u003cli>\u003cstrong>权限天然够用\u003c/strong>：\u003ccode>/api/custom/\u003c/code> 与 \u003ccode>/api/schema/\u003c/code> 在 \u003ccode>PermissionCheck\u003c/code> 白名单内（仅要求登录），\n因此任何账号都能打开这一页、看到自己那条数据，\u003cstrong>不需要额外配权限节点\u003c/strong>。\u003c/li>\n\u003c/ul>\n"},{"file":"11-DSL-CURD页面.md","title":"后台 DSL · CURD 页面","section":"guide","sectionName":"使用指南","mtime":"2026/10/20 09:20:10","headings":[{"depth":2,"text":"1. 五步建一个 CURD 页","id":"h-96"},{"depth":2,"text":"2. 控制器骨架","id":"h-97"},{"depth":2,"text":"3. 常用列 grid()->column($prop, $label)","id":"h-98"},{"depth":3,"text":"3.1 点击弹窗 / 行内展开（modal() / expand()）","id":"h-99"},{"depth":2,"text":"4. 搜索 grid()->filter(callable)","id":"h-100"},{"depth":3,"text":"4.1 搜索项默认值 ->default()","id":"h-101"},{"depth":2,"text":"5. 表单 grid()->form(callable)（新增+编辑共用）","id":"h-102"},{"depth":3,"text":"5.1 场景字段控制：if ($form->isCreate()) / if ($form->isEdit())","id":"h-103"},{"depth":3,"text":"5.2 点式字段：读写 JSON 列里的子键（config.api_url）","id":"h-104"},{"depth":3,"text":"5.3 JSON 组件：$form->json() 键值对编辑器","id":"h-105"},{"depth":3,"text":"5.4 查看详情（$grid->setDetail()）：默认「列表列 ∪ 表单字段」","id":"h-106"},{"depth":2,"text":"6. 自定义操作 Action（行级/批量/全局/弹窗）","id":"h-107"},{"depth":3,"text":"6.1 全局/批量按钮 + 表单弹窗（global()/batch() × form()）","id":"h-108"},{"depth":3,"text":"6.2 Excel 导入字段 $form->excel()（multipart 直传 + 自动解析）","id":"h-109"},{"depth":2,"text":"7. 列表头汇总条 grid()->summary(callable)","id":"h-110"},{"depth":2,"text":"8. 其它常用开关（含导出）","id":"h-111"},{"depth":2,"text":"9. 字段标题国际化 __()（symfony/translation）","id":"h-112"},{"depth":2,"text":"10. 自定义 JS setCustomJs() 与公共 API window.curd","id":"h-113"},{"depth":3,"text":"10.1 执行方式（为什么 help 里的 @click 能调到函数）","id":"h-114"},{"depth":3,"text":"10.2 help() 里写事件","id":"h-115"},{"depth":3,"text":"10.3 公共 API window.curd","id":"h-116"}],"allHeadings":[{"depth":1,"text":"后台 DSL · CURD 页面","id":"h-95"},{"depth":2,"text":"1. 五步建一个 CURD 页","id":"h-96"},{"depth":2,"text":"2. 控制器骨架","id":"h-97"},{"depth":2,"text":"3. 常用列 grid()->column($prop, $label)","id":"h-98"},{"depth":3,"text":"3.1 点击弹窗 / 行内展开（modal() / expand()）","id":"h-99"},{"depth":2,"text":"4. 搜索 grid()->filter(callable)","id":"h-100"},{"depth":3,"text":"4.1 搜索项默认值 ->default()","id":"h-101"},{"depth":2,"text":"5. 表单 grid()->form(callable)（新增+编辑共用）","id":"h-102"},{"depth":3,"text":"5.1 场景字段控制：if ($form->isCreate()) / if ($form->isEdit())","id":"h-103"},{"depth":3,"text":"5.2 点式字段：读写 JSON 列里的子键（config.api_url）","id":"h-104"},{"depth":3,"text":"5.3 JSON 组件：$form->json() 键值对编辑器","id":"h-105"},{"depth":3,"text":"5.4 查看详情（$grid->setDetail()）：默认「列表列 ∪ 表单字段」","id":"h-106"},{"depth":2,"text":"6. 自定义操作 Action（行级/批量/全局/弹窗）","id":"h-107"},{"depth":3,"text":"6.1 全局/批量按钮 + 表单弹窗（global()/batch() × form()）","id":"h-108"},{"depth":3,"text":"6.2 Excel 导入字段 $form->excel()（multipart 直传 + 自动解析）","id":"h-109"},{"depth":2,"text":"7. 列表头汇总条 grid()->summary(callable)","id":"h-110"},{"depth":2,"text":"8. 其它常用开关（含导出）","id":"h-111"},{"depth":2,"text":"9. 字段标题国际化 __()（symfony/translation）","id":"h-112"},{"depth":2,"text":"10. 自定义 JS setCustomJs() 与公共 API window.curd","id":"h-113"},{"depth":3,"text":"10.1 执行方式（为什么 help 里的 @click 能调到函数）","id":"h-114"},{"depth":3,"text":"10.2 help() 里写事件","id":"h-115"},{"depth":3,"text":"10.3 公共 API window.curd","id":"h-116"}],"html":"\u003ch1 id=\"h-95\">后台 DSL · CURD 页面\u003c/h1>\n\u003cblockquote>\n\u003cp>列表管理页：表格 / 搜索 / 表单 / 自定义操作 / 汇总条 / 导出，用 \u003ccode>Grid/Form/Filter/Column/Action\u003c/code> 流式声明。\n代码位置 \u003ccode>plugin/curd/app/dsl/\u003c/code>；配套示例见 \u003ccode>app/controller/admin/api/MROrdersController.php\u003c/code>。\n展示型页面见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · Schema 页面\u003c/a>，菜单 / 权限 / 生效见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-96\">1. 五步建一个 CURD 页\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Model\u003c/strong>（业务 \u003ccode>app/model/\u003c/code>）：extends 平台 BaseModel、设 \u003ccode>$table\u003c/code>，必要时加常量字典；\u003c/li>\n\u003cli>\u003cstrong>Controller\u003c/strong>（业务 \u003ccode>app/controller/api/\u003c/code> 或 \u003ccode>admin/api/\u003c/code>）：extends \u003ccode>plugin\\curd\\app\\controller\\base\\BaseCurdController\u003c/code>，声明 \u003ccode>$title\u003c/code>，实现 \u003ccode>grid()\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>路由\u003c/strong>（\u003ccode>config/admin-route.php\u003c/code> 的 \u003ccode>register\u003c/code> 闭包，或业务 \u003ccode>config/route.php\u003c/code>）：\u003ccode>RouteControllerRegistry::registerMany([&#39;/xxx&#39; =&gt; XxxController::class])\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>菜单\u003c/strong>：后台「菜单管理」新增（\u003ccode>path\u003c/code> 填上一步的路径）；宿主若带 \u003ccode>make:permission\u003c/code> 命令（如 huafei）也可用命令建；\u003c/li>\n\u003cli>\u003cstrong>功能声明\u003c/strong>：全部在 \u003ccode>grid()\u003c/code> 里流式拼装（列 / 搜索 / 表单 / 操作 / 汇总 / 导出开关）。\u003c/li>\n\u003c/ol>\n\u003cp>参考完整实现：\u003ccode>examples/MyTestController.php\u003c/code>（示例「测试管理」，覆盖点式字段、\u003ccode>display()\u003c/code> HTML、\n\u003ccode>help()\u003c/code> 里写 \u003ccode>@click\u003c/code>、\u003ccode>setCustomJs()\u003c/code> 与 \u003ccode>window.curd\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>本篇 vs \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\">API 参考\u003c/a>\u003c/strong>：本篇按任务讲「怎么拼成一个能跑的页面」，示例偏整体；\n逐个方法的参数与边界条件看 API 参考（与源码逐行对齐），两处冲突时以 API 参考为准。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-97\">2. 控制器骨架\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">use plugin\\curd\\app\\controller\\base\\BaseCurdController;\nuse plugin\\curd\\app\\dsl\\Grid;\n\nclass MROrdersController extends BaseCurdController\n{\n    protected string $title = &#39;话费订单&#39;;\n\n    protected function grid(): Grid\n    {\n        // ① 推荐写法：不声明 $modelClass —— 框架自动从 Grid 的模型实例提取回填\n        //    （Grid 里 new 的 Model 与 $modelClass 本就是同一个类，无需写两遍）\n        // ② 推荐写法：Grid 不传 title —— 自动读控制器的 $this-&gt;title\n        $grid = new Grid(new MobileRechargeOrder());\n        $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);                   // ③ 列表默认排序\n\n        // ④ 列 / 搜索 / 表单 / 操作 / 汇总 ……\n        return $grid;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>旧写法（声明 \u003ccode>$modelClass\u003c/code> + \u003ccode>new Grid(new Model(), $this-&gt;title)\u003c/code>）依然兼容；\n新写法少两行、且改模型类时只改一处。字段标题请统一用 \u003ccode>__()\u003c/code> 翻译，见 §9。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-98\">3. 常用列 \u003ccode>grid()-&gt;column($prop, $label)\u003c/code>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>-&gt;width(int)\u003c/code> / \u003ccode>-&gt;minWidth(int)\u003c/code> / \u003ccode>-&gt;align(&#39;center&#39;)\u003c/code> / \u003ccode>-&gt;fixed(&#39;right&#39;)\u003c/code>\u003c/td>\n\u003ctd>布局\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;map([0=&gt;&#39;否&#39;,1=&gt;&#39;是&#39;])\u003c/code>\u003c/td>\n\u003ctd>值→文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;label([0=&gt;&#39;danger&#39;,1=&gt;&#39;success&#39;])\u003c/code>\u003c/td>\n\u003ctd>值→el-tag 颜色（配合 map 成
