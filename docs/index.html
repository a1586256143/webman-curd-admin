12\">Column\u003c/a>，表单/字段见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">Form/Field\u003c/a>，搜索/操作见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\">Filter/Action\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-192\">0. 速查表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new Grid(Model $model, ?string $title = null)\u003c/code>\u003c/td>\n\u003ctd>构造。title 不传则自动读控制器 \u003ccode>$title\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getModel(): Builder\u003c/code>\u003c/td>\n\u003ctd>取查询构造器（排序 / 附加条件）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getModelInstance(): Model\u003c/code>\u003c/td>\n\u003ctd>取模型实例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>column(string $prop, ?string $label = null): Column\u003c/code>\u003c/td>\n\u003ctd>加列表列，返回 Column\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>filter(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>搜索项（回调参数 \u003ccode>Filter\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>form(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>新增+编辑共用表单（回调参数 \u003ccode>Form\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addForm(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>仅「新增」表单（覆盖 form 的同名字段）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>editForm(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>仅「编辑」表单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>action(string $name, string $label): Action\u003c/code>\u003c/td>\n\u003ctd>加操作按钮，返回 Action\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addAction(Action $action): self\u003c/code>\u003c/td>\n\u003ctd>加入已构造好的 Action\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setDetail(array $groups): self\u003c/code>\u003c/td>\n\u003ctd>查看详情分组 \u003ccode>[[&#39;title&#39;=&gt;..,&#39;fields&#39;=&gt;[..]]]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setFormTabs(array $tabs): self\u003c/code>\u003c/td>\n\u003ctd>表单选项卡 \u003ccode>[[&#39;label&#39;=&gt;..,&#39;fields&#39;=&gt;[..]]]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setFormSteps(array $steps): self\u003c/code>\u003c/td>\n\u003ctd>表单分步 \u003ccode>[[&#39;label&#39;=&gt;..,&#39;fields&#39;=&gt;[..]]]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setDialogWidth(string $width): self\u003c/code>\u003c/td>\n\u003ctd>弹窗宽度，如 \u003ccode>&#39;700px&#39;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setOptions(array $options): self\u003c/code>\u003c/td>\n\u003ctd>透传页面级配置（高级）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setRowStyle(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>行内联样式回调\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setRowClass(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>行 class 回调\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setRules(array $rules): self\u003c/code>\u003c/td>\n\u003ctd>提交前校验规则（后端格式）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>summary(callable $cb): self\u003c/code>\u003c/td>\n\u003ctd>列表头汇总条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setCustomCss(string $css): self\u003c/code>\u003c/td>\n\u003ctd>注入页面 CSS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>setCustomJs(string $js): self\u003c/code>\u003c/td>\n\u003ctd>注入页面 JS（顶层函数挂全局）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>disableCreate/Edit/Delete/View/Export/BatchDelete(): self\u003c/code>\u003c/td>\n\u003ctd>关闭对应能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>title(): string\u003c/code> / \u003ccode>columns()\u003c/code> / \u003ccode>search()\u003c/code> / \u003ccode>formFields()\u003c/code> / \u003ccode>detail()\u003c/code> / \u003ccode>actions()\u003c/code>\u003c/td>\n\u003ctd>读取内部结构（框架用，少直接用）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-193\">1. 构造与标题\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">protected function grid(): Grid\n{\n    // 推荐：不传 title，自动读控制器 $title\n    $grid = new Grid(new MyTest());\n    $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);\n    return $grid;\n}\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new Grid(new MyTest())\u003c/code>\u003c/td>\n\u003ctd>标题取 \u003ccode>$this-&gt;title\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>new Grid(new MyTest(), &#39;订单管理&#39;)\u003c/code>\u003c/td>\n\u003ctd>显式覆盖标题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>模型类不用再声明 \u003ccode>$modelClass\u003c/code>：框架从 Grid 的模型实例自动提取回填。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>排序 / 附加条件\u003c/strong>（\u003ccode>getModel()\u003c/code> 返回 \u003ccode>illuminate\u003c/code> 查询构造器）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;)-&gt;where(&#39;deleted&#39;, 0);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-194\">2. 列 \u003ccode>column()\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(80)-&gt;align(&#39;center&#39;);\n$grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;));\n$grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;datetime()-&gt;width(180);\n\u003c/code>\u003c/pre>\n\u003cp>返回 \u003ccode>Column\u003c/code>，可继续链式设置。\u003cstrong>完整列方法见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">API · Column\u003c/a>。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>点式列 \u003ccode>aaa.xxx\u003c/code>\u003c/strong>：\u003ccode>aaa\u003c/code> 是真实字段（JSON 列）时按 JSON 键取值；不是字段时当作\u003cstrong>关联关系\u003c/strong>\n（如 \u003ccode>user.name\u003c/code> → \u003ccode>belongsTo(&#39;User&#39;)\u003c/code>），列表查询会自动 \u003ccode>with(&#39;aaa&#39;)\u003c/code> 预加载：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;config.api_url&#39;, __(&#39;Api url&#39;));   // JSON 字段取键（字段优先）\n$grid-&gt;column(&#39;user.name&#39;, __(&#39;User&#39;));           // 关联关系取字段（不是字段才走关联）\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>关联预加载\u003cstrong>只用于取点式值\u003c/strong>：\u003ccode>with(&#39;user&#39;)\u003c/code> 载入的关联对象不会出现在列表 JSON 里，\n行数据只有真实字段 + \u003ccode>user.name\u003c/code> 这类字面 key（避免整个关联对象被序列化下发）。\n若确实要输出关联内容，用 \u003ccode>-&gt;display()\u003c/code> 自行拼装。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>弹窗 / 整行展开\u003c/strong>：\u003ccode>-&gt;modal(&#39;标题&#39;, $content)\u003c/code> / \u003ccode>-&gt;expand($content)\u003c/code>（点行任意位置、内容通栏），内容支持\n\u003ccode>Table\u003c/code> / \u003ccode>Card\u003c/code> / \u003ccode>Html\u003c/code> 组件、闭包、类名、HTML 模板 —— 见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\" data-doc-anchor=\"h-217\">Column §9\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-195\">3. 搜索 \u003ccode>filter()\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;like(&#39;name&#39;, __(&#39;Name&#39;));\n    $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;]);\n    $filter-&gt;dateRange(&#39;created_at&#39;, __(&#39;Created at&#39;));\n});\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>完整搜索方法见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\" data-doc-anchor=\"h-246\">API · Filter\u003c/a>。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-196\">4. 表单 \u003ccode>form()\u003c/code> / \u003ccode>addForm()\u003c/code> / \u003ccode>editForm()\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;labelWidth(120)-&gt;contentWidth(&#39;520px&#39;);\n    $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;required();\n    $form-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])-&gt;default(1);\n});\n\n// 仅新增时追加字段（如初始密码）\n$grid-&gt;addForm(function (Form $form) {\n    $form-&gt;password(&#39;password&#39;, __(&#39;Password&#39;))-&gt;required();\n});\n\n// 仅编辑时追加字段\n$grid-&gt;editForm(function (Form $form) {\n    $form-&gt;textarea(&#39;remark&#39;, __(&#39;Remark&#39;));\n});\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>form()\u003c/code> 同时作用于新增与编辑；\u003c/li>\n\u003cli>\u003ccode>addForm()/editForm()\u003c/code> 里的字段按 \u003ccode>prop\u003c/code> 覆盖 \u003ccode>form()\u003c/code> 的同名字段；\u003c/li>\n\u003cli>字段类型与通用方法见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">API · Form/Field\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-197\">4.1 表单选项卡 / 分步\u003c/h3>\n\u003cp>两者结构相同：\u003ccode>[[&#39;label&#39; =&gt; 标题, &#39;fields&#39; =&gt; [字段 prop...]]]\u003c/code>。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setFormTabs([\n    [&#39;label&#39; =&gt; &#39;基础信息&#39;, &#39;fields&#39; =&gt; [&#39;name&#39;, &#39;status&#39;]],\n    [&#39;label&#39; =&gt; &#39;接口配置&#39;, &#39;fields&#39; =&gt; [&#39;config.api_url&#39;, &#39;config.api_token&#39;, &#39;config.timeout&#39;]],\n    [&#39;label&#39; =&gt; &#39;其它&#39;, &#39;fields&#39; =&gt; [&#39;remark&#39;, &#39;extra&#39;]],\n]);\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setFormSteps([\n    [&#39;label&#39; =&gt; &#39;第 1 步 · 基础&#39;, &#39;fields&#39; =&gt; [&#39;name&#39;, &#39;status&#39;]],\n    [&#39;label&#39; =&gt; &#39;第 2 步 · 配置&#39;, &#39;fields&#39; =&gt; [&#39;config.api_url&#39;, &#39;config.api_token&#39;]],\n]);\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>未列进任何分组的字段会自动归入「其他」，不会丢失。选项卡与分步同时设置时以分步为准。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-198\">4.2 提交二次确认\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;confirm(&#39;确认保存吗？&#39;, &#39;create&#39;);   // 新增时确认\n    $form-&gt;confirm(&#39;修改将立即生效，继续？&#39;, &#39;edit&#39;); // 编辑时确认\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-199\">4.3 场景字段（新增/编辑各显示一部分）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;isCreate();       // 仅新增显示\n    $form-&gt;text(&#39;code&#39;, __(&#39;Code&#39;))-&gt;isEdit();         // 仅编辑显示\n});\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-200\">5. 查看详情 \u003ccode>setDetail()\u003c/code>\u003c/h2>\n\u003cp>不设置时默认 = 「列表列 ∪ 表单字段」。显式设置后\u003cstrong>只显示声明的字段\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setDetail([\n    [&#39;title&#39; =&gt; &#39;基础信息&#39;, &#39;fields&#39; =&gt; [&#39;id&#39;, &#39;name&#39;, &#39;status&#39;, &#39;created_at&#39;]],\n    [&#39;title&#39; =&gt; &#39;接口配置&#39;, &#39;fields&#39; =&gt; [&#39;config.api_url&#39;, &#39;config.api_token&#39;, &#39;config.timeout&#39;]],\n]);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>fields\u003c/code> 用列表列 / 表单字段的 \u003ccode>prop\u003c/code>（点式字段同样支持）；\u003c/li>\n\u003cli>详情是只读视图：\u003ccode>switch\u003c/code> 显示「开/关」、\u003ccode>select\u003c/code> 显示选项文案、\u003ccode>image\u003c/code> 显示缩略图。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-201\">6. 操作按钮 \u003ccode>action()\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;sync&#39;, __(&#39;Sync&#39;))\n    -&gt;icon(&#39;Refresh&#39;)\n    -&gt;confirm(&#39;确定同步该条数据吗？&#39;)\n    -&gt;handler(&#39;sync&#39;)          // → POST /api/curd/model/{Model}/action/sync\n    -&gt;show(fn($row) =&gt; $row-&gt;status == 1);\n\u003c/code>\u003c/pre>\n\u003cp>返回 \u003ccode>Action\u003c/code>，可继续链式设置（\u003ccode>form()\u003c/code> 弹窗表单 / \u003ccode>batch()\u003c/code> 批量 / \u003ccode>global()\u003c/code> 全局 / \u003ccode>jump()\u003c/code> 跳转 / \u003ccode>api()\u003c/code> 自定义接口…）。\n\u003cstrong>完整操作能力见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\" data-doc-anchor=\"h-253\">API · Action\u003c/a>。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-202\">7. 汇总条 \u003ccode>summary()\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;summary(function ($query) {\n    $q = clone $query; // 当前筛选后的查询，随搜索自动刷新\n    $total = (float)(clone $q)-&gt;sum(&#39;money&#39;);\n    $ok = (float)(clone $q)-&gt;where(&#39;status&#39;, 2)-&gt;sum(&#39;money&#39;);\n    return &#39;&lt;span&gt;合计：&lt;b&gt;￥&#39; . number_format($total, 2) . &#39;&lt;/b&gt;&#39;\n        . &#39; · 成功：&lt;b&gt;￥&#39; . number_format($ok, 2) . &#39;&lt;/b&gt;&lt;/span&gt;&#39;;\n});\n\u003c/code>\u003c/pre>\n\u003cp>返回 HTML，直接渲染在表格头部。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-203\">8. 行样式与校验\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// 行内联样式（返回数组）\n$grid-&gt;setRowStyle(function ($row) {\n    return $row-&gt;status == 0 ? [&#39;background&#39; =&gt; &#39;#fff7ed&#39;] : [];\n});\n\n// 行 class（返回字符串）\n$grid-&gt;setRowClass(fn($row) =&gt; $row-&gt;status == 0 ? &#39;row-disabled&#39; : &#39;&#39;);\n\n// 提交前校验（后端格式，字段 =&gt; 规则）\n$grid-&gt;setRules([\n    &#39;name&#39; =&gt; &#39;required|max:50&#39;,\n    &#39;config.timeout&#39; =&gt; &#39;integer|between:1,600&#39;,\n]);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-204\">9. 能力开关\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;disableCreate();        // 隐藏「新增」\n$grid-&gt;disableEdit();          // 隐藏「编辑」\n$grid-&gt;disableDelete();        // 隐藏「删除」\n$grid-&gt;disableView();          // 隐藏「查看」\n$grid-&gt;disableExport();        // 隐藏「导出」\n$grid-&gt;disableBatchDelete();   // 隐藏「批量删除」\n\u003c/code>\u003c/pre>\n\u003cp>导出行为（导出当前页 / 选中 / 全部、导出列收窄）见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面 §8\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-205\">10. 自定义 CSS / JS\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setCustomCss(&#39;.row-disabled { color: #9ca3af; }&#39;);\n\n$grid-&gt;setCustomJs(&lt;&lt;&lt;&#39;JS&#39;\n// 顶层函数会挂到全局，help 里的 @click 可直接调用\nfunction hello() {\n  curd.message.success(&#39;hello&#39;)\n  console.log(curd.getFormData())\n}\nJS);\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>window.curd\u003c/code> 公共 API（表单 / 列表 / 弹窗 / 提示 / 请求）见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面 §10\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-206\">11. 其它\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setDialogWidth(&#39;760px&#39;);   // 新增/编辑弹窗宽度\n$grid-&gt;setOptions([...]);         // 页面级配置透传（高级用法，见前端 config）\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-207\">12. 一个完整可运行示例\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\admin\\api;\n\nuse app\\model\\HfGoods;\nuse plugin\\curd\\app\\controller\\base\\BaseCurdController;\nuse plugin\\curd\\app\\dsl\\Filter;\nuse plugin\\curd\\app\\dsl\\Form;\nuse plugin\\curd\\app\\dsl\\Grid;\n\nclass HfGoodsController extends BaseCurdController\n{\n    protected string $title = &#39;商品管理&#39;;\n\n    private const STATUS = [0 =&gt; &#39;下架&#39;, 1 =&gt; &#39;上架&#39;];\n\n    protected function grid(): Grid\n    {\n        $grid = new Grid(new HfGoods());\n        $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);\n\n        $grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(70)-&gt;align(&#39;center&#39;);\n        $grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))-&gt;copy();\n        $grid-&gt;column(&#39;price&#39;, __(&#39;Price&#39;))-&gt;prefix(&#39;￥&#39;);\n        $grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))-&gt;map(self::STATUS)-&gt;label([0 =&gt; &#39;info&#39;, 1 =&gt; &#39;success&#39;]);\n        $grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;datetime()-&gt;width(180);\n\n        $grid-&gt;filter(function (Filter $filter) {\n            $filter-&gt;like(&#39;name&#39;, __(&#39;Name&#39;));\n            $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options(self::STATUS);\n            $filter-&gt;dateRange(&#39;created_at&#39;, __(&#39;Created at&#39;));\n        });\n\n        $grid-&gt;form(function (Form $form) {\n            $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;required();\n            $form-&gt;number(&#39;price&#39;, __(&#39;Price&#39;))-&gt;min(0)-&gt;step(&#39;0.01&#39;);\n            $form-&gt;radio(&#39;status&#39;, __(&#39;Status&#39;), self::STATUS)-&gt;default(1);\n        });\n\n        $grid-&gt;action(&#39;sync&#39;, __(&#39;Sync&#39;))\n            -&gt;icon(&#39;Refresh&#39;)\n            -&gt;confirm(&#39;确定同步该商品吗？&#39;)\n            -&gt;handler(&#39;sync&#39;);\n\n        $grid-&gt;summary(function ($query) {\n            return &#39;&lt;span&gt;商品数：&lt;b&gt;&#39; . (clone $query)-&gt;count() . &#39;&lt;/b&gt;&lt;/span&gt;&#39;;\n        });\n\n        return $grid;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>路由（宿主 \u003ccode>config/route.php\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">RouteControllerRegistry::registerMany([\n    &#39;/hf-goods&#39; =&gt; \\app\\controller\\admin\\api\\HfGoodsController::class,\n]);\n\u003c/code>\u003c/pre>\n\u003cp>控制器里再实现操作处理（\u003ccode>handler(&#39;sync&#39;)\u003c/code> 对应 \u003ccode>actionSync()\u003c/code>；不写 \u003ccode>handler()\u003c/code> 时按 action 名推导 \u003ccode>action{Sync}()\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 约定：action + 帕斯卡命名的操作名 + (Request $request)\npublic function actionSync(\\support\\Request $request)\n{\n    $id = (int)$request-&gt;post(&#39;id&#39;);\n    // ... 业务逻辑\n    return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;ok&#39;]);\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>更推荐把业务写进 \u003ccode>Action\u003c/code> 子类的 \u003ccode>handle(Request $request)\u003c/code>（可用 \u003ccode>$this-&gt;model()\u003c/code> 取当前行），\n此时控制器无需任何方法。约定见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\" data-doc-anchor=\"h-257\">API · Action\u003c/a>。\u003c/p>\n\u003c/blockquote>\n"},{"file":"21-API-Column.md","title":"API · Column 列方法大全","section":"api","sectionName":"API 参考","mtime":"2026/10/20 09:24:08","headings":[{"depth":2,"text":"0. 速查表","id":"h-209"},{"depth":2,"text":"1. 布局","id":"h-210"},{"depth":2,"text":"3. 显示值与 HTML","id":"h-211"},{"depth":2,"text":"4. 时间","id":"h-212"},{"depth":2,"text":"5. 图片与静态资源","id":"h-213"},{"depth":2,"text":"6. 链接","id":"h-214"},{"depth":2,"text":"7. 关联表翻译","id":"h-215"},{"depth":2,"text":"8. 行内编辑","id":"h-216"},{"depth":2,"text":"9. 弹窗与整行展开","id":"h-217"},{"depth":3,"text":"9.1 内容的四种写法","id":"h-218"},{"depth":3,"text":"9.1.1 用类写弹窗内容（OrderDetailModal）","id":"h-219"},{"depth":3,"text":"9.2 内置组件","id":"h-220"},{"depth":3,"text":"9.3 整行展开的交互细节","id":"h-221"},{"depth":3,"text":"9.4 与 display() / copy() 的优先级","id":"h-222"},{"depth":2,"text":"10. 兜底配置","id":"h-223"},{"depth":2,"text":"11. 完整示例","id":"h-224"}],"allHeadings":[{"depth":1,"text":"API · Column 列方法大全","id":"h-208"},{"depth":2,"text":"0. 速查表","id":"h-209"},{"depth":2,"text":"1. 布局","id":"h-210"},{"depth":2,"text":"3. 显示值与 HTML","id":"h-211"},{"depth":2,"text":"4. 时间","id":"h-212"},{"depth":2,"text":"5. 图片与静态资源","id":"h-213"},{"depth":2,"text":"6. 链接","id":"h-214"},{"depth":2,"text":"7. 关联表翻译","id":"h-215"},{"depth":2,"text":"8. 行内编辑","id":"h-216"},{"depth":2,"text":"9. 弹窗与整行展开","id":"h-217"},{"depth":3,"text":"9.1 内容的四种写法","id":"h-218"},{"depth":3,"text":"9.1.1 用类写弹窗内容（OrderDetailModal）","id":"h-219"},{"depth":3,"text":"9.2 内置组件","id":"h-220"},{"depth":3,"text":"9.3 整行展开的交互细节","id":"h-221"},{"depth":3,"text":"9.4 与 display() / copy() 的优先级","id":"h-222"},{"depth":2,"text":"10. 兜底配置","id":"h-223"},{"depth":2,"text":"11. 完整示例","id":"h-224"}],"html":"\u003ch1 id=\"h-208\">API · Column 列方法大全\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003ccode>$grid-&gt;column($prop, $label)\u003c/code> 返回 \u003ccode>Column\u003c/code>，所有方法返回自身，可链式组合。\n代码位置 \u003ccode>plugin/curd/app/dsl/Column.php\u003c/code>。\n点式列（\u003ccode>config.api_url\u003c/code>）对\u003cstrong>任意列方法\u003c/strong>都成立，与字段类型无关。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-209\">0. 速查表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>width(int)\u003c/code> / \u003ccode>minWidth(int)\u003c/code>\u003c/td>\n\u003ctd>列宽 / 最小宽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>align(&#39;center&#39;)\u003c/code>\u003c/td>\n\u003ctd>对齐 \u003ccode>left/center/right\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>fixed(&#39;right&#39;)\u003c/code>\u003c/td>\n\u003ctd>固定列 \u003ccode>left/right\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sortable(bool)\u003c/code>\u003c/td>\n\u003ctd>是否可排序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hidden(bool)\u003c/code>\u003c/td>\n\u003ctd>默认隐藏（可在「列配置」里打开）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>showInList(bool)\u003c/code>\u003c/td>\n\u003ctd>是否出现在列表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>limit(int)\u003c/code>\u003c/td>\n\u003ctd>文本截断长度（超出省略）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>map(array)\u003c/code>\u003c/td>\n\u003ctd>值 → 文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>label(array)\u003c/code>\u003c/td>\n\u003ctd>值 → el-tag 颜色（配合 map）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>switch(int $active, int $inactive)\u003c/code>\u003c/td>\n\u003ctd>行内开关（显示为开关）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>display(string|callable)\u003c/code>\u003c/td>\n\u003ctd>自定义显示值；\u003cstrong>字符串按 HTML 渲染\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>html(bool)\u003c/code>\u003c/td>\n\u003ctd>显示值按 HTML 渲染（闭包需显式开启）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>prefix(string)\u003c/code> / \u003ccode>suffix(string)\u003c/code>\u003c/td>\n\u003ctd>显示值前后缀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>copy()\u003c/code>\u003c/td>\n\u003ctd>可复制列（复制按钮，复制显示值）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>modal(string $title, $content)\u003c/code>\u003c/td>\n\u003ctd>点击弹窗，弹窗内容服务端逐行生成（Table / Card / Html / 闭包 / 类名 / 模板）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>expand($content, string $title = &#39;&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>整行展开\u003c/strong>：点行任意位置展开/收起，内容通栏显示在行下方（写法同 \u003ccode>modal\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>datetime()\u003c/code> / \u003ccode>date()\u003c/code>\u003c/td>\n\u003ctd>时间格式化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image(int $w, int $h)\u003c/code> / \u003ccode>staticHost(?string)\u003c/code>\u003c/td>\n\u003ctd>图片列 / 静态资源域名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>open(&#39;_blank&#39;)\u003c/code>\u003c/td>\n\u003ctd>点击在新窗口打开该列值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>href(string|callable, string $target)\u003c/code>\u003c/td>\n\u003ctd>单元格链接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>remote(string $table, $valueKey, $labelKey)\u003c/code>\u003c/td>\n\u003ctd>关联表翻译\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>editable(string $type, array $options)\u003c/code>\u003c/td>\n\u003ctd>行内编辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>select(array $options)\u003c/code>\u003c/td>\n\u003ctd>行内下拉编辑（\u003ccode>editable(&#39;select&#39;)\u003c/code> 便捷写法）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config(array)\u003c/code>\u003c/td>\n\u003ctd>塞入任意原始列配置（兜底）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-210\">1. 布局\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(70)-&gt;align(&#39;center&#39;);\n$grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))-&gt;minWidth(160)-&gt;sortable();\n$grid-&gt;column(&#39;remark&#39;, __(&#39;Remark&#39;))-&gt;limit(20);       // 超 20 字省略，点击弹出全文\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>列宽自适应\u003c/strong>：\u003ccode>width\u003c/code> / \u003ccode>minWidth\u003c/code> 未指定时，主表格列按\u003cstrong>当前页内容\u003c/strong>自动估算列宽\n（表头 + 单元格显示文本，含 display / map 结果；HTML 值先去标签），超长列 clamp 到 460px 换行。\n显式指定 \u003ccode>width\u003c/code> / \u003ccode>minWidth\u003c/code> 则完全以定义为准。规则与 \u003ccode>expand\u003c/code> / \u003ccode>modal\u003c/code> 里 \u003ccode>Table\u003c/code> 组件一致（\u003ccode>fit: false\u003c/code> 可关）。\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003ccode>limit(N)\u003c/code> 对\u003cstrong>单元格最终显示文本\u003c/strong>生效：与 \u003ccode>-&gt;display()\u003c/code> 叠加时，截断的是 display 闭包的返回值\n（超出省略 + 点击弹全文）；HTML 渲染值（\u003ccode>-&gt;html()\u003c/code> / 自动检测命中）不做文本截断，避免截坏标签。\n$grid-&gt;column(&#39;updated_at&#39;, __(&#39;Updated at&#39;))-&gt;hidden(); // 默认不显示\n$grid-&gt;column(&#39;actions_placeholder&#39;, &#39;&#39;)-&gt;fixed(&#39;right&#39;);\u003c/p>\n\u003c/blockquote>\n\u003cpre>\u003ccode>\n---\n\n## 2. 字典映射与颜色标签\n\n```php\n$grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))\n    -&gt;map([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])\n    -&gt;label([0 =&gt; &#39;danger&#39;, 1 =&gt; &#39;success&#39;]);   // el-tag 颜色\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>map\u003c/code> 只改显示文案，原始值仍用于编辑回显；\u003c/li>\n\u003cli>\u003ccode>label\u003c/code> 让单元格渲染成彩色标签（值必须与 map 的键一致）。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>行内开关\u003c/strong>（直接显示 el-switch，切换即保存）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))-&gt;switch(1, 0);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-211\">3. 显示值与 HTML\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// ① 闭包：返回文本（默认转义，安全）\n$grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))\n    -&gt;display(fn($v) =&gt; $v == 1 ? &#39;开启&#39; : &#39;关闭&#39;);\n\n// ② 闭包 + -&gt;html()：返回 HTML\n$grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))\n    -&gt;display(fn($v, $row) =&gt; &#39;&lt;b&gt;&#39; . htmlspecialchars($v) . &#39;&lt;/b&gt;&#39;)\n    -&gt;html();\n\n// ②&#39; 闭包返回 HTML 但没写 -&gt;html()：自动检测（默认开启，见下方说明）\n$grid-&gt;column(&#39;ip_status&#39;, __(&#39;IP状态&#39;))\n    -&gt;display(function () {\n        return $this-&gt;getOther()[&#39;proxy_cache&#39;] ?? &#39;&#39;\n            ? &quot;&lt;el-tag type=&#39;info&#39;&gt;池&lt;/el-tag&gt;&quot;\n            : &quot;&lt;el-tag type=&#39;danger&#39;&gt;兜底&lt;/el-tag&gt;&quot;;\n    });   // 返回值里出现真实标签 → 自动按 HTML 渲染\n\n// ③ 字符串模板：自动按 HTML 渲染，{prop} 取行字段、{value} 取原始值\n$grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))\n    -&gt;display(&#39;&lt;a href=&quot;/admin/user/{id}&quot; target=&quot;_blank&quot;&gt;{name}&lt;/a&gt;&#39;);\n\n// ④ 前后缀（与 display 可叠加：先 display 再拼前后缀）\n$grid-&gt;column(&#39;price&#39;, __(&#39;Price&#39;))-&gt;prefix(&#39;￥&#39;)-&gt;suffix(&#39; 元&#39;);\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>闭包内 \u003ccode>$this\u003c/code> 绑定为\u003cstrong>当前行\u003c/strong>，也可用第二个参数 \u003ccode>$row\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>HTML 自动检测（\u003ccode>display_auto_html\u003c/code>，默认开启）\u003c/strong>\u003c/p>\n\u003cp>服务端逐行判断闭包返回值：命中「\u003ccode>&lt;字母…&gt;\u003c/code> 真实标签」就按 HTML 渲染，纯文本照常转义。判定规则：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>返回值\u003c/th>\n\u003cth>是否按 HTML 渲染\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>&lt;span class=&quot;label&quot;&gt;池&lt;/span&gt;\u003c/code> / \u003ccode>&lt;el-tag type=&quot;info&quot;&gt;池&lt;/el-tag&gt;\u003c/code>\u003c/td>\n\u003ctd>✅ 是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>价格 &lt;span&gt;12&lt;/span&gt; 元\u003c/code>\u003c/td>\n\u003ctd>✅ 是（含真实标签）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>纯文本\u003c/code> / \u003ccode>5 &lt; 10\u003c/code> / \u003ccode>a &lt; b 且 b &gt; c\u003c/code> / \u003ccode>&lt;&gt;\u003c/code>\u003c/td>\n\u003ctd>❌ 否（\u003ccode>&lt;\u003c/code> 后不是标签名）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>优先级：\u003ccode>-&gt;html()\u003c/code> 强制 HTML → \u003ccode>-&gt;html(false)\u003c/code> 强制文本 → 都没写才走自动检测。\n全局关闭：宿主 \u003ccode>config/curd-admin.php\u003c/code> 加 \u003ccode>&#39;display_auto_html&#39; =&gt; false\u003c/code>（之后闭包返回 HTML 必须显式 \u003ccode>-&gt;html()\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ 自动检测开启后，返回值不再自动转义：拼接外部数据（如代理 IP、用户昵称）请自行 \u003ccode>htmlspecialchars()\u003c/code>。\n该能力需要新前端产物（\u003ccode>display_html_{prop}\u003c/code> 标记），升级插件后\u003cstrong>必须重建/同步前端\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>\u003ccode>v-html\u003c/code> 不编译 Vue 组件\u003c/strong>：\u003ccode>return &#39;&lt;el-tag type=&quot;info&quot;&gt;池&lt;/el-tag&gt;&#39;\u003c/code> 只会得到一个无样式的未知标签\n（Element Plus 的样式挂在 \u003ccode>.el-tag\u003c/code> \u003cstrong>类名\u003c/strong>上，不是标签名上）。徽标请用内联样式，最稳且不依赖分包 CSS：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 灰（info）徽标；success/warning/danger 换 bg/color/border 三色即可\nreturn &#39;&lt;span style=&quot;display:inline-flex;align-items:center;height:22px;padding:0 8px;&#39;\n     . &#39;border-radius:4px;font-size:12px;line-height:1;border:1px solid #e9e9eb;&#39;\n     . &#39;background:#f4f4f5;color:#909399&quot;&gt;池&lt;/span&gt;&#39;;\n\u003c/code>\u003c/pre>\n\u003cp>也可写 \u003ccode>&lt;span class=&quot;el-tag el-tag--info&quot;&gt;池&lt;/span&gt;\u003c/code>（依赖该页已加载 el-tag 的样式分包）；\n想用真组件渲染则走 \u003ccode>-&gt;map()\u003c/code> + \u003ccode>-&gt;label()\u003c/code>（文案由字典决定，不能再拼额外数据）。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>可复制列\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;config.api_url&#39;, __(&#39;Api url&#39;))-&gt;copy();\n\u003c/code>\u003c/pre>\n\u003cp>复制的是 \u003ccode>display()\u003c/code> / \u003ccode>map()\u003c/code> / \u003ccode>prefix()\u003c/code> 之后的最终显示值；copy 的渲染优先级最高。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-212\">4. 时间\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;datetime()-&gt;width(180);\n$grid-&gt;column(&#39;birthday&#39;, __(&#39;Birthday&#39;))-&gt;date();\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-213\">5. 图片与静态资源\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;avatar&#39;, __(&#39;Avatar&#39;))-&gt;image(40, 40);\n$grid-&gt;column(&#39;cover&#39;, __(&#39;Cover&#39;))-&gt;image()-&gt;staticHost(&#39;https://cdn.example.com&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>staticHost\u003c/code> 不传时取配置 \u003ccode>curd-admin.image_server\u003c/code>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-214\">6. 链接\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// 固定地址，新窗口\n$grid-&gt;column(&#39;url&#39;, __(&#39;Url&#39;))-&gt;open(&#39;_blank&#39;);\n\n// 动态链接：闭包返回 URL 字符串，或 [&#39;url&#39;=&gt;..,&#39;target&#39;=&gt;..]\n$grid-&gt;column(&#39;order_no&#39;, __(&#39;Order no&#39;))\n    -&gt;href(fn($v, $row) =&gt; &#39;/app/curd/#/order-detail?id=&#39; . $row-&gt;id);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-215\">7. 关联表翻译\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;user_id&#39;, __(&#39;User&#39;))\n    -&gt;remote(&#39;admin_users&#39;, &#39;id&#39;, &#39;username&#39;);   // 表, 值字段, 显示字段\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-216\">8. 行内编辑\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// 文本行内编辑\n$grid-&gt;column(&#39;remark&#39;, __(&#39;Remark&#39;))-&gt;editable(&#39;input&#39;);\n\n// 下拉行内编辑（关联数组：值 =&gt; 文案）\n$grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))-&gt;select([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;]);\n\n// 下拉行内编辑（二维列表：value/label）\n$grid-&gt;column(&#39;platform&#39;, __(&#39;Platform&#39;))-&gt;select([\n    [&#39;value&#39; =&gt; 1, &#39;label&#39; =&gt; &#39;微信&#39;],\n    [&#39;value&#39; =&gt; 2, &#39;label&#39; =&gt; &#39;支付宝&#39;],\n]);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>修改后立即提交到当前控制器的 \u003ccode>update\u003c/code> 接口；\u003c/li>\n\u003cli>行内编辑字段自动加入\u003cstrong>可写字段白名单\u003c/strong>，不必再写进 \u003ccode>form()\u003c/code>；\u003c/li>\n\u003cli>带 \u003ccode>-&gt;select()\u003c/code> 的列优先级低于 \u003ccode>display()\u003c/code>（若同时存在，display 生效）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-217\">9. 弹窗与整行展开\u003c/h2>\n\u003cp>给行挂一个交互：点开\u003cstrong>弹窗\u003c/strong>（\u003ccode>modal\u003c/code>），或\u003cstrong>整行展开\u003c/strong>（\u003ccode>expand\u003c/code>）。\n内容在\u003cstrong>服务端逐行生成\u003c/strong>，随列表接口一起返回（\u003ccode>_modal_{prop}\u003c/code> / \u003ccode>_expand_{prop}\u003c/code>），\n前端直接渲染，不用写 Vue。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">use plugin\\curd\\app\\dsl\\component\\Card;\nuse plugin\\curd\\app\\dsl\\component\\Table;\n\n// 整行展开：点行【任意位置】展开/收起，\n// 内容通栏显示在该行下方（不再挤在单元格里）\n$grid-&gt;column(&#39;money&#39;, __(&#39;Money&#39;))-&gt;expand(function ($value, $row) {\n    return new Table([&#39;xxx&#39; =&gt; &#39;标题&#39;], [\n        [&#39;xxx&#39; =&gt; &#39;111&#39;],\n        [&#39;xxx&#39; =&gt; &#39;1222&#39;],\n    ]);\n});\n\n// 弹窗：标题 + 内容\n$grid-&gt;column(&#39;order_no&#39;, __(&#39;Order no&#39;))-&gt;modal(&#39;订单详情&#39;, function ($value, $row) {\n    return new Card([&#39;订单号&#39; =&gt; $value, &#39;金额&#39; =&gt; $row-&gt;amount], &#39;基本信息&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-218\">9.1 内容的四种写法\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>示例\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>组件实例\u003c/td>\n\u003ctd>\u003ccode>new Table(...)\u003c/code> / \u003ccode>new Card(...)\u003c/code> / \u003ccode>new Html(...)\u003c/code>\u003c/td>\n\u003ctd>推荐，最直观\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>闭包\u003c/td>\n\u003ctd>\u003ccode>fn($value, $row) =&gt; new Card([...])\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>$this\u003c/code> 绑定当前行，可 \u003ccode>$this-&gt;id\u003c/code> 取字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>类名\u003c/td>\n\u003ctd>\u003ccode>OrderDetailModal::class\u003c/code>\u003c/td>\n\u003ctd>实例化后依次找 \u003ccode>render($row)\u003c/code> / \u003ccode>schema($row)\u003c/code> / \u003ccode>make($row)\u003c/code> / \u003ccode>content($row)\u003c/code> / \u003ccode>__invoke($row)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTML 模板\u003c/td>\n\u003ctd>\u003ccode>&#39;&lt;b&gt;{order_no}&lt;/b&gt; 金额 {amount}&#39;\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{prop}\u003c/code> 取行字段，\u003ccode>{value}\u003c/code> 取本列值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-219\">9.1.1 用类写弹窗内容（\u003ccode>OrderDetailModal\u003c/code>）\u003c/h3>\n\u003cp>弹窗/展开的类\u003cstrong>没有基类和接口要求\u003c/strong>，就是一个普通类：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\admin\\api\\modals;\n\nuse plugin\\curd\\app\\dsl\\component\\Card;\n\nclass OrderDetailModal\n{\n    // $row = 当前行 Eloquent Model（不是数组），可直接 $row-&gt;字段 / $row-&gt;关联\n    public function render($row)\n    {\n        return new Card([\n            &#39;订单号&#39;   =&gt; $row-&gt;order_no,\n            &#39;金额&#39;     =&gt; &#39;￥&#39; . $row-&gt;amount,\n            &#39;状态&#39;     =&gt; $row-&gt;status_text ?? &#39;-&#39;,\n            &#39;创建时间&#39; =&gt; (string)$row-&gt;created_at,\n        ], &#39;订单详情&#39;, [&#39;column&#39; =&gt; 2]);   // 第三个参数：卡片分列数\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">use app\\controller\\admin\\api\\modals\\OrderDetailModal;\n\n$grid-&gt;column(&#39;id&#39;, &#39;ID&#39;)-&gt;modal(&#39;详情&#39;, OrderDetailModal::class);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>契约\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>实例化\u003c/td>\n\u003ctd>\u003ccode>support\\Container::get($class)\u003c/code> —— 构造函数可注入依赖（Service / 配置等）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>方法查找顺序\u003c/td>\n\u003ctd>\u003ccode>render($row)\u003c/code> → \u003ccode>schema($row)\u003c/code> → \u003ccode>make($row)\u003c/code> → \u003ccode>content($row)\u003c/code> → \u003ccode>__invoke($row)\u003c/code>，命中第一个即用；都没有则不弹（静默）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>返回值\u003c/td>\n\u003ctd>① \u003ccode>Component\u003c/code> 实例（\u003ccode>Table\u003c/code> / \u003ccode>Card\u003c/code> / \u003ccode>Html\u003c/code>）；② \u003ccode>[&#39;type&#39; =&gt; &#39;table&#39;|&#39;card&#39;|&#39;html&#39;, ...]\u003c/code> 数组；③ 字符串（按 HTML 渲染）；④ \u003ccode>null\u003c/code> = 该行不弹\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行时机\u003c/td>\n\u003ctd>列表接口里\u003cstrong>逐行\u003c/strong>执行（\u003ccode>_modal_{prop}\u003c/code> 随行下发），所以别在里面跑重查询\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>位置\u003c/td>\n\u003ctd>任意能被 composer 自动加载的命名空间，惯例 \u003ccode>app/controller/admin/api/modals/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>三种常见形态\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// ① 明细表（配合预加载，见下方注意）\npublic function render($row)\n{\n    return new Table(\n        [&#39;goods_name&#39; =&gt; &#39;商品&#39;, &#39;qty&#39; =&gt; &#39;数量&#39;, &#39;price&#39; =&gt; &#39;单价&#39;],\n        $row-&gt;items-&gt;toArray(),\n        [&#39;stripe&#39; =&gt; true, &#39;maxHeight&#39; =&gt; 320]\n    );\n}\n\n// ② 自定义 HTML（v-html 渲染，只放自己拼的可信内容）\npublic function render($row)\n{\n    return new Html(&#39;&lt;div&gt;订单 &lt;b&gt;&#39; . htmlspecialchars($row-&gt;order_no) . &#39;&lt;/b&gt; 已支付&lt;/div&gt;&#39;);\n}\n\n// ③ 按状态决定弹不弹\npublic function render($row)\n{\n    return $row-&gt;status === 0 ? null : new Card([...], &#39;订单详情&#39;);\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>性能注意\u003c/strong>：\u003ccode>render\u003c/code> 在列表接口逐行调用，弹窗里要用的关联必须先预加载，否则 N 行 = N 次查询：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function grid(): Grid\n{\n    $grid = new Grid(new Order());\n    $grid-&gt;getModel()-&gt;with([&#39;items&#39;]);      // 弹窗里 $row-&gt;items 才不会逐行查库\n    $grid-&gt;column(&#39;id&#39;, &#39;ID&#39;)-&gt;modal(&#39;详情&#39;, OrderDetailModal::class);\n    return $grid;\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>弹窗默认宽 720px；宽内容（明细表）建议改用 \u003ccode>-&gt;expand()\u003c/code> 整行展开（见 §9.3）。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-220\">9.2 内置组件\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// ① 键值对：键 = 行数据字段名\nnew Table([&#39;id&#39; =&gt; &#39;ID&#39;, &#39;name&#39; =&gt; &#39;名称&#39;], $rows, [&#39;stripe&#39; =&gt; true, &#39;maxHeight&#39; =&gt; 320]);\n\n// ② 纯标题列表：标题按顺序对齐行数据的键（键序 = 各行键的首次出现顺序）\nnew Table([&#39;标题&#39;, &#39;标题2&#39;], [\n    [&#39;xxx&#39; =&gt; &#39;111&#39;, &#39;xxx2&#39; =&gt; &#39;113&#39;],\n    [&#39;xxx&#39; =&gt; &#39;1222&#39;, &#39;xxx2&#39; =&gt; &#39;112&#39;],\n]);\n// 行也可以是纯列表（按位置与标题对齐）：new Table([&#39;ID&#39;, &#39;名称&#39;], [[1, &#39;A&#39;], [2, &#39;B&#39;]]);\n\n// ③ 列数组细配（width / align / minWidth / fixed 直接透传 el-table-column）\nnew Table([\n    [&#39;prop&#39; =&gt; &#39;id&#39;,   &#39;label&#39; =&gt; &#39;ID&#39;,   &#39;width&#39; =&gt; 80, &#39;align&#39; =&gt; &#39;center&#39;],\n    [&#39;prop&#39; =&gt; &#39;name&#39;, &#39;label&#39; =&gt; &#39;名称&#39;, &#39;minWidth&#39; =&gt; 160],\n], $rows, [&#39;stripe&#39; =&gt; true, &#39;maxHeight&#39; =&gt; 320]);\n\nnew Card([&#39;订单号&#39; =&gt; &#39;A001&#39;, &#39;状态&#39; =&gt; &#39;已支付&#39;], &#39;订单详情&#39;, [&#39;column&#39; =&gt; 2]);\nnew Html(&#39;&lt;div class=&quot;tip&quot;&gt;任意 &lt;b&gt;HTML&lt;/b&gt;&lt;/div&gt;&#39;);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>Table\u003c/code> 的列也可以细配：\u003ccode>[[&#39;prop&#39; =&gt; &#39;id&#39;, &#39;label&#39; =&gt; &#39;ID&#39;, &#39;width&#39; =&gt; 80, &#39;align&#39; =&gt; &#39;center&#39;]]\u003c/code>，\n\u003ccode>options\u003c/code> 直接透传 el-table（\u003ccode>border\u003c/code> / \u003ccode>stripe\u003c/code> / \u003ccode>maxHeight\u003c/code> / \u003ccode>size\u003c/code> / \u003ccode>emptyText\u003c/code>）；\u003c/li>\n\u003cli>\u003ccode>Card\u003c/code> 的 items 支持 \u003ccode>[&#39;标签&#39; =&gt; &#39;值&#39;]\u003c/code>，或 \u003ccode>[[&#39;label&#39; =&gt; &#39;..&#39;, &#39;value&#39; =&gt; &#39;..&#39;, &#39;html&#39; =&gt; true]]\u003c/code>；\u003c/li>\n\u003cli>\u003ccode>Html\u003c/code> 按 v-html 渲染，只放自己拼的可信内容；\u003c/li>\n\u003cli>\u003cstrong>HTML 自动检测（所有组件通用）\u003c/strong>：\u003ccode>Table\u003c/code> 单元格 / \u003ccode>Card\u003c/code> 条目的值只要含真实 HTML 标签\n（如 \u003ccode>&lt;span class=&quot;el-tag&quot;&gt;池&lt;/span&gt;\u003c/code>）就自动按 HTML 渲染，纯文本照常转义；\n\u003ccode>Card\u003c/code> 条目可用 \u003ccode>html =&gt; true\u003c/code> 强制、\u003ccode>html =&gt; false\u003c/code> 强制文本。\u003c/li>\n\u003cli>\u003cstrong>列宽自适应\u003c/strong>：\u003ccode>Table\u003c/code> 未显式给 \u003ccode>width\u003c/code> / \u003ccode>minWidth\u003c/code> 的列自动按内容估算宽度\n（全角 ≈12px、半角 ≈6.5px，clamp 64–460px，以 \u003ccode>min-width\u003c/code> 应用，表格仍自动撑满）；\n显式给了宽度则不干预；\u003ccode>&#39;fit&#39; =&gt; false\u003c/code> 可整体关闭。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>弹窗默认宽 720px；\u003ccode>expand\u003c/code> 是通栏整行展开，宽度不受列宽限制，宽内容（明细表）优先用 \u003ccode>expand\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-221\">9.3 整行展开的交互细节\u003c/h3>\n\u003cul>\n\u003cli>声明了 \u003ccode>-&gt;expand()\u003c/code> 的 grid 即启用整行展开（内部用 el-table \u003ccode>type=&quot;expand&quot;\u003c/code> 列承载通栏内容，该列缩为 1px 隐藏，\u003cstrong>不显示箭头\u003c/strong>），声明列本身照常显示单元格值；\u003c/li>\n\u003cli>\u003cstrong>点行任意位置\u003c/strong>都会展开/收起（点按钮、链接、输入框、下拉等交互元素除外，不会误触）；\u003c/li>\n\u003cli>内容通栏显示在该行下方，不再挤在单元格里横向滚动；\u003c/li>\n\u003cli>多列都声明 \u003ccode>-&gt;expand()\u003c/code> 时，取\u003cstrong>第一列\u003c/strong>的内容作为该行的展开内容。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-222\">9.4 与 display() / copy() 的优先级\u003c/h3>\n\u003cp>\u003ccode>modal\u003c/code> &gt; \u003ccode>copy\u003c/code> &gt; \u003ccode>display\u003c/code> &gt; 其它类型。\n即同一列既 \u003ccode>-&gt;display()\u003c/code> 又 \u003ccode>-&gt;modal()\u003c/code> 时：单元格显示 display 的值，点击弹窗。\n\u003ccode>expand\u003c/code> 不占用单元格——它把整行变成可展开行，与 \u003ccode>display()\u003c/code> / \u003ccode>copy()\u003c/code> / \u003ccode>modal()\u003c/code> 互不冲突\n（声明 \u003ccode>-&gt;expand()\u003c/code> 的列如果同时 \u003ccode>-&gt;modal()\u003c/code>，单元格点击弹窗、行其它位置展开）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-223\">10. 兜底配置\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;extra&#39;, __(&#39;Extra&#39;))-&gt;config([\n    &#39;type&#39; =&gt; &#39;tag&#39;,\n    &#39;width&#39; =&gt; 120,\n]);\n\u003c/code>\u003c/pre>\n\u003cp>直接合并进列配置对象，用于前端新增能力先行试用。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-224\">11. 完整示例\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">protected function grid(): Grid\n{\n    $grid = new Grid(new HfGoods());\n    $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);\n\n    $grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(70)-&gt;align(&#39;center&#39;);\n    $grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))-&gt;minWidth(160)-&gt;sortable();\n    // 名称加粗 + 可复制\n    $grid-&gt;column(&#39;code&#39;, __(&#39;Code&#39;))\n        -&gt;display(&#39;&lt;code&gt;{value}&lt;/code&gt;&#39;)\n        -&gt;copy();\n    $grid-&gt;column(&#39;price&#39;, __(&#39;Price&#39;))-&gt;prefix(&#39;￥&#39;);\n    $grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))\n        -&gt;map([0 =&gt; &#39;下架&#39;, 1 =&gt; &#39;上架&#39;])\n        -&gt;label([0 =&gt; &#39;info&#39;, 1 =&gt; &#39;success&#39;])\n        -&gt;select([0 =&gt; &#39;下架&#39;, 1 =&gt; &#39;上架&#39;]);\n    $grid-&gt;column(&#39;cover&#39;, __(&#39;Cover&#39;))-&gt;image(48, 48);\n    $grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;datetime()-&gt;width(180);\n    $grid-&gt;column(&#39;updated_at&#39;, __(&#39;Updated at&#39;))-&gt;hidden();\n\n    return $grid;\n}\n\u003c/code>\u003c/pre>\n\u003cp>对应路由与控制器骨架见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\" data-doc-anchor=\"h-207\">API · Grid §12\u003c/a>。\u003c/p>\n"},{"file":"22-API-Form-Field.md","title":"API · Form 与 Field 方法大全","section":"api","sectionName":"API 参考","mtime":"2026/10/18 07:28:07","headings":[{"depth":2,"text":"0. 速查表","id":"h-226"},{"depth":3,"text":"0.1 Form（表单容器 / 布局）","id":"h-227"},{"depth":3,"text":"0.2 字段类型","id":"h-228"},{"depth":3,"text":"0.3 Field 通用方法","id":"h-229"},{"depth":2,"text":"1. 布局","id":"h-230"},{"depth":2,"text":"2. 基础字段","id":"h-231"},{"depth":2,"text":"3. 选项类字段","id":"h-232"},{"depth":2,"text":"4. 时间","id":"h-233"},{"depth":2,"text":"5. 上传","id":"h-234"},{"depth":2,"text":"6. 关联表下拉","id":"h-235"},{"depth":2,"text":"7. JSON 与标签","id":"h-236"},{"depth":2,"text":"8. 点式字段（读写 JSON 子键）","id":"h-237"},{"depth":2,"text":"9. 通用属性","id":"h-238"},{"depth":3,"text":"9.1 帮助文字里的交互（HTML + @click）","id":"h-239"},{"depth":3,"text":"9.2 快捷填入","id":"h-240"},{"depth":3,"text":"9.3 字段联动","id":"h-241"},{"depth":3,"text":"9.4 级联下拉","id":"h-242"},{"depth":2,"text":"10. 场景控制","id":"h-243"},{"depth":2,"text":"11. 完整可运行示例","id":"h-244"}],"allHeadings":[{"depth":1,"text":"API · Form 与 Field 方法大全","id":"h-225"},{"depth":2,"text":"0. 速查表","id":"h-226"},{"depth":3,"text":"0.1 Form（表单容器 / 布局）","id":"h-227"},{"depth":3,"text":"0.2 字段类型","id":"h-228"},{"depth":3,"text":"0.3 Field 通用方法","id":"h-229"},{"depth":2,"text":"1. 布局","id":"h-230"},{"depth":2,"text":"2. 基础字段","id":"h-231"},{"depth":2,"text":"3. 选项类字段","id":"h-232"},{"depth":2,"text":"4. 时间","id":"h-233"},{"depth":2,"text":"5. 上传","id":"h-234"},{"depth":2,"text":"6. 关联表下拉","id":"h-235"},{"depth":2,"text":"7. JSON 与标签","id":"h-236"},{"depth":2,"text":"8. 点式字段（读写 JSON 子键）","id":"h-237"},{"depth":2,"text":"9. 通用属性","id":"h-238"},{"depth":3,"text":"9.1 帮助文字里的交互（HTML + @click）","id":"h-239"},{"depth":3,"text":"9.2 快捷填入","id":"h-240"},{"depth":3,"text":"9.3 字段联动","id":"h-241"},{"depth":3,"text":"9.4 级联下拉","id":"h-242"},{"depth":2,"text":"10. 场景控制","id":"h-243"},{"depth":2,"text":"11. 完整可运行示例","id":"h-244"}],"html":"\u003ch1 id=\"h-225\">API · Form 与 Field 方法大全\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003ccode>$grid-&gt;form(function (Form $form) { ... })\u003c/code> 里声明表单；\u003ccode>$form-&gt;text(...)\u003c/code> 等返回 \u003ccode>Field\u003c/code>，链式设置通用属性。\n代码位置 \u003ccode>plugin/curd/app/dsl/Form.php\u003c/code>、\u003ccode>Field.php\u003c/code>。\n点式字段（\u003ccode>config.api_url\u003c/code>）可用于\u003cstrong>任意字段类型\u003c/strong>：读写 JSON 列里的子键。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-226\">0. 速查表\u003c/h2>\n\u003ch3 id=\"h-227\">0.1 Form（表单容器 / 布局）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>columns(int)\u003c/code>\u003c/td>\n\u003ctd>表单栅格列数（默认 1）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>labelWidth(int)\u003c/code>\u003c/td>\n\u003ctd>标签宽度（px）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>labelPosition(&#39;right&#39;)\u003c/code>\u003c/td>\n\u003ctd>标签位置 \u003ccode>left/right/top\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>contentWidth(string)\u003c/code>\u003c/td>\n\u003ctd>内容区最大宽度，如 \u003ccode>&#39;480px&#39;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>width(string)\u003c/code> / \u003ccode>height(string)\u003c/code>\u003c/td>\n\u003ctd>弹窗宽 / 高\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>confirm(string $msg, string $mode)\u003c/code>\u003c/td>\n\u003ctd>提交二次确认（\u003ccode>create\u003c/code> / \u003ccode>edit\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>when(string $parent, $value, callable)\u003c/code>\u003c/td>\n\u003ctd>条件显示字段组\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>isCreate(...$fields)\u003c/code> / \u003ccode>isEdit(...$fields)\u003c/code>\u003c/td>\n\u003ctd>场景白名单（仅新增/仅编辑显示）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-228\">0.2 字段类型\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>控件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>text($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>单行文本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>textarea($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>多行文本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>number($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>数字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>password($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>密码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>select($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>下拉（配合 \u003ccode>-&gt;options()\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>multipleSelect($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>多选下拉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>radio($prop, $label, ?array $map)\u003c/code>\u003c/td>\n\u003ctd>单选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>switch($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>date($prop, $label)\u003c/code> / \u003ccode>datetime($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>日期 / 日期时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>图片上传（jpg/jpeg/png）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>file($prop, $label)\u003c/code> / \u003ccode>multipleFile($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>单文件 / 多文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>excel($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>Excel 导入（multipart + 自动解析）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>remote($prop, $label, $table, $valueKey, $labelKey)\u003c/code>\u003c/td>\n\u003ctd>关联表下拉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>json($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>JSON 键值对编辑器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tags($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>标签输入（逗号分隔字符串）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hidden($prop, $label = &#39;&#39;)\u003c/code>\u003c/td>\n\u003ctd>隐藏字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>add(string $type, $prop, $label, array $options)\u003c/code>\u003c/td>\n\u003ctd>自定义类型（前端已注册的 type）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-229\">0.3 Field 通用方法\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>required(bool)\u003c/code>\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>default($value, ?string $mode)\u003c/code>\u003c/td>\n\u003ctd>默认值（\u003ccode>add\u003c/code>/\u003ccode>edit\u003c/code> 可分开）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addDefault($v)\u003c/code> / \u003ccode>editDefault($v)\u003c/code>\u003c/td>\n\u003ctd>仅新增 / 仅编辑默认值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>disabled(bool, ?string $mode)\u003c/code>\u003c/td>\n\u003ctd>禁用（可分开新增/编辑）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addDisabled()\u003c/code> / \u003ccode>editDisabled()\u003c/code>\u003c/td>\n\u003ctd>同上快捷写法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hidden(bool, ?string $mode)\u003c/code>\u003c/td>\n\u003ctd>隐藏（可分开）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addHidden()\u003c/code> / \u003ccode>editHidden()\u003c/code>\u003c/td>\n\u003ctd>同上快捷写法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addOnly(bool)\u003c/code> / \u003ccode>editOnly(bool)\u003c/code>\u003c/td>\n\u003ctd>仅新增 / 仅编辑出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>placeholder(string)\u003c/code>\u003c/td>\n\u003ctd>占位提示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>help(string $html)\u003c/code>\u003c/td>\n\u003ctd>字段下方帮助文字（\u003cstrong>支持 HTML 与 \u003ccode>@click\u003c/code>\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>quickOptions(array)\u003c/code>\u003c/td>\n\u003ctd>快捷填入按钮（\u003ccode>[值]\u003c/code> 或 \u003ccode>[&#39;文案&#39;=&gt;&#39;值&#39;]\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>rows(int)\u003c/code>\u003c/td>\n\u003ctd>textarea 行数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>min($min)\u003c/code> / \u003ccode>max($max)\u003c/code> / \u003ccode>step($step)\u003c/code>\u003c/td>\n\u003ctd>数字范围 / 步长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>multiple(bool)\u003c/code> / \u003ccode>filterable(bool)\u003c/code>\u003c/td>\n\u003ctd>多选 / 可搜索\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>options(array $map, array $config = [])\u003c/code>\u003c/td>\n\u003ctd>选项（关联数组或二维列表）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>rules(string)\u003c/code>\u003c/td>\n\u003ctd>前端校验规则串\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>span(int)\u003c/code> / \u003ccode>full()\u003c/code> / \u003ccode>row(bool)\u003c/code>\u003c/td>\n\u003ctd>栅格占宽 / 独占一行 / 独立成行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>link(string $target, string $expr)\u003c/code>\u003c/td>\n\u003ctd>输入时联动写入另一字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cascadeFrom(string ...$props)\u003c/code>\u003c/td>\n\u003ctd>级联依赖字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cascadeUrl(string)\u003c/code> / \u003ccode>cascadeHandler(string)\u003c/code>\u003c/td>\n\u003ctd>级联选项来源（接口 / 控制器方法）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>when($value, callable)\u003c/code>\u003c/td>\n\u003ctd>条件显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config(array)\u003c/code>\u003c/td>\n\u003ctd>兜底原始配置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-230\">1. 布局\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;columns(2)                 // 两列栅格\n        -&gt;labelWidth(120)\n        -&gt;labelPosition(&#39;right&#39;)\n        -&gt;contentWidth(&#39;480px&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003cp>字段占宽：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;span(12);   // 半行（columns=2 时）\n$form-&gt;textarea(&#39;remark&#39;, __(&#39;Remark&#39;))-&gt;full(); // 独占整行\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-231\">2. 基础字段\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;required()-&gt;placeholder(&#39;请输入名称&#39;);\n$form-&gt;textarea(&#39;remark&#39;, __(&#39;Remark&#39;))-&gt;rows(4);\n$form-&gt;number(&#39;price&#39;, __(&#39;Price&#39;))-&gt;min(0)-&gt;max(99999)-&gt;step(&#39;0.01&#39;);\n$form-&gt;password(&#39;password&#39;, __(&#39;Password&#39;))-&gt;required()-&gt;addOnly();\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-232\">3. 选项类字段\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// 关联数组：值 =&gt; 文案\n$form-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])-&gt;default(1);\n\n// 二维列表：value / label\n$form-&gt;select(&#39;platform&#39;, __(&#39;Platform&#39;))-&gt;options([\n    [&#39;value&#39; =&gt; 1, &#39;label&#39; =&gt; &#39;微信&#39;],\n    [&#39;value&#39; =&gt; 2, &#39;label&#39; =&gt; &#39;支付宝&#39;],\n]);\n\n$form-&gt;multipleSelect(&#39;tags&#39;, __(&#39;Tags&#39;))-&gt;options([1 =&gt; &#39;新品&#39;, 2 =&gt; &#39;热销&#39;])-&gt;multiple();\n$form-&gt;radio(&#39;status&#39;, __(&#39;Status&#39;), [0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])-&gt;default(1);\n$form-&gt;switch(&#39;enabled&#39;, __(&#39;Enabled&#39;))-&gt;default(1);\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>select/multipleSelect\u003c/code> 需要显式 \u003ccode>-&gt;options()\u003c/code>；\u003ccode>radio\u003c/code> 可直接把 map 作为第三个参数。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-233\">4. 时间\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;date(&#39;publish_date&#39;, __(&#39;Publish date&#39;));\n$form-&gt;datetime(&#39;sync_at&#39;, __(&#39;Sync at&#39;))-&gt;required();\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-234\">5. 上传\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;image(&#39;cover&#39;, __(&#39;Cover&#39;));                 // jpg/jpeg/png\n$form-&gt;file(&#39;attachment&#39;, __(&#39;Attachment&#39;));        // 通用文件\n$form-&gt;multipleFile(&#39;images&#39;, __(&#39;Images&#39;));        // 多文件（JSON 数组）\n$form-&gt;excel(&#39;import_file&#39;, __(&#39;Excel&#39;))\n    -&gt;help(&#39;上传 xlsx，系统自动解析并导入&#39;);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-235\">6. 关联表下拉\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;remote(&#39;user_id&#39;, __(&#39;User&#39;), &#39;admin_users&#39;, &#39;id&#39;, &#39;username&#39;)\n    -&gt;filterable();\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-236\">7. JSON 与标签\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// JSON 键值对编辑器（提交时序列化为 JSON 字符串）\n$form-&gt;json(&#39;extra&#39;, __(&#39;Extra&#39;))-&gt;help(&#39;键值对形式保存到 extra 列&#39;);\n\n// 标签输入：DB 存 &quot;a,b,c&quot; 字符串，前端用数组编辑\n$form-&gt;tags(&#39;tags&#39;, __(&#39;Tags&#39;));\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-237\">8. 点式字段（读写 JSON 子键）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">// 读写 config 列（JSON）里的 api_url / timeout\n$form-&gt;text(&#39;config.api_url&#39;, __(&#39;Api url&#39;))-&gt;required();\n$form-&gt;number(&#39;config.timeout&#39;, __(&#39;Timeout seconds&#39;))-&gt;min(1)-&gt;max(600);\n$form-&gt;select(&#39;config.platform&#39;, __(&#39;Platform&#39;))-&gt;options([1 =&gt; &#39;微信&#39;, 2 =&gt; &#39;支付宝&#39;]);\n$form-&gt;switch(&#39;config.enabled&#39;, __(&#39;Enabled&#39;));\n\u003c/code>\u003c/pre>\n\u003cp>保存时后端把散落的点式键合并回根列（JSON），表单里没出现的键原样保留。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-238\">9. 通用属性\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))\n    -&gt;required()\n    -&gt;default(&#39;未命名&#39;)\n    -&gt;placeholder(&#39;请输入名称&#39;)\n    -&gt;rules(&#39;min:2|max:50&#39;)\n    -&gt;help(&#39;2~50 个字符&#39;);\n\n$form-&gt;text(&#39;code&#39;, __(&#39;Code&#39;))\n    -&gt;editDisabled()     // 编辑时不可改\n    -&gt;addDefault(&#39;AUTO&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-239\">9.1 帮助文字里的交互（HTML + \u003ccode>@click\u003c/code>）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;config.api_token&#39;, __(&#39;Api token&#39;))\n    -&gt;help(&#39;留空沿用旧值 · &lt;span @click=&quot;fillToken()&quot; style=&quot;cursor:pointer;color:var(--el-color-primary)&quot;&gt;填入示例&lt;/span&gt;&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>配合 \u003ccode>$grid-&gt;setCustomJs()\u003c/code> 定义全局函数：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setCustomJs(&lt;&lt;&lt;&#39;JS&#39;\nfunction fillToken() {\n  curd.setFormData({ &#39;config.api_token&#39;: &#39;demo-&#39; + Date.now() })\n  curd.message.success(&#39;已填入&#39;)\n}\nJS);\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>help\u003c/code> 内容用 \u003ccode>v-html\u003c/code> 渲染，\u003ccode>@click\u003c/code> 由事件委托执行；函数必须是全局的（customJs 顶层 \u003ccode>function\u003c/code>）。\n另支持 \u003ccode>&lt;span class=&quot;content-click&quot;&gt;文本&lt;/span&gt;\u003c/code>：点击把文本回填到该字段。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-240\">9.2 快捷填入\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;remark&#39;, __(&#39;Remark&#39;))\n    -&gt;quickOptions([&#39;已联系客户&#39;, &#39;客户要求回电&#39; =&gt; &#39;客户要求回电，待跟进&#39;]);\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-241\">9.3 字段联动\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// 输入数量时自动算金额：expr 是 JS 表达式，可用 val / form / round / fn\n$form-&gt;number(&#39;qty&#39;, __(&#39;Qty&#39;))\n    -&gt;link(&#39;amount&#39;, &#39;round(val * form.price, 2)&#39;);\n\n$form-&gt;number(&#39;price&#39;, __(&#39;Price&#39;));\n$form-&gt;number(&#39;amount&#39;, __(&#39;Amount&#39;))-&gt;disabled();\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-242\">9.4 级联下拉\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;select(&#39;province_id&#39;, __(&#39;Province&#39;))-&gt;options($provinces);\n$form-&gt;select(&#39;city_id&#39;, __(&#39;City&#39;))\n    -&gt;cascadeFrom(&#39;province_id&#39;)\n    -&gt;cascadeHandler(&#39;cities&#39;);   // 控制器 public function cascadeCities(Request $request)\n\u003c/code>\u003c/pre>\n\u003cp>控制器侧：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function cascadeCities(\\support\\Request $request)\n{\n    $pid = (int)$request-&gt;get(&#39;province_id&#39;);\n    return json([&#39;code&#39; =&gt; 0, &#39;data&#39; =&gt; City::where(&#39;province_id&#39;, $pid)-&gt;get([&#39;id&#39;, &#39;name&#39;])]);\n}\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-243\">10. 场景控制\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    // 方式一：字段级\n    $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;isCreate();\n    $form-&gt;text(&#39;code&#39;, __(&#39;Code&#39;))-&gt;isEdit();\n\n    // 方式二：条件显示（依赖另一个字段的值）\n    $form-&gt;select(&#39;type&#39;, __(&#39;Type&#39;))-&gt;options([1 =&gt; &#39;普通&#39;, 2 =&gt; &#39;高级&#39;]);\n    $form-&gt;when(&#39;type&#39;, 2, function (Form $form) {\n        $form-&gt;number(&#39;quota&#39;, __(&#39;Quota&#39;));\n    });\n});\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-244\">11. 完整可运行示例\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;columns(2)-&gt;labelWidth(130)-&gt;contentWidth(&#39;520px&#39;);\n\n    $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;required()-&gt;span(12)-&gt;rules(&#39;max:50&#39;);\n    $form-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])-&gt;default(1)-&gt;span(12);\n\n    $form-&gt;number(&#39;price&#39;, __(&#39;Price&#39;))-&gt;min(0)-&gt;step(&#39;0.01&#39;)-&gt;span(12);\n    $form-&gt;number(&#39;stock&#39;, __(&#39;Stock&#39;))-&gt;min(0)-&gt;span(12);\n\n    $form-&gt;image(&#39;cover&#39;, __(&#39;Cover&#39;))-&gt;span(12);\n    $form-&gt;tags(&#39;tags&#39;, __(&#39;Tags&#39;))-&gt;span(12);\n\n    $form-&gt;text(&#39;config.api_url&#39;, __(&#39;Api url&#39;))-&gt;required()-&gt;full()\n        -&gt;help(&#39;接口地址，需以 http(s):// 开头&#39;);\n    $form-&gt;text(&#39;config.api_token&#39;, __(&#39;Api token&#39;))-&gt;full()\n        -&gt;help(&#39;留空沿用旧值 · &lt;span @click=&quot;fillToken()&quot; style=&quot;cursor:pointer;color:var(--el-color-primary)&quot;&gt;填入示例&lt;/span&gt;&#39;);\n    $form-&gt;switch(&#39;config.enabled&#39;, __(&#39;Enabled&#39;))-&gt;default(1)-&gt;span(12);\n    $form-&gt;datetime(&#39;config.sync_at&#39;, __(&#39;Sync at&#39;))-&gt;span(12);\n\n    $form-&gt;json(&#39;extra&#39;, __(&#39;Extra&#39;))-&gt;full();\n    $form-&gt;textarea(&#39;remark&#39;, __(&#39;Remark&#39;))-&gt;rows(3)-&gt;full();\n});\n\u003c/code>\u003c/pre>\n\u003cp>配套 \u003ccode>customJs\u003c/code> 与路由见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\" data-doc-anchor=\"h-207\">API · Grid §12\u003c/a>。\u003c/p>\n"},{"file":"23-API-Filter-Action.md","title":"API · Filter 搜索 与 Action 操作","section":"api","sectionName":"API 参考","mtime":"2026/10/18 08:07:22","headings":[{"depth":2,"text":"1. Filter 搜索","id":"h-246"},{"depth":3,"text":"1.1 速查表","id":"h-247"},{"depth":3,"text":"1.2 基础用法","id":"h-248"},{"depth":3,"text":"1.3 数值区间 / 单日","id":"h-249"},{"depth":3,"text":"1.4 默认值","id":"h-250"},{"depth":3,"text":"1.5 自定义条件","id":"h-251"},{"depth":3,"text":"1.6 关联表下拉","id":"h-252"},{"depth":2,"text":"2. Action 操作按钮","id":"h-253"},{"depth":3,"text":"2.1 速查表","id":"h-254"},{"depth":3,"text":"2.2 行级操作（默认）","id":"h-255"},{"depth":3,"text":"2.3 带表单弹窗","id":"h-256"},{"depth":3,"text":"2.4 自定义处理 handler + params","id":"h-257"},{"depth":3,"text":"2.5 批量操作","id":"h-258"},{"depth":3,"text":"2.6 全局按钮","id":"h-259"},{"depth":3,"text":"2.7 跳转 / 调接口","id":"h-260"},{"depth":3,"text":"2.8 权限与角色","id":"h-261"},{"depth":3,"text":"2.9 Excel 导入操作","id":"h-262"},{"depth":2,"text":"3. 完整可运行示例","id":"h-263"}],"allHeadings":[{"depth":1,"text":"API · Filter 搜索 与 Action 操作","id":"h-245"},{"depth":2,"text":"1. Filter 搜索","id":"h-246"},{"depth":3,"text":"1.1 速查表","id":"h-247"},{"depth":3,"text":"1.2 基础用法","id":"h-248"},{"depth":3,"text":"1.3 数值区间 / 单日","id":"h-249"},{"depth":3,"text":"1.4 默认值","id":"h-250"},{"depth":3,"text":"1.5 自定义条件","id":"h-251"},{"depth":3,"text":"1.6 关联表下拉","id":"h-252"},{"depth":2,"text":"2. Action 操作按钮","id":"h-253"},{"depth":3,"text":"2.1 速查表","id":"h-254"},{"depth":3,"text":"2.2 行级操作（默认）","id":"h-255"},{"depth":3,"text":"2.3 带表单弹窗","id":"h-256"},{"depth":3,"text":"2.4 自定义处理 handler + params","id":"h-257"},{"depth":3,"text":"2.5 批量操作","id":"h-258"},{"depth":3,"text":"2.6 全局按钮","id":"h-259"},{"depth":3,"text":"2.7 跳转 / 调接口","id":"h-260"},{"depth":3,"text":"2.8 权限与角色","id":"h-261"},{"depth":3,"text":"2.9 Excel 导入操作","id":"h-262"},{"depth":2,"text":"3. 完整可运行示例","id":"h-263"}],"html":"\u003ch1 id=\"h-245\">API · Filter 搜索 与 Action 操作\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003ccode>Filter\u003c/code> 用于 \u003ccode>$grid-&gt;filter(fn(Filter $f) =&gt; ...)\u003c/code>；\u003ccode>Action\u003c/code> 用于 \u003ccode>$grid-&gt;action(name, label)\u003c/code>。\n代码位置 \u003ccode>plugin/curd/app/dsl/Filter.php\u003c/code>、\u003ccode>Action.php\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-246\">1. Filter 搜索\u003c/h2>\n\u003ch3 id=\"h-247\">1.1 速查表\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>like($prop, $label, array $options = [])\u003c/code>\u003c/td>\n\u003ctd>模糊匹配（\u003ccode>LIKE %kw%\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>equal($prop, $label, array $options = [])\u003c/code>\u003c/td>\n\u003ctd>精确匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>where(callable $cb, $label, $prop = &#39;&#39;)\u003c/code>\u003c/td>\n\u003ctd>自定义查询条件（闭包内 \u003ccode>$this-&gt;input\u003c/code> 取输入）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>select($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>下拉筛选（配合 \u003ccode>-&gt;options()\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>options(array $map, array $config = [])\u003c/code>\u003c/td>\n\u003ctd>设置选项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>between($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>数值区间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dateRange($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>日期区间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>singleDate($prop, $label)\u003c/code>\u003c/td>\n\u003ctd>单个日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>remote($prop, $label, $table, $valueKey, $labelKey)\u003c/code>\u003c/td>\n\u003ctd>关联表下拉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>default($value)\u003c/code>\u003c/td>\n\u003ctd>默认值（构建时求值，传具体值或相对表达式）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>add(array $item)\u003c/code>\u003c/td>\n\u003ctd>兜底：直接塞一个搜索项配置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-248\">1.2 基础用法\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;like(&#39;name&#39;, __(&#39;Name&#39;));\n    $filter-&gt;equal(&#39;code&#39;, __(&#39;Code&#39;));\n    $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;]);\n    $filter-&gt;dateRange(&#39;created_at&#39;, __(&#39;Created at&#39;));\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-249\">1.3 数值区间 / 单日\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;between(&#39;price&#39;, __(&#39;Price&#39;));\n    $filter-&gt;singleDate(&#39;publish_date&#39;, __(&#39;Publish date&#39;));\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-250\">1.4 默认值\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    // 固定值\n    $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;禁用&#39;, 1 =&gt; &#39;启用&#39;])-&gt;default(1);\n\n    // 相对日期：最近 7 天（构建时求值成具体日期区间）\n    $filter-&gt;dateRange(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;default(&#39;-7d&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>default\u003c/code> 必须写在 \u003ccode>dateRange/between\u003c/code> 之后，且最终类型保持 \u003ccode>daterange\u003c/code>，否则默认值不生效。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-251\">1.5 自定义条件\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    // 闭包内 $this-&gt;input 是用户输入；返回查询条件\n    $filter-&gt;where(function ($query) {\n        $kw = trim((string)$this-&gt;input);\n        if ($kw !== &#39;&#39;) {\n            $query-&gt;where(function ($q) use ($kw) {\n                $q-&gt;where(&#39;name&#39;, &#39;like&#39;, &quot;%{$kw}%&quot;)\n                  -&gt;orWhere(&#39;code&#39;, &#39;like&#39;, &quot;%{$kw}%&quot;);\n            });\n        }\n    }, __(&#39;关键字（名称/编码）&#39;), &#39;keyword&#39;);\n\n    // 把上一个自定义条件变成下拉\n    $filter-&gt;where(function ($query) {\n        if ($this-&gt;input === &#39;1&#39;) $query-&gt;whereNull(&#39;deleted_at&#39;);\n    }, __(&#39;删除状态&#39;), &#39;deleted&#39;)-&gt;select([1 =&gt; &#39;仅未删除&#39;]);\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-252\">1.6 关联表下拉\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;remote(&#39;user_id&#39;, __(&#39;User&#39;), &#39;admin_users&#39;, &#39;id&#39;, &#39;username&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-253\">2. Action 操作按钮\u003c/h2>\n\u003ch3 id=\"h-254\">2.1 速查表\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>name($name)\u003c/code> / \u003ccode>label($label)\u003c/code>\u003c/td>\n\u003ctd>标识 / 文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>icon($icon)\u003c/code>\u003c/td>\n\u003ctd>按钮图标（Element Plus 图标名）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>type($type)\u003c/code>\u003c/td>\n\u003ctd>按钮类型 \u003ccode>primary/success/warning/danger/info\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>confirm($msg, $type = &#39;warning&#39;)\u003c/code>\u003c/td>\n\u003ctd>点击前二次确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>form(callable $cb)\u003c/code>\u003c/td>\n\u003ctd>弹窗表单（回调参数 \u003ccode>Form\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>modal(string $html)\u003c/code>\u003c/td>\n\u003ctd>自定义 HTML 弹窗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>jump($url, $target = &#39;_self&#39;)\u003c/code>\u003c/td>\n\u003ctd>跳转链接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>api($url, $method = &#39;POST&#39;)\u003c/code>\u003c/td>\n\u003ctd>调用自定义接口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>handler($name)\u003c/code>\u003c/td>\n\u003ctd>指定后端处理方法名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>params(array|Closure)\u003c/code>\u003c/td>\n\u003ctd>附加请求参数（闭包可按行取值）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>field($field)\u003c/code>\u003c/td>\n\u003ctd>行主键字段名（默认 \u003ccode>id\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show(callable $cb)\u003c/code>\u003c/td>\n\u003ctd>按行控制是否显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>successMsg($msg)\u003c/code>\u003c/td>\n\u003ctd>成功提示文案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dialogTitle($title)\u003c/code> / \u003ccode>dialogWidth($width)\u003c/code>\u003c/td>\n\u003ctd>弹窗标题 / 宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>inline(bool)\u003c/code>\u003c/td>\n\u003ctd>行内按钮（默认）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>batch(bool)\u003c/code>\u003c/td>\n\u003ctd>批量工具栏按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>global(bool)\u003c/code>\u003c/td>\n\u003ctd>表格右上角全局按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>roles(array)\u003c/code>\u003c/td>\n\u003ctd>限定角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>permission($object, $action = &#39;execute&#39;)\u003c/code>\u003c/td>\n\u003ctd>权限点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>excelRows($prop)\u003c/code>\u003c/td>\n\u003ctd>读取 \u003ccode>$form-&gt;excel()\u003c/code> 解析后的数据行\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-255\">2.2 行级操作（默认）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;sync&#39;, __(&#39;Sync&#39;))\n    -&gt;icon(&#39;Refresh&#39;)\n    -&gt;type(&#39;primary&#39;)\n    -&gt;confirm(&#39;确定同步该条数据吗？&#39;)\n    -&gt;successMsg(&#39;同步成功&#39;)\n    -&gt;show(fn($row) =&gt; $row-&gt;status == 1)\n    -&gt;handler(&#39;sync&#39;);   // → POST /api/curd/model/{Model}/action/sync\n\u003c/code>\u003c/pre>\n\u003cp>后端两种接法（任选其一）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 接法 A（推荐）：Action 子类里写业务，控制器无需任何方法\nclass SyncAction extends \\plugin\\curd\\app\\dsl\\Action\n{\n    public function handle(\\support\\Request $request)\n    {\n        $row = $this-&gt;model();          // 当前行模型实例（按 id 自动注入）\n        // ... 业务\n        return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;ok&#39;]);\n    }\n}\n\n// 注册\n$grid-&gt;addAction(\n    (new SyncAction(&#39;sync&#39;, __(&#39;Sync&#39;)))-&gt;confirm(&#39;确定同步？&#39;)\n);\n\n// 接法 B：控制器方法，命名 action + 帕斯卡(name 或 handler)\npublic function actionSync(\\support\\Request $request)\n{\n    $id = (int)$request-&gt;post(&#39;id&#39;);\n    return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;ok&#39;]);\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>分发规则\u003c/strong>：只有 Action \u003cstrong>子类自己实现了 \u003ccode>handle()\u003c/code>\u003c/strong> 才走子类；链式 \u003ccode>$grid-&gt;action(...)\u003c/code> 创建的实例\n一律回退到控制器 \u003ccode>action{Name}()\u003c/code>（方法名取 \u003ccode>handler()\u003c/code> 优先，否则取按钮名转帕斯卡）。\n子类没实现 \u003ccode>handle()\u003c/code> 时不要 \u003ccode>addAction\u003c/code>，否则会抛「Action xxx 未实现 handle」。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-256\">2.3 带表单弹窗\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;audit&#39;, __(&#39;Audit&#39;))\n    -&gt;icon(&#39;Edit&#39;)\n    -&gt;form(function (Form $form) {\n        $form-&gt;radio(&#39;pass&#39;, __(&#39;Result&#39;), [1 =&gt; &#39;通过&#39;, 0 =&gt; &#39;驳回&#39;])-&gt;required();\n        $form-&gt;textarea(&#39;reason&#39;, __(&#39;Reason&#39;))-&gt;rows(3);\n    })\n    -&gt;handler(&#39;audit&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>提交时会带上 \u003ccode>id\u003c/code> + 表单字段。后端：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function actionAudit(\\support\\Request $request)\n{\n    $id     = (int)$request-&gt;post(&#39;id&#39;);\n    $pass   = (int)$request-&gt;post(&#39;pass&#39;);\n    $reason = (string)$request-&gt;post(&#39;reason&#39;);\n    return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;ok&#39;]);\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-257\">2.4 自定义处理 \u003ccode>handler\u003c/code> + \u003ccode>params\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;notify&#39;, __(&#39;Notify&#39;))\n    -&gt;params(fn($row) =&gt; [&#39;order_id&#39; =&gt; $row-&gt;id, &#39;channel&#39; =&gt; &#39;sms&#39;])\n    -&gt;handler(&#39;notify&#39;);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>params\u003c/code> 传数组：固定参数；\u003c/li>\n\u003cli>传闭包：按当前行生成参数；\u003c/li>\n\u003cli>URL 使用 \u003ccode>handler\u003c/code>（未设置则用 action 名）：\u003ccode>POST /api/curd/model/{Model}/action/{handler}\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-258\">2.5 批量操作\u003c/h3>\n\u003cp>\u003ccode>$grid-&gt;action($name, $label)-&gt;batch(true)\u003c/code>，等价简写 \u003cstrong>\u003ccode>$grid-&gt;batAction($name, $label)\u003c/code>\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;batchSync&#39;, __(&#39;批量同步&#39;))\n    -&gt;batch(true)\n    -&gt;confirm(&#39;确定同步选中的记录吗？&#39;)\n    -&gt;handler(&#39;batch-sync&#39;);\n\n// 简写\n$grid-&gt;batAction(&#39;batch-on&#39;, __(&#39;批量上架&#39;))-&gt;icon(&#39;Top&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>后端从 \u003ccode>ids\u003c/code> 取选中行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function actionBatchSync(\\support\\Request $request)\n{\n    $ids = (array)$request-&gt;post(&#39;ids&#39;, []);\n    return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;已处理 &#39; . count($ids) . &#39; 条&#39;]);\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-259\">2.6 全局按钮\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;exportAll&#39;, __(&#39;导出全部&#39;))\n    -&gt;global(true)\n    -&gt;type(&#39;success&#39;)\n    -&gt;jump(&#39;/api/curd/model/HfGoods/export&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-260\">2.7 跳转 / 调接口\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// 新窗口打开\n$grid-&gt;action(&#39;detail&#39;, __(&#39;详情&#39;))-&gt;jump(&#39;/app/curd/#/order-detail?id={id}&#39;, &#39;_blank&#39;);\n\n// 直接调接口（不写后端方法）\n$grid-&gt;action(&#39;refreshCache&#39;, __(&#39;刷新缓存&#39;))\n    -&gt;api(&#39;/api/curd/model/HfGoods/action/refresh-cache&#39;, &#39;POST&#39;);\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>jump\u003c/code> 的 URL 支持 \u003ccode>{id}\u003c/code> 等行字段占位（按当前行替换）。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-261\">2.8 权限与角色\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;delete&#39;, __(&#39;删除&#39;))\n    -&gt;type(&#39;danger&#39;)\n    -&gt;permission(&#39;curd.HfGoods.delete&#39;, &#39;execute&#39;)  // 权限点\n    -&gt;roles([&#39;admin&#39;])                              // 限定角色\n    -&gt;handler(&#39;delete&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-262\">2.9 Excel 导入操作\u003c/h3>\n\u003cp>\u003cstrong>一行版\u003c/strong>（推荐）：\u003ccode>$grid-&gt;importAction()\u003c/code> = \u003ccode>action(&#39;import&#39;, &#39;导入&#39;)\u003c/code> + \u003ccode>icon(&#39;Upload&#39;)\u003c/code> +\n\u003ccode>type(&#39;warning&#39;)\u003c/code> + \u003ccode>global(true)\u003c/code> + \u003ccode>form(fn($f) =&gt; $f-&gt;excel(&#39;file&#39;, &#39;Excel 文件&#39;))\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;importAction();                       // 默认 name=import / label=导入\n$grid-&gt;importAction(&#39;import&#39;, __(&#39;导入订单&#39;)); // 自定义\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>展开写法\u003c/strong>（需要多个字段或自定义样式时）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;action(&#39;import&#39;, __(&#39;批量导入&#39;))\n    -&gt;global(true)\n    -&gt;form(function (Form $form) {\n        $form-&gt;excel(&#39;file&#39;, __(&#39;Excel&#39;))-&gt;required();\n    })\n    -&gt;handler(&#39;import&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>后端读取解析结果：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">public function actionImport(\\support\\Request $request)\n{\n    $rows = $this-&gt;excelRows(&#39;file&#39;);   // 已解析的二维数组（首行表头）\n    foreach ($rows as $row) {\n        // $row[&#39;列名&#39;] =&gt; 值\n    }\n    return json([&#39;code&#39; =&gt; 0, &#39;msg&#39; =&gt; &#39;导入 &#39; . count($rows) . &#39; 条&#39;]);\n}\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-263\">3. 完整可运行示例\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">protected function grid(): Grid\n{\n    $grid = new Grid(new HfGoods());\n\n    $grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(70);\n    $grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;));\n    $grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))-&gt;map([0 =&gt; &#39;下架&#39;, 1 =&gt; &#39;上架&#39;]);\n\n    // 搜索\n    $grid-&gt;filter(function (Filter $filter) {\n        $filter-&gt;like(&#39;name&#39;, __(&#39;Name&#39;));\n        $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options([0 =&gt; &#39;下架&#39;, 1 =&gt; &#39;上架&#39;]);\n        $filter-&gt;dateRange(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;default(&#39;-7d&#39;);\n    });\n\n    // 行级：带表单\n
