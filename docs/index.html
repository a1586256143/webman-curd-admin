/p>\n\u003ch3 id=\"h-102\">1.3 ⚠️ 公钥是每个宿主一份的\u003c/h3>\n\u003cp>\u003ccode>install.php\u003c/code> 会在 \u003ccode>config/keys/api_rsa_public.pem\u003c/code> 生成该宿主专属的公钥。\n用\u003cstrong>别的宿主的公钥\u003c/strong>（或 \u003ccode>src/utils/apiCrypto.js\u003c/code> 里内嵌的开发默认值）→\n后端私钥解不开信封 → \u003cstrong>所有 \u003ccode>/api\u003c/code> 返回 400「请求解密失败」\u003c/strong>。\u003c/p>\n\u003cp>排查口径：入口 JS 里搜 \u003ccode>X-Encrypt-Data\u003c/code> 字符串，出现在产物里即为加密版。\n换宿主要重新构建，别把 A 宿主的产物拷到 B 宿主。\u003c/p>\n\u003ch3 id=\"h-103\">1.4 前后端必须一致\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>端\u003c/th>\n\u003cth>开关\u003c/th>\n\u003cth>默认\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>前端\u003c/td>\n\u003ctd>\u003ccode>VITE_API_ENCRYPT\u003c/code>（构建期内联）\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>（明文）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端\u003c/td>\n\u003ctd>\u003ccode>API_ENCRYPT\u003c/code>（\u003ccode>.env\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>（能解密）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>后端默认 \u003ccode>true\u003c/code>，是「能解就解、明文透传」，所以\u003cstrong>前端不开也能跑\u003c/strong>；\n反过来前端开了而后端 \u003ccode>API_ENCRYPT=false\u003c/code>，才会 400。\u003c/p>\n\u003ch3 id=\"h-104\">1.5 豁免清单（无需配置，始终明文）\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>OPTIONS\u003c/code> 预检请求；\u003c/li>\n\u003cli>非 \u003ccode>/api\u003c/code> 路径（页面、静态资源）；\u003c/li>\n\u003cli>\u003ccode>multipart\u003c/code> 上传（\u003ccode>FormData\u003c/code>）；\u003c/li>\n\u003cli>非 JSON 响应（CSV 导出等文件流）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-105\">2. 接口异常兜底\u003c/h2>\n\u003cp>SQL 报错、类型错误等\u003cstrong>未捕获异常\u003c/strong>的统一出口，由插件自带的\n\u003ccode>plugin\\curd\\app\\exception\\CurdExceptionHandler\u003c/code> 负责。\u003c/p>\n\u003ch3 id=\"h-106\">2.1 为什么是异常处理器，不是中间件\u003c/h3>\n\u003cp>webman 的中间件链在\u003cstrong>每一层内层都先 \u003ccode>try/catch\u003c/code> 再转 Response\u003c/strong>，外层中间件\n\u003cstrong>永远捕获不到\u003c/strong>控制器 / 路由中间件抛出的异常。所以兜底只能做成异常处理器（实测踩过）。\u003c/p>\n\u003ch3 id=\"h-107\">2.2 生效范围\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围\u003c/th>\n\u003cth>怎么生效\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>插件路由\u003c/strong>（\u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code> …）\u003c/td>\n\u003ctd>\u003cstrong>开箱生效\u003c/strong>：插件自带 \u003ccode>plugin/curd/config/exception.php\u003c/code>，框架按 \u003ccode>plugin.curd.exception\u003c/code> 读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>宿主自己的 \u003ccode>/api\u003c/code> 控制器\u003c/strong>\u003c/td>\n\u003ctd>把宿主 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向插件处理器（见下）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode class=\"language-php\">// config/exception.php\nreturn [\n    &#39;&#39; =&gt; \\plugin\\curd\\app\\exception\\CurdExceptionHandler::class,\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ 只加 \u003ccode>&#39;@&#39;\u003c/code> 键\u003cstrong>无效\u003c/strong> —— 框架规则是「本 app 配置里已有 \u003ccode>&#39;&#39;\u003c/code> 键 ⇒ 忽略 \u003ccode>&#39;@&#39;\u003c/code>」，\n而 webman 骨架默认自带 \u003ccode>&#39;&#39; =&gt; support\\exception\\Handler::class\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>只兜 \u003ccode>/api\u003c/code>；非 \u003ccode>/api\u003c/code> 请求任何模式下都沿用框架默认错误页 / 调试页。\u003c/p>\n\u003ch3 id=\"h-108\">2.3 两档模式\u003c/h3>\n\u003cp>由 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code> 决定（\u003ccode>plugin.curd.app.debug\u003c/code> 读它）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>true\u003c/code>（默认，\u003cstrong>本地\u003c/strong>）\u003c/td>\n\u003ctd>异常信息\u003cstrong>原样暴露\u003c/strong>：JSON 请求返回真实 msg + traces，其余返回调试页 —— 当场可查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>false\u003c/code>（\u003cstrong>线上\u003c/strong>）\u003c/td>\n\u003ctd>\u003ccode>/api\u003c/code> 返回 \u003cstrong>HTTP 500\u003c/strong> \u003ccode>{&quot;code&quot;:500,&quot;msg&quot;:&quot;服务内部错误（编号 xxxxxxxx）&quot;}\u003c/code>；异常类 / 消息 / \u003cstrong>SQL + 绑定\u003c/strong> / 请求上下文 / 堆栈写 \u003ccode>runtime/logs/webman.log\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>宿主自己控制器的模式取宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>，与插件 debug \u003cstrong>取交集\u003c/strong>\n（任一为 \u003ccode>false\u003c/code> 即按线上处理），线上记得两边都关；\u003c/li>\n\u003cli>响应刻意用 \u003cstrong>HTTP 500\u003c/strong> 而非 200：便于 Nginx / 监控按 5xx 告警；前端已能解密并展示\n非 2xx 的加密错误响应（\u003ccode>request.js\u003c/code> 的 error 分支）；\u003c/li>\n\u003cli>提示文案可改：\u003ccode>config/curd-admin.php\u003c/code> 或插件 \u003ccode>config/curd.php\u003c/code> 的 \u003ccode>error_message\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-109\">2.4 日志刻意做成「一条异常一行」\u003c/h3>\n\u003cp>\u003ccode>trace_str\u003c/code> 里的换行已收敛成 \u003ccode>|\u003c/code>，且 \u003ccode>sql\u003c/code> / \u003ccode>bindings\u003c/code> 等关键字段排在堆栈\u003cstrong>之前\u003c/strong>。\n原因是 webman 默认日志格式器开了 \u003ccode>allowInlineLineBreaks\u003c/code>，多行堆栈会把后面的字段顶到\n几十行开外，\u003ccode>grep &lt;编号&gt;\u003c/code> 就只能看到第一行。收敛后可放心用 \u003ccode>grep\u003c/code> / \u003ccode>jq\u003c/code> / 采集器解析。\u003c/p>\n\u003cblockquote>\n\u003cp>若你 \u003ccode>grep &lt;编号&gt;\u003c/code> 只看到半条，说明用的是旧版 \u003ccode>CurdExceptionHandler\u003c/code>，重新同步一次插件。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-110\">2.5 前端提示里的编号 = 报障凭据\u003c/h3>\n\u003cpre>\u003ccode>服务内部错误（编号 a1b2c3d4）\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">grep a1b2c3d4 runtime/logs/webman.log\n\u003c/code>\u003c/pre>\n\u003cp>即可看到异常类、消息、SQL 与绑定。这与 \u003ccode>PermissionCheck\u003c/code> 的 403 编号是\u003cstrong>同一套排查方式\u003c/strong>：\n403 只给编号（不泄露权限结构），\u003ccode>reason\u003c/code> 写日志，同样用编号 grep。\u003c/p>\n"},{"file":"08-升级与生产部署.md","title":"升级 · 部署 · 发布","mtime":"2026/9/20 22:11:31","headings":[{"depth":2,"text":"1. 升级安全（避免本地改动被静默覆盖）","id":"h-112"},{"depth":2,"text":"2. 同步清单：哪些文件属于宿主、不能覆盖","id":"h-113"},{"depth":2,"text":"3. 卸载","id":"h-114"},{"depth":2,"text":"4. 生产部署","id":"h-115"},{"depth":3,"text":"4.1 守护进程（supervisor）","id":"h-116"},{"depth":3,"text":"4.2 Nginx 反代（SPA 与 API 同域，免 CORS）","id":"h-117"},{"depth":3,"text":"4.3 环境与密钥（上线检查单）","id":"h-118"},{"depth":3,"text":"4.4 备份","id":"h-119"},{"depth":3,"text":"4.5 升级与回滚","id":"h-120"},{"depth":2,"text":"5. 发布（zip / GitHub Release）","id":"h-121"},{"depth":2,"text":"6. 与本项目 webman-huafei-platform 的关系","id":"h-122"}],"html":"\u003ch1 id=\"h-111\">升级 · 部署 · 发布\u003c/h1>\n\u003cp>升级为什么不会自动生效、怎么把新版插件同步进宿主、上线部署要配什么、怎么打发布包。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-112\">1. 升级安全（避免本地改动被静默覆盖）\u003c/h2>\n\u003cp>安装器策略：\u003cstrong>\u003ccode>plugin/curd\u003c/code> 已存在就跳过拷贝\u003c/strong>（保护本地改动）。因此\n\u003ccode>composer update amcolin/webman-curd-admin\u003c/code> 只会更新 \u003ccode>vendor/\u003c/code> 里的包，\n\u003cstrong>不会动\u003c/strong>宿主 \u003ccode>plugin/curd\u003c/code> 与 \u003ccode>config/\u003c/code> 下的文件。\u003c/p>\n\u003cp>要把新版插件文件同步到宿主，走这两步：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># ① 升级前先检查宿主 plugin/curd 有无本地改动（0=无改动，1=发现改动）\n./scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\n\n# ② 确认无本地改动（或已备份）后整体重拷\nbash scripts/sync-plugin.sh\n#    = 备份 plugin/curd → plugin/curd.bak-&lt;时间戳&gt;，再从 vendor 整体重拷\n#    宿主 config/curd-admin.php 与 config/database.php 已存在，不会被覆盖\n\u003c/code>\u003c/pre>\n\u003cp>发现改动时：先 \u003ccode>git stash\u003c/code> / 提交 / 把改动\u003cstrong>迁回插件配置化\u003c/strong>，再升级。\u003c/p>\n\u003cblockquote>\n\u003cp>只改了内置前端的话，用 \u003ccode>scripts/build-frontend.sh\u003c/code> 重建 dist 即可，\n不必动 \u003ccode>plugin/curd\u003c/code> 源码。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>升级后建议再跑一次幂等安装\u003c/strong>，补齐新表 / 新种子 / 新菜单：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php plugin/curd/install.php      # 幂等：已存在的全 SKIP\nphp plugin/curd/migrate.php      # 如有增量迁移文件\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-113\">2. 同步清单：哪些文件属于宿主、不能覆盖\u003c/h2>\n\u003cp>\u003ccode>sync-plugin.sh\u003c/code> 会整体重拷 \u003ccode>plugin/curd\u003c/code>，但下列内容属于\u003cstrong>宿主专有\u003c/strong>，\n绝不能覆盖或删除（手工同步时逐条核对）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件 / 目录\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/config/keys/\u003c/code>\u003c/td>\n\u003ctd>RSA 私钥（\u003ccode>.gitignore\u003c/code> 排除，换机需手动拷贝，丢失要重生成）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/install-business.sql\u003c/code>\u003c/td>\n\u003ctd>宿主真实业务建表 SQL（\u003ccode>--business-sql\u003c/code> 用它）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/public/assets/\u003c/code>\u003c/td>\n\u003ctd>宿主自己的前端构建产物（若是自行构建的版本）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/migrations/\u003c/code>\u003c/td>\n\u003ctd>宿主的增量迁移文件（\u003ccode>V{n}__*.sql\u003c/code>）—— 同步时不要删除 / 覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主根 \u003ccode>config/curd-admin.php\u003c/code>、\u003ccode>config/database.php\u003c/code>、\u003ccode>.env\u003c/code>、\u003ccode>app/\u003c/code>\u003c/td>\n\u003ctd>插件之外的宿主自有层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>顺带一提，包 → 宿主需要同步的核心条目是：\u003ccode>api/Install.php\u003c/code>、\u003ccode>app/\u003c/code>、\n\u003ccode>config/*.php\u003c/code>、\u003ccode>env.example\u003c/code>、\u003ccode>install.php\u003c/code>、\u003ccode>install.sql\u003c/code>、\u003ccode>migrate.php\u003c/code>、\u003ccode>public/\u003c/code>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-114\">3. 卸载\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">composer remove amcolin/webman-curd-admin\n# 卸载钩子不自动删目录（避免误删本地开发版），手动清理：\nrm -rf plugin/curd\nphp start.php restart\n\u003c/code>\u003c/pre>\n\u003cp>数据库表与 \u003ccode>config/curd-admin.php\u003c/code> 需自行决定是否清理。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-115\">4. 生产部署\u003c/h2>\n\u003ch3 id=\"h-116\">4.1 守护进程（supervisor）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-ini\"># /etc/supervisor/conf.d/my-app.conf\n[program:my-app]\ncommand=php /var/www/my-app/start.php start\ndirectory=/var/www/my-app\nnumprocs=1\nautostart=true\nautorestart=true\nstartretries=3\nuser=www-data\nredirect_stderr=true\nstdout_logfile=/var/log/my-app/worker.log\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">supervisorctl reread &amp;&amp; supervisorctl update &amp;&amp; supervisorctl start my-app\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>不要裸跑 \u003ccode>php start.php start -d\u003c/code>。托管后整体重启用 \u003ccode>supervisorctl restart my-app\u003c/code>\n（手动 \u003ccode>php start.php restart\u003c/code> 会杀会话进程组）。插件的 \u003ccode>SIGUSR1\u003c/code> 平滑 reload 只重启\nworker、不杀 master，与 supervisor 托管兼容，仍可用于「改配置即时生效」。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-117\">4.2 Nginx 反代（SPA 与 API 同域，免 CORS）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-nginx\">server {\n    listen 80;\n    server_name admin.example.com;\n    root /var/www/my-app/public;\n\n    location / {\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n    location /index.php {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME $document_root/index.php;\n        fastcgi_pass 127.0.0.1:8787;   # 与 config/process.php 的 &#39;listen&#39; 一致\n    }\n    location /app/curd/ {              # 插件内置前端（SPA history 由 PageController 处理）\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>webman 侧取真实客户端 IP 用 \u003ccode>connection-&gt;getRemoteIp()\u003c/code>，依赖 Nginx 正确透传。\u003c/p>\n\u003ch3 id=\"h-118\">4.3 环境与密钥（上线检查单）\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>.env\u003c/code> 设 \u003ccode>APP_DEBUG=false\u003c/code>\u003c/strong> —— 否则接口未捕获异常会把堆栈 / 表结构直接抛给前端，\n既泄漏实现细节、又拿不到统一提示；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键\u003c/strong>指向\n\u003ccode>\\plugin\\curd\\app\\exception\\CurdExceptionHandler::class\u003c/code>（宿主自己的 \u003ccode>/api\u003c/code> 控制器才覆盖到；\n插件路由靠插件自带配置已生效）；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>config/middleware.php\u003c/code> 的 \u003ccode>&#39;@&#39;\u003c/code> 组\u003c/strong>注册 \u003ccode>StaticFile\u003c/code> + \u003ccode>ApiCrypto\u003c/code>\n（加密关闭也保留，否则前端加密请求无人解）；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>config/curd-admin.php\u003c/code> 开 \u003ccode>admin_require_permission =&gt; true\u003c/code>；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 登录后立即修改初始管理员密码；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>config/keys/\u003c/code> 独立挂载、不进 git / 不进发布产物；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 开发 / 测试 / 生产各用独立数据库，\u003ccode>.env\u003c/code> 不进 git。\u003c/li>\n\u003c/ul>\n\u003cp>细节见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a> 与 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">配置参考\u003c/a>。\u003c/p>\n\u003ch3 id=\"h-119\">4.4 备份\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>频率\u003c/th>\n\u003cth>方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>数据库（认证表 + 业务表同库）\u003c/td>\n\u003ctd>每日\u003c/td>\n\u003ctd>\u003ccode>mysqldump\u003c/code> 全量 + 保留 7 天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config/keys/\u003c/code>（RSA 私钥）\u003c/td>\n\u003ctd>\u003cstrong>生成即备份\u003c/strong>\u003c/td>\n\u003ctd>单独加密归档，切勿丢失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码 / 前端 dist\u003c/td>\n\u003ctd>每次发版\u003c/td>\n\u003ctd>git tag + CI 产物\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>RSA 私钥丢失不影响登录，只影响已加密的接口。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-120\">4.5 升级与回滚\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 升级前确认无本地改动\n./scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\nbash scripts/sync-plugin.sh          # 自带备份 plugin/curd.bak-&lt;时间戳&gt;\nphp plugin/curd/install.php          # 幂等补表 / 补种子 / 补菜单\n\u003c/code>\u003c/pre>\n\u003cp>回滚 = 恢复 \u003ccode>plugin/curd.bak-*\u003c/code> 后 reload；或 \u003ccode>git checkout &lt;上一版本 tag&gt;\u003c/code> /\ncomposer 锁版本重装。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-121\">5. 发布（zip / GitHub Release）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># 本地打 zip（排除 keys / install-business.sql / release-zip.sh 自身）\n./scripts/release-zip.sh 1.1.0\n# → dist/webman-curd-admin-v1.1.0.zip（约 1.1M，解压即用）\n\n# 发布到 GitHub\ngit tag v1.1.0 &amp;&amp; git push origin v1.1.0\n# → .github/workflows/release.yml 自动跑：\n#   composer validate --strict → 全量 php -l → 前端 dist 完整性校验\n#   → 关键文件存在性校验 → release-zip.sh → GitHub Release 附 zip\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>CI 不跑 npm\u003c/strong>：内置前端由开发者本地 \u003ccode>scripts/build-frontend.sh\u003c/code> 构建后提交 dist，\nCI 只校验产物完整性（\u003ccode>index.html\u003c/code> + \u003ccode>assets/\u003c/code> + 文件数 &gt; 10）。\u003c/p>\n\u003cp>zip 包内容 = \u003ccode>composer.json\u003c/code> + \u003ccode>README.md\u003c/code> + \u003ccode>INSTALL.md\u003c/code> + \u003ccode>docs/\u003c/code> +\n\u003ccode>plugin/curd/\u003c/code> + \u003ccode>scripts/\u003c/code>；\u003ccode>config/keys/\u003c/code>、\u003ccode>install-business.sql\u003c/code> 不进包。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-122\">6. 与本项目 webman-huafei-platform 的关系\u003c/h2>\n\u003cp>本包由 \u003ccode>webman-huafei-platform/plugin/curd\u003c/code> 发布而来，演进分三阶段：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>做了什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>M1\u003c/strong> 自包含下沉\u003c/td>\n\u003ctd>middleware / rbac / model / helpers / \u003ccode>casbin.conf\u003c/code> 全部内置，插件不再依赖宿主 \u003ccode>app\\middleware\u003c/code>、\u003ccode>app\\rbac\u003c/code>、\u003ccode>app\\functions.php\u003c/code>、\u003ccode>app\\model\\CurdConfigs\u003c/code>；宿主业务代码零改动、行为不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>M2\u003c/strong> 开箱即用\u003c/td>\n\u003ctd>\u003ccode>install.sql\u003c/code> + \u003ccode>api/Install.php\u003c/code> + \u003ccode>install.php\u003c/code> 一键建表 / 种子 / 密钥；前端 dist 内置 \u003ccode>public/\u003c/code>，\u003ccode>/app/curd/\u003c/code> 直接打开完整后台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>M3\u003c/strong> 管理面内置\u003c/td>\n\u003ctd>用户 / 角色 / 个人中心下沉进插件并注册路由（宿主同名路由优先，零行为变化）；新增 \u003ccode>admin_require_permission\u003c/code> 收紧开关；路由注册改走 \u003ccode>curd_route()\u003c/code> 冲突检测（修掉「重复注册抛 Route conflict」的崩溃点）；在全新空 webman 项目上完成端到端验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>M5 宿主旧副本下线\u003c/strong>：宿主侧的 \u003ccode>app/middleware/*\u003c/code>、\u003ccode>app/rbac/*\u003c/code>、\u003ccode>app/functions.php\u003c/code>\n已切到插件内置版并删除（\u003ccode>StaticFile.php\u003c/code> 是宿主自有，保留）。\u003c/p>\n\u003cblockquote>\n\u003cp>宿主开发期两条命令：\n\u003ccode>scripts/release.sh\u003c/code> 把宿主侧改动回灌到包；\u003ccode>scripts/build-frontend.sh\u003c/code> 重建内置前端。\u003c/p>\n\u003c/blockquote>\n"},{"file":"09-排错速查与FAQ.md","title":"排错速查与 FAQ","mtime":"2026/9/20 22:07:14","headings":[{"depth":2,"text":"1. 安装 / 初始化","id":"h-124"},{"depth":2,"text":"2. 启动 / 运行","id":"h-125"},{"depth":2,"text":"3. 菜单 / 权限","id":"h-126"},{"depth":2,"text":"4. 页面 / DSL","id":"h-127"},{"depth":2,"text":"5. 认证 / 登录","id":"h-128"},{"depth":2,"text":"6. 接口加密","id":"h-129"},{"depth":2,"text":"7. 异常兜底 / 日志","id":"h-130"},{"depth":2,"text":"8. 升级 / 部署","id":"h-131"},{"depth":2,"text":"9. FAQ","id":"h-132"},{"depth":3,"text":"为什么配置写在 config/curd-admin.php 而不是 .env？","id":"h-133"},{"depth":3,"text":"为什么还保留 mysql_business 连接（默认指向同一个库）？","id":"h-134"},{"depth":3,"text":"composer audit 红字能彻底消除吗？","id":"h-135"},{"depth":3,"text":"插件的路由前缀和命名空间是什么？","id":"h-136"}],"html":"\u003ch1 id=\"h-123\">排错速查与 FAQ\u003c/h1>\n\u003cp>按现象查。\u003cstrong>第一条永远是\u003c/strong>：配置和 PHP 改动都需要 \u003ccode>restart\u003c/code>（webman 常驻内存，热改不生效）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-124\">1. 安装 / 初始化\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>装完 \u003ccode>plugin/curd\u003c/code> 不存在\u003c/td>\n\u003ctd>自动拷贝未触发（宿主 \u003ccode>composer.json\u003c/code> 缺 \u003ccode>post-package-install\u003c/code> scripts 或 \u003ccode>support/Plugin.php\u003c/code>）。补 scripts 后 \u003ccode>composer dump-autoload &amp;&amp; composer update amcolin/webman-curd-admin\u003c/code>；或直接 \u003ccode>cp -r vendor/amcolin/webman-curd-admin/plugin/curd plugin/curd\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Failed to audit installed packages\u003c/code> 红字\u003c/td>\n\u003ctd>audit 硬编码访问 \u003ccode>packagist.org\u003c/code> 被墙，\u003cstrong>\u003ccode>exit 0\u003c/code>、不影响安装\u003c/strong>。用包内 wrapper 消除：\u003ccode>alias composer=&#39;&lt;包目录&gt;/scripts/composer.sh&#39;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向导页面显示「系统已安装」\u003c/td>\n\u003ctd>\u003ccode>runtime/curd-installed.lock\u003c/code> 存在。重装 = 删锁 + 清库后刷新向导页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/curd/config?route_path=/my-test\u003c/code> 返回 404「配置不存在」\u003c/td>\n\u003ctd>没跑安装向导 / \u003ccode>install.php\u003c/code>，\u003ccode>curd_configs\u003c/code> 种子未插。执行初始化流程，或在后台「配置生成器」手动生成该页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/auth/captcha\u003c/code> 返回「验证码生成失败：Class &quot;Webman\\Captcha...&quot; not found」\u003c/td>\n\u003ctd>宿主缺 \u003ccode>webman/captcha\u003c/code>（包已 require，旧宿主补装）或缺 \u003ccode>ext-gd\u003c/code> / \u003ccode>ext-mbstring\u003c/code>。不想要验证码：\u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报 \u003ccode>Class &quot;support\\Redis&quot; not found\u003c/code>\u003c/td>\n\u003ctd>缺 \u003ccode>webman/redis\u003c/code>：\u003ccode>composer require webman/redis\u003c/code>。（包已 require；Redis 不可用时 Auth / RBAC / AuthCheck / AdminController 已 \u003ccode>try/catch\u003c/code> 降级直查 DB，不影响登录鉴权）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「测试管理」菜单 / \u003ccode>my_test\u003c/code> 表不出现\u003c/td>\n\u003ctd>老项目没跑过新版 install。执行一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等，补表 + 补菜单）；不想要示例就跳过，不影响安装结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务表没建出来\u003c/td>\n\u003ctd>\u003ccode>--business-sql\u003c/code> 没传（默认只装认证面 8 张表），或路径不是相对宿主根。多文件可重复传或逗号分隔\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>装完登录报 \u003ccode>1045 Access denied\u003c/code>\u003c/td>\n\u003ctd>Web 向导场景已\u003cstrong>自动 \u003ccode>SIGUSR1\u003c/code> 平滑 reload\u003c/strong>，一般不会出现；Windows / supervisor 等\u003cstrong>信号不可用\u003c/strong>环境按页面提示手动 \u003ccode>php start.php restart\u003c/code>（worker 配置在启动期固化）。CLI 安装后同样重启一次\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-125\">2. 启动 / 运行\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>改 PHP 类 / 常量 / 配置后不生效\u003c/td>\n\u003ctd>webman 常驻内存：reload 不重读类文件，改 PHP 要 \u003ccode>restart\u003c/code>（改 \u003ccode>.env\u003c/code> / config 可用 \u003ccode>SIGUSR1\u003c/code> 平滑 reload）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口不是 8787\u003c/td>\n\u003ctd>webman 2.x 端口在 \u003ccode>config/process.php\u003c/code> 的 \u003ccode>listen\u003c/code>，改这里再重启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后台页面 404 / 静态资源 404\u003c/td>\n\u003ctd>/app/curd/\u003ccode>没被正确反代（Nginx 见 [升级 · 部署 · 发布](08-升级与生产部署.md)），或\u003c/code>page_base\u003ccode>与前端\u003c/code>VITE_BASE_PATH` 不一致（两者必须相同，改完要重建前端）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SPA 深链（\u003ccode>/app/curd/dashboard\u003c/code>）404\u003c/td>\n\u003ctd>反代没把未知路径回退到 \u003ccode>index.php\u003c/code>（\u003ccode>PageController\u003c/code> 只负责把请求交给 \u003ccode>index.html\u003c/code>，前面得有 try_files 兜住）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换了端口打开登录页，账号没自动回填\u003c/td>\n\u003ctd>\u003ccode>localStorage\u003c/code> 按\u003cstrong>源\u003c/strong>隔离（\u003ccode>127.0.0.1:18082\u003c/code> ≠ \u003ccode>127.0.0.1:8787\u003c/code>），属正常现象\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-126\">3. 菜单 / 权限\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>403 只看到「编号」看不到原因\u003c/td>\n\u003ctd>\u003cstrong>设计如此\u003c/strong>（不泄露权限结构）。拿编号 grep \u003ccode>runtime/logs/webman-*.log\u003c/code> 看 \u003ccode>reason\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 日志里 \u003ccode>reason=unresolved-permission\u003c/code>\u003c/td>\n\u003ctd>不是没权限，是\u003cstrong>路径推导不出 \u003ccode>obj:act\u003c/code>\u003c/strong>：控制器没进 \u003ccode>RouteControllerRegistry\u003c/code>，或菜单 \u003ccode>path\u003c/code> 与注册 key 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>勾了「一键生成权限」却没生成\u003c/td>\n\u003ctd>\u003ccode>path\u003c/code> 不是已注册的 CURD 页 → 推导不出 \u003ccode>curd.{Model}\u003c/code>。接口响应 \u003ccode>data.warning\u003c/code> 会提示，手填「权限标识」后重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「快速创建权限」报重名 400\u003c/td>\n\u003ctd>该 \u003ccode>permission\u003c/code> 已存在（含之前一键生成过的）。换个后缀名，或去菜单树里找已有节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/admin/*\u003c/code> 对新角色一律 403\u003c/td>\n\u003ctd>开了 \u003ccode>admin_require_permission\u003c/code>。\u003ccode>admin\u003c/code> 角色有 \u003ccode>p,admin,*,*\u003c/code> 不受影响；其余角色需在「角色管理」勾选，或写 \u003ccode>casbin_rule\u003c/code>：\u003ccode>INSERT INTO casbin_rule (ptype,v0,v1,v2) VALUES (&#39;p&#39;,&#39;yunying&#39;,&#39;admin&#39;,&#39;users&#39;);\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关掉权限后前端还显示无权限\u003c/td>\n\u003ctd>前端要读响应里的 \u003ccode>permission_enabled\u003c/code> 字段自行处理；插件只负责后端放行与字段透传\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后仍进 \u003ccode>/dashboard\u003c/code>（没走配置的 \u003ccode>home_page\u003c/code>）\u003c/td>\n\u003ctd>按顺序查：①\u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>home_page\u003c/code> 改了但没 \u003ccode>restart\u003c/code>；②前端是旧产物（登录跳转在前端，需重新构建部署）；③浏览器里是\u003cstrong>旧书签 / 历史\u003c/strong>（\u003ccode>login?redirect=...\u003c/code> 这类旧值已被忽略）；④从侧边栏点了「首页」菜单（那是菜单数据，与 \u003ccode>home_page\u003c/code> 无关）；⑤\u003ccode>localStorage.admin_home_page\u003c/code> 是旧值且 \u003ccode>/api/config/site\u003c/code> 请求失败（看 Network）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后落点跟「上次被拦住的那一页」不一致\u003c/td>\n\u003ctd>\u003cstrong>刻意如此\u003c/strong>：登录一律跳 \u003ccode>home_page\u003c/code>，不再回跳原页（\u003ccode>?redirect=\u003c/code> 已彻底不参与）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-127\">4. 页面 / DSL\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新 Schema 页面 404\u003c/td>\n\u003ctd>\u003ccode>PageRegistry::register\u003c/code> 没写（或没 \u003ccode>restart\u003c/code>）；页面名与 \u003ccode>name\u003c/code> 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>props 不生效\u003c/td>\n\u003ctd>键不在前端注册表白名单 → 被丢弃。查 \u003ccode>componentRegistry.js\u003c/code> 对应 type 的 props\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面显示 \u003ccode>[未注册节点: xxx]\u003c/code>\u003c/td>\n\u003ctd>type 拼错，或前端漏登记\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>collapse 不展开 / 展开错乱\u003c/td>\n\u003ctd>展开态由渲染器托管：用 \u003ccode>-&gt;active([...])\u003c/code> 设初始 name，item 需有 \u003ccode>-&gt;name()\u003c/code> 才能精确命中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>*-item\u003c/code> 没显示\u003c/td>\n\u003ctd>条目必须\u003cstrong>直接\u003c/strong>挂在对应容器 children，不能夹在中间组件里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>statistic\u003c/code> 显示 NaN / 空\u003c/td>\n\u003ctd>整串占位取不到值时\u003cstrong>保留原文\u003c/strong>；确认数据接口返回数字、key 路径写对（\u003ccode>{{stats.amount}}\u003c/code> 是 \u003ccode>data.amount\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code> 图标不显示（空白方块）\u003c/td>\n\u003ctd>\u003ccode>-&gt;icon(&#39;xxx&#39;)\u003c/code> 必须是 EP 图标名（\u003ccode>View\u003c/code> / \u003ccode>Money\u003c/code> / \u003ccode>User\u003c/code>…）；写错时 \u003ccode>getIconComponent\u003c/code> 回退 \u003ccode>Monitor\u003c/code>，连图标位都空则查 \u003ccode>utils/icons\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 显示「暂无数据」\u003c/td>\n\u003ctd>\u003ccode>data\u003c/code> 取不到值（占位符未替换 / JSON 解析失败 / 数组里全是非数字）→ 走空态。查 dataApi 是否返回\u003cstrong>数组\u003c/strong>、key 路径是否写对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 折线贴底 / 全 0\u003c/td>\n\u003ctd>数据本身全 0（如订单表为空），不是 bug；用 \u003ccode>-&gt;data([...])\u003c/code> 静态数组可快速自查渲染\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表宽度不随侧边栏折叠变化\u003c/td>\n\u003ctd>节点组件用 \u003ccode>ResizeObserver\u003c/code> 监听容器，正常会自动重绘；若嵌在 \u003ccode>display:none\u003c/code> 的 tab 里初始化，切回时会重绘一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Action 按钮不出现\u003c/td>\n\u003ctd>\u003ccode>-&gt;show(fn)\u003c/code> 返回了 false；或 \u003ccode>-&gt;batch(true)\u003c/code> 的按钮在批量工具栏（需勾选行）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面报「不支持导入模块 xxx」\u003c/td>\n\u003ctd>运行时编译只放行 \u003ccode>vue\u003c/code> / \u003ccode>element-plus\u003c/code> / \u003ccode>@element-plus/icons-vue\u003c/code>；发请求改用 \u003ccode>inject(&#39;request&#39;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面 \u003ccode>&lt;style lang=&quot;scss&quot;&gt;\u003c/code> 报错\u003c/td>\n\u003ctd>浏览器端无预处理器，只能用纯 CSS（\u003ccode>scoped\u003c/code> 也会降级为全局，class 加唯一前缀）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导出报「本次将导出 N 条，超过单次导出上限 M 条」\u003c/td>\n\u003ctd>\u003ccode>export_max_rows\u003c/code> 限制（默认 100000）。调大该键，或缩小筛选范围；前端把超限当\u003cstrong>错误提示\u003c/strong>而不是下载文件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-128\">5. 认证 / 登录\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>自定义登录没生效\u003c/td>\n\u003ctd>\u003ccode>login_handler\u003c/code> / \u003ccode>auth_provider\u003c/code> 类名写错会\u003cstrong>静默回退内置\u003c/strong>；改完需 \u003ccode>restart\u003c/code>，并确认类能被自动加载（PSR-4 路径 / 命名空间）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义登录返回 null 却想给明确错误\u003c/td>\n\u003ctd>\u003ccode>login()\u003c/code> 只能返回身份数组或 \u003ccode>null\u003c/code>；想区分「用户不存在」「密码错」可在 \u003ccode>null\u003c/code> 前用日志 / 监控区分，响应统一是 401\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录成功但 \u003ccode>/api/auth/me\u003c/code> 报用户不存在\u003c/td>\n\u003ctd>\u003ccode>login()\u003c/code> 的 \u003ccode>id\u003c/code> 与 \u003ccode>resolveUser($id)\u003c/code> 取数来源不一致，核对两边用的是同一张表同一列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自己实现 \u003ccode>auth_provider\u003c/code> 加状态判定，结果「能访问接口但 \u003ccode>/me\u003c/code> 状态不对」\u003c/td>\n\u003ctd>覆盖时漏了三个入口之一（\u003ccode>login\u003c/code> / \u003ccode>identity\u003c/code> / \u003ccode>resolveUser\u003c/code>），\u003cstrong>漏了不报错\u003c/strong>。改用 \u003ccode>auth_state_guard\u003c/code> 收口到一处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code> 配了却不生效\u003c/td>\n\u003ctd>①类名写错 / 类不存在 → \u003ccode>stateGuard()\u003c/code> 返回 \u003ccode>null\u003c/code> 静默跳过；②没 \u003ccode>restart\u003c/code>（配置在启动期读取）；③配的是 \u003ccode>auth_provider\u003c/code> 而非 \u003ccode>auth_state_guard\u003c/code>。排查：\u003ccode>php -r &quot;var_dump(class_exists(&#39;\\\\\\\\app\\\\\\\\auth\\\\\\\\MyGuard&#39;));&quot;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录一直提示「验证码错误」「请输入验证码」\u003c/td>\n\u003ctd>①宿主要求验证码但自定义登录页没送 \u003ccode>captcha_key\u003c/code> / \u003ccode>captcha_code\u003c/code>（不想用就 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启）；②前端产物是旧的（不含验证码字段）→ 重新构建部署；③\u003ccode>/api/auth/captcha\u003c/code> 报 500（缺 \u003ccode>webman/captcha\u003c/code> 或 \u003ccode>ext-gd\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码位置只有一行「点击获取」，没有图片\u003c/td>\n\u003ctd>\u003ccode>/api/auth/captcha\u003c/code> 没返回有效 key，看响应 \u003ccode>msg\u003c/code>：ext-gd 未装 / 字体缺失 / Redis 不可用；点那一行可重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码输入框整块不显示（后端却仍要验证码）\u003c/td>\n\u003ctd>\u003ccode>captcha_enabled=false\u003c/code> 已生效，或 \u003ccode>/api/config/site\u003c/code> 请求失败（前端兜底不显示）。后端返回的错误里带 \u003ccode>data.captcha=true\u003c/code>，前端会\u003cstrong>自动展开并拉图\u003c/strong>，重试一次即可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全员都登不进去，且验证码一直失败\u003c/td>\n\u003ctd>Redis 挂了（验证码明文存 Redis，一次性）。应急把 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启放行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号能登录，但过一会儿请求全 403「账号已被禁用」\u003c/td>\n\u003ctd>配了 \u003ccode>auth_state_guard\u003c/code>，其业务判定返回了 \u003ccode>false\u003c/code>（\u003ccode>AuthCheck\u003c/code> 每请求都调，实时生效、无缓存）。查 \u003ccode>PlatformStatusGuard\u003c/code> 之类的实现与业务库状态；注意钩子内要做 \u003cstrong>fail-open\u003c/strong>（异常时放行 + 记日志）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-129\">6. 接口加密\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>所有 \u003ccode>/api\u003c/code> 返回 400「请求解密失败」\u003c/td>\n\u003ctd>前端产物用的公钥与宿主私钥不匹配。\u003cstrong>公钥每宿主一份\u003c/strong>（\u003ccode>config/keys/api_rsa_public.pem\u003c/code>），别把 A 宿主的产物拷到 B 宿主；用 \u003ccode>build-frontend.sh\u003c/code> 重开（它会校验产物里真的带上了目标宿主的公钥）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「我明明没开加密，怎么要解密」\u003c/td>\n\u003ctd>开关是\u003cstrong>显式\u003c/strong>的：只有 \u003ccode>VITE_API_ENCRYPT=true\u003c/code> 才开。若产物里搜得到 \u003ccode>X-Encrypt-Data\u003c/code>，说明这批 dist 是加密版构建的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改了 \u003ccode>VITE_API_ENCRYPT\u003c/code> 没反应\u003c/td>\n\u003ctd>该变量是\u003cstrong>构建期内联\u003c/strong>，不是运行期配置，改完必须重新 \u003ccode>npm run build\u003c/code> 并部署产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动构建时换行写不对\u003c/td>\n\u003ctd>\u003ccode>VITE_API_RSA_PUBLIC_KEY\u003c/code> 里的换行要写成字面 \u003ccode>\\n\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上传 / 导出也想加密\u003c/td>\n\u003ctd>不需要，也不会加密：\u003ccode>multipart\u003c/code> 上传、非 JSON 响应（CSV 导出）、\u003ccode>OPTIONS\u003c/code> 预检、非 \u003ccode>/api\u003c/code> 路径\u003cstrong>始终明文\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-130\">7. 异常兜底 / 日志\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>线上接口提示「服务内部错误（编号 xxxxxxxx）」\u003c/td>\n\u003ctd>后端有未捕获异常（多为 SQL 报错 / 字段不存在）。\u003ccode>grep &lt;编号&gt; runtime/logs/webman.log\u003c/code> 直接看到异常类、SQL 与绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口只提示「Request failed with status code 500」，没有编号\u003c/td>\n\u003ctd>该路由\u003cstrong>没走\u003c/strong>插件异常处理器。插件路由应自动生效（\u003ccode>plugin/curd/config/exception.php\u003c/code>）；宿主自己的 \u003ccode>/api\u003c/code> 控制器需把 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向 \u003ccode>CurdExceptionHandler\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口直接返回堆栈 / 表结构\u003c/td>\n\u003ctd>模式还判定为「本地」：插件侧看 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code>，宿主自己控制器还要看宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>（两者\u003cstrong>取交集\u003c/strong>，任一为 \u003ccode>false\u003c/code> 即线上）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按编号 grep 日志只看到半条\u003c/td>\n\u003ctd>日志被 \u003ccode>trace_str\u003c/code> 的换行撑成多行（webman 默认 \u003ccode>allowInlineLineBreaks=true\u003c/code>）。新版已把换行收敛为 \u003ccode>|\u003c/code>、并把 \u003ccode>sql\u003c/code> / \u003ccode>bindings\u003c/code> 排在堆栈之前，一条异常恒为一行；用到旧版 \u003ccode>CurdExceptionHandler\u003c/code> 就重新同步一次插件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想在中间件里统一捕获接口异常\u003c/td>\n\u003ctd>\u003cstrong>做不到\u003c/strong>：webman 的中间件链每层内层都先 try/catch 再转 Response，外层拿不到控制器异常。只能用异常处理器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-131\">8. 升级 / 部署\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>composer update\u003c/code> 后宿主 \u003ccode>plugin/curd\u003c/code> 没变\u003c/td>\n\u003ctd>\u003cstrong>预期行为\u003c/strong>：安装器只在目录不存在时拷贝（保护本地改动）。要同步新版文件用 \u003ccode>scripts/sync-plugin.sh\u003c/code>（先备份再重拷）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不确定宿主侧有没有本地改动\u003c/td>\n\u003ctd>升级前跑 \u003ccode>scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\u003c/code>：\u003ccode>0\u003c/code> = 无改动，\u003ccode>1\u003c/code> = 发现改动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>升级后新表 / 新菜单缺失\u003c/td>\n\u003ctd>升级后跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等补种子）与 \u003ccode>php plugin/curd/migrate.php\u003c/code>（增量迁移）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Route conflict\u003c/code> 异常\u003c/td>\n\u003ctd>老版本插件没用冲突检测。现版本统一走 \u003ccode>curd_route()\u003c/code>：注册前检测同 method + path，已注册则跳过、保留宿主实现。宿主自注册过 \u003ccode>/api/admin/*\u003c/code> 等不受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与宿主路由冲突怎么办\u003c/td>\n\u003ctd>同上 —— \u003cstrong>宿主优先\u003c/strong>，插件让位。存量项目装插件行为不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件自带 config 覆盖了 \u003ccode>config/plugin/curd/curd.php\u003c/code>\u003c/td>\n\u003ctd>正常：插件以「根目录应用插件」分发，webman 配置加载顺序是 \u003ccode>config/\u003c/code> 先、\u003ccode>plugin/*/config\u003c/code> 后。调参请写宿主根 \u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-132\">9. FAQ\u003c/h2>\n\u003ch3 id=\"h-133\">为什么配置写在 \u003ccode>config/curd-admin.php\u003c/code> 而不是 \u003ccode>.env\u003c/code>？\u003c/h3>\n\u003cp>插件自带 config 会覆盖 \u003ccode>config/plugin/curd/curd.php\u003c/code>；宿主根 \u003ccode>config/curd-admin.php\u003c/code>\n由安装器生成、\u003cstrong>顶层同名键覆盖内置默认\u003c/strong>，是唯一推荐调参入口。\n数据库连接仍走 \u003ccode>.env\u003c/code> 的 \u003ccode>DB_*\u003c/code> 键。\u003c/p>\n\u003cblockquote>\n\u003cp>注意：\u003ccode>CURD_*\u003c/code> 环境变量已\u003cstrong>全部移除\u003c/strong>，\u003ccode>config/curd.php\u003c/code> 与 \u003ccode>config/admin.php\u003c/code>\n也已\u003cstrong>不再读取\u003c/strong>（2026-09-19 合并）。改这两个地方一律无效果。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-134\">为什么还保留 \u003ccode>mysql_business\u003c/code> 连接（默认指向同一个库）？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史原因\u003c/strong>：插件按「认证库 / 业务库」分离设计，\u003ccode>business_connection=mysql_business\u003c/code>\n是默认的业务模型 CURD 连接名。改这一处会动大量业务代码、破坏向后兼容。\u003c/li>\n\u003cli>\u003cstrong>单库模式\u003c/strong>（默认）：\u003ccode>mysql_business.database\u003c/code> 回退到认证库名 → 两个连接\u003cstrong>指向同一库\u003c/strong>，零开销。\u003c/li>\n\u003cli>\u003cstrong>想分库\u003c/strong>：在 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>database.business_db\u003c/code> 填不同库名。\u003c/li>\n\u003cli>\u003cstrong>不要它\u003c/strong>：删掉 \u003ccode>config/database.php\u003c/code> 里 \u003ccode>&#39;mysql_business&#39; =&gt; [...]\u003c/code> 整块，\n业务代码里的 \u003ccode>Db::connection(&#39;mysql_business&#39;)\u003c/code> 改成 \u003ccode>mysql\u003c/code>，或在模型里\n\u003ccode>protected $connection = &#39;mysql&#39;;\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-135\">\u003ccode>composer audit\u003c/code> 红字能彻底消除吗？\u003c/h3>\n\u003cp>包内无法彻底消除（composer 没有全局 config 关闭 audit），但提供\u003cstrong>零侵入 wrapper\u003c/strong>。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>原理\u003c/strong>：\u003ccode>composer require/update\u003c/code> 末尾会跑 \u003ccode>composer audit\u003c/code>，硬编码访问 \u003ccode>packagist.org\u003c/code>\n的 \u003ccode>security-advisories\u003c/code> 端点（不走国内镜像）；不可达时就报红字，但命令本身 \u003ccode>exit 0\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>根治\u003c/strong>：让 \u003ccode>packagist.org\u003c/code> 可达（全局代理或 hosts）。\u003c/li>\n\u003cli>\u003cstrong>包内方案\u003c/strong>：\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">./scripts/composer.sh update                          # 临时用一次\necho &quot;alias composer=&#39;$(pwd)/scripts/composer.sh&#39;&quot; &gt;&gt; ~/.zshrc &amp;&amp; source ~/.zshrc   # 永久\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-136\">插件的路由前缀和命名空间是什么？\u003c/h3>\n\u003cul>\n\u003cli>后端 API \u003ccode>/api/*\u003c/code>、内置前端 \u003ccode>/app/curd/*\u003c/code>；\u003c/li>\n\u003cli>命名空间 \u003ccode>plugin\\curd\\app\\*\u003c/code>；配置读取 \u003ccode>config(&#39;plugin.curd.*&#39;)\u003c/code>；\u003c/li>\n\u003cli>表 \u003ccode>curd_configs\u003c/code>（页面 DSL 配置）、\u003ccode>admin_users\u003c/code>、\u003ccode>admin_tokens\u003c/code>、\u003ccode>roles\u003c/code>、\n\u003ccode>admin_role_user\u003c/code>、\u003ccode>role_permission\u003c/code>、\u003ccode>casbin_rule\u003c/code>、\u003ccode>menus\u003c/code>。\u003c/li>\n\u003c/ul>\n"}];</script>
<script>
(function () {
  var DATA = window.__DOCS_DATA__ || [];
  var aside = document.getElementById('tree');
  var panels = document.getElementById('panels');
  var treeEmpty = document.getElementById('treeEmpty');
  var backTop = document.getElementById('backTop');

  // ---------- 渲染左侧栏目树（DOM 构建，天然成树/自动转义） ----------
  function buildSidebar() {
    aside.innerHTML = '';
    for (var i = 0; i < DATA.length; i++) {
      var doc = DATA[i];
      var group = document.createElement('div');
      group.className = 'doc-group';
      group.setAttribute('data-doc', i);

      var title = document.createElement('div');
      title.className = 'doc-title';
      title.setAttribute('data-doc', i);
      var dot = document.createElement('span');
      dot.className = 'dot';
      title.appendChild(dot);
      title.appendChild(document.createTextNode(doc.title));
      var fname = document.createElement('span');
      fname.className = 'fname';
      fname.textContent = doc.file;
      title.appendChild(fname);
      group.appendChild(title);

      // 嵌套目录树：rootUl 挂 2 级；3/4 级挂到最近的上级 li 下（惰性建 ul）
      var rootUl = document.createElement('ul');
      rootUl.className = 'tree';
      var lastByDepth = { 1: rootUl };
      for (var j = 0; j < doc.headings.length; j++) {
        var h = doc.headings[j];
        if (h.depth <= 1) continue;
        var li = document.createElement('li');
        var lvlClass = h.depth >= 4 ? 'lvl4' : (h.depth === 3 ? 'lvl3' : 'lvl2');
        li.className = lvlClass;
        var a = document.createElement('a');
        a.setAttribute('data-doc', i);
        a.setAttribute('data-target', h.id);
        a.textContent = h.text;
        li.appendChild(a);
        // 挂载点：向上找最近已存在的上一级
        var d = h.depth - 1;
        while (d >= 1 && !lastByDepth[d]) d--;
        var parent = d < 1 ? rootUl : lastByDepth[d];
        if (parent !== rootUl) {
          if (!parent._ul) {
            parent._ul = document.createElement('ul');
            parent.appendChild(parent._ul);
          }
          parent._ul.appendChild(li);
        } else {
          rootUl.appendChild(li);
        }
        lastByDepth[h.depth] = li;
      }
      if (rootUl.children.length) group.appendChild(rootUl);
      aside.appendChild(group);
    }
  }

  // ---------- 渲染右侧内容面板（DOM 构建，文本自动转义） ----------
  function buildPanels() {
    panels.innerHTML = '';
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];

      var sec = document.createElement('section');
      sec.className = 'doc-panel';
      sec.setAttribute('data-doc', i);

      var meta = document.createElement('div');
      meta.className = 'panel-meta';
      meta.appendChild(document.createTextNode('来源：'));
      var fnameChip = document.createElement('span');
      fnameChip.className = 'chip';
      fnameChip.textContent = d.file;
      meta.appendChild(fnameChip);
      meta.appendChild(document.createTextNode(' '));
      var timeChip = document.createElement('span');
      timeChip.className = 'chip';
      timeChip.textContent = '更新于 ' + d.mtime;
      meta.appendChild(timeChip);

      var body = document.createElement('div');
      body.className = 'doc-body';
      // 内容来自构建器渲染的 markdown HTML，受信源（仅扫描 docs/ 下文件）
      body.innerHTML = d.html;

      sec.appendChild(meta);
      sec.appendChild(body);
      panels.appendChild(sec);
    }
  }

  // ---------- 激活文档 ----------
  var currentDoc = 0;
  function setActiveDoc(idx) {
    currentDoc = idx;
    var ps = panels.querySelectorAll('.doc-panel');
    for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('active', i === idx);
    var gs = aside.querySelectorAll('.doc-group');
    for (var j = 0; j < gs.length; j++) gs[j].classList.toggle('active', j === idx);
  }

  // ---------- 跳转锚点 ----------
  function jump(targetId) {
    var el = document.getElementById(targetId);
    if (!el) return;
    var panel = el.closest('.doc-panel');
    if (panel) {
      var idx = parseInt(panel.getAttribute('data-doc'), 10);
      if (idx !== currentDoc) setActiveDoc(idx);
    }
    requestAnimationFrame(function () {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ---------- 事件绑定 ----------
  aside.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (a) { e.preventDefault(); jump(a.getAttribute('data-target')); markActive(a); return; }
    var t = e.target.closest('.doc-title');
    if (t) { var idx = parseInt(t.getAttribute('data-doc'), 10); setActiveDoc(idx); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  function markActive(a) {
    var prev = aside.querySelector('a.active');
    if (prev) prev.classList.remove('active');
    if (a) a.classList.add('active');
  }

  // ---------- 正文里的站内互链：切换到对应文档面板 ----------
  panels.addEventListener('click', function (e) {
    var a = e.target.closest('a.doc-link');
    if (!a) return;
    e.preventDefault();
    var idx = parseInt(a.getAttribute('data-doc-jump'), 10);
    if (isNaN(idx) || idx < 0 || idx >= DATA.length) return;
    setActiveDoc(idx);
    markActive(null);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 滚动高亮当前阅读标题
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var panel = panels.querySelector('.doc-panel.active');
      if (!panel) return;
      var heads = panel.querySelectorAll('.doc-body [id^="h-"]');
      var cur = null;
      for (var i = 0; i < heads.length; i++) {
        var r = heads[i].getBoundingClientRect();
        if (r.top <= 90) cur = heads[i]; else break;
      }
      if (cur) {
        var a = aside.querySelector('a[data-target="' + cur.id + '"]');
        markActive(a);
      }
      backTop.classList.toggle('show', (window.pageYOffset || document.documentElement.scrollTop) > 480);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  backTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- 关键字过滤（只过滤栏目树） ----------
  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var kw = q.value.trim().toLowerCase();
    var links = aside.querySelectorAll('.tree a');
    var groups = aside.querySelectorAll('.doc-group');
    var any = false;
    for (var i = 0; i < links.length; i++) {
      var li = links[i].closest('li');
      var hit = !kw || links[i].textContent.toLowerCase().indexOf(kw) !== -1;
      li.style.display = hit ? '' : 'none';
      if (hit) any = true;
    }
    for (var g = 0; g < groups.length; g++) {
      var vis = groups[g].querySelector('.tree li');
      groups[g].style.display = vis && vis.style.display !== 'none' ? '' : 'none';
      if (kw && !any) { /* 文档级命中也显示 */ }
    }
    // 若文档标题命中但章节没命中，展开全部章节
    if (kw) {
      for (var gg = 0; gg < groups.length; gg++) {
        var titleHit = groups[gg].querySelector('.doc-title').textContent.toLowerCase().indexOf(kw) !== -1;
        var items = groups[gg].querySelectorAll('.tree li');
        if (titleHit) { for (var k = 0; k < items.length; k++) items[k].style.display = ''; any = true; }
        else { var has = false; for (var m = 0; m < items.length; m++) { if (items[m].style.display !== 'none') has = true; } groups[gg].style.display = has ? '' : 'none'; }
      }
    }
    treeEmpty.style.display = any ? 'none' : 'block';
  });

  // ---------- 初始化 ----------
  document.getElementById('totalDocs').textContent = DATA.length + ' 篇';
  buildSidebar();
  buildPanels();
  setActiveDoc(0);
})();
</script>
</body>
</html>
