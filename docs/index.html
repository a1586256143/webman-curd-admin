<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webman-curd-admin 文档</title>
<style>
:root{
  --accent:#2563eb; --accent-soft:#eff6ff; --border:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --aside-w:300px; --header-h:56px; --code-bg:#23272f; --code-fg:#c8ccd4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:#f6f7f9}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 顶栏 ===== */
.site-header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:12px;
  padding:0 16px;background:#fff;border-bottom:1px solid var(--border)}
.site-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.site-title .brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-title .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.doc-count{font-size:12px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:2px 10px;white-space:nowrap;flex-shrink:0}
.head-links{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:13px;color:#4b5563}
.head-links a{color:#4b5563}
.head-links a:hover{color:var(--accent);text-decoration:none}
.search-box{flex:1 1 auto;min-width:0;max-width:380px;margin-left:auto;position:relative}
.search-box input{width:100%;min-width:0;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-box .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:13px;pointer-events:none}

/* ===== 主体布局 ===== */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}

/* ===== 左侧栏目 ===== */
.sidebar{width:var(--aside-w);flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));padding:12px 8px 40px}
.tree-empty{padding:16px 12px;color:#9ca3af;font-size:13px;display:none}
.doc-group{margin-bottom:4px}
.doc-title{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13.5px;line-height:1.45;color:var(--text);user-select:none}
.doc-title:hover{background:#f3f4f6}
.doc-title .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex-shrink:0;transition:background .15s}
.doc-title .tname{flex:1;min-width:0;word-break:break-word}
.doc-title .chev{flex-shrink:0;width:12px;height:12px;color:#9ca3af;transition:transform .18s ease}
.doc-group:not(.collapsed) .doc-title .chev{transform:rotate(90deg)}
.doc-group.active .doc-title{color:var(--accent)}
.doc-group.active .doc-title .dot{background:var(--accent)}
/* 折叠：非当前文档默认收起（laravel-admin 风格），点标题展开 */
.doc-group.collapsed .tree{display:none}
.sidebar.searching .doc-group .tree{display:block}
.tree{list-style:none;margin:2px 0 4px;padding:0}
.tree li{margin:0}
.tree a{display:block;padding:5px 10px 5px 26px;border-radius:6px;color:#4b5563;font-size:13px;border-left:2px solid transparent;cursor:pointer;line-height:1.5}
.tree a:hover{background:#f3f4f6;color:var(--text);text-decoration:none}
.tree a.active{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.tree ul{list-style:none;margin:0;padding:0}
.tree .lvl3 a{padding-left:42px;font-size:12.5px;color:#6b7280}
.tree .lvl3 a.active{color:var(--accent)}
.tree .lvl4 a{padding-left:58px;font-size:12px;color:#9ca3af}
.sidebar-foot{margin-top:16px;padding:10px 12px;font-size:11px;color:#c0c4cc;border-top:1px dashed #eee}

/* ===== 右侧内容 ===== */
.content{flex:1;min-width:0;padding:26px 36px 80px}
.doc-panel{display:none;max-width:1160px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px 44px 46px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.doc-panel.active{display:block}
.panel-meta{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #f0f1f3;color:#9ca3af;font-size:12px;flex-wrap:wrap}
.panel-meta .chip{background:#f3f4f6;border-radius:6px;padding:2px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#6b7280}
.back-top{position:fixed;right:26px;bottom:30px;width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.35);display:none;z-index:60}
.back-top.show{display:block}

/* ===== 正文排版 ===== */
.doc-body h1{font-size:27px;margin:0 0 6px;line-height:1.4;letter-spacing:.2px}
.doc-body h2{font-size:20px;margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid #eef0f3;line-height:1.5}
.doc-body h3{font-size:16px;margin:26px 0 9px;color:#111827;line-height:1.55}
.doc-body h4{font-size:14.5px;margin:20px 0 8px;color:#374151}
.doc-body p{margin:10px 0}
.doc-body ul,.doc-body ol{margin:10px 0;padding-left:26px}
.doc-body li{margin:4px 0}
.doc-body strong{font-weight:700}
.doc-body a{word-break:break-all}
.doc-body a.doc-link{border-bottom:1px dashed currentColor;word-break:normal}
.doc-body a.doc-link::after{content:" →";font-size:11px;opacity:.55}
.doc-body td a.doc-link::after,.doc-body th a.doc-link::after{content:""}
.doc-body blockquote{margin:14px 0;padding:10px 16px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:0 8px 8px 0;color:#78350f}
.doc-body blockquote p{margin:4px 0}
.doc-body hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.doc-body img{max-width:100%}
.doc-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:12.5px;background:#f2f4f8;color:#d6336c;padding:2px 6px;border-radius:4px}
.doc-body pre{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.65;margin:14px 0;tab-size:4}
.doc-body pre code{background:none;color:inherit;padding:0;font-size:12.8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
.doc-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
.doc-body th,.doc-body td{border:1px solid #e5e7eb;padding:7px 12px;text-align:left;vertical-align:top}
.doc-body th{background:#f8fafc;font-weight:700;white-space:nowrap}
.doc-body tr:nth-child(even) td{background:#fafbfc}
.doc-body [id^="h-"]{scroll-margin-top:72px}

/* ===== 代码高亮（One Dark 近似） ===== */
.tok-com{color:#7f8c98;font-style:italic}
.tok-str{color:#98c379}
.tok-num{color:#d19a66}
.tok-kw{color:#c678dd}
.tok-fn{color:#61afef}
.tok-var{color:#e06c75}
.tok-tag{color:#e06c75}
.tok-attr{color:#d19a66}
.tok-op{color:#56b6c2}

/* ===== 栏目分区 ===== */
.section-title{display:flex;align-items:center;gap:6px;margin:16px 6px 4px;padding:2px 6px;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:#6b7280}
.section-title .sec-ico{width:13px;height:13px;flex-shrink:0;color:#9ca3af}
.section-title:first-child{margin-top:2px}

/* ===== 代码块复制 / 语言标签 ===== */
.code-wrap{position:relative}
.code-wrap pre{margin:14px 0}
.code-copy{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#cbd5e1;
  font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2}
.code-lang{position:absolute;top:9px;right:56px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:#6b7280;opacity:0;transition:opacity .15s;z-index:2;pointer-events:none}
.code-wrap:hover .code-copy,.code-wrap:hover .code-lang{opacity:1}
.code-copy:hover{background:rgba(255,255,255,.18)}
.code-copy.done{color:#86efac;border-color:rgba(134,239,172,.4)}

/* ===== 上一篇 / 下一篇 ===== */
.panel-nav{display:flex;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid #f0f1f3}
.panel-nav button{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--border);
  background:#fff;border-radius:10px;cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.panel-nav button:hover{border-color:var(--accent);background:var(--accent-soft)}
.panel-nav .dir{font-size:11px;color:#9ca3af}
.panel-nav .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-nav .next{margin-left:auto;text-align:right;align-items:flex-end}
.panel-nav button:disabled{opacity:.35;cursor:not-allowed}

/* ===== 移动端抽屉 ===== */
.menu-btn{display:none;width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;
  font-size:16px;line-height:1;color:var(--text);flex-shrink:0}
.sidebar-mask{display:none;position:fixed;inset:var(--header-h) 0 0 0;background:rgba(15,23,42,.35);z-index:40}

@media (max-width:1100px){
  :root{--aside-w:260px}
  .content{padding:20px 22px 70px}
  .doc-panel{padding:24px 26px 38px}
}

@media (max-width:860px){
  :root{--header-h:52px}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .site-title{font-size:14px}
  .doc-count,.head-links{display:none}
  .search-box{max-width:none;margin-left:0}
  .layout{display:block}
  .sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;width:84%;max-width:330px;height:auto;max-height:none;
    transform:translateX(-102%);transition:transform .22s ease;z-index:45;border-right:1px solid var(--border);
    box-shadow:0 12px 30px rgba(15,23,42,.18);padding:10px 8px 40px}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .sidebar-mask{display:block}
  .content{padding:14px 12px 60px}
  .doc-panel{padding:18px 15px 32px;border-radius:10px}
  .doc-body h1{font-size:22px}
  .doc-body h2{font-size:18px;margin:26px 0 10px}
  .doc-body h3{font-size:15px}
  .doc-body pre{font-size:12px;padding:12px}
  /* 触屏没有 hover，复制按钮 / 语言标签常显 */
  .code-copy{opacity:1}
  .code-lang{opacity:1;right:52px}
  /* 窄屏表格：首列不换行（否则中文被挤成竖排），其余照常换行，整表横向滚动 */
  .doc-body table{font-size:12.5px}
  .doc-body td:first-child{white-space:nowrap}
  .doc-body th,.doc-body td{padding:6px 9px}
  .panel-nav{flex-direction:column}
  .panel-nav .next{margin-left:0;text-align:left;align-items:flex-start}
  .back-top{right:14px;bottom:18px;width:36px;height:36px}
}

@media (max-width:420px){
  .site-header{padding:0 10px;gap:8px}
  .search-box input{height:32px;font-size:12.5px}
}
</style>
</head>

<script>window.__DOCS_DATA__ = [{"file":"00-总览与导航.md","title":"webman-curd-admin · 总览与导航","section":"start","sectionName":"入门与指南","mtime":"2026/10/19 17:42:18","headings":[{"depth":2,"text":"1. 三条阅读路径（先选一条）","id":"h-2"},{"depth":2,"text":"2. 文档地图","id":"h-3"},{"depth":3,"text":"入门与指南（00–09）","id":"h-4"},{"depth":3,"text":"使用指南（10–19）","id":"h-5"},{"depth":3,"text":"API 参考（20–29）","id":"h-6"},{"depth":2,"text":"3. 能力一览","id":"h-7"},{"depth":2,"text":"4. 按场景索引","id":"h-8"},{"depth":2,"text":"5. 三条必须记住的约定","id":"h-9"},{"depth":2,"text":"6. 环境与兼容","id":"h-10"},{"depth":2,"text":"7. 后台界面导览","id":"h-11"},{"depth":2,"text":"8. 关于这个文档站","id":"h-12"},{"depth":2,"text":"9. 代码该写在哪（插件 vs 业务）","id":"h-13"}],"allHeadings":[{"depth":1,"text":"webman-curd-admin · 总览与导航","id":"h-1"},{"depth":2,"text":"1. 三条阅读路径（先选一条）","id":"h-2"},{"depth":2,"text":"2. 文档地图","id":"h-3"},{"depth":3,"text":"入门与指南（00–09）","id":"h-4"},{"depth":3,"text":"使用指南（10–19）","id":"h-5"},{"depth":3,"text":"API 参考（20–29）","id":"h-6"},{"depth":2,"text":"3. 能力一览","id":"h-7"},{"depth":2,"text":"4. 按场景索引","id":"h-8"},{"depth":2,"text":"5. 三条必须记住的约定","id":"h-9"},{"depth":2,"text":"6. 环境与兼容","id":"h-10"},{"depth":2,"text":"7. 后台界面导览","id":"h-11"},{"depth":2,"text":"8. 关于这个文档站","id":"h-12"},{"depth":2,"text":"9. 代码该写在哪（插件 vs 业务）","id":"h-13"}],"html":"\u003ch1 id=\"h-1\">webman-curd-admin · 总览与导航\u003c/h1>\n\u003cp>面向 webman 的\u003cstrong>中后台一体化应用插件\u003c/strong>：CURD / DSL / Schema 页面引擎 + 登录 / RBAC 底座 + 内置前端。\n宿主一条 \u003ccode>composer require\u003c/code>，插件自动落到 \u003ccode>{项目}/plugin/curd\u003c/code>，启动即用 ——\n\u003cstrong>不需要单独部署前端静态资源，也不需要写 List / Form / API 代码\u003c/strong>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>包名\u003c/td>\n\u003ctd>\u003ccode>amcolin/webman-curd-admin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件目录\u003c/td>\n\u003ctd>\u003ccode>plugin/curd\u003c/code>（宿主根；由 webman 官方插件机制 \u003ccode>support\\Plugin::install\u003c/code> 自动拷贝）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命名空间\u003c/td>\n\u003ctd>\u003ccode>plugin\\curd\\app\\*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置读取\u003c/td>\n\u003ctd>\u003ccode>config(&#39;plugin.curd.*&#39;)\u003c/code>（插件调参） + \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>（宿主管家键）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由前缀\u003c/td>\n\u003ctd>\u003ccode>/api/*\u003c/code>（后端 API）、\u003ccode>/app/curd/*\u003c/code>（内置前端 SPA）、\u003ccode>/app/curd-installer\u003c/code>（安装向导）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库\u003c/td>\n\u003ctd>GitHub \u003ccode>a1586256143/webman-curd-admin\u003c/code>；Gitee 镜像 \u003ccode>colingit/webman-curd-admin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-2\">1. 三条阅读路径（先选一条）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你的处境\u003c/th>\n\u003cth>从这读\u003c/th>\n\u003cth>然后\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>还没装\u003c/strong>（空项目 / 新服务器）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南\u003c/a> —— 环境自检 → 建骨架 → require → 建表 → 接线 → 验收\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始\u003c/a> 写第一个业务页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>装好了，要做页面\u003c/strong>\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始\u003c/a> → \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面\u003c/a>\u003c/td>\n\u003ctd>需要仪表盘看 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>在写代码，查某个方法\u003c/strong>\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\">API · Grid\u003c/a> → \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">Column\u003c/a> / \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">Form·Field\u003c/a> / \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\">Filter·Action\u003c/a>\u003c/td>\n\u003ctd>报错查 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">FAQ\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>「使用型」与「参考型」文档的分工：\n\u003cstrong>使用型\u003c/strong>（10 / 11）按任务讲「怎么拼成一个页面」，带完整可运行代码；\n\u003cstrong>参考型\u003c/strong>（20–23）按类讲「有哪些方法、参数是什么」，用来查漏补缺。\n同一能力两边都出现时，以参考型为准（它跟源码逐行对齐）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-3\">2. 文档地图\u003c/h2>\n\u003ch3 id=\"h-4\">入门与指南（00–09）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文档\u003c/th>\n\u003cth>一句话\u003c/th>\n\u003cth>什么时候读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"0\">00 总览与导航\u003c/a>\u003c/td>\n\u003ctd>本页：定位、阅读路径、文档地图\u003c/td>\n\u003ctd>第一次进来\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">01 安装指南\u003c/a>\u003c/td>\n\u003ctd>空项目 → 后台能登录，含环境自检与 20+ 条安装期坑\u003c/td>\n\u003ctd>装之前 / 装挂了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">02 快速开始\u003c/a>\u003c/td>\n\u003ctd>建表之后：写第一个 CURD、\u003ccode>make:curd\u003c/code>、业务 SQL、migration\u003c/td>\n\u003ctd>刚装完\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">03 配置参考\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>config/curd-admin.php\u003c/code> 每个键的作用与默认值\u003c/td>\n\u003ctd>改配置 / 改完没反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-5\">使用指南（10–19）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文档\u003c/th>\n\u003cth>一句话\u003c/th>\n\u003cth>什么时候读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">10 DSL · Schema 页面\u003c/a>\u003c/td>\n\u003ctd>数组 DSL 拼仪表盘 / 详情页：布局块、统计卡、图表、数据绑定、自定义 \u003ccode>.vue\u003c/code>\u003c/td>\n\u003ctd>要做展示型页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">11 DSL · CURD 页面\u003c/a>\u003c/td>\n\u003ctd>一个模型 + 一个控制器 = 列表/搜索/新增/编辑/删除/导出；含 \u003ccode>__()\u003c/code> 国际化与自定义 JS\u003c/td>\n\u003ctd>要给一张表做增删改查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">12 菜单与权限\u003c/a>\u003c/td>\n\u003ctd>菜单树、角色授权、「一键生成权限」、改默认落地页\u003c/td>\n\u003ctd>页面看不见 / 点不开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">13 认证与登录\u003c/a>\u003c/td>\n\u003ctd>换登录表、接管登录接口、叠加账号状态判定\u003c/td>\n\u003ctd>要接自己的用户体系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">14 接口加密与异常兜底\u003c/a>\u003c/td>\n\u003ctd>RSA + AES 信封开关；线上 \u003ccode>/api\u003c/code> 异常统一 500 + 编号\u003c/td>\n\u003ctd>上线前\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">15 升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003ctd>覆盖同步边界、supervisor + Nginx、打 zip 发版、文档站构建\u003c/td>\n\u003ctd>上线 / 升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">16 排错速查与 FAQ\u003c/a>\u003c/td>\n\u003ctd>按现象查原因：安装、启动、菜单、页面、登录、加密、日志、升级\u003c/td>\n\u003ctd>出问题时\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-6\">API 参考（20–29）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文档\u003c/th>\n\u003cth>覆盖\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\">20 API · Grid\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>Grid\u003c/code> 全部方法：构造、列、搜索、表单、tabs / steps、详情、操作、汇总、样式开关、\u003ccode>customJs\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">21 API · Column\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>Column\u003c/code> 全部方法：布局、映射、HTML、时间、图片、链接、\u003ccode>remote\u003c/code>、行内编辑、兜底\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">22 API · Form / Field\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>Form\u003c/code> 布局 + 15 种字段类型 + \u003ccode>Field\u003c/code> 通用方法：点式字段、\u003ccode>help\u003c/code>、\u003ccode>quickOptions\u003c/code>、\u003ccode>link\u003c/code>、级联、场景控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\">23 API · Filter / Action\u003c/a>\u003c/td>\n\u003ctd>\u003ccode>Filter\u003c/code> 全部搜索方法；\u003ccode>Action\u003c/code> 行级 / 批量 / 全局 / 弹窗 / \u003ccode>jump\u003c/code> / \u003ccode>api\u003c/code> / 权限角色 / Excel 导入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-7\">3. 能力一览\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力\u003c/th>\n\u003cth>你能得到什么\u003c/th>\n\u003cth>详解\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>开箱后台\u003c/strong>\u003c/td>\n\u003ctd>登录页 + 用户 / 角色 / 菜单管理 + 个人中心，\u003ccode>/app/curd/\u003c/code> 打开就能用（前端产物已内置在包里）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CURD 页面\u003c/strong>\u003c/td>\n\u003ctd>一个模型 + 一个控制器 = 列表 / 搜索 / 新增 / 编辑 / 删除 / 导出；\u003ccode>grid()\u003c/code> 链式模板，另含场景字段控制、Excel 导入、行级 / 批量 / 弹窗按钮\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>单元格交互\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>-&gt;modal()\u003c/code> 点击弹窗、\u003ccode>-&gt;expand()\u003c/code> 整行展开（点行任意位置、内容通栏），内容用 \u003ccode>Table\u003c/code> / \u003ccode>Card\u003c/code> / \u003ccode>Html\u003c/code> 组件或闭包在服务端逐行生成；点式列 \u003ccode>user.name\u003c/code> 自动走关联预加载\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\" data-doc-anchor=\"h-217\">Column §9\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Schema 页面\u003c/strong>\u003c/td>\n\u003ctd>用数组 DSL 拼仪表盘 / 详情页：布局块、容器块、统计卡、折线图、数据绑定、自定义 \u003ccode>.vue\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>配置生成器\u003c/strong>\u003c/td>\n\u003ctd>后台「配置生成器」工具页：选表 → 配字段 → 填页面路径 → 保存，不写代码就能出一个 CURD 页。\u003cstrong>生产默认关闭\u003c/strong>（跟随 \u003ccode>APP_DEBUG\u003c/code>，可显式 \u003ccode>generator_enabled\u003c/code>）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始 §4\u003c/a> / \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考 §4.5\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>脚手架 \u003ccode>make:curd\u003c/code>\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>php webman make:curd -t 表名\u003c/code> 按表结构一键生成控制器（+模型）：grid 列 / 搜索 / 表单自动出，标题统一 \u003ccode>__()\u003c/code> 翻译，路由走 \u003ccode>config/route.php\u003c/code>（不进落库配置，改控制器即时生效）；\u003ccode>--action\u003c/code> / \u003ccode>--bat-action\u003c/code> / \u003ccode>--import-action\u003c/code> 顺带生成操作按钮与控制器方法骨架\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-60\">快速开始 §6\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>字段国际化 \u003ccode>__()\u003c/code>\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>__(&#39;Created at&#39;)\u003c/code> → 「创建时间」：symfony/translation，domain=fields，插件内置常用词库 + 宿主同名 key 覆盖\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL §9\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>自定义 JS / 公共 API\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>setCustomJs()\u003c/code> 注入本页逻辑（顶层函数即全局）；\u003ccode>help()\u003c/code> 里可写 \u003ccode>@click=&quot;fn()&quot;\u003c/code>；\u003ccode>window.curd\u003c/code> 提供表单 / 列表 / 弹窗 / 提示 / 请求等公共方法，免写重复代码\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL §10\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>菜单与权限\u003c/strong>\u003c/td>\n\u003ctd>菜单树 + 角色授权 + 「一键生成权限」/「快速创建权限」；\u003ccode>permission_enabled\u003c/code> 一键关掉整条 RBAC\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>可插拔认证\u003c/strong>\u003c/td>\n\u003ctd>换登录表 / 换校验逻辑（\u003ccode>auth_provider\u003c/code>）、接管整个登录接口（\u003ccode>login_handler\u003c/code>）、叠加业务状态判定（\u003ccode>auth_state_guard\u003c/code>）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>接口加密（可选）\u003c/strong>\u003c/td>\n\u003ctd>RSA + AES 信封：前端加密请求体、后端解密；\u003cstrong>显式开关\u003c/strong>，构建期注入\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>异常兜底\u003c/strong>\u003c/td>\n\u003ctd>线上 \u003ccode>/api\u003c/code> 未捕获异常统一 HTTP 500 + 8 位编号，完整详情落日志（一条异常一行，可 grep）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>安装 / 升级 / 部署\u003c/strong>\u003c/td>\n\u003ctd>三种引包方式、Web 安装向导（装完免手动重启）、CLI 等价流程、宿主内升级同步、supervisor + Nginx\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南\u003c/a> / \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-8\">4. 按场景索引\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你现在要干的事\u003c/th>\n\u003cth>直接看\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>空项目从零装一遍\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>装到一半报错 / 向导打不开 / 1045\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\" data-doc-anchor=\"h-43\">安装指南 §9\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>装完了，想先看到后台跑起来\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\" data-doc-anchor=\"h-42\">安装指南 §8 验收清单\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>给一张表做增删改查（搜索 / 导出 / Excel 导入 / 自定义按钮）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用数组 DSL 拼一个仪表盘或详情页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某个配置项怎么写 / 「配置改了没反应」\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查 \u003ccode>grid()-&gt;column()\u003c/code> 有没有某个方法\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">API · Column\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查表单字段类型 / \u003ccode>help\u003c/code> / 级联 / 联动计算\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"13\">API · Form / Field\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查搜索条件写法 / 操作按钮怎么配\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"14\">API · Filter / Action\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配菜单、发权限、「一键生成权限」怎么用、改默认落地页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换登录表 / 接管登录接口 / 加账号状态判定（禁停、合同到期…）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>打开接口加密，或让线上异常统一报「服务内部错误（编号）」\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>升级插件、部署到服务器、打 zip 发版\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报错了 / 现象对不上\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">排错速查与 FAQ\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-9\">5. 三条必须记住的约定\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>配置只有一个入口\u003c/strong>：宿主根 \u003ccode>config/curd-admin.php\u003c/code>。旧的 \u003ccode>config/curd.php\u003c/code> /\n\u003ccode>config/admin.php\u003c/code> \u003cstrong>已不再读取\u003c/strong>（2026-09-19 合并），文件存在也不生效 ——\n「改了配置没反应」第一件事就是确认改对了文件。\u003c/li>\n\u003cli>\u003cstrong>webman 是常驻内存\u003c/strong>：改 PHP 代码或配置后必须 \u003ccode>restart\u003c/code>（或 \u003ccode>SIGUSR1\u003c/code> 平滑 reload），\n热改文件不生效（前端产物同理，改完要重新构建再部署）。\u003c/li>\n\u003cli>\u003cstrong>单库架构\u003c/strong>：\u003ccode>mysql\u003c/code>（认证）与 \u003ccode>mysql_business\u003c/code>（业务）两个连接\u003cstrong>指向同一个库\u003c/strong>，\n业务想分库才需要动 \u003ccode>config/database.php\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2 id=\"h-10\">6. 环境与兼容\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PHP\u003c/td>\n\u003ctd>≥ 8.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>框架\u003c/td>\n\u003ctd>webman（\u003ccode>workerman/webman-framework\u003c/code> ^2.1，官方骨架即可）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库\u003c/td>\n\u003ctd>MySQL 5.7+ / 8.0+ —— \u003cstrong>单库架构\u003c/strong>：认证表与业务表放同一个库，无分库配置项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依赖\u003c/td>\n\u003ctd>\u003ccode>composer require\u003c/code> 自动拉齐 \u003ccode>webman/database\u003c/code> \u003ccode>webman/redis\u003c/code> \u003ccode>casbin/casbin\u003c/code> \u003ccode>vlucas/phpdotenv\u003c/code> \u003ccode>webman/captcha\u003c/code>，无需手动装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PHP 扩展\u003c/td>\n\u003ctd>\u003ccode>pdo_mysql\u003c/code> \u003ccode>mbstring\u003c/code> \u003ccode>openssl\u003c/code>；登录图形验证码另需 \u003ccode>ext-gd\u003c/code>（不需要可在配置里 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>宿主 \u003ccode>composer.json\u003c/code> 需带 webman 官方插件三件套（官方骨架自带，缺失则补）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">&quot;scripts&quot;: {\n  &quot;post-package-install&quot;:  [&quot;support\\\\Plugin::install&quot;],\n  &quot;post-package-update&quot;:   [&quot;support\\\\Plugin::install&quot;],\n  &quot;pre-package-uninstall&quot;: [&quot;support\\\\Plugin::uninstall&quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>并确认存在 \u003ccode>support/Plugin.php\u003c/code>（官方骨架文件）。缺了会导致「require 成功但 \u003ccode>plugin/curd\u003c/code>\n不出现」，详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南 §2.1\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-11\">7. 后台界面导览\u003c/h2>\n\u003cp>内置前端（Vue3 + Element Plus）已随包分发，由 \u003ccode>PageController\u003c/code> 承载，无需另行部署：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>地址\u003c/th>\n\u003cth>页面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/app/curd-installer\u003c/code>\u003c/td>\n\u003ctd>安装向导（装完后自动失效）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/app/curd/\u003c/code>\u003c/td>\n\u003ctd>登录页（图形验证码 + 记住账号）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/app/curd/dashboard\u003c/code>\u003c/td>\n\u003ctd>内置首页（默认落地页，可改）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/app/curd/curd-generator\u003c/code>\u003c/td>\n\u003ctd>「配置生成器」工具页（DSL 造 CURD / Schema 页面；本页自身不需要 DSL 配置）。\u003cstrong>生产关闭时菜单不出现、直连被拦回首页\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后左侧菜单\u003c/td>\n\u003ctd>用户管理 / 角色管理 / 菜单管理 / 自定义页面 / （示例）测试管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>登录后可顺手验证的接口：\u003c/p>\n\u003cpre>\u003ccode>/api/curd/models      → 模型清单（已扫描到宿主模型）\n/api/curd/tables      → 表清单\n/api/menu             → 当前用户可见菜单\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-12\">8. 关于这个文档站\u003c/h2>\n\u003cul>\n\u003cli>文档源就是 \u003ccode>docs/\u003c/code> 下的 \u003ccode>*.md\u003c/code>，\u003cstrong>文件名编号决定顺序\u003c/strong>，分区按编号段：\n\u003ccode>00–09\u003c/code> 入门与指南、\u003ccode>10–19\u003c/code> 使用指南、\u003ccode>20–29\u003c/code> API 参考；\u003c/li>\n\u003cli>每篇第一个 \u003ccode>H1\u003c/code> 是文档标题，\u003ccode>H2/H3\u003c/code> 自动生成左侧嵌套目录；\u003c/li>\n\u003cli>文档之间互相引用请写标准 Markdown 链接 \u003ccode>[标题](NN-主题.md#锚点)\u003c/code>：\n在 GitHub 上是可点的文件链接，在文档站里会被接管为\u003cstrong>页内切换 + 定位到对应小节\u003c/strong>；\u003c/li>\n\u003cli>重新构建、三种分发方式（本地双击 / 随发布包 / 在线站点）见\n\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布 §7\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-13\">9. 代码该写在哪（插件 vs 业务）\u003c/h2>\n\u003cp>插件只提供\u003cstrong>通用引擎\u003c/strong>，业务项目在 \u003ccode>app\u003c/code> 层消费它，两边严格分工 ——\n这也是「升级不会冲掉你的代码」的前提（覆盖同步只动 \u003ccode>plugin/curd/\u003c/code>）。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>DSL\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>形态\u003c/th>\n\u003cth>引擎位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Schema 页面 DSL\u003c/strong>\u003c/td>\n\u003ctd>展示型页面（首页 / 看板）：组件套组件 + 24 栏栅格 + 数据注入\u003c/td>\n\u003ctd>\u003ccode>PageSchema + blocks\u003c/code> 编译成 JSON 组件树\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/schema/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CURD DSL\u003c/strong>\u003c/td>\n\u003ctd>列表管理页：表格 / 搜索 / 表单 / 自定义操作 / 导出 / 汇总条\u003c/td>\n\u003ctd>\u003ccode>Grid / Form / Filter / Column / Action\u003c/code> 流式声明\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/dsl/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>归属\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Schema 引擎（\u003ccode>SchemaNode\u003c/code> / \u003ccode>PageSchema\u003c/code> / \u003ccode>PageRegistry\u003c/code> / \u003ccode>blocks/*\u003c/code>）\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>与业务无关，随包升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>CustomPageController\u003c/code>（\u003ccode>.vue\u003c/code> + Schema 两种分发）\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>路由在插件 \u003ccode>plugin/curd/config/route.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面内容接口 \u003ccode>GET /api/custom/pages\u003c/code>、\u003ccode>GET /api/custom/page\u003c/code>\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>随插件自动加载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>业务 Schema 页面类\u003c/strong>（如首页 \u003ccode>HomePage\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/admin/api/\u003c/code>\u003c/td>\n\u003ctd>自己 \u003ccode>use\u003c/code> 插件 DSL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>数据接口\u003c/strong>（\u003ccode>dataApi\u003c/code> 指向的统计）\u003c/td>\n\u003ctd>业务\u003c/td>\n\u003ctd>查业务表，属业务逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>注册\u003c/strong> \u003ccode>PageRegistry::register\u003c/code>\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>对插件扩展点的声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 自定义页面文件\u003c/td>\n\u003ctd>业务 \u003ccode>app/custom/pages/*.vue\u003c/code>\u003c/td>\n\u003ctd>插件只负责读取分发，不存放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 业务控制器（Model + \u003ccode>grid()\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/api/\u003c/code>、\u003ccode>app/controller/admin/api/\u003c/code>\u003c/td>\n\u003ctd>继承 \u003ccode>BaseCurdController\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 路由注册 \u003ccode>RouteControllerRegistry::registerMany\u003c/code>\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>菜单 / 权限数据\u003c/td>\n\u003ctd>数据库 \u003ccode>menus\u003c/code> / \u003ccode>casbin_rule\u003c/code>\u003c/td>\n\u003ctd>在后台「菜单管理」维护\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>页面访问入口约定\u003c/strong>（菜单的 \u003ccode>path\u003c/code> 就填它）：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>CURD 页\u003c/strong>：\u003ccode>/mobile-recharge-orders\u003c/code> 这类，即 \u003ccode>registerMany\u003c/code> 的 key；\u003c/li>\n\u003cli>\u003cstrong>Schema / \u003ccode>.vue\u003c/code> 自定义页\u003c/strong>：\u003ccode>/custom-page/&lt;页面名&gt;\u003c/code>（前端 catch-all 路由命中）。\u003c/li>\n\u003c/ul>\n"},{"file":"01-安装指南.md","title":"安装指南（空项目 → 后台能登录）","section":"start","sectionName":"入门与指南","mtime":"2026/10/19 15:28:11","headings":[{"depth":2,"text":"0. 全流程地图","id":"h-15"},{"depth":2,"text":"1. 环境自检","id":"h-16"},{"depth":3,"text":"1.1 要求","id":"h-17"},{"depth":3,"text":"1.2 一条命令自检","id":"h-18"},{"depth":3,"text":"1.3 缺什么怎么补","id":"h-19"},{"depth":2,"text":"2. 建 webman 空项目","id":"h-20"},{"depth":3,"text":"2.1 确认骨架自带「插件安装三件套」","id":"h-21"},{"depth":3,"text":"2.2 先跑一次空骨架","id":"h-22"},{"depth":2,"text":"3. 引入插件（三选一）","id":"h-23"},{"depth":3,"text":"3.1 方式 A：本地 path（开发期联调，改包源码即时生效）","id":"h-24"},{"depth":3,"text":"3.2 方式 B：Git VCS（推荐上线，走 tag 版本）","id":"h-25"},{"depth":3,"text":"3.3 方式 C：私有 Satis / Packagist（团队统一源）","id":"h-26"},{"depth":3,"text":"3.4 关于 --no-audit","id":"h-27"},{"depth":3,"text":"3.5 安装器自动做了什么","id":"h-28"},{"depth":3,"text":"3.6 验收：装好了吗","id":"h-29"},{"depth":2,"text":"4. 配数据库","id":"h-30"},{"depth":3,"text":"4.1 做法一：什么都不填，交给安装向导（推荐）","id":"h-31"},{"depth":3,"text":"4.2 做法二：自己写 .env","id":"h-32"},{"depth":3,"text":"4.3 顺手确认验证码开关","id":"h-33"},{"depth":2,"text":"5. 初始化数据库（建表 + 种子 + 密钥）","id":"h-34"},{"depth":3,"text":"5.1 Web 安装向导（推荐，新项目首选）","id":"h-35"},{"depth":3,"text":"5.2 CLI 等价流程（不便开浏览器 / 自动化部署）","id":"h-36"},{"depth":3,"text":"5.3 这一步到底建了什么","id":"h-37"},{"depth":2,"text":"6. 宿主接线（两处，必做）","id":"h-38"},{"depth":3,"text":"6.1 全局中间件：config/middleware.php","id":"h-39"},{"depth":3,"text":"6.2 异常处理器：config/exception.php","id":"h-40"},{"depth":2,"text":"7. 启动","id":"h-41"},{"depth":2,"text":"8. 验收清单","id":"h-42"},{"depth":2,"text":"9. 可能遇到的问题","id":"h-43"},{"depth":3,"text":"9.1 安装期（composer）","id":"h-44"},{"depth":3,"text":"9.2 初始化期（建表 / 连接）","id":"h-45"},{"depth":3,"text":"9.3 运行期（页面 / 接口）","id":"h-46"},{"depth":2,"text":"10. 卸载与重装","id":"h-47"},{"depth":2,"text":"11. 下一步","id":"h-48"}],"allHeadings":[{"depth":1,"text":"安装指南（空项目 → 后台能登录）","id":"h-14"},{"depth":2,"text":"0. 全流程地图","id":"h-15"},{"depth":2,"text":"1. 环境自检","id":"h-16"},{"depth":3,"text":"1.1 要求","id":"h-17"},{"depth":3,"text":"1.2 一条命令自检","id":"h-18"},{"depth":3,"text":"1.3 缺什么怎么补","id":"h-19"},{"depth":2,"text":"2. 建 webman 空项目","id":"h-20"},{"depth":3,"text":"2.1 确认骨架自带「插件安装三件套」","id":"h-21"},{"depth":3,"text":"2.2 先跑一次空骨架","id":"h-22"},{"depth":2,"text":"3. 引入插件（三选一）","id":"h-23"},{"depth":3,"text":"3.1 方式 A：本地 path（开发期联调，改包源码即时生效）","id":"h-24"},{"depth":3,"text":"3.2 方式 B：Git VCS（推荐上线，走 tag 版本）","id":"h-25"},{"depth":3,"text":"3.3 方式 C：私有 Satis / Packagist（团队统一源）","id":"h-26"},{"depth":3,"text":"3.4 关于 --no-audit","id":"h-27"},{"depth":3,"text":"3.5 安装器自动做了什么","id":"h-28"},{"depth":3,"text":"3.6 验收：装好了吗","id":"h-29"},{"depth":2,"text":"4. 配数据库","id":"h-30"},{"depth":3,"text":"4.1 做法一：什么都不填，交给安装向导（推荐）","id":"h-31"},{"depth":3,"text":"4.2 做法二：自己写 .env","id":"h-32"},{"depth":3,"text":"4.3 顺手确认验证码开关","id":"h-33"},{"depth":2,"text":"5. 初始化数据库（建表 + 种子 + 密钥）","id":"h-34"},{"depth":3,"text":"5.1 Web 安装向导（推荐，新项目首选）","id":"h-35"},{"depth":3,"text":"5.2 CLI 等价流程（不便开浏览器 / 自动化部署）","id":"h-36"},{"depth":3,"text":"5.3 这一步到底建了什么","id":"h-37"},{"depth":2,"text":"6. 宿主接线（两处，必做）","id":"h-38"},{"depth":3,"text":"6.1 全局中间件：config/middleware.php","id":"h-39"},{"depth":3,"text":"6.2 异常处理器：config/exception.php","id":"h-40"},{"depth":2,"text":"7. 启动","id":"h-41"},{"depth":2,"text":"8. 验收清单","id":"h-42"},{"depth":2,"text":"9. 可能遇到的问题","id":"h-43"},{"depth":3,"text":"9.1 安装期（composer）","id":"h-44"},{"depth":3,"text":"9.2 初始化期（建表 / 连接）","id":"h-45"},{"depth":3,"text":"9.3 运行期（页面 / 接口）","id":"h-46"},{"depth":2,"text":"10. 卸载与重装","id":"h-47"},{"depth":2,"text":"11. 下一步","id":"h-48"}],"html":"\u003ch1 id=\"h-14\">安装指南（空项目 → 后台能登录）\u003c/h1>\n\u003cp>从\u003cstrong>一个空目录\u003c/strong>开始，把 webman 骨架 + 本插件装到「浏览器能打开登录页、能增删改查」为止。\n每一步都给了\u003cstrong>验收点\u003c/strong>（做完应该看到什么）和\u003cstrong>失败怎么办\u003c/strong>（对应常见问题编号，详见\n\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">排错速查与 FAQ\u003c/a>）。\u003c/p>\n\u003cblockquote>\n\u003cp>已经有能跑的 webman 项目？跳过 \u003ca href=\"#1-%E7%8E%AF%E5%A2%83%E8%87%AA%E6%A3%80\">§1\u003c/a> \u003ca href=\"#2-%E5%BB%BA-webman-%E7%A9%BA%E9%A1%B9%E7%9B%AE\">§2\u003c/a>，\n从 \u003ca href=\"#3-%E5%BC%95%E5%85%A5%E6%8F%92%E4%BB%B6%E4%B8%89%E9%80%89%E4%B8%80\">§3 引入插件\u003c/a> 开始，做完 §8 即可。\n只想看「装完之后怎么写业务页面」→ 直接读 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-15\">0. 全流程地图\u003c/h2>\n\u003cpre>\u003ccode>① 环境自检  →  ② 建 webman 骨架  →  ③ composer require 插件\n      ↓                                     ↓\n   缺什么补什么                     自动生成 plugin/curd + config/curd-admin.php\n                                            ↓\n④ 配数据库(.env) → ⑤ 初始化建表(向导/CLI) → ⑥ 宿主注册中间件+异常处理器\n                                            ↓\n                            ⑦ 启动 → ⑧ 验收（登录页 / 接口）\n                                            ↓\n                            ⑨ 写第一个业务 CURD（见 快速开始）\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>步骤\u003c/th>\n\u003cth>大概耗时\u003c/th>\n\u003cth>会改哪些文件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>① 环境自检\u003c/td>\n\u003ctd>2 分钟\u003c/td>\n\u003ctd>无\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>② 建骨架\u003c/td>\n\u003ctd>2 分钟\u003c/td>\n\u003ctd>新建项目目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>③ 引入插件\u003c/td>\n\u003ctd>2 分钟\u003c/td>\n\u003ctd>\u003ccode>composer.json\u003c/code>、\u003ccode>plugin/curd/\u003c/code>、\u003ccode>config/curd-admin.php\u003c/code>、\u003ccode>app/\u003c/code>（示例）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>④ 配数据库\u003c/td>\n\u003ctd>1 分钟\u003c/td>\n\u003ctd>\u003ccode>.env\u003c/code>（或 \u003ccode>config/database.php\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⑤ 初始化\u003c/td>\n\u003ctd>1 分钟\u003c/td>\n\u003ctd>数据库 8 张表 + \u003ccode>config/keys/*.pem\u003c/code> + \u003ccode>runtime/curd-installed.lock\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⑥ 宿主接线\u003c/td>\n\u003ctd>3 分钟\u003c/td>\n\u003ctd>\u003ccode>config/middleware.php\u003c/code>、\u003ccode>config/exception.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⑦⑧ 启动验收\u003c/td>\n\u003ctd>1 分钟\u003c/td>\n\u003ctd>无\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-16\">1. 环境自检\u003c/h2>\n\u003ch3 id=\"h-17\">1.1 要求\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>最低要求\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PHP\u003c/td>\n\u003ctd>\u003cstrong>8.1+\u003c/strong>\u003c/td>\n\u003ctd>插件用了 \u003ccode>enum\u003c/code>、\u003ccode>readonly\u003c/code>、\u003ccode>never\u003c/code> 等语法，8.0 及以下直接语法报错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩展\u003c/td>\n\u003ctd>\u003ccode>pdo_mysql\u003c/code> \u003ccode>mbstring\u003c/code> \u003ccode>gd\u003c/code> \u003ccode>openssl\u003c/code> \u003ccode>json\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>gd\u003c/code> 只给登录图形验证码用，装不了可关（见 §4.3）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MySQL\u003c/td>\n\u003ctd>5.7+ / 8.0+\u003c/td>\n\u003ctd>单库架构：认证表与业务表放\u003cstrong>同一个库\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Composer\u003c/td>\n\u003ctd>2.x\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>进程管理\u003c/td>\n\u003ctd>无需额外组件\u003c/td>\n\u003ctd>webman 自带 workerman，CLI 启动即可\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-18\">1.2 一条命令自检\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php -v &amp;&amp; php -m | grep -Ei &#39;pdo_mysql|mbstring|gd|openssl|posix&#39; &amp;&amp; composer -V &amp;&amp; mysql --version\n\u003c/code>\u003c/pre>\n\u003cp>期望看到 \u003ccode>PHP 8.1.x\u003c/code> 或更高，以及 \u003ccode>pdo_mysql\u003c/code> / \u003ccode>mbstring\u003c/code> / \u003ccode>gd\u003c/code> / \u003ccode>openssl\u003c/code> / \u003ccode>posix\u003c/code> 五行。\n\u003ccode>posix\u003c/code> 缺失不影响启动，只影响「Web 安装向导装完自动平滑重启」（会回退成提示你手动 restart）。\u003c/p>\n\u003ch3 id=\"h-19\">1.3 缺什么怎么补\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>缺\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PHP 版本低\u003c/td>\n\u003ctd>换 8.1+。ServBay / phpStudy / brew 都能多版本共存；\u003ccode>php -v\u003c/code> 要确认\u003cstrong>命令行用的那个\u003c/strong>也是 8.1+\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pdo_mysql\u003c/code>\u003c/td>\n\u003ctd>打开 \u003ccode>php.ini\u003c/code> 的 \u003ccode>extension=pdo_mysql\u003c/code>（Windows 是 \u003ccode>extension=php_pdo_mysql.dll\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mbstring\u003c/code>\u003c/td>\n\u003ctd>同上，\u003ccode>extension=mbstring\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>gd\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>extension=gd\u003c/code>；实在装不了就在 \u003ccode>config/curd-admin.php\u003c/code> 设 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>openssl\u003c/code>\u003c/td>\n\u003ctd>一般默认开启；关闭时接口加密与 RSA 密钥生成都不可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>没有 composer\u003c/td>\n\u003ctd>\u003ccode>curl -sS https://getcomposer.org/installer | php\u003c/code> 或包管理器安装\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>命令行 PHP 与 Nginx/Apache 用的 PHP \u003cstrong>可能不是同一个\u003c/strong>。\u003ccode>php -v\u003c/code> 对、但浏览器 500，\n先确认 FPM 那侧的版本（\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-177\">FAQ §2\u003c/a>）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-20\">2. 建 webman 空项目\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">composer create-project workerman/webman webman-curd-demo\ncd webman-curd-demo\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-21\">2.1 确认骨架自带「插件安装三件套」\u003c/h3>\n\u003cp>webman 官方骨架的 \u003ccode>composer.json\u003c/code> 里应包含这三行 —— 插件的自动拷贝全靠它们：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">&quot;scripts&quot;: {\n  &quot;post-package-install&quot;:  [&quot;support\\\\Plugin::install&quot;],\n  &quot;post-package-update&quot;:   [&quot;support\\\\Plugin::install&quot;],\n  &quot;pre-package-uninstall&quot;: [&quot;support\\\\Plugin::uninstall&quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>并确认 \u003ccode>support/Plugin.php\u003c/code> 存在：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">ls support/Plugin.php &amp;&amp; grep -n &#39;post-package-install&#39; composer.json\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>缺了会怎样\u003c/strong>：\u003ccode>composer require\u003c/code> 成功，但 \u003ccode>plugin/curd/\u003c/code> 目录不会被创建，\n后台 404。补上这两处后再 \u003ccode>composer dump-autoload &amp;&amp; composer update amcolin/webman-curd-admin\u003c/code>。\n见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-176\">FAQ §1\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-22\">2.2 先跑一次空骨架\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php start.php start\n# 浏览器打开 http://127.0.0.1:8787 → 看到 webman 欢迎页即骨架 OK\n\u003c/code>\u003c/pre>\n\u003cp>端口在 \u003ccode>config/process.php\u003c/code> 的 \u003ccode>&#39;listen&#39; =&gt; &#39;http://0.0.0.0:8787&#39;\u003c/code>。\n\u003cstrong>先确认空骨架能跑，再装插件\u003c/strong> —— 出问题时才能区分是骨架问题还是插件问题。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-23\">3. 引入插件（三选一）\u003c/h2>\n\u003ch3 id=\"h-24\">3.1 方式 A：本地 path（开发期联调，改包源码即时生效）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">composer config repositories.curd path &quot;../webman-curd-admin&quot;\ncomposer require amcolin/webman-curd-admin:@dev\n\u003c/code>\u003c/pre>\n\u003cp>包在本机其它位置就把 \u003ccode>../webman-curd-admin\u003c/code> 换成实际路径。改包内源码不用重新 require。\u003c/p>\n\u003ch3 id=\"h-25\">3.2 方式 B：Git VCS（推荐上线，走 tag 版本）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># GitHub\ncomposer config repositories.curd vcs &quot;git@github.com:a1586256143/webman-curd-admin.git&quot;\n# 国内更快可走 Gitee 镜像：\n# composer config repositories.curd vcs &quot;https://gitee.com/colingit/webman-curd-admin.git&quot;\n\ncomposer require amcolin/webman-curd-admin:^1.0 --no-audit\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-26\">3.3 方式 C：私有 Satis / Packagist（团队统一源）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">composer config repositories.curd-satis composer &quot;https://satis.your-company.com&quot;\ncomposer require amcolin/webman-curd-admin\n\u003c/code>\u003c/pre>\n\u003cp>仓库内附 \u003ccode>satis.json\u003c/code> 模板，改掉 \u003ccode>homepage\u003c/code> / Gitee URL 后在 Satis 服务器\n\u003ccode>satis build satis.json web/\u003c/code> 即可。\u003c/p>\n\u003ch3 id=\"h-27\">3.4 关于 \u003ccode>--no-audit\u003c/code>\u003c/h3>\n\u003cp>\u003ccode>composer audit\u003c/code> 红字（\u003ccode>Failed to audit installed packages.\u003c/code>）是\u003cstrong>已知尾部告警\u003c/strong>：\n它硬编码访问 \u003ccode>packagist.org\u003c/code>，不走国内镜像，国内常不可达；命令本身 \u003ccode>exit 0\u003c/code>，\n\u003cstrong>不影响安装\u003c/strong>。不想每次手打：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">./scripts/composer.sh require amcolin/webman-curd-admin:^1.0        # 一次性\necho &quot;alias composer=&#39;$(pwd)/scripts/composer.sh&#39;&quot; &gt;&gt; ~/.zshrc      # 永久（wrapper 只对会触发 audit 的子命令追加 --no-audit）\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-28\">3.5 安装器自动做了什么\u003c/h3>\n\u003cp>\u003ccode>src/Install.php\u003c/code>（由 \u003ccode>support\\Plugin::install\u003c/code> 调用）会：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>落点\u003c/th>\n\u003cth>已存在时\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>拷贝插件\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>整目录覆盖重拷\u003c/strong>（清掉包内已删除的陈旧文件），仅保留 \u003ccode>config/keys/*.pem\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>落位示例\u003c/td>\n\u003ctd>\u003ccode>app/controller/admin/api/MyTestController.php\u003c/code>、\u003ccode>app/model/MyTest.php\u003c/code>\u003c/td>\n\u003ctd>不覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>生成配置\u003c/td>\n\u003ctd>\u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003ctd>不覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>生成翻译文件\u003c/td>\n\u003ctd>\u003ccode>resource/translations/zh_CN/fields.php\u003c/code>\u003c/td>\n\u003ctd>不覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补数据库模板\u003c/td>\n\u003ctd>\u003ccode>config/database.php\u003c/code>（缺失或是占位模板时）\u003c/td>\n\u003ctd>不覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>生成后台路由文件\u003c/td>\n\u003ctd>\u003ccode>config/admin-route.php\u003c/code>（空注册模板）\u003c/td>\n\u003ctd>不覆盖\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003ccode>config/admin-route.php\u003c/code> 用来把「后台页面路由」和「项目自身接口」分开：\n插件在路由加载阶段取出并执行它返回的 \u003ccode>register\u003c/code> 闭包，\u003ccode>config/route.php\u003c/code> 不用改。\n老项目没有这个文件也完全正常（行为不变）。\n⚠️ 文件里\u003cstrong>只能 \u003ccode>return\u003c/code> 数组\u003c/strong>，路由写在 \u003ccode>&#39;register&#39; =&gt; function () { ... }\u003c/code> 里——\n\u003ccode>config/\u003c/code> 下的 \u003ccode>.php\u003c/code> 会被 webman 当配置提前加载（早于 \u003ccode>Route\u003c/code> 初始化），\n顶层直接写 \u003ccode>Route::group()\u003c/code> 会 \u003ccode>addGroup() on null\u003c/code>。\n详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-61\">快速开始 §6.1\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-29\">3.6 验收：装好了吗\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">ls plugin/curd/config/route.php config/curd-admin.php\nphp -r &#39;echo is_file(&quot;plugin/curd/api/Install.php&quot;) ? &quot;plugin OK\\n&quot; : &quot;plugin MISSING\\n&quot;;&#39;\n\u003c/code>\u003c/pre>\n\u003cp>三条都在 → 继续。\u003ccode>plugin MISSING\u003c/code> → 见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-176\">FAQ §1\u003c/a>\n（九成是 §2.1 的三件套缺失，或 \u003ccode>extra.webman-app-plugin\u003c/code> 被改）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-30\">4. 配数据库\u003c/h2>\n\u003cp>数据库连接\u003cstrong>不在\u003c/strong> \u003ccode>config/curd-admin.php\u003c/code>，而是走 \u003ccode>.env\u003c/code> 的 \u003ccode>DB_*\u003c/code> 键\n（\u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读）。两种做法，任选一种：\u003c/p>\n\u003ch3 id=\"h-31\">4.1 做法一：什么都不填，交给安装向导（推荐）\u003c/h3>\n\u003cp>直接跳到 \u003ca href=\"#51-web-%E5%AE%89%E8%A3%85%E5%90%91%E5%AF%BC%E6%8E%A8%E8%8D%90%E6%96%B0%E9%A1%B9%E7%9B%AE%E9%A6%96%E9%80%89\">§5.1\u003c/a>，向导页面上填主机 / 库名 / 账号密码，\n提交后自动写 \u003ccode>.env\u003c/code> 并同步 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>database\u003c/code> 段。\u003c/p>\n\u003ch3 id=\"h-32\">4.2 做法二：自己写 \u003ccode>.env\u003c/code>\u003c/h3>\n\u003cp>在项目根 \u003ccode>.env\u003c/code> 追加（键清单见 \u003ccode>plugin/curd/env.example\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-ini\">DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=webman_curd\nDB_USER=root\nDB_PASSWORD=your_password\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>单库\u003c/strong>：认证表与业务表同库，只需一份 \u003ccode>DB_*\u003c/code>。\u003ccode>config/database.php\u003c/code> 里\n\u003ccode>mysql\u003c/code> 与 \u003ccode>mysql_business\u003c/code> 两个连接指向同一个库，业务想分库才需要动它。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-33\">4.3 顺手确认验证码开关\u003c/h3>\n\u003cp>装不了 \u003ccode>ext-gd\u003c/code> 的话，在 \u003ccode>config/curd-admin.php\u003c/code> 里改：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&#39;captcha_enabled&#39; =&gt; false,   // 关掉登录图形验证码\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-34\">5. 初始化数据库（建表 + 种子 + 密钥）\u003c/h2>\n\u003ch3 id=\"h-35\">5.1 Web 安装向导（推荐，新项目首选）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php start.php start\n\u003c/code>\u003c/pre>\n\u003cp>浏览器打开 \u003cstrong>\u003ccode>http://127.0.0.1:8787/app/curd-installer\u003c/code>\u003c/strong>，填两块（明文输入，便于核对）：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>数据库连接\u003c/strong>：主机 / 端口 / 库名 / 账号 / 密码 —— 库不存在会\u003cstrong>自动 CREATE\u003c/strong>；\u003c/li>\n\u003cli>\u003cstrong>管理员账号\u003c/strong>：登录名 / 密码 / 确认密码 —— 自定义初始管理员，\u003cstrong>不是固定的 admin/admin123\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003cp>提交后自动完成：\u003c/p>\n\u003col>\n\u003cli>DB 信息\u003cstrong>按键合并\u003c/strong>写入 \u003ccode>.env\u003c/code>（绝不覆盖其它键）+ 同步写 \u003ccode>config/curd-admin.php\u003c/code> 的\n\u003ccode>database\u003c/code> 段（修掉「worker 启动后 \u003ccode>.env\u003c/code> 改不动」导致的 1045）；\u003c/li>\n\u003cli>子进程执行 \u003ccode>php plugin/curd/install.php\u003c/code>：建库 → 建表 → 种子 → RSA 密钥 → 页面实时进度；\u003c/li>\n\u003cli>\u003cstrong>免手动重启\u003c/strong>：成功后向 master 进程发 \u003ccode>SIGUSR1\u003c/code>（workerman 平滑 reload），\nworker 处理完当前请求即重启并重读 \u003ccode>.env\u003c/code>（约 2 秒后进登录页）。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>信号不可用\u003c/strong>（Windows / 无 \u003ccode>posix\u003c/code> 扩展 / supervisor 托管）时，页面会提示你手动\n\u003ccode>php start.php restart\u003c/code> —— worker 配置在启动期固化，不重启会报 \u003ccode>1045 Access denied\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>验收\u003c/strong>：浏览器跳到 \u003ccode>/app/curd/\u003c/code> 登录页，用刚设的账号能登录。\n安装标记文件 \u003ccode>runtime/curd-installed.lock\u003c/code> 生成后，向导自动失效。\u003c/p>\n\u003ch3 id=\"h-36\">5.2 CLI 等价流程（不便开浏览器 / 自动化部署）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 前提：.env 的 DB_* 已配好（见 §4.2）\nphp plugin/curd/install.php --admin-user=admin --admin-pass=&#39;你的密码&#39;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>--admin-user=admin\u003c/code> / \u003ccode>--admin-pass=xxx\u003c/code>\u003c/td>\n\u003ctd>初始管理员凭据（仅 \u003ccode>admin_users\u003c/code> 空表时生效）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--business-sql=path/a.sql\u003c/code>\u003c/td>\n\u003ctd>项目自带业务建表 SQL（相对宿主根；可重复或逗号分隔）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--business-connection=mysql_business\u003c/code>\u003c/td>\n\u003ctd>覆盖业务 SQL 使用的连接名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--progress-file=runtime/x.log\u003c/code>\u003c/td>\n\u003ctd>进度 JSONL 输出（Web 向导内部用）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-37\">5.3 这一步到底建了什么\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>8 张管理面表\u003c/strong>：\u003ccode>admin_users\u003c/code> \u003ccode>admin_tokens\u003c/code> \u003ccode>roles\u003c/code> \u003ccode>admin_role_user\u003c/code>\n\u003ccode>role_permission\u003c/code> \u003ccode>casbin_rule\u003c/code> \u003ccode>curd_configs\u003c/code> \u003ccode>menus\u003c/code>，外加示例表 \u003ccode>my_test\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>种子\u003c/strong>（仅空表时插）：超级管理员角色、6 条基础菜单、初始 admin 账号、\n\u003ccode>/my-test\u003c/code> 示例页面配置 +「测试管理」菜单 + 示例数据；\u003c/li>\n\u003cli>\u003cstrong>RSA 密钥\u003c/strong>：\u003ccode>config/keys/api_rsa_priv.pem\u003c/code> / \u003ccode>api_rsa_pub.pem\u003c/code>\n—— \u003cstrong>生产环境务必单独备份此目录\u003c/strong>，换机器重装会重新生成，旧密钥加密的历史数据解不开。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>全程幂等：表用 \u003ccode>CREATE TABLE IF NOT EXISTS\u003c/code>，种子按「表空才插」判定，\n重复执行全部 SKIP。\u003cstrong>重装\u003c/strong> = 删 \u003ccode>runtime/curd-installed.lock\u003c/code> + 清库 + 刷新向导页。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-38\">6. 宿主接线（两处，必做）\u003c/h2>\n\u003cp>插件自己的路由开箱生效，但\u003cstrong>加解密中间件\u003c/strong>与\u003cstrong>宿主 \u003ccode>/api\u003c/code> 的异常兜底\u003c/strong>必须宿主登记。\u003c/p>\n\u003ch3 id=\"h-39\">6.1 全局中间件：\u003ccode>config/middleware.php\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">return [\n    &#39;@&#39; =&gt; [\n        \\app\\middleware\\StaticFile::class,\n        // 接口加解密（RSA + AES 信封）；即使当前关闭加密也要保留，否则前端加密请求无人解\n        \\plugin\\curd\\app\\middleware\\ApiCrypto::class,\n    ],\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>必须是 \u003ccode>&#39;@&#39;\u003c/code>（跨所有 app 与 plugin 生效）。写成 \u003ccode>&#39;&#39;\u003c/code> 只作用于默认 app，\n插件的 \u003ccode>/api/*\u003c/code> 会绕过 → 加密开启时全部请求解密失败。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-40\">6.2 异常处理器：\u003ccode>config/exception.php\u003c/code>\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>插件路由已开箱生效\u003c/strong>：插件自带 \u003ccode>plugin/curd/config/exception.php\u003c/code>，覆盖\n\u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>宿主自己的 \u003ccode>/api\u003c/code> 控制器\u003c/strong>要覆盖到，才需要把宿主 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指过来：\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-php\">return [\n    &#39;&#39; =&gt; \\plugin\\curd\\app\\exception\\CurdExceptionHandler::class,\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ 只写 \u003ccode>&#39;@&#39;\u003c/code> 键\u003cstrong>无效\u003c/strong> —— 框架规则是「本 app 配置里已有 \u003ccode>&#39;&#39;\u003c/code> 键 ⇒ 忽略 \u003ccode>&#39;@&#39;\u003c/code>」，\n而 webman 骨架默认就自带 \u003ccode>&#39;&#39; =&gt; support\\exception\\Handler::class\u003c/code>。\u003c/p>\n\u003cp>⚠️ 别想用中间件做这件事：webman 中间件链在每层内层都先 try/catch 转 Response，\n外层中间件\u003cstrong>永远捕获不到\u003c/strong>控制器异常（实测踩过）。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>APP_DEBUG\u003c/code> 决定模式：\u003ccode>true\u003c/code>（本地）异常原样暴露；\u003ccode>false\u003c/code>（\u003cstrong>线上必设\u003c/strong>）返回\n\u003ccode>{&quot;code&quot;:500,&quot;msg&quot;:&quot;服务内部错误（编号 xxxxxxxx）&quot;}\u003c/code>，详情写\n\u003ccode>runtime/logs/webman.log\u003c/code>，\u003ccode>grep &lt;编号&gt;\u003c/code> 定位。详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-41\">7. 启动\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">php start.php restart     # CLI 安装后必须重启一次（Web 向导已自动平滑 reload，可跳过）\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>命令\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>php start.php start\u003c/code>\u003c/td>\n\u003ctd>前台启动（调试看日志用，\u003ccode>Ctrl+C\u003c/code> 退出）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php start.php start -d\u003c/code>\u003c/td>\n\u003ctd>守护进程（后台常驻）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php start.php restart\u003c/code>\u003c/td>\n\u003ctd>重启（\u003cstrong>改 PHP 代码 / 配置后必须\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php start.php reload\u003c/code>\u003c/td>\n\u003ctd>平滑重载业务代码（不发 SIGUSR1 时用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php start.php status\u003c/code>\u003c/td>\n\u003ctd>看进程与连接数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php start.php stop\u003c/code>\u003c/td>\n\u003ctd>停止\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>webman 是常驻内存\u003c/strong>：改 PHP 代码或配置不 restart 不生效。这条会反复踩，\n已写进 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"0\" data-doc-anchor=\"h-9\">总览 §5 三条约定\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-42\">8. 验收清单\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>验证点\u003c/th>\n\u003cth>期望\u003c/th>\n\u003cth>不对时看\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>http://127.0.0.1:8787/app/curd/\u003c/code>\u003c/td>\n\u003ctd>登录页（图形验证码 + 记住账号）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-177\">FAQ §2\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用 §5 设的账号登录\u003c/td>\n\u003ctd>进首页，左侧有菜单\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-178\">FAQ §3\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>深链 \u003ccode>http://127.0.0.1:8787/app/curd/dashboard\u003c/code>\u003c/td>\n\u003ctd>200（history 路由回退 \u003ccode>index.html\u003c/code>）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-177\">FAQ §2\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/curd/models\u003c/code>\u003c/td>\n\u003ctd>200，返回已扫描到的模型清单\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-176\">FAQ §1\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/curd/tables\u003c/code>\u003c/td>\n\u003ctd>200，返回表清单\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-176\">FAQ §1\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/menu\u003c/code>\u003c/td>\n\u003ctd>200，返回当前用户可见菜单\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-178\">FAQ §3\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左侧「测试管理」菜单\u003c/td>\n\u003ctd>能打开并增删改查（示例页）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-59\">快速开始 §5\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>php webman list | grep make:curd\u003c/code>\u003c/td>\n\u003ctd>有 \u003ccode>make:curd\u003c/code>（中文描述「快速生成后台 CURD 控制器…」）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">FAQ §10\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>八条全绿 = 安装完成。接着读 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始\u003c/a> 写自己的业务页面。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-43\">9. 可能遇到的问题\u003c/h2>\n\u003cp>按「现象」查。全部条目的完整版在 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">排错速查与 FAQ\u003c/a>，这里只列安装期高频项。\u003c/p>\n\u003ch3 id=\"h-44\">9.1 安装期（composer）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因\u003c/th>\n\u003cth>解决\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>composer require\u003c/code> 报 \u003ccode>Could not find package\u003c/code>\u003c/td>\n\u003ctd>仓库没配，或 \u003ccode>@dev\u003c/code> 没带\u003c/td>\n\u003ctd>方式 A 必须 \u003ccode>amcolin/webman-curd-admin:@dev\u003c/code>；方式 B 先 \u003ccode>composer config repositories.curd vcs ...\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Your requirements could not be resolved\u003c/code>（\u003ccode>minimum-stability\u003c/code>）\u003c/td>\n\u003ctd>宿主 \u003ccode>minimum-stability\u003c/code> 是 \u003ccode>stable\u003c/code>，而 \u003ccode>@dev\u003c/code> 分支版本不满足\u003c/td>\n\u003ctd>用 \u003ccode>@dev\u003c/code> 显式声明，或走 tag \u003ccode>^1.0\u003c/code>（方式 B）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>composer audit\u003c/code> 报红 / 卡住\u003c/td>\n\u003ctd>audit 直连 \u003ccode>packagist.org\u003c/code>，国内不可达\u003c/td>\n\u003ctd>加 \u003ccode>--no-audit\u003c/code>，或 alias \u003ccode>scripts/composer.sh\u003c/code>（§3.4）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>require\u003c/code> 成功但 \u003ccode>plugin/curd\u003c/code> 不存在\u003c/td>\n\u003ctd>宿主缺 \u003ccode>post-package-install\u003c/code> 三件套 / 缺 \u003ccode>support/Plugin.php\u003c/code>\u003c/td>\n\u003ctd>补 §2.1，再 \u003ccode>composer dump-autoload &amp;&amp; composer update amcolin/webman-curd-admin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想强制重装插件目录\u003c/td>\n\u003ctd>自动拷贝没触发\u003c/td>\n\u003ctd>⚠️ 先备份：\u003ccode>cp -r vendor/amcolin/webman-curd-admin/plugin/curd plugin/curd\u003c/code> 会\u003cstrong>覆盖本地改动\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>composer remove\u003c/code> 后 \u003ccode>plugin/curd\u003c/code> 还在\u003c/td>\n\u003ctd>\u003ccode>pre-package-uninstall\u003c/code> 未注册\u003c/td>\n\u003ctd>手动删 \u003ccode>plugin/curd\u003c/code>（数据表与 \u003ccode>config/curd-admin.php\u003c/code> 不会自动删，见 §10）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-45\">9.2 初始化期（建表 / 连接）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因\u003c/th>\n\u003cth>解决\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>1045 Access denied for user\u003c/code>\u003c/td>\n\u003ctd>装完后没重启，worker 还用旧 \u003ccode>.env\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>php start.php restart\u003c/code>（向导场景确认 \u003ccode>posix\u003c/code> 可用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>SQLSTATE[HY000] [2002] Connection refused\u003c/code>\u003c/td>\n\u003ctd>主机 / 端口错，或 MySQL 没起\u003c/td>\n\u003ctd>核对 \u003ccode>DB_HOST\u003c/code> / \u003ccode>DB_PORT\u003c/code>；容器里跑要写 \u003ccode>host.docker.internal\u003c/code> 或服务名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向导页打不开（404）\u003c/td>\n\u003ctd>已装过（\u003ccode>runtime/curd-installed.lock\u003c/code> 存在）或路由未加载\u003c/td>\n\u003ctd>删锁重装，或走 CLI（§5.2）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向导提交后卡住不动\u003c/td>\n\u003ctd>子进程 \u003ccode>install.php\u003c/code> 报错，进度没写\u003c/td>\n\u003ctd>看 \u003ccode>runtime/logs/webman.log\u003c/code>；或直接命令行跑 §5.2 看真实报错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>建表成功但后台空白\u003c/td>\n\u003ctd>种子没插（表非空被 SKIP）\u003c/td>\n\u003ctd>清空对应表后重跑 \u003ccode>php plugin/curd/install.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config/keys\u003c/code> 丢了\u003c/td>\n\u003ctd>覆盖同步时被清（正常应保留 \u003ccode>*.pem\u003c/code>）\u003c/td>\n\u003ctd>从备份恢复；没有就重新生成并让前端重新登录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-46\">9.3 运行期（页面 / 接口）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因\u003c/th>\n\u003cth>解决\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/app/curd/\u003c/code> 404\u003c/td>\n\u003ctd>\u003ccode>PageController\u003c/code> 未加载 / 被宿主路由覆盖\u003c/td>\n\u003ctd>确认 \u003ccode>plugin/curd/public/index.html\u003c/code> 存在，检查 \u003ccode>config/route.php\u003c/code> 有无同名兜底路由\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面白屏、控制台 \u003ccode>MIME type\u003c/code> / \u003ccode>Failed to load module\u003c/code>\u003c/td>\n\u003ctd>前端产物被当文本返回 / 静态文件没走对\u003c/td>\n\u003ctd>Nginx 见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署\u003c/a> §4；本地确认 \u003ccode>StaticFile\u003c/code> 中间件在 \u003ccode>&#39;@&#39;\u003c/code> 组\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录一直转圈 / 401\u003c/td>\n\u003ctd>\u003ccode>ApiCrypto\u003c/code> 没注册（§6.1），前端加密请求后端不认\u003c/td>\n\u003ctd>把 \u003ccode>ApiCrypto\u003c/code> 加到 \u003ccode>&#39;@&#39;\u003c/code> 组并 restart\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>500 且日志 \u003ccode>Undefined array key &quot;locale&quot;\u003c/code>\u003c/td>\n\u003ctd>宿主缺 \u003ccode>config/plugin/curd/translation.php\u003c/code>\u003c/td>\n\u003ctd>重装（插件自带该文件）或从包内补一份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>500 且日志 \u003ccode>Base table or view not found: curd_configs\u003c/code>\u003c/td>\n\u003ctd>没跑初始化\u003c/td>\n\u003ctd>§5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码不显示\u003c/td>\n\u003ctd>缺 \u003ccode>ext-gd\u003c/code>\u003c/td>\n\u003ctd>装 gd，或 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后菜单是空的\u003c/td>\n\u003ctd>角色没授权 / \u003ccode>permission_enabled\u003c/code> 干扰\u003c/td>\n\u003ctd>见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改配置没反应\u003c/td>\n\u003ctd>改错文件（旧 \u003ccode>config/curd.php\u003c/code> 已不读）或没 restart\u003c/td>\n\u003ctd>只认 \u003ccode>config/curd-admin.php\u003c/code> + restart\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨域 \u003ccode>CORS\u003c/code> 报错\u003c/td>\n\u003ctd>前端与后端不同源\u003c/td>\n\u003ctd>插件自带 \u003ccode>Cors\u003c/code> 中间件；确认它没被宿主 \u003ccode>&#39;@&#39;\u003c/code> 组顺序挤掉\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>更多现象（DSL 不生效、Action 404、导出乱码、加密开关、异常编号定位…）见\n\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\">排错速查与 FAQ\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-47\">10. 卸载与重装\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># 卸载（pre-package-uninstall → 删除 plugin/curd）\ncomposer remove amcolin/webman-curd-admin &amp;&amp; php start.php restart\n\n# 重来一次\nrm -f runtime/curd-installed.lock        # 让安装向导重新可用\ncomposer update amcolin/webman-curd-admin # 重新触发插件拷贝\nphp plugin/curd/install.php --admin-user=admin --admin-pass=&#39;新密码&#39;\nphp start.php restart\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>composer remove\u003c/code> \u003cstrong>不会\u003c/strong>删：数据库表（含业务数据）、\u003ccode>config/curd-admin.php\u003c/code>、\n示例控制器 / 模型、\u003ccode>resource/translations/\u003c/code>、\u003ccode>config/keys/\u003c/code>。\n逐项清单与「哪些属于宿主不能覆盖」见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\" data-doc-anchor=\"h-161\">升级 · 部署 · 发布 §3\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-48\">11. 下一步\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>想做的事\u003c/th>\n\u003cth>看这篇\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>写第一个业务 CURD（模型 + 控制器 + 路由 + 菜单）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">快速开始\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用命令按表结构一键生成控制器\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-60\">快速开始 §6\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置项怎么写、有哪些开关\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grid / Column / Form / Filter / Action 的全部方法\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\">API · Grid\u003c/a> 起四篇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署到生产（supervisor + Nginx）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"file":"02-快速开始.md","title":"快速开始：写第一个业务 CURD","section":"start","sectionName":"入门与指南","mtime":"2026/10/19 15:27:04","headings":[{"depth":2,"text":"1. 花 30 秒确认装好了","id":"h-50"},{"depth":2,"text":"2. 五步建一个 CURD 页","id":"h-51"},{"depth":3,"text":"2.1 ① 模型：app/model/APackage.php","id":"h-52"},{"depth":3,"text":"2.2 ② 控制器：app/controller/api/PackageController.php","id":"h-53"},{"depth":3,"text":"2.3 ③ 路由：config/admin-route.php 或 config/route.php","id":"h-54"},{"depth":3,"text":"2.4 ④ 重启","id":"h-55"},{"depth":3,"text":"2.5 ⑤ 后台登记菜单 + 授权","id":"h-56"},{"depth":2,"text":"3. 页面访问路径怎么定","id":"h-57"},{"depth":2,"text":"4. 后台「配置生成器」（不写代码）","id":"h-58"},{"depth":2,"text":"5. 开箱示例「测试管理」","id":"h-59"},{"depth":2,"text":"6. 命令行生成 make:curd","id":"h-60"},{"depth":3,"text":"6.1 后台路由单独放 config/admin-route.php","id":"h-61"},{"depth":2,"text":"7. 业务库表结构 · 种子 · 增量 migration","id":"h-62"},{"depth":3,"text":"7.1 业务建表 SQL","id":"h-63"},{"depth":3,"text":"7.2 业务种子（菜单 / 权限自动登记）","id":"h-64"},{"depth":3,"text":"7.3 增量 migration","id":"h-65"},{"depth":2,"text":"8. 配置写在哪个文件","id":"h-66"},{"depth":2,"text":"9. 下一步","id":"h-67"}],"allHeadings":[{"depth":1,"text":"快速开始：写第一个业务 CURD","id":"h-49"},{"depth":2,"text":"1. 花 30 秒确认装好了","id":"h-50"},{"depth":2,"text":"2. 五步建一个 CURD 页","id":"h-51"},{"depth":3,"text":"2.1 ① 模型：app/model/APackage.php","id":"h-52"},{"depth":3,"text":"2.2 ② 控制器：app/controller/api/PackageController.php","id":"h-53"},{"depth":3,"text":"2.3 ③ 路由：config/admin-route.php 或 config/route.php","id":"h-54"},{"depth":3,"text":"2.4 ④ 重启","id":"h-55"},{"depth":3,"text":"2.5 ⑤ 后台登记菜单 + 授权","id":"h-56"},{"depth":2,"text":"3. 页面访问路径怎么定","id":"h-57"},{"depth":2,"text":"4. 后台「配置生成器」（不写代码）","id":"h-58"},{"depth":2,"text":"5. 开箱示例「测试管理」","id":"h-59"},{"depth":2,"text":"6. 命令行生成 make:curd","id":"h-60"},{"depth":3,"text":"6.1 后台路由单独放 config/admin-route.php","id":"h-61"},{"depth":2,"text":"7. 业务库表结构 · 种子 · 增量 migration","id":"h-62"},{"depth":3,"text":"7.1 业务建表 SQL","id":"h-63"},{"depth":3,"text":"7.2 业务种子（菜单 / 权限自动登记）","id":"h-64"},{"depth":3,"text":"7.3 增量 migration","id":"h-65"},{"depth":2,"text":"8. 配置写在哪个文件","id":"h-66"},{"depth":2,"text":"9. 下一步","id":"h-67"}],"html":"\u003ch1 id=\"h-49\">快速开始：写第一个业务 CURD\u003c/h1>\n\u003cp>\u003cstrong>前置\u003c/strong>：已按 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">安装指南\u003c/a> 装完、能登录后台。本篇从「库里有一张表」到「菜单里能点开、能增删改查」。\u003c/p>\n\u003cblockquote>\n\u003cp>想先不写代码就看到页面 → \u003ca href=\"#4-%E5%90%8E%E5%8F%B0%E9%85%8D%E7%BD%AE%E7%94%9F%E6%88%90%E5%99%A8%E4%B8%8D%E5%86%99%E4%BB%A3%E7%A0%81\">§4 配置生成器\u003c/a>；想抄现成的 → \u003ca href=\"#5-%E5%BC%80%E7%AE%B1%E7%A4%BA%E4%BE%8B%E6%B5%8B%E8%AF%95%E7%AE%A1%E7%90%86\">§5 开箱示例\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-50\">1. 花 30 秒确认装好了\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查\u003c/th>\n\u003cth>命令 / 动作\u003c/th>\n\u003cth>期望\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>插件在\u003c/td>\n\u003ctd>\u003ccode>ls plugin/curd/config/route.php\u003c/code>\u003c/td>\n\u003ctd>文件存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置在\u003c/td>\n\u003ctd>\u003ccode>ls config/curd-admin.php\u003c/code>\u003c/td>\n\u003ctd>文件存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表建了\u003c/td>\n\u003ctd>\u003ccode>GET /api/curd/tables\u003c/code>\u003c/td>\n\u003ctd>200，能列出表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能登录\u003c/td>\n\u003ctd>打开 \u003ccode>/app/curd/\u003c/code>\u003c/td>\n\u003ctd>进首页，左侧有菜单\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>任一条不对 → \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\" data-doc-anchor=\"h-42\">安装指南 §8 验收清单\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-51\">2. 五步建一个 CURD 页\u003c/h2>\n\u003cp>以「套餐管理」（表 \u003ccode>a_package\u003c/code>）为例：两个 PHP 文件 + 一处路由 + 一步后台操作。\u003c/p>\n\u003ch3 id=\"h-52\">2.1 ① 模型：\u003ccode>app/model/APackage.php\u003c/code>\u003c/h3>\n\u003cp>启动时自动扫描进 \u003ccode>ModelRegistry\u003c/code>，不用手写注册：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\model;\n\nuse plugin\\curd\\app\\model\\BaseModel;\n\nclass APackage extends BaseModel\n{\n    protected $table = &#39;a_package&#39;;\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-53\">2.2 ② 控制器：\u003ccode>app/controller/api/PackageController.php\u003c/code>\u003c/h3>\n\u003cp>继承插件基类即获得整套列表 / 搜索 / 表单 / 增删改查 / 导出能力：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\api;\n\nuse app\\model\\APackage;\nuse plugin\\curd\\app\\controller\\base\\BaseCurdController;\nuse plugin\\curd\\app\\dsl\\Filter;\nuse plugin\\curd\\app\\dsl\\Form;\nuse plugin\\curd\\app\\dsl\\Grid;\n\nclass PackageController extends BaseCurdController\n{\n    // 标题只写这一处：Grid 不传第二个参数时自动读它\n    protected string $title = &#39;套餐管理&#39;;\n\n    private const STATUS = [0 =&gt; &#39;停售&#39;, 1 =&gt; &#39;在售&#39;];\n\n    protected function grid(): Grid\n    {\n        // ① 模型直接 new 进 Grid —— 框架自动回填 $modelClass，不必再声明该属性\n        $grid = new Grid(new APackage());\n        $grid-&gt;getModel()-&gt;orderByDesc(&#39;id&#39;);\n\n        // ② 列\n        $grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;))-&gt;width(80)-&gt;align(&#39;center&#39;);\n        $grid-&gt;column(&#39;name&#39;, __(&#39;Name&#39;))-&gt;minWidth(160)-&gt;sortable();\n        $grid-&gt;column(&#39;price&#39;, __(&#39;Price&#39;))-&gt;prefix(&#39;¥ &#39;)-&gt;width(120);\n        $grid-&gt;column(&#39;status&#39;, __(&#39;Status&#39;))-&gt;map(self::STATUS)-&gt;label([1 =&gt; &#39;success&#39;])-&gt;width(100);\n        $grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;))-&gt;datetime()-&gt;width(180);\n\n        // ③ 搜索\n        $grid-&gt;filter(function (Filter $filter) {\n            $filter-&gt;like(&#39;name&#39;, __(&#39;Name&#39;));\n            $filter-&gt;select(&#39;status&#39;, __(&#39;Status&#39;))-&gt;options(self::STATUS);\n        });\n\n        // ④ 新增 / 编辑表单\n        $grid-&gt;form(function (Form $form) {\n            $form-&gt;text(&#39;name&#39;, __(&#39;Name&#39;))-&gt;required();\n            $form-&gt;number(&#39;price&#39;, __(&#39;Price&#39;))-&gt;required()-&gt;min(0);\n            $form-&gt;radio(&#39;status&#39;, __(&#39;Status&#39;), self::STATUS)-&gt;default(1);\n        });\n\n        return $grid;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>$modelClass\u003c/code> 不用声明（框架从 \u003ccode>grid()\u003c/code> 里列的模型自动提取回填）；手动写也兼容。\n\u003ccode>grid()\u003c/code> 里用到 \u003ccode>request()\u003c/code> 等请求上下文的控制器，建议保留显式声明 —— 启动扫描期不执行 \u003ccode>grid()\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-54\">2.3 ③ 路由：\u003ccode>config/admin-route.php\u003c/code> 或 \u003ccode>config/route.php\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">use plugin\\curd\\app\\RouteControllerRegistry;\n\nRouteControllerRegistry::registerMany([\n    &#39;/package&#39; =&gt; \\app\\controller\\api\\PackageController::class,\n]);\n\n// 单条也行：\n// RouteControllerRegistry::register(&#39;/package&#39;, \\app\\controller\\api\\PackageController::class);\n\u003c/code>\u003c/pre>\n\u003cp>放哪个文件都行：\u003ccode>config/admin-route.php\u003c/code>（推荐，后台路由集中管理，插件自动加载；注意写在\n\u003ccode>return [&#39;register&#39; =&gt; function () { ... }]\u003c/code> 闭包里）或 \u003ccode>config/route.php\u003c/code>（老项目照旧）。\n区别见 \u003ca href=\"#61-%E5%90%8E%E5%8F%B0%E8%B7%AF%E7%94%B1%E5%8D%95%E7%8B%AC%E6%94%BE-configadmin-routephp\">§6.1\u003c/a>。\u003c/p>\n\u003cp>这样注册的页面\u003cstrong>不进 \u003ccode>curd_configs\u003c/code> 落库配置\u003c/strong>，改 \u003ccode>grid()\u003c/code> 立即生效（registry 优先于落库配置）。\u003c/p>\n\u003ch3 id=\"h-55\">2.4 ④ 重启\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php start.php restart\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-56\">2.5 ⑤ 后台登记菜单 + 授权\u003c/h3>\n\u003cp>「菜单管理」新增一条：\u003ccode>path\u003c/code> 填 \u003cstrong>\u003ccode>/package\u003c/code>\u003c/strong>（与 ③ 一致），\u003ccode>permission\u003c/code> 可留空由「一键生成权限」推导。\n再到「角色管理」给对应角色勾上该菜单。刷新后台 → 左侧出现「套餐管理」，增删改查 / 导出全部可用。\u003c/p>\n\u003cblockquote>\n\u003cp>完整 \u003ccode>grid()\u003c/code> 能力见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">DSL · CURD 页面\u003c/a>，逐个方法查 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"11\">API · Grid\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-57\">3. 页面访问路径怎么定\u003c/h2>\n\u003cp>菜单的 \u003ccode>path\u003c/code> 就是页面 URL：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>页面类型\u003c/th>\n\u003ct
