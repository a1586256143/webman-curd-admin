<script>window.__DOCS_DATA__ = [{"file":"00-总览与导航.md","title":"webman-curd-admin · 总览与导航","mtime":"2026/9/20 22:10:23","headings":[{"depth":2,"text":"1. 能力一览","id":"h-2"},{"depth":2,"text":"2. 按场景索引","id":"h-3"},{"depth":2,"text":"3. 两类 DSL 与文件归属（先读这一段）","id":"h-4"},{"depth":2,"text":"4. 目录结构","id":"h-5"},{"depth":2,"text":"5. 环境与兼容","id":"h-6"},{"depth":2,"text":"6. 后台界面导览","id":"h-7"},{"depth":2,"text":"7. 三条必须记住的约定","id":"h-8"},{"depth":2,"text":"8. 维护与发布这个文档站","id":"h-9"}],"html":"\u003ch1 id=\"h-1\">webman-curd-admin · 总览与导航\u003c/h1>\n\u003cp>面向 webman 的\u003cstrong>中后台一体化应用插件\u003c/strong>：CURD / DSL / Schema 页面引擎 + 登录 / RBAC 底座 + 内置前端。\n宿主一条 \u003ccode>composer require\u003c/code>，插件自动落到 \u003ccode>{项目}/plugin/curd\u003c/code>，启动即用 ——\n\u003cstrong>不需要单独部署任何前端静态资源，也不需要写 List / Form / API 代码\u003c/strong>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>包名\u003c/td>\n\u003ctd>\u003ccode>amcolin/webman-curd-admin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件目录\u003c/td>\n\u003ctd>\u003ccode>plugin/curd\u003c/code>（宿主根；由 webman 官方插件机制 \u003ccode>support\\Plugin::install\u003c/code> 自动拷贝）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命名空间\u003c/td>\n\u003ctd>\u003ccode>plugin\\curd\\app\\*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配置读取\u003c/td>\n\u003ctd>\u003ccode>config(&#39;plugin.curd.*&#39;)\u003c/code>（插件调参） + \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>（宿主管家键）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路由前缀\u003c/td>\n\u003ctd>\u003ccode>/api/*\u003c/code>（后端 API）、\u003ccode>/app/curd/*\u003c/code>（内置前端 SPA）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仓库\u003c/td>\n\u003ctd>GitHub \u003ccode>a1586256143/webman-curd-admin\u003c/code>；Gitee 镜像 \u003ccode>colingit/webman-curd-admin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-2\">1. 能力一览\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力\u003c/th>\n\u003cth>你能得到什么\u003c/th>\n\u003cth>详解\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>开箱后台\u003c/strong>\u003c/td>\n\u003ctd>登录页 + 用户 / 角色 / 菜单管理 + 个人中心，\u003ccode>/app/curd/\u003c/code> 打开就能用（前端产物已内置在包里）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">快速开始\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CURD 页面\u003c/strong>\u003c/td>\n\u003ctd>一个模型 + 一个控制器 = 列表 / 搜索 / 新增 / 编辑 / 删除 / 导出；\u003ccode>grid()\u003c/code> 链式模板，另含场景字段控制、Excel 导入、行级 / 批量 / 弹窗按钮\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · CURD 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Schema 页面\u003c/strong>\u003c/td>\n\u003ctd>用数组 DSL 拼仪表盘 / 详情页：布局块、容器块、统计卡、折线图、数据绑定、自定义 \u003ccode>.vue\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>配置生成器\u003c/strong>\u003c/td>\n\u003ctd>后台「配置生成器」工具页：选表 → 配字段 → 填页面路径 → 保存，不写代码就能出一个 CURD 页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">快速开始\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>菜单与权限\u003c/strong>\u003c/td>\n\u003ctd>菜单树 + 角色授权 + 「一键生成权限」/「快速创建权限」；\u003ccode>permission_enabled\u003c/code> 一键关掉整条 RBAC\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>可插拔认证\u003c/strong>\u003c/td>\n\u003ctd>换登录表 / 换校验逻辑（\u003ccode>auth_provider\u003c/code>）、接管整个登录接口（\u003ccode>login_handler\u003c/code>）、叠加业务状态判定（\u003ccode>auth_state_guard\u003c/code>）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>接口加密（可选）\u003c/strong>\u003c/td>\n\u003ctd>RSA + AES 信封：前端加密请求体、后端解密；\u003cstrong>显式开关\u003c/strong>，构建期注入\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>异常兜底\u003c/strong>\u003c/td>\n\u003ctd>线上 \u003ccode>/api\u003c/code> 未捕获异常统一 HTTP 500 + 8 位编号，完整详情落日志（一条异常一行，可 grep）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>安装 / 升级 / 部署\u003c/strong>\u003c/td>\n\u003ctd>三种引包方式、Web 安装向导（装完免手动重启）、CLI 等价流程、宿主内升级同步、supervisor + Nginx\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">快速开始\u003c/a> / \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-3\">2. 按场景索引\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你现在要干的事\u003c/th>\n\u003cth>直接看\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第一次装，想尽快看到后台跑起来\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"1\">快速开始\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某个配置项怎么写 / 「配置改了没反应」\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">配置参考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用数组 DSL 拼一个仪表盘或详情页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">DSL · Schema 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>给一张表做增删改查（搜索 / 导出 / Excel 导入 / 自定义按钮）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · CURD 页面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配菜单、发权限、「一键生成权限」怎么用、改默认落地页\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换登录表 / 接管登录接口 / 加账号状态判定（禁停、合同到期…）\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>打开接口加密，或让线上异常统一报「服务内部错误（编号）」\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>升级插件、部署到服务器、打 zip 发版\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">升级 · 部署 · 发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报错了 / 现象对不上\u003c/td>\n\u003ctd>\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">排错速查与 FAQ\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>三篇 DSL 相关文档的关系：\u003cstrong>Schema\u003c/strong> 是「拼页面」，\u003cstrong>CURD\u003c/strong> 是「拼列表 + 表单」，\n\u003cstrong>菜单与权限\u003c/strong> 决定这些页面能不能被看见、被点开。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-4\">3. 两类 DSL 与文件归属（先读这一段）\u003c/h2>\n\u003cp>插件提供\u003cstrong>通用引擎\u003c/strong>，业务项目在 \u003cstrong>app 层\u003c/strong>消费它，两者严格分工：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>DSL\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>形态\u003c/th>\n\u003cth>代码位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Schema 页面 DSL\u003c/strong>\u003c/td>\n\u003ctd>展示型页面（首页 / 看板）：组件套组件 + 24 栏栅格 + 数据注入\u003c/td>\n\u003ctd>\u003ccode>PageSchema + blocks\u003c/code> 编译成 JSON 组件树\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/schema/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CURD DSL\u003c/strong>\u003c/td>\n\u003ctd>列表管理页：表格 / 搜索 / 表单 / 自定义操作 / 导出 / 汇总条\u003c/td>\n\u003ctd>\u003ccode>Grid / Form / Filter / Column / Action\u003c/code> 流式声明\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/dsl/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>归属\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Schema 引擎（\u003ccode>SchemaNode\u003c/code> / \u003ccode>PageSchema\u003c/code> / \u003ccode>PageRegistry\u003c/code> / \u003ccode>blocks/*\u003c/code>）\u003c/td>\n\u003ctd>插件 \u003ccode>plugin/curd/app/schema/\u003c/code>\u003c/td>\n\u003ctd>命名空间 \u003ccode>plugin\\curd\\app\\schema\\*\u003c/code>，与业务无关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义页面分发控制器 \u003ccode>CustomPageController\u003c/code>（\u003ccode>.vue\u003c/code> + Schema 两种分发）\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>路由在插件 \u003ccode>plugin/curd/config/route.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面内容接口 \u003ccode>GET /api/custom/pages\u003c/code>、\u003ccode>GET /api/custom/page\u003c/code>\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>随插件自动加载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>业务 Schema 页面类\u003c/strong>（如首页 \u003ccode>HomePage\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/admin/api/\u003c/code>\u003c/td>\n\u003ctd>用户级文件，自己 \u003ccode>use\u003c/code> 插件 DSL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>数据接口\u003c/strong>（\u003ccode>dataApi\u003c/code> 指向的业务统计）\u003c/td>\n\u003ctd>业务\u003c/td>\n\u003ctd>查业务表，属业务逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>注册\u003c/strong> \u003ccode>PageRegistry::register\u003c/code>\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>业务对插件扩展点的声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 自定义页面文件\u003c/td>\n\u003ctd>业务 \u003ccode>app/custom/pages/*.vue\u003c/code>\u003c/td>\n\u003ctd>插件只负责读取分发，不存放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 业务控制器（Model + \u003ccode>grid()\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/api/\u003c/code>、\u003ccode>app/controller/admin/api/\u003c/code>\u003c/td>\n\u003ctd>继承 \u003ccode>BaseCurdController\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 路由注册 \u003ccode>RouteControllerRegistry::registerMany\u003c/code>\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>菜单 / 权限数据\u003c/td>\n\u003ctd>数据库 \u003ccode>menus\u003c/code> / \u003ccode>casbin_rule\u003c/code>\u003c/td>\n\u003ctd>在后台「菜单管理」维护\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>页面访问入口约定\u003c/strong>（菜单的 \u003ccode>path\u003c/code> 就填它）：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>CURD 页\u003c/strong>：\u003ccode>/mobile-recharge-orders\u003c/code> 这类，即 \u003ccode>registerMany\u003c/code> 的 key；\u003c/li>\n\u003cli>\u003cstrong>Schema / \u003ccode>.vue\u003c/code> 自定义页\u003c/strong>：\u003ccode>/custom-page/&lt;页面名&gt;\u003c/code>（前端 catch-all 路由命中）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-5\">4. 目录结构\u003c/h2>\n\u003cpre>\u003ccode>webman-curd-admin/\n├── composer.json              # 包定义（name: amcolin/webman-curd-admin）\n├── README.md                  # 仓库门面（特性 / 60 秒上手 / 文档索引）\n├── INSTALL.md                 # 安装说明（本包发布版随包分发）\n├── docs/                      # 文档站（本目录）\n│   ├── index.html             # 自包含单页文档站（浏览器直接打开，无需服务器）\n│   ├── 00..09-*.md            # 各篇文档源（见上表）\n│   └── tools/build_docs.cjs   # md → index.html 构建脚本\n├── plugin/curd/               # ★ 应用插件源码（自包含，不依赖宿主 app 层）\n│   ├── app/\n│   │   ├── controller/        # Auth / Menu / Curd / CustomPage / Upload / Options / Page\n│   │   │   ├── PageController.php      # 内置前端静态托管 + SPA history fallback\n│   │   │   └── base/                   # BaseCurdController + Traits + DynamicCurdController\n│   │   ├── dsl/               # Grid / Form / Field / Column / Filter / Action\n│   │   ├── schema/            # PageSchema / PageRegistry / SchemaNode / blocks/*\n│   │   ├── middleware/        # Cors / AuthCheck / PermissionCheck / ApiCrypto（内置）\n│   │   ├── exception/         # CurdExceptionHandler（/api 未捕获异常兜底）\n│   │   ├── rbac/              # casbin Rbac + DatabaseAdapter（内置）\n│   │   ├── model/             # CurdConfigs / BaseModel（内置）\n│   │   ├── CurdDb.php         # 库连接助手（admin_connection / business_connection）\n│   │   ├── ModelRegistry.php  # 宿主模型扫描登记\n│   │   ├── RouteControllerRegistry.php\n│   │   └── bootstrap.php      # 初始化引导（模型 / 控制器扫描等）\n│   ├── api/Install.php        # 安装器（建表 / 种子 / RSA 密钥）\n│   ├── config/                # app.php / route.php / autoload.php / crypto.php / curd.php / casbin.conf\n│   ├── install.sql            # 核心表 DDL + my_test 示例表段\n│   ├── install.php            # CLI 引导：php plugin/curd/install.php\n│   ├── migrate.php            # 增量 migration 引导\n│   ├── migrations/            # V{版本}__{描述}.sql\n│   ├── env.example            # 传统 .env 方式的键清单\n│   └── public/                # ★ 内置前端构建产物（vite base=/app/curd/）\n├── examples/                  # 后台 CURD 示例（MyTestController + MyTest）\n├── scripts/                   # composer.sh / release.sh / build-frontend.sh / release-zip.sh\n│                              # sync-plugin.sh / check-plugin-overrides.sh\n└── src/Install.php            # composer 安装器（拷贝 plugin/curd + 落位 examples + 生成 config）\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>宿主侧只有两处是本插件相关的：\u003ccode>{项目}/plugin/curd/\u003c/code> 与 \u003ccode>{项目}/config/curd-admin.php\u003c/code>。\n其它都是插件自带、随包升级整体替换的。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-6\">5. 环境与兼容\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PHP\u003c/td>\n\u003ctd>≥ 8.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>框架\u003c/td>\n\u003ctd>webman（\u003ccode>workerman/webman-framework\u003c/code> ^2.1，官方骨架即可）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库\u003c/td>\n\u003ctd>MySQL —— \u003cstrong>单库架构\u003c/strong>：认证表与业务表放同一个库，无分库配置项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依赖\u003c/td>\n\u003ctd>\u003ccode>composer require\u003c/code> 自动拉齐 \u003ccode>webman/database\u003c/code> \u003ccode>webman/redis\u003c/code> \u003ccode>casbin/casbin\u003c/code> \u003ccode>vlucas/phpdotenv\u003c/code> \u003ccode>webman/captcha\u003c/code>，无需手动装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PHP 扩展\u003c/td>\n\u003ctd>登录图形验证码需要 \u003ccode>ext-gd\u003c/code> + \u003ccode>ext-mbstring\u003c/code>；不需要可在配置里 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>宿主 \u003ccode>composer.json\u003c/code> 需带 webman 官方插件三件套（官方骨架自带，缺失则补）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">&quot;scripts&quot;: {\n  &quot;post-package-install&quot;:  [&quot;support\\\\Plugin::install&quot;],\n  &quot;post-package-update&quot;:   [&quot;support\\\\Plugin::install&quot;],\n  &quot;pre-package-uninstall&quot;: [&quot;support\\\\Plugin::uninstall&quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>并确认存在 \u003ccode>support/Plugin.php\u003c/code>（官方骨架文件）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-7\">6. 后台界面导览\u003c/h2>\n\u003cp>内置前端（Vue3 + Element Plus）已随包分发，由 \u003ccode>PageController\u003c/code> 承载，无需另行部署：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>地址\u003c/th>\n\u003cth>页面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/app/curd/\u003c/code>\u003c/td>\n\u003ctd>登录页（图形验证码 + 记住账号）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/app/curd/dashboard\u003c/code>\u003c/td>\n\u003ctd>内置首页（默认落地页，可改）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/app/curd/curd-generator\u003c/code>\u003c/td>\n\u003ctd>「配置生成器」工具页（DSL 造 CURD / Schema 页面；本页自身不需要 DSL 配置）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后左侧菜单\u003c/td>\n\u003ctd>用户管理 / 角色管理 / 菜单管理 / 自定义页面 / （示例）测试管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>登录后可顺手验证的接口：\u003c/p>\n\u003cpre>\u003ccode>/api/curd/models      → 模型清单（已扫描到的宿主模型）\n/api/curd/tables      → 表清单\n/api/menu             → 当前用户可见菜单\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-8\">7. 三条必须记住的约定\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>配置只有一个入口\u003c/strong>：宿主根 \u003ccode>config/curd-admin.php\u003c/code>。旧的 \u003ccode>config/curd.php\u003c/code> /\n\u003ccode>config/admin.php\u003c/code> \u003cstrong>已不再读取\u003c/strong>（2026-09-19 合并），文件存在也不生效 ——\n「改了配置没反应」第一件事就是确认改对了文件。\u003c/li>\n\u003cli>\u003cstrong>webman 是常驻内存\u003c/strong>：改 PHP 代码或配置后必须 \u003ccode>restart\u003c/code>（或 \u003ccode>SIGUSR1\u003c/code> 平滑 reload），\n热改文件不生效（前端产物同理，改完要重新构建再部署）。\u003c/li>\n\u003cli>\u003cstrong>单库架构\u003c/strong>：\u003ccode>mysql\u003c/code>（认证）与 \u003ccode>mysql_business\u003c/code>（业务）两个连接\u003cstrong>指向同一个库\u003c/strong>，\n业务想分库才需要动 \u003ccode>config/database.php\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2 id=\"h-9\">8. 维护与发布这个文档站\u003c/h2>\n\u003cp>文档源就是本目录的 \u003ccode>*.md\u003c/code>，位置即编号（\u003ccode>00-\u003c/code> 在最前）。改完重跑构建脚本即可：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd docs\nnode tools/build_docs.cjs        # 重新生成 docs/index.html（自包含单页，双击可开）\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>站点左侧栏目按\u003cstrong>文件名排序\u003c/strong>，所以新增文档请沿用 \u003ccode>NN-主题.md\u003c/code> 命名；\u003c/li>\n\u003cli>每篇的第一个 H1 是文档标题，H2/H3 自动生成嵌套目录树；\u003c/li>\n\u003cli>文档之间互相引用请用标准 Markdown 链接 \u003ccode>[标题](NN-主题.md)\u003c/code>：\n在 GitHub 上是可点的文件链接，在文档站里会被自动接管为\u003cstrong>页内跳转\u003c/strong>（切到对应面板）。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>三种分发方式\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本地 / 离线\u003c/td>\n\u003ctd>直接双击 \u003ccode>docs/index.html\u003c/code>，零依赖、无需服务器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>随发布包\u003c/td>\n\u003ctd>\u003ccode>scripts/release-zip.sh\u003c/code> 已把 \u003ccode>docs/\u003c/code> 与 \u003ccode>INSTALL.md\u003c/code> 打进 zip（排除 \u003ccode>_legacy/\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在线站点\u003c/td>\n\u003ctd>仓库 → Actions → \u003cstrong>docs-pages\u003c/strong> → Run workflow，把 \u003ccode>docs/\u003c/code> 发到 GitHub Pages（需先在 Settings → Pages 把 Source 设为 &quot;GitHub Actions&quot;；私有仓库需 Pro/Team/Enterprise 才允许 Pages）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>放在这里的 \u003ccode>.nojekyll\u003c/code> 是给 GitHub Pages 用的，避免下划线开头的目录被 Jekyll 忽略。\u003c/p>\n\u003c/blockquote>\n"},{"file":"01-快速开始.md","title":"快速开始","mtime":"2026/9/20 22:11:26","headings":[{"depth":2,"text":"1. 前置条件","id":"h-11"},{"depth":2,"text":"2. 引入插件（三选一）","id":"h-12"},{"depth":3,"text":"2.1 方式 A：本地 path（开发期联调）","id":"h-13"},{"depth":3,"text":"2.2 方式 B：私有 Git VCS（推荐上线，走 tag 版本）","id":"h-14"},{"depth":3,"text":"2.3 方式 C：私有 Satis / Packagist（团队统一源）","id":"h-15"},{"depth":3,"text":"2.4 安装器自动完成了什么（src/Install.php，幂等）","id":"h-16"},{"depth":2,"text":"3. 初始化数据库（建表 + 种子 + 密钥）","id":"h-17"},{"depth":3,"text":"3.1 Web 安装向导（推荐，新项目首选）","id":"h-18"},{"depth":3,"text":"3.2 CLI 等价流程（不便开浏览器时）","id":"h-19"},{"depth":3,"text":"3.3 安装做了什么（幂等，重复执行全部 SKIP）","id":"h-20"},{"depth":2,"text":"4. 全局中间件与异常处理器（必做）","id":"h-21"},{"depth":3,"text":"① 全局中间件（注册加解密）","id":"h-22"},{"depth":3,"text":"② 异常处理器（未捕获异常的兜底出口）","id":"h-23"},{"depth":2,"text":"5. 启动与验证","id":"h-24"},{"depth":2,"text":"6. 写第一个业务 CURD","id":"h-25"},{"depth":3,"text":"6.1 四步","id":"h-26"},{"depth":3,"text":"6.2 开箱示例：「测试管理」","id":"h-27"},{"depth":2,"text":"7. 业务库表结构 · 种子 · 增量 migration","id":"h-28"},{"depth":3,"text":"7.1 业务建表 SQL","id":"h-29"},{"depth":3,"text":"7.2 业务种子（菜单 / 权限自动登记）","id":"h-30"},{"depth":3,"text":"7.3 增量 migration（表结构演进）","id":"h-31"},{"depth":2,"text":"8. 配置写在哪个文件","id":"h-32"}],"html":"\u003ch1 id=\"h-10\">快速开始\u003c/h1>\n\u003cp>从零到「后台能登录、能增删改查」的完整流程。已有 webman 项目的话，直接从\n\u003ca href=\"#2-%E5%BC%95%E5%85%A5%E6%8F%92%E4%BB%B6%E4%B8%89%E9%80%89%E4%B8%80\">§2 引入插件\u003c/a> 看起，然后跳到 \u003ca href=\"#3-%E5%88%9D%E5%A7%8B%E5%8C%96%E6%95%B0%E6%8D%AE%E5%BA%93%E5%BB%BA%E8%A1%A8--%E7%A7%8D%E5%AD%90--%E5%AF%86%E9%92%A5\">§3 初始化数据库\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-11\">1. 前置条件\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PHP\u003c/td>\n\u003ctd>≥ 8.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>框架\u003c/td>\n\u003ctd>webman（\u003ccode>workerman/webman-framework\u003c/code> ^2.1，官方骨架即可）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库\u003c/td>\n\u003ctd>MySQL（认证表与业务表\u003cstrong>同库\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PHP 扩展\u003c/td>\n\u003ctd>\u003ccode>ext-gd\u003c/code> + \u003ccode>ext-mbstring\u003c/code> —— 登录图形验证码要用；装不了可在配置里 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本地环境\u003c/td>\n\u003ctd>ServBay / phpStudy 等一键环境即可\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>宿主 \u003ccode>composer.json\u003c/code> 需含 webman 官方插件的三个 scripts（官方骨架自带，缺失则补）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">&quot;scripts&quot;: {\n  &quot;post-package-install&quot;:  [&quot;support\\\\Plugin::install&quot;],\n  &quot;post-package-update&quot;:   [&quot;support\\\\Plugin::install&quot;],\n  &quot;pre-package-uninstall&quot;: [&quot;support\\\\Plugin::uninstall&quot;]\n}\n\u003c/code>\u003c/pre>\n\u003cp>并确认存在 \u003ccode>support/Plugin.php\u003c/code>（官方骨架文件；缺失时从 webman 骨架仓库补）。\u003c/p>\n\u003cblockquote>\n\u003cp>全新项目先建骨架：\u003ccode>composer create-project workerman/webman webman-clean-demo &amp;&amp; cd webman-clean-demo\u003c/code>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-12\">2. 引入插件（三选一）\u003c/h2>\n\u003ch3 id=\"h-13\">2.1 方式 A：本地 path（开发期联调）\u003c/h3>\n\u003cp>改包源码即时生效，配合包内 \u003ccode>scripts/release.sh\u003c/code> 把宿主侧改动回灌回包：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">composer config repositories.curd path &quot;../webman-curd-admin&quot;\ncomposer require amcolin/webman-curd-admin:@dev\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-14\">2.2 方式 B：私有 Git VCS（推荐上线，走 tag 版本）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># GitHub\ncomposer config repositories.curd vcs &quot;git@github.com:a1586256143/webman-curd-admin.git&quot;\n# 国内拉取更快可走 Gitee 镜像：\n# composer config repositories.curd vcs &quot;https://gitee.com/colingit/webman-curd-admin.git&quot;\n\ncomposer require amcolin/webman-curd-admin:^1.0 --no-audit   # 走 tag，避免 @dev 漂移\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ \u003ccode>composer audit\u003c/code> 红字（\u003ccode>Failed to audit installed packages.\u003c/code>）是\u003cstrong>已知尾部告警\u003c/strong>：\naudit 硬编码访问 \u003ccode>packagist.org\u003c/code>（不走国内镜像），国内常不可达；命令本身 \u003ccode>exit 0\u003c/code>，\n\u003cstrong>不影响安装\u003c/strong>。不想每次手打 \u003ccode>--no-audit\u003c/code>：\u003c/p>\n\u003c/blockquote>\n\u003cpre>\u003ccode class=\"language-bash\"># 一次性\n./scripts/composer.sh require amcolin/webman-curd-admin:^1.0\n# 永久（把系统 composer alias 成 wrapper，只对会触发 audit 的子命令追加 --no-audit）\necho &quot;alias composer=&#39;$(pwd)/scripts/composer.sh&#39;&quot; &gt;&gt; ~/.zshrc &amp;&amp; source ~/.zshrc\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-15\">2.3 方式 C：私有 Satis / Packagist（团队统一源）\u003c/h3>\n\u003cp>仓库已附 \u003ccode>satis.json\u003c/code> 模板（把 homepage / Gitee URL 改成真实地址），\n在 Satis 服务器执行 \u003ccode>satis build satis.json web/\u003c/code> 后部署：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">composer config repositories.curd-satis composer &quot;https://satis.your-company.com&quot;\ncomposer require amcolin/webman-curd-admin\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-16\">2.4 安装器自动完成了什么（\u003ccode>src/Install.php\u003c/code>，幂等）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>拷贝插件\u003c/strong>：\u003ccode>vendor/amcolin/webman-curd-admin/plugin/curd\u003c/code> → 宿主 \u003ccode>plugin/curd\u003c/code>\n（\u003cstrong>已存在则跳过\u003c/strong>，以保护本地开发版）；\u003c/li>\n\u003cli>\u003cstrong>示例落位\u003c/strong>到宿主根（给你抄的示例，可自由改 / 删）：\u003cul>\n\u003cli>\u003ccode>app/controller/admin/api/MyTestController.php\u003c/code>（「测试管理」控制器）\u003c/li>\n\u003cli>\u003ccode>app/model/MyTest.php\u003c/code>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>生成集中配置\u003c/strong> \u003ccode>config/curd-admin.php\u003c/code>（已存在不覆盖）；\u003c/li>\n\u003cli>宿主 \u003ccode>config/database.php\u003c/code> 缺失或是 webman/database 的占位模板时，自动生成\n\u003cstrong>env 驱动\u003c/strong>的 \u003ccode>mysql\u003c/code> + \u003ccode>mysql_business\u003c/code> 双连接模板（单库同库）。\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode class=\"language-bash\"># 验证装好了\nls plugin/curd config/curd-admin.php config/database.php\n\n# 极少见「自动拷贝未触发」时的兜底\ncomposer dump-autoload &amp;&amp; composer update amcolin/webman-curd-admin\ncp -r vendor/amcolin/webman-curd-admin/plugin/curd plugin/curd\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-17\">3. 初始化数据库（建表 + 种子 + 密钥）\u003c/h2>\n\u003ch3 id=\"h-18\">3.1 Web 安装向导（推荐，新项目首选）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php start.php start      # 端口默认 8787（config/process.php 的 &#39;listen&#39; 行）\n\u003c/code>\u003c/pre>\n\u003cp>浏览器打开 \u003cstrong>\u003ccode>http://host:port/app/curd-installer\u003c/code>\u003c/strong>，填两块（均为明文输入，便于核对）：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>数据库连接\u003c/strong>：主机 / 端口 / 库名 / 账号 / 密码 —— 库不存在会\u003cstrong>自动 CREATE\u003c/strong>；\u003c/li>\n\u003cli>\u003cstrong>管理员账号\u003c/strong>：登录名 / 密码 / 确认密码 —— 自定义初始管理员，\u003cstrong>不是固定的 admin/admin123\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>提交后自动完成：\u003c/p>\n\u003col>\n\u003cli>DB 信息\u003cstrong>按键合并\u003c/strong>写入宿主 \u003ccode>.env\u003c/code>（绝不覆盖其它键）+ 同步写 \u003ccode>config/curd-admin.php\u003c/code>\n的 \u003ccode>database\u003c/code> 段（修复 worker 启动后 \u003ccode>.env\u003c/code> 无法刷新导致的 1045）；\u003c/li>\n\u003cli>子进程执行 \u003ccode>php plugin/curd/install.php\u003c/code>：自动建库 → 建核心表 + 示例表 \u003ccode>my_test\u003c/code> →\n种子（超级管理员角色 / 基础菜单 /「测试管理」菜单 / 管理员账号 / RSA 密钥）→ 页面实时进度；\u003c/li>\n\u003cli>\u003cstrong>免手动重启\u003c/strong>：安装成功即向 master 进程发 \u003ccode>SIGUSR1\u003c/code>（= workerman 平滑 reload），\nworker 处理完当前请求后重启并重读 \u003ccode>.env\u003c/code> / config，新 \u003ccode>DB_*\u003c/code> 立即生效（约 2 秒后进登录页）。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>信号不可用\u003c/strong>的场景（Windows / 无 posix 扩展 / supervisor 托管等）页面会自动回退提示\n\u003ccode>php start.php restart\u003c/code> —— worker 配置在启动期固化，不重启会报 \u003ccode>1045 Access denied\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>安装标记\u003c/strong>：成功生成 \u003ccode>runtime/curd-installed.lock\u003c/code>，向导即失效（再访问提示已安装）。\n\u003cstrong>重装\u003c/strong> = 删锁 + 清库后刷新向导页。\u003c/p>\n\u003ch3 id=\"h-19\">3.2 CLI 等价流程（不便开浏览器时）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 先配好 .env 的 DB_*（键清单见 plugin/curd/env.example，单库只需一份 DB_NAME）\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=webman_curd        # 不存在会自动建\nDB_USER=root\nDB_PASSWORD=your_password\n\n# 一键安装（幂等，可重复执行；默认只种【超级管理员】角色）\nphp plugin/curd/install.php --admin-user=admin --admin-pass=&#39;你的密码&#39;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>--admin-user=admin\u003c/code> / \u003ccode>--admin-pass=xxx\u003c/code>\u003c/td>\n\u003ctd>初始管理员凭据（仅 \u003ccode>admin_users\u003c/code> 空表时生效）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--business-sql=path/a.sql\u003c/code>\u003c/td>\n\u003ctd>项目自带的业务建表 SQL（相对宿主根；可重复或逗号分隔传多个）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--business-connection=mysql_business\u003c/code>\u003c/td>\n\u003ctd>覆盖业务 SQL 使用的连接名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--progress-file=runtime/x.log\u003c/code>\u003c/td>\n\u003ctd>进度 JSONL 输出（Web 向导内部用）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-20\">3.3 安装做了什么（幂等，重复执行全部 SKIP）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>建表\u003c/strong>：\u003ccode>admin_users\u003c/code> \u003ccode>admin_tokens\u003c/code> \u003ccode>roles\u003c/code> \u003ccode>admin_role_user\u003c/code> \u003ccode>role_permission\u003c/code>\n\u003ccode>casbin_rule\u003c/code> \u003ccode>curd_configs\u003c/code> \u003ccode>menus\u003c/code>（8 张认证/管理面表）+ 示例表 \u003ccode>my_test\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>种子\u003c/strong>（仅空表时插）：\u003ccode>roles\u003c/code> 超级管理员、\u003ccode>menus\u003c/code> 6 条基础菜单、初始 admin 账号、\n\u003ccode>curd_configs\u003c/code> 的 \u003ccode>/my-test\u003c/code> 示例页面配置 +「测试管理」菜单 + \u003ccode>my_test\u003c/code> 示例数据；\u003c/li>\n\u003cli>\u003cstrong>RSA 密钥\u003c/strong>：生成 \u003ccode>config/keys/\u003c/code>（已存在跳过；\u003cstrong>生产环境务必单独备份此目录\u003c/strong>）；\u003c/li>\n\u003cli>所有表 \u003ccode>IF NOT EXISTS\u003c/code>、种子按表空判定 → 重复执行全部 SKIP。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-21\">4. 全局中间件与异常处理器（必做）\u003c/h2>\n\u003ch3 id=\"h-22\">① 全局中间件（注册加解密）\u003c/h3>\n\u003cp>插件的接口加解密必须由宿主在 \u003ccode>config/middleware.php\u003c/code> 的 \u003ccode>&#39;@&#39;\u003c/code> 组注册——\n\u003ccode>&#39;@&#39;\u003c/code> 才是「跨所有 app 与 plugin 生效」；写成 \u003ccode>&#39;&#39;\u003c/code> 只作用于默认 app，插件的 \u003ccode>/api/*\u003c/code> 会绕过：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// config/middleware.php\nreturn [\n    &#39;@&#39; =&gt; [\n        \\app\\middleware\\StaticFile::class,\n        // 接口加解密（RSA + AES 信封）；即使当前关闭加密也要保留，否则前端加密请求无人解\n        \\plugin\\curd\\app\\middleware\\ApiCrypto::class,\n    ],\n];\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-23\">② 异常处理器（未捕获异常的兜底出口）\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>插件路由开箱生效\u003c/strong>：插件自带 \u003ccode>plugin/curd/config/exception.php\u003c/code>，框架按\n\u003ccode>plugin.curd.exception\u003c/code> 读取，\u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code> 直接覆盖到；\u003c/li>\n\u003cli>\u003cstrong>宿主自己的 \u003ccode>/api\u003c/code> 控制器\u003c/strong>要覆盖到，就把宿主 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指过来：\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-php\">// config/exception.php\nreturn [\n    &#39;&#39; =&gt; \\plugin\\curd\\app\\exception\\CurdExceptionHandler::class,\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ 只写 \u003ccode>&#39;@&#39;\u003c/code> 键\u003cstrong>无效\u003c/strong> —— 框架规则是「本 app 配置里已有 \u003ccode>&#39;&#39;\u003c/code> 键 ⇒ 忽略 \u003ccode>&#39;@&#39;\u003c/code>」，\n而 webman 骨架默认就自带 \u003ccode>&#39;&#39; =&gt; support\\exception\\Handler::class\u003c/code>。\u003c/p>\n\u003cp>⚠️ \u003cstrong>别想用中间件做这件事\u003c/strong>：webman 的中间件链在\u003cstrong>每一层内层都先 try/catch 再转 Response\u003c/strong>，\n外层中间件\u003cstrong>永远捕获不到\u003c/strong>控制器抛出的异常（实测踩过）。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>本地 / 线上模式\u003c/strong>由 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code> 决定（\u003ccode>plugin.curd.app.debug\u003c/code> 读它）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003ccode>APP_DEBUG\u003c/code>\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>true\u003c/code>（默认，本地）\u003c/td>\n\u003ctd>异常信息原样暴露：JSON 请求返回真实 msg + traces，其余返回调试页 —— 当场可查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>false\u003c/code>（\u003cstrong>线上必设\u003c/strong>）\u003c/td>\n\u003ctd>\u003ccode>/api\u003c/code> 返回 \u003cstrong>HTTP 500\u003c/strong> \u003ccode>{&quot;code&quot;:500,&quot;msg&quot;:&quot;服务内部错误（编号 xxxxxxxx）&quot;}\u003c/code>，详情写 \u003ccode>runtime/logs/webman.log\u003c/code>，\u003ccode>grep &lt;编号&gt;\u003c/code> 定位原始异常\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>宿主自己控制器的模式还取宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>，与插件 debug \u003cstrong>取交集\u003c/strong>\n（任一为 \u003ccode>false\u003c/code> 即按线上处理），线上记得两边都关。详见\n\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-24\">5. 启动与验证\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># CLI 安装后重启一次让新配置 / 路由生效（Web 向导场景已自动平滑 reload，可跳过）\nphp start.php restart\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>验证点\u003c/th>\n\u003cth>期望\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>http://host:port/app/curd/\u003c/code>\u003c/td>\n\u003ctd>登录页（用 §3 设置的管理员账号）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录成功\u003c/td>\n\u003ctd>用户 / 角色 / 菜单管理、配置生成器、自定义页面全部可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SPA 深链 \u003ccode>http://host:port/app/curd/dashboard\u003c/code>\u003c/td>\n\u003ctd>200（history 路由回退 \u003ccode>index.html\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/curd/models\u003c/code>、\u003ccode>/api/curd/tables\u003c/code>\u003c/td>\n\u003ctd>200，返回模型 / 表清单\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>端口默认 8787，位置在 \u003ccode>config/process.php\u003c/code> 的 \u003ccode>listen\u003c/code>；与存量服务冲突就改这里再重启。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-25\">6. 写第一个业务 CURD\u003c/h2>\n\u003ch3 id=\"h-26\">6.1 四步\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// ① 模型：app/model/APackage.php —— 启动时自动扫描进 ModelRegistry，不用手写注册\nnamespace app\\model;\nuse plugin\\curd\\app\\model\\BaseModel;\n\nclass APackage extends BaseModel {\n    protected $table = &#39;a_package&#39;;\n}\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">// ② 控制器：app/controller/api/PackageController.php\n//    继承插件基类即获得整套列表 / 搜索 / 表单 / 增删改查 / 导出能力\nnamespace app\\controller\\api;\nuse plugin\\curd\\app\\controller\\base\\BaseCurdController;\n\nclass PackageController extends BaseCurdController {\n    protected string $modelClass = \\app\\model\\APackage::class;\n    protected string $title = &#39;套餐管理&#39;;\n}\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">// ③ 路由：加入宿主 config/route.php 的 / 或 registerMany([...]) 数组\n//    registerMany 是「路径 =&gt; 控制器类」的关联数组\nRouteControllerRegistry::registerMany([\n    &#39;/package&#39; =&gt; \\app\\controller\\api\\PackageController::class,\n]);\n// 单条也行：RouteControllerRegistry::register(&#39;/package&#39;, \\app\\controller\\api\\PackageController::class);\n\u003c/code>\u003c/pre>\n\u003cp>④ 进后台「菜单管理」登记菜单 + 给角色授权（写 \u003ccode>menus\u003c/code> / \u003ccode>casbin_rule\u003c/code>），前端即可见可用。\n\u003cstrong>菜单的 \u003ccode>path\u003c/code> 要填上面注册用的路径\u003c/strong>（这里是 \u003ccode>/package\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>想省掉手写代码：后台左侧「\u003cstrong>配置生成器\u003c/strong>」（\u003ccode>/app/curd/curd-generator\u003c/code>）\n选表 → 配字段 → 填页面路径 → 保存，\u003ccode>/api/curd/config\u003c/code> 立刻能查到该 \u003ccode>route_path\u003c/code>，\n对应动态页即可在菜单中打开。工具页本身\u003cstrong>不需要\u003c/strong> DSL 配置。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-27\">6.2 开箱示例：「测试管理」\u003c/h3>\n\u003cp>装包时示例文件已自动落位宿主根（见 §2.4），启用只要两步：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// a) 宿主 config/route.php 注册（示例文件 MyTestController.php 头注释含完整写法）\nRouteControllerRegistry::registerMany([\n    // ...\n    &#39;/my-test&#39; =&gt; \\app\\controller\\admin\\api\\MyTestController::class,\n]);\n// b) 安装时已自动种好：my_test 表 + curd_configs 的 /my-test 配置 +「测试管理」菜单\n//    重启后打开后台即出现该菜单，直接可增删改查\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>全新项目\u003c/strong>：安装向导自动建表 + 补菜单 + 插 1 条示例数据，开箱即用。\u003c/li>\n\u003cli>\u003cstrong>已运行项目\u003c/strong>：跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等）即可补齐表与菜单；不想要就跳过。\u003c/li>\n\u003cli>\u003cstrong>删除\u003c/strong>：控制器 + \u003ccode>app/model/MyTest.php\u003c/code> + \u003ccode>bootstrap.php\u003c/code> 的「内置示例」注册段 +\nmenus 里的「测试管理」行 + \u003ccode>my_test\u003c/code> 表（控制器头注释含完整清单）。\u003c/li>\n\u003c/ul>\n\u003cp>这个示例同时是\u003cstrong>链路自检\u003c/strong>：登录 → 菜单 → 配置接口 → 数据接口 → 库表全通。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-28\">7. 业务库表结构 · 种子 · 增量 migration\u003c/h2>\n\u003ch3 id=\"h-29\">7.1 业务建表 SQL\u003c/h3>\n\u003cp>\u003ccode>install.sql\u003c/code> 默认只建认证/管理面那 8 张表。项目专有业务表（如 \u003ccode>hf_goods\u003c/code> /\n\u003ccode>mobile_recharge_orders\u003c/code>）由项目自带：放 \u003ccode>install-business.sql\u003c/code> 到项目根，\n语句间用 \u003ccode>--SPLIT--\u003c/code> 分隔，\u003ccode>CREATE TABLE IF NOT EXISTS\u003c/code> 保证幂等\n（此文件\u003cstrong>不\u003c/strong>打包进通用包）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># 单个文件\nphp plugin/curd/install.php --business-sql=install-business.sql\n\n# 多个文件（可重复或逗号分隔）\nphp plugin/curd/install.php \\\n  --business-sql=sql/admin.sql \\\n  --business-sql=sql/business.sql\n\n# 临时切换业务库连接（默认 config 的 business_connection，即 mysql_business）\nphp plugin/curd/install.php \\\n  --business-sql=install-business.sql \\\n  --business-connection=mysql_business_test\n\u003c/code>\u003c/pre>\n\u003cp>执行机制：\u003ccode>Install::install(false, $extraSqls)\u003c/code> → \u003ccode>Install::runSqlFile($content, $db, true)\u003c/code>\n（先把内容读入再传，避免路径被当 SQL 语句）。每条额外 SQL 走各自指定的 DB 连接，\n与认证库完全隔离。\u003c/p>\n\u003ch3 id=\"h-30\">7.2 业务种子（菜单 / 权限自动登记）\u003c/h3>\n\u003cp>新环境想「装完即带业务菜单」，把菜单 / 权限的种子 INSERT 直接追加到业务 SQL 里，\n全部用 \u003ccode>INSERT IGNORE\u003c/code> 保持幂等（\u003ccode>--SPLIT--\u003c/code> 分隔语句）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">-- install-business.sql（项目根；表结构部分见上一节）\n-- 菜单：path 必须与 RouteControllerRegistry 注册的路径一致\nINSERT IGNORE INTO menus (parent_id, title, icon, path, permission, sort, type, visible)\nVALUES (0, &#39;测试管理&#39;, &#39;Monitor&#39;, &#39;/my-test&#39;, &#39;curd:MyTest&#39;, 90, 1, 1);\n--SPLIT--\n-- 权限：admin 角色已带 p,admin,*,* 通配，通常只需给其它角色补\nINSERT IGNORE INTO casbin_rule (ptype, v0, v1, v2)\nVALUES (&#39;p&#39;, &#39;yunying&#39;, &#39;curd:MyTest&#39;, &#39;*&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>字段口径（与 \u003ccode>install.sql\u003c/code> 的 DDL 一致）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表\u003c/th>\n\u003cth>关键列\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>menus\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>parent_id\u003c/code>（0 = 顶级）、\u003ccode>title\u003c/code>（菜单名）、\u003ccode>icon\u003c/code>（Element Plus 图标名）、\u003ccode>path\u003c/code>（路由路径）、\u003ccode>permission\u003c/code>（权限标识）、\u003ccode>sort\u003c/code>、\u003ccode>type\u003c/code>（1 = 菜单项 / 2 = 子菜单容器）、\u003ccode>visible\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>casbin_rule\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>ptype\u003c/code>（\u003ccode>p\u003c/code> = 策略 / \u003ccode>g\u003c/code> = 角色继承）、\u003ccode>v0\u003c/code>（角色）、\u003ccode>v1\u003c/code>（obj）、\u003ccode>v2\u003c/code>（act）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>菜单的 \u003ccode>path\u003c/code> 推导权限标识的规则是 \u003ccode>curd.{Model}\u003c/code>；\u003ccode>permission\u003c/code> 留空时由后台\n「一键生成权限」按已注册的 CURD 页推导。详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">菜单与权限\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-31\">7.3 增量 migration（表结构演进）\u003c/h3>\n\u003cp>业务表结构变更用\u003cstrong>只追加\u003c/strong>的迁移文件，由 \u003ccode>plugin/curd/migrate.php\u003c/code> 驱动：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># 文件命名：plugin/curd/migrations/V{版本}__{描述}.sql，版本号升序，--SPLIT-- 分隔多语句\nphp plugin/curd/migrate.php                       # 跑全部未执行迁移\nphp plugin/curd/migrate.php --connection=mysql    # 指定连接\nphp plugin/curd/migrate.php --dry-run             # 预检\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>已执行版本记录进 \u003ccode>{连接库}._curd_migrations\u003c/code>（唯一约束，幂等）；\u003c/li>\n\u003cli>已发布版本\u003cstrong>只追加不修改\u003c/strong>，改结构请新建更高版本号文件；\u003c/li>\n\u003cli>详见 \u003ccode>plugin/curd/migrations/README.md\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-32\">8. 配置写在哪个文件\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>写在哪\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>数据库连接（\u003ccode>DB_HOST\u003c/code> / \u003ccode>DB_PORT\u003c/code> / \u003ccode>DB_NAME\u003c/code> / \u003ccode>DB_USER\u003c/code> / \u003ccode>DB_PASSWORD\u003c/code>）\u003c/td>\n\u003ctd>宿主 \u003ccode>.env\u003c/code>（由 \u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读取；向导会自动写）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件调参 + 站点信息 + 验证码 + 上传 + 导出上限\u003c/td>\n\u003ctd>宿主根 \u003cstrong>\u003ccode>config/curd-admin.php\u003c/code>\u003c/strong>（唯一入口）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>❌ 不再读取\u003c/td>\n\u003ctd>\u003ccode>config/curd.php\u003c/code>、\u003ccode>config/admin.php\u003c/code>（2026-09-19 已合并，存在也不生效）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>配置改完\u003cstrong>必须重启 webman\u003c/strong>（启动期读取）；只有 \u003ccode>site\u003c/code> / \u003ccode>home_page\u003c/code> / \u003ccode>captcha_*\u003c/code>\n这几项无需重建前端。全部键位与默认值见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\">配置参考\u003c/a>。\u003c/p>\n"},{"file":"02-配置参考.md","title":"配置参考","mtime":"2026/9/20 22:06:22","headings":[{"depth":2,"text":"1. 配置从哪读、谁能覆盖谁","id":"h-34"},{"depth":2,"text":"2. 数据库连接","id":"h-35"},{"depth":3,"text":"想真正分库 / 想去掉 mysql_business","id":"h-36"},{"depth":2,"text":"3. 插件调参键（全量）","id":"h-37"},{"depth":2,"text":"4. 宿主管家键","id":"h-38"},{"depth":3,"text":"4.1 站点信息 site","id":"h-39"},{"depth":3,"text":"4.2 默认落地页 home_page","id":"h-40"},{"depth":3,"text":"4.3 上传与静态资源","id":"h-41"},{"depth":3,"text":"4.4 导出与验证码","id":"h-42"},{"depth":2,"text":"5. 路由「宿主优先」机制","id":"h-43"},{"depth":2,"text":"6. 内置前端与 page_base","id":"h-44"},{"depth":2,"text":"7. 环境变量一览","id":"h-45"}],"html":"\u003ch1 id=\"h-33\">配置参考\u003c/h1>\n\u003cp>全部可调点、默认值与覆盖规则。\u003cstrong>改完必须重启 webman\u003c/strong>（配置在启动期读取）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-34\">1. 配置从哪读、谁能覆盖谁\u003c/h2>\n\u003cp>插件以「\u003cstrong>根目录应用插件\u003c/strong>」形式分发（\u003ccode>{项目}/plugin/curd\u003c/code>），而 webman 的配置加载顺序是\n\u003ccode>config/\u003c/code> 先、\u003ccode>plugin/*/config\u003c/code> 后 —— 也就是说\u003cstrong>插件自带的配置会覆盖\n\u003ccode>config/plugin/curd/curd.php\u003c/code>\u003c/strong>。所以调参不能写在 \u003ccode>config/plugin/curd/\u003c/code> 里。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>优先级（高 → 低）\u003c/th>\n\u003cth>位置\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>宿主根 \u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>唯一推荐入口\u003c/strong>，\u003ccode>composer require\u003c/code> / Web 向导自动生成模板\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/config/curd.php\u003c/code> 的 \u003ccode>$defaults\u003c/code>\u003c/td>\n\u003ctd>插件内置默认，随包升级整体替换，\u003cstrong>不要改这里\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>合并逻辑（\u003ccode>plugin/curd/config/curd.php\u003c/code> 末尾）：宿主文件存在就\n\u003ccode>array_merge($defaults, $hostCurd)\u003c/code> —— \u003cstrong>同名顶层键被宿主覆盖，没写的键保持默认\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>旧的 \u003ccode>config/curd.php\u003c/code> 与 \u003ccode>config/admin.php\u003c/code> 已不再读取\u003c/strong>（2026-09-19 合并为一个文件）。\n这两个文件即使存在也不生效。排查「配置改了没反应」时，先确认改的是不是\n\u003ccode>config/curd-admin.php\u003c/code>，再确认有没有 \u003ccode>restart\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>插件内部读取分两类：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键的类型\u003c/th>\n\u003cth>读取方式\u003c/th>\n\u003cth>举例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>插件调参键\u003c/strong>\u003c/td>\n\u003ctd>合并进 \u003ccode>config(&#39;plugin.curd.curd.*&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>page_base\u003c/code>、\u003ccode>admin_require_permission\u003c/code>、\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>宿主管家键\u003c/strong>\u003c/td>\n\u003ctd>直接读 \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>site\u003c/code>、\u003ccode>home_page\u003c/code>、\u003ccode>upload_path\u003c/code>、\u003ccode>captcha_*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-35\">2. 数据库连接\u003c/h2>\n\u003cp>\u003cstrong>数据库信息只写在宿主 \u003ccode>.env\u003c/code> 的 5 个键\u003c/strong>，由 \u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读取：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=webman_curd\nDB_USER=root\nDB_PASSWORD=your_password\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>单库架构\u003c/strong>：认证表（\u003ccode>admin_users\u003c/code> / \u003ccode>admin_tokens\u003c/code> / \u003ccode>roles\u003c/code> / \u003ccode>admin_role_user\u003c/code> /\n\u003ccode>role_permission\u003c/code> / \u003ccode>casbin_rule\u003c/code> / \u003ccode>curd_configs\u003c/code> / \u003ccode>menus\u003c/code>）与业务表放\u003cstrong>同一个库\u003c/strong>，\n已无 \u003ccode>DB_BUSINESS_NAME\u003c/code>、无「分库选项 / 同库勾选」。\u003c/li>\n\u003cli>\u003ccode>mysql_business\u003c/code> 连接\u003cstrong>仍然保留\u003c/strong>（兼容已写死 \u003ccode>$connection = &#39;mysql_business&#39;\u003c/code> 的模型），\n其 \u003ccode>database\u003c/code> 与 \u003ccode>mysql\u003c/code> 相同（= \u003ccode>DB_NAME\u003c/code>），两个连接指向同一库，零额外开销。\u003c/li>\n\u003cli>\u003ccode>.env\u003c/code> 不进 git。Web 安装向导写 \u003ccode>.env\u003c/code> 时是\u003cstrong>按键合并\u003c/strong>，不会动其它键。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-36\">想真正分库 / 想去掉 mysql_business\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目标\u003c/th>\n\u003cth>做法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>分库\u003c/td>\n\u003ctd>在 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>database.business_db\u003c/code> 填不同库名，然后重装向导或手动改 \u003ccode>config/database.php\u003c/code>；\u003ccode>.env\u003c/code> 保留 \u003ccode>DB_BUSINESS_NAME\u003c/code> 即可（插件只认 \u003ccode>admin_connection\u003c/code> / \u003ccode>business_connection\u003c/code> 两个\u003cstrong>连接名\u003c/strong>，两个连接都定义着就不冲突）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>切回单库\u003c/td>\n\u003ctd>去掉 \u003ccode>.env\u003c/code> 的 \u003ccode>DB_BUSINESS_NAME\u003c/code>，把 \u003ccode>config/database.php\u003c/code> 里 \u003ccode>mysql_business.database\u003c/code> 改成 \u003ccode>env(&#39;DB_NAME&#39;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不要这个连接\u003c/td>\n\u003ctd>在 \u003ccode>config/database.php\u003c/code> 删掉 \u003ccode>&#39;mysql_business&#39; =&gt; [...]\u003c/code> 整块；业务代码里出现 \u003ccode>Db::connection(&#39;mysql_business&#39;)\u003c/code> 的改成 \u003ccode>mysql\u003c/code>，或在每个模型里 \u003ccode>protected $connection = &#39;mysql&#39;;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-37\">3. 插件调参键（全量）\u003c/h2>\n\u003cp>默认值取自 \u003ccode>plugin/curd/config/curd.php\u003c/code> 的 \u003ccode>$defaults\u003c/code>；在宿主 \u003ccode>config/curd-admin.php\u003c/code>\n写\u003cstrong>同名顶层键\u003c/strong>即可覆盖。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>配置键\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>admin_connection\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>mysql\u003c/code>\u003c/td>\n\u003ctd>认证 / 菜单 / RBAC 库\u003cstrong>连接名\u003c/strong>（认证表所在库）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>business_connection\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>mysql_business\u003c/code>\u003c/td>\n\u003ctd>业务模型 CURD 默认连接名（单库下与 \u003ccode>mysql\u003c/code> 同库）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{根}/app/model\u003c/code>\u003c/td>\n\u003ctd>宿主业务模型扫描目录（自动登记进 \u003ccode>ModelRegistry\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>model_namespace\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>app\\model\u003c/code>\u003c/td>\n\u003ctd>模型命名空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>controller_dirs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>app/controller/api\u003c/code> + \u003ccode>app/controller/admin/api\u003c/code>\u003c/td>\n\u003ctd>CURD 业务控制器扫描目录（继承 \u003ccode>BaseCurdController\u003c/code> 会自动关联模型）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vue_pages_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{根}/app/custom/pages\u003c/code>\u003c/td>\n\u003ctd>宿主业务 \u003ccode>.vue\u003c/code> 页面目录（\u003ccode>CustomPageController\u003c/code> 读取分发）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>casbin_model_path\u003c/code>\u003c/td>\n\u003ctd>插件自带 \u003ccode>config/casbin.conf\u003c/code>\u003c/td>\n\u003ctd>casbin 模型文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>base_model_class\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>plugin\\curd\\app\\model\\BaseModel\u003c/code>\u003c/td>\n\u003ctd>运行时动态生成模型的基类；宿主有增强版可改回 \u003ccode>app\\model\\BaseModel\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>allow_unresolved\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>推导不出权限标识的路径：\u003ccode>true\u003c/code> = 仅登录放行 / \u003ccode>false\u003c/code> = 403\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>export_max_rows\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>100000\u003c/code>\u003c/td>\n\u003ctd>单次导出最大行数（\u003ccode>&lt;= 0\u003c/code> 不限制）；超限返回 \u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;本次将导出 N 条，超过单次导出上限 M 条...&quot;}\u003c/code>，前端当错误提示而非下载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>error_message\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>服务内部错误\u003c/code>\u003c/td>\n\u003ctd>线上异常兜底的提示文案（编号自动追加）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>home_page\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/dashboard\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>默认落地页\u003c/strong>（登录成功后、以及访问后台根路径 / 刷新时打开哪一页）；详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"5\">菜单与权限\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>登录页是否显示图形验证码（关掉即前端不渲染、后端也不校验）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_ttl\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>300\u003c/code>\u003c/td>\n\u003ctd>验证码有效期（秒）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>captcha_length\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>4\u003c/code>\u003c/td>\n\u003ctd>验证码位数（3~6，越界回落 4；字符集已剔除易混的 \u003ccode>i l o 0 1\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>admin_require_permission\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/api/admin/*\u003c/code> 是否强制 RBAC 校验；\u003cstrong>生产建议 \u003ccode>true\u003c/code>\u003c/strong>（admin 角色有 \u003ccode>p,admin,*,*\u003c/code> 不受影响）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_provider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DefaultAuthProvider\u003c/code>\u003c/td>\n\u003ctd>登录提供方（可插拔，实现 \u003ccode>AuthProviderInterface\u003c/code>）；详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">认证与登录\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&#39;&#39;\u003c/code>（不启用）\u003c/td>\n\u003ctd>账号状态钩子（实现 \u003ccode>AuthStateGuardInterface\u003c/code>），在账号自身 \u003ccode>status\u003c/code> 之外叠加业务判定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>login_handler\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&#39;&#39;\u003c/code>（用内置）\u003c/td>\n\u003ctd>接管整个 \u003ccode>/api/auth/login\u003c/code> 的类名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>permission_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>权限总开关：\u003ccode>false\u003c/code> = 全部放行，且不生成 / 不下发任何权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>page_base\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/app/curd\u003c/code>\u003c/td>\n\u003ctd>内置前端 URL 前缀（改需同步用同 \u003ccode>VITE_BASE_PATH\u003c/code> 重建前端）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>public_dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/public\u003c/code>\u003c/td>\n\u003ctd>内置前端产物目录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-38\">4. 宿主管家键\u003c/h2>\n\u003cp>这些键\u003cstrong>直接读 \u003ccode>config(&#39;curd-admin.*&#39;)\u003c/code>\u003c/strong>（不走 \u003ccode>plugin.curd.curd.*\u003c/code>），同样写在\n\u003ccode>config/curd-admin.php\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-39\">4.1 站点信息 \u003ccode>site\u003c/code>\u003c/h3>\n\u003cp>前端 \u003ccode>/api/config/site\u003c/code> 读取，用于侧边栏 logo、登录页、浏览器标签：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&#39;site&#39; =&gt; [\n    &#39;title&#39;     =&gt; &#39;话费充值系统&#39;,             // 站点标题（logo 文字 / 登录页 / 浏览器标签）\n    &#39;logo&#39;      =&gt; &#39;Monitor&#39;,                 // logo_type=icon 时为 el-icon 组件名；=image 时为图片 URL\n    &#39;logo_type&#39; =&gt; &#39;icon&#39;,                    // icon | image\n    &#39;copyright&#39; =&gt; &#39;© 2022-2026 话费充值系统&#39;, // 页脚版权\n    &#39;favicon&#39;   =&gt; &#39;&#39;,                        // 浏览器标签图标 URL（空 = 用默认 favicon）\n],\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-40\">4.2 默认落地页 \u003ccode>home_page\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">&#39;home_page&#39; =&gt; &#39;/custom-page/home&#39;,   // 写「不含部署前缀」的相对路径\n// &#39;/dashboard&#39; → 内置首页（插件默认值）\n// 也可写完整 URL（http://...），前端整页跳转\n\u003c/code>\u003c/pre>\n\u003cp>优先级：\u003ccode>home_page\u003c/code> → \u003ccode>site.home_page\u003c/code> → 插件默认 \u003ccode>/dashboard\u003c/code>。\n改完\u003cstrong>即生效\u003c/strong>（前端每次启动都拉 \u003ccode>/api/config/site\u003c/code>），\u003cstrong>无需重建前端\u003c/strong>。\n只决定「打开哪一页」，不校验用户有没有该页面的菜单 / 权限。\u003c/p>\n\u003ch3 id=\"h-41\">4.3 上传与静态资源\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>示例\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>upload_path\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>uploads\u003c/code>\u003c/td>\n\u003ctd>上传目录（相对 \u003ccode>public\u003c/code>）；\u003ccode>local\u003c/code> 驱动存本机 \u003ccode>public/&lt;upload_path&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>upload_driver\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>local\u003c/code>\u003c/td>\n\u003ctd>存储驱动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image_server\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>http://127.0.0.1:8787/\u003c/code>\u003c/td>\n\u003ctd>图片 / 静态资源前缀，DSL 列与表单的 \u003ccode>staticHost\u003c/code> 拼装用它，可被 \u003ccode>-&gt;staticHost(&#39;...&#39;)\u003c/code> 单独覆盖\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-42\">4.4 导出与验证码\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">&#39;export_max_rows&#39; =&gt; 100000,   // 0 = 不限制；调小可防「全表导出」拖垮服务（同步查询 + 内存拼 CSV）\n&#39;captcha_enabled&#39; =&gt; true,     // false = 登录页完全不显示验证码，登录接口也不再校验\n&#39;captcha_ttl&#39;     =&gt; 300,      // 有效期（秒）\n&#39;captcha_length&#39;  =&gt; 4,        // 位数 3~6\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>验证码明文存 \u003cstrong>Redis\u003c/strong>（key \u003ccode>curd_captcha:{随机串}\u003c/code>，一次性，校验后即删）。\n\u003cstrong>Redis 挂了就没人能登录\u003c/strong> —— 应急把它设为 \u003ccode>false\u003c/code> 并重启即可放行。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-43\">5. 路由「宿主优先」机制\u003c/h2>\n\u003cp>webman 的 \u003ccode>Route\u003c/code> 对「同 method + 同 path」重复注册会\u003cstrong>直接抛异常\u003c/strong>（\u003ccode>Route conflict\u003c/code>）。\n插件因此统一用 \u003ccode>curd_route()\u003c/code> 注册路由：注册前检测该路径是否已被注册，\u003cstrong>已注册则跳过，\n保留宿主实现\u003c/strong>。\u003c/p>\n\u003cul>\n\u003cli>路由加载顺序：宿主 \u003ccode>config/route.php\u003c/code> → \u003ccode>plugin/{name}/config/route.php\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>存量项目\u003c/strong>（自己注册过 \u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/config/site\u003c/code> 等）：装插件不冲突、行为不变，\n继续走宿主控制器；\u003c/li>\n\u003cli>\u003cstrong>新项目\u003c/strong>：无同名路由，插件路由全部生效 —— \u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code>、\n\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/custom/*\u003c/code>、\u003ccode>/api/options/*\u003c/code>、\u003ccode>/api/upload\u003c/code>、\u003ccode>/app/curd/*\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-44\">6. 内置前端与 \u003ccode>page_base\u003c/code>\u003c/h2>\n\u003cp>内置前端（Vue3 + Element Plus）的 dist 已放进 \u003ccode>plugin/curd/public/\u003c/code>，由\n\u003ccode>plugin/curd/app/controller/PageController.php\u003c/code> 承载：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>/app/curd/*\u003c/code> 下真实存在的文件按静态资源返回；\u003c/li>\n\u003cli>其余路径（vue-router history 路由，如 \u003ccode>/app/curd/dashboard\u003c/code>）回退 \u003ccode>index.html\u003c/code>；\u003c/li>\n\u003cli>\u003ccode>PageController\u003c/code> 做了\u003cstrong>路径穿越防护\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>改前缀：\u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>page_base\u003c/code>（默认 \u003ccode>/app/curd\u003c/code>），\n\u003cstrong>必须用相同的 \u003ccode>VITE_BASE_PATH\u003c/code> 重新构建前端\u003c/strong>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">VITE_BASE_PATH=/your-prefix VITE_API_BASE_URL= VITE_API_ENCRYPT=false npm run build\n\u003c/code>\u003c/pre>\n\u003cp>存量 OSS / CDN 部署不受影响：不设 \u003ccode>VITE_BASE_PATH\u003c/code> 时 vite base 与旧版一致（\u003ccode>/\u003c/code> 或 OSS URL）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-45\">7. 环境变量一览\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变量\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DB_HOST\u003c/code> \u003ccode>DB_PORT\u003c/code> \u003ccode>DB_NAME\u003c/code> \u003ccode>DB_USER\u003c/code> \u003ccode>DB_PASSWORD\u003c/code>\u003c/td>\n\u003ctd>数据库连接（\u003cstrong>唯一必填组\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>APP_DEBUG\u003c/code>\u003c/td>\n\u003ctd>决定 \u003ccode>/api\u003c/code> 异常兜底走「本地暴露」还是「线上 500 + 编号」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>API_ENCRYPT\u003c/code>\u003c/td>\n\u003ctd>后端接口解密开关，\u003cstrong>默认 \u003ccode>true\u003c/code>\u003c/strong>，\u003ccode>.env\u003c/code> 设 \u003ccode>false\u003c/code> 才关（详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">接口加密与异常兜底\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>❌ \u003cstrong>\u003ccode>CURD_*\u003c/code> 环境变量已全部移除\u003c/strong>。历史上的 \u003ccode>CURD_ADMIN_CONNECTION\u003c/code> /\n\u003ccode>CURD_BUSINESS_CONNECTION\u003c/code> / \u003ccode>CURD_ADMIN_REQUIRE_PERMISSION\u003c/code> 等已不再读取 ——\n插件调参统一收敛到宿主 \u003ccode>config/curd-admin.php\u003c/code>。\u003c/p>\n\u003cp>前端构建期变量（\u003ccode>VITE_BASE_PATH\u003c/code> / \u003ccode>VITE_API_BASE_URL\u003c/code> / \u003ccode>VITE_API_ENCRYPT\u003c/code> /\n\u003ccode>VITE_API_RSA_PUBLIC_KEY\u003c/code>）不是运行期配置，只在 \u003ccode>npm run build\u003c/code> 时内联。\n完整键清单见 \u003ccode>plugin/curd/env.example\u003c/code>（\u003cstrong>参考用，勿整文件覆盖宿主 \u003ccode>.env\u003c/code>\u003c/strong>）。\u003c/p>\n\u003c/blockquote>\n"},{"file":"03-DSL-Schema页面.md","title":"后台 DSL · Schema 页面","mtime":"2026/9/20 22:29:17","headings":[{"depth":2,"text":"1. 一句话原理","id":"h-47"},{"depth":2,"text":"2. 新建一个页面（三步）","id":"h-48"},{"depth":2,"text":"3. 页面根 PageSchema","id":"h-49"},{"depth":2,"text":"4. 布局块（可任意嵌套）","id":"h-50"},{"depth":2,"text":"5. 容器块（能继续装子节点）","id":"h-51"},{"depth":2,"text":"6. 展示块（叶子，靠 props 驱动）","id":"h-52"},{"depth":2,"text":"7. 数据绑定：{{key.path}} 注入","id":"h-53"},{"depth":2,"text":"8. props 白名单与安全","id":"h-54"},{"depth":2,"text":"9. 渲染链路（改后端即生效，无需构建前端）","id":"h-55"},{"depth":2,"text":"10. 扩展新组件（前后端各一步）","id":"h-56"},{"depth":2,"text":"11. .vue 自定义页面（app/custom/pages/）—— 怎么用、怎么访问","id":"h-57"},{"depth":2,"text":"12. 完整示例：做一个「我的信息」页","id":"h-58"}],"html":"\u003ch1 id=\"h-46\">后台 DSL · Schema 页面\u003c/h1>\n\u003cblockquote>\n\u003cp>展示型页面（首页 / 看板）：后端 PHP 声明组件树 → 前端 \u003ccode>SchemaRenderer\u003c/code> 递归渲染。\n\u003cstrong>纯数据、无脚本\u003c/strong>，改后端即生效、前端无需重新构建。\n对应的 CURD 列表页 DSL 见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"4\">DSL · CURD 页面\u003c/a>，分层与文件归属见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"0\">webman-curd-admin · 总览与导航\u003c/a> 的 §3。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-47\">1. 一句话原理\u003c/h2>\n\u003cp>一个页面 = 后端 PHP DSL 流式声明的一棵\u003cstrong>组件树 JSON\u003c/strong>，前端 \u003ccode>SchemaRenderer\u003c/code> 递归把它渲染成真实 Element Plus 页面。树节点统一为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ &quot;type&quot;: &quot;card&quot;, &quot;props&quot;: { &quot;header&quot;: &quot;今日概览&quot; }, &quot;children&quot;: [ … ] }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>type\u003c/code> 在\u003cstrong>前后端注册表\u003c/strong>里登记（后端 \u003ccode>plugin/curd/app/schema/blocks/\u003c/code> 的类，前端 \u003ccode>frontend/src/schema/componentRegistry.js\u003c/code>），\u003ccode>props\u003c/code> 走白名单透传。\u003cstrong>Schema 是纯数据、无脚本\u003c/strong>，比自定义 .vue 更可控。\u003c/p>\n\u003ch2 id=\"h-48\">2. 新建一个页面（三步）\u003c/h2>\n\u003cp>\u003cstrong>① 写页面类\u003c/strong>（用户级文件放 \u003ccode>app/controller/admin/api/\u003c/code>，命名如 \u003ccode>XxxPage.php\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\admin\\api;\n\nuse plugin\\curd\\app\\schema\\PageSchema;\nuse plugin\\curd\\app\\schema\\blocks\\Col;\nuse plugin\\curd\\app\\schema\\blocks\\Card;\nuse plugin\\curd\\app\\schema\\blocks\\Row;\n\nclass DashPage\n{\n    public static function schema(): PageSchema\n    {\n        $page = new PageSchema(&#39;概览看板&#39;);\n        $page-&gt;api(&#39;stats&#39;, &#39;/api/dash/stats&#39;);            // ① 数据接口（可多个）\n        $page-&gt;row(function (Row $row) {                   // ② 布局：24 栏栅格\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;今日&#39;, function (Card $card) {\n                    $card-&gt;statistic(&#39;充值额&#39;)-&gt;value(&#39;{{stats.amount}}&#39;)-&gt;prefix(&#39;¥&#39;);\n                });\n            });\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;提示&#39;, function (Card $card) {\n                    $card-&gt;alert(&#39;正常&#39;, &#39;一切正常&#39;)-&gt;type(&#39;success&#39;)-&gt;closable(false);\n                });\n            });\n        });\n        return $page;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 注册\u003c/strong>（业务 \u003ccode>config/route.php\u003c/code> 顶部，一行）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">PageRegistry::register(&#39;dash&#39;, [\\app\\controller\\admin\\api\\DashPage::class, &#39;schema&#39;]);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 建菜单\u003c/strong>，\u003ccode>path\u003c/code> 填 \u003ccode>/custom-page/dash\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php webman make:permission --name 概览看板 --slug dash-page --type 1 --path /custom-page/dash --icon DataBoard --sort 3\n\u003c/code>\u003c/pre>\n\u003cp>改完 \u003ccode>php start.php restart\u003c/code>（新类 + 注册生效），刷新即可看到页面。\u003cstrong>已注册的参考实现\u003c/strong>：\u003ccode>app/controller/admin/api/HomePage.php\u003c/code>（首页，name=\u003ccode>home\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003ccode>.vue\u003c/code> 自定义页面是同一入口体系的另一形态：文件放 \u003ccode>app/custom/pages/demo.vue\u003c/code>，菜单 path \u003ccode>/custom-page/demo\u003c/code>，前端运行时编译渲染（复杂交互页用）。同名时 \u003cstrong>Schema 注册表优先\u003c/strong>于 .vue 文件。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-49\">3. 页面根 PageSchema\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new PageSchema(?string $title)\u003c/code>\u003c/td>\n\u003ctd>页面根节点（type=\u003ccode>page\u003c/code>，不参与渲染，只承载 title/dataApi/body）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code>\u003c/td>\n\u003ctd>页面标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;api(string $key, string $url, string $method = &#39;get&#39;, array $params = [])\u003c/code>\u003c/td>\n\u003ctd>声明数据接口。渲染前前端并发请求，结果放进 \u003ccode>pageData[$key]\u003c/code>，供 \u003ccode>{{key.xxx}}\u003c/code> 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;row/col/card/collapse/timeline/descriptions/divider/alert/statistic/image/text/copyText/box/lineChartStat/node\u003c/code>\u003c/td>\n\u003ctd>顶层挂载（来自 \u003ccode>HasBlocks\u003c/code> trait，下面节点通用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;toArray()\u003c/code>\u003c/td>\n\u003ctd>输出 \u003ccode>{ title, dataApi, body }\u003c/code>，由 CustomPageController 下发\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"h-50\">4. 布局块（可任意嵌套）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>透传 prop（白名单）\u003c/th>\n\u003cth>取值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;gutter(int)\u003c/code> \u003ccode>-&gt;justify(str)\u003c/code> \u003ccode>-&gt;align(str)\u003c/code>\u003c/td>\n\u003ctd>gutter/justify/align/wrap\u003c/td>\n\u003ctd>justify: start/end/center/space-around/space-between/space-evenly；align: top/middle/bottom\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;span(int 1-24)\u003c/code> \u003ccode>-&gt;offset(int)\u003c/code> \u003ccode>-&gt;moveRight(int)\u003c/code>(push) \u003ccode>-&gt;moveLeft(int)\u003c/code>(pull) \u003ccode>-&gt;responsive(&#39;md&#39;, 8)\u003c/code>\u003c/td>\n\u003ctd>span/offset/push/pull/xs/sm/md/lg/xl\u003c/td>\n\u003ctd>响应式断点同 el-col\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>子节点规则：\u003ccode>row\u003c/code> 装 \u003ccode>col\u003c/code>；\u003ccode>col\u003c/code> 纵向堆叠任意块。想缩进偏移用 \u003ccode>offset\u003c/code>，想调整顺序用 \u003ccode>moveRight/moveLeft\u003c/code>。\u003c/p>\n\u003ch2 id=\"h-51\">5. 容器块（能继续装子节点）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>子节点规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;header(string)\u003c/code>（渲染到 EP 卡片 header 插槽） \u003ccode>-&gt;shadow(&#39;always&#39;|&#39;hover&#39;|&#39;never&#39;)\u003c/code>\u003c/td>\n\u003ctd>children 进卡片正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;accordion(bool)\u003c/code> \u003ccode>-&gt;active(array $names)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(title, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CollapseItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code> \u003ccode>-&gt;name(string)\u003c/code> \u003ccode>-&gt;disabled(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children（可再嵌 row/card/描述…）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Timeline\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(ts, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>TimelineItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;timestamp(string)\u003c/code> \u003ccode>-&gt;placement(&#39;top&#39;|&#39;bottom&#39;)\u003c/code> \u003ccode>-&gt;type(&#39;primary&#39;|&#39;success&#39;|&#39;warning&#39;|&#39;danger&#39;|&#39;info&#39;)\u003c/code> \u003ccode>-&gt;color(string)\u003c/code> \u003ccode>-&gt;hollow(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;column(int)\u003c/code> \u003ccode>-&gt;border(bool)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;colon(bool)\u003c/code> \u003ccode>-&gt;size(&#39;large&#39;|&#39;default&#39;|&#39;small&#39;)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(label, content)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DescriptionsItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;span(int)\u003c/code> \u003ccode>-&gt;width(mixed)\u003c/code>\u003c/td>\n\u003ctd>值内容放 children；\u003ccode>item()\u003c/code> 传字符串自动转 Text 子节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;content(string)\u003c/code>（中央文字） \u003ccode>-&gt;contentPosition(&#39;left&#39;|&#39;center&#39;|&#39;right&#39;)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;borderStyle(str)\u003c/code>\u003c/td>\n\u003ctd>中央文字用 \u003ccode>content()\u003c/code>，子节点作默认插槽\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>条目类（\u003ccode>*-item\u003c/code>）\u003cstrong>只能\u003c/strong>作为对应容器（collapse/timeline/descriptions）的直接子节点，不可隔层——渲染器用单组件 \u003ccode>h()\u003c/code> 递归保证它们是父容器的直接相邻 VNode。\u003c/p>\n\u003ch2 id=\"h-52\">6. 展示块（叶子，靠 props 驱动）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;description(str)\u003c/code> \u003ccode>-&gt;type(&#39;success&#39;|&#39;info&#39;|&#39;warning&#39;|&#39;error&#39;)\u003c/code> \u003ccode>-&gt;closable(bool)\u003c/code> \u003ccode>-&gt;showIcon(bool)\u003c/code> \u003ccode>-&gt;center(bool)\u003c/code> \u003ccode>-&gt;effect(&#39;light&#39;|&#39;dark&#39;)\u003c/code>\u003c/td>\n\u003ctd>提示条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;prefix(str)\u003c/code> \u003ccode>-&gt;suffix(str)\u003c/code> \u003ccode>-&gt;precision(int)\u003c/code> \u003ccode>-&gt;groupSeparator(str)\u003c/code> \u003ccode>-&gt;valueStyle(array)\u003c/code>\u003c/td>\n\u003ctd>数值卡；value 整串 \u003ccode>{{}}\u003c/code> 且为数字时自动转 number\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;sub(str, $v=null)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;subValue($v)\u003c/code> \u003ccode>-&gt;icon(str)\u003c/code> \u003ccode>-&gt;color(str)\u003c/code> \u003ccode>-&gt;tag(str)\u003c/code> \u003ccode>-&gt;height(int=108)\u003c/code> \u003ccode>-&gt;group(bool=false)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>指标卡片\u003c/strong>：图标 + 大数字 + 副标题 + 右上角周期标记，仪表盘顶部并排四个的经典形态。\u003ccode>icon\u003c/code> 取 EP 图标名（\u003ccode>View\u003c/code>/\u003ccode>Money\u003c/code>/\u003ccode>User\u003c/code>/\u003ccode>Tickets\u003c/code>…，见前端 \u003ccode>utils/icons\u003c/code>）；\u003ccode>color\u003c/code> 取 \u003ccode>blue\u003c/code>/\u003ccode>green\u003c/code>/\u003ccode>red\u003c/code>/\u003ccode>orange\u003c/code>/\u003ccode>purple\u003c/code>/\u003ccode>cyan\u003c/code>，同时决定图标底色与标记配色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LineChartStat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;data(array|str)\u003c/code> \u003ccode>-&gt;categories(array|str)\u003c/code> \u003ccode>-&gt;seriesName(str=&#39;业绩&#39;)\u003c/code> \u003ccode>-&gt;color(str=&#39;#36cfc9&#39;)\u003c/code> \u003ccode>-&gt;height(int=350)\u003c/code> \u003ccode>-&gt;smooth(bool=true)\u003c/code> \u003ccode>-&gt;showMax(bool=true)\u003c/code> \u003ccode>-&gt;showAverage(bool=true)\u003c/code> \u003ccode>-&gt;areaGradient(bool=true)\u003c/code> \u003ccode>-&gt;unit(str)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>折线图统计卡\u003c/strong>：卡片标题 + 子标题 + 渐变面积折线图（峰值气泡 + 平均值虚线）。\u003ccode>data\u003c/code> 走 echarts 按需注册（不引入全量），\u003cstrong>取不到数据时显示「暂无数据」空态\u003c/strong>而非空图；鼠标悬停按\u003cstrong>轴触发\u003c/strong>给 tooltip（整列读数 + 虚线指示），\u003ccode>unit\u003c/code> 有值时读数自动带单位，\u003ccode>seriesName\u003c/code> 即 tooltip 里的系列名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;src(str)\u003c/code> \u003ccode>-&gt;fit(&#39;fill&#39;|&#39;contain&#39;|&#39;cover&#39;|&#39;none&#39;|&#39;scale-down&#39;)\u003c/code> \u003ccode>-&gt;alt(str)\u003c/code> \u003ccode>-&gt;lazy(bool)\u003c/code> \u003ccode>-&gt;previewSrcList(array)\u003c/code> \u003ccode>-&gt;previewTeleported(bool)\u003c/code>\u003c/td>\n\u003ctd>点击预览大图等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>copy-text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CopyText\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code> \u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;mono(bool=true)\u003c/code> \u003ccode>-&gt;mask(bool=false)\u003c/code> \u003ccode>-&gt;maskHead(int=4)\u003c/code> \u003ccode>-&gt;maskTail(int=4)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>可复制文本\u003c/strong>：等宽展示 + 一键复制按钮，用于 api_key / 密钥 / 回调地址等长串；\u003ccode>-&gt;mask(true)\u003c/code> 默认打码，配眼睛按钮切换明文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code>（也可 \u003ccode>new Text(&#39;内容&#39;)\u003c/code>）\u003c/td>\n\u003ctd>纯文本（渲染 span，非 EP 组件），说明文字用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>仪表盘组合示例\u003c/strong>（\u003ccode>box\u003c/code> 一排四个 + \u003ccode>line-chart-stat\u003c/code> 整行，即典型后台首页首屏）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 第一行：四个指标卡片\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;今日订单&#39;, &#39;{{stats.today_count}}&#39;)\n            -&gt;sub(&#39;今日成功&#39;, &#39;{{stats.today_success_count}}&#39;)\n            -&gt;icon(&#39;Tickets&#39;)-&gt;color(&#39;blue&#39;)-&gt;tag(&#39;日&#39;);\n    });\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;本月金额&#39;, &#39;{{stats.month_amount}}&#39;)\n            -&gt;sub(&#39;本月成功单金额&#39;)\n            -&gt;icon(&#39;Money&#39;)-&gt;color(&#39;green&#39;)-&gt;tag(&#39;月&#39;);\n    });\n    // … 另两个同理（red / orange）\n});\n\n// 第二行：折线图统计卡（data / categories 均可直接传数组或占位符）\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(24, function (Col $col) {\n        $col-&gt;lineChartStat(&#39;订单趋势&#39;)\n            -&gt;subTitle(&#39;近 30 天成功单走势&#39;)\n            -&gt;data(&#39;{{stats.trend_counts}}&#39;)      // 数据接口返回数组 → 整串注入\n            -&gt;categories(&#39;{{stats.trend_days}}&#39;)\n            -&gt;seriesName(&#39;成功单&#39;)\n            -&gt;color(&#39;#36cfc9&#39;);\n    });\n});\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>data\u003c/code> 的两种写法：① \u003ccode>-&gt;data(&#39;{{stats.trend_counts}}&#39;)\u003c/code> 由 dataApi 注入（推荐）；\n② \u003ccode>-&gt;data([20, 25, 30, …])\u003c/code> 直接写静态数组（适合演示或常量数据）。\u003ccode>categories\u003c/code> 省略时自动用 \u003ccode>1..n\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-53\">7. 数据绑定：\u003ccode>{{key.path}}\u003c/code> 注入\u003c/h2>\n\u003col>\n\u003cli>页面 \u003ccode>-&gt;api(&#39;stats&#39;, &#39;/api/xxx&#39;)\u003c/code> 声明数据源；数据接口就是一个普通控制器方法，返回统一响应 \u003ccode>{code, msg, data}\u003c/code>，渲染前前端并发请求并取 \u003cstrong>\u003ccode>data\u003c/code>\u003c/strong> 作为 \u003ccode>pageData[&#39;stats&#39;]\u003c/code>。\u003c/li>\n\u003cli>任一节点 props 的字符串里可用 \u003ccode>{{stats.today_amount}}\u003c/code> 占位：\u003cul>\n\u003cli>\u003cstrong>整串就是占位符\u003c/strong>（如 \u003ccode>value: &quot;{{stats.amount}}&quot;\u003c/code>）：数据是数字 → 注入数字（statistic 需要）；是对象/数组 → 原样注入；取不到 → \u003cstrong>保留原文\u003c/strong>（避免渲染出 undefined）；\u003c/li>\n\u003cli>占位符\u003cstrong>嵌在长文本\u003c/strong>里（如 \u003ccode>&quot;¥{{stats.amount}} 元&quot;\u003c/code>）→ 文本替换，取不到替换为空串。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>只做取值替换，不执行任何 JS\u003c/strong>。单个 dataApi 失败不阻塞整页（该键数据为空，占位保留便于定位）。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>参考数据接口：\u003ccode>SchemaPageDataController::home\u003c/code>（GET \u003ccode>/api/schema/home/stats\u003c/code>），返回 \u003ccode>today_amount / today_count / month_amount / pending_count / account_total / account_count / accounts[]\u003c/code>，与订单列表头部汇总条同口径。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-54\">8. props 白名单与安全\u003c/h2>\n\u003cp>后端 block 的 \u003ccode>-&gt;方法()\u003c/code> 本质是往 \u003ccode>props\u003c/code> 里塞键（\u003ccode>SchemaNode::set\u003c/code>）。\u003cstrong>前端渲染器只透传注册表白名单内的键\u003c/strong>（\u003ccode>componentRegistry.js\u003c/code>），其余一律丢弃——避免脏属性打到 EP 组件上、也避免任意数据注入造成意外行为。三个兜底入口：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$card-&gt;raw([&#39;bodyStyle&#39; =&gt; [&#39;padding&#39; =&gt; &#39;12px&#39;]]); // SchemaNode::raw：一次合并多个 props\n$img-&gt;set(&#39;initialIndex&#39;, 2);                        // SchemaNode::set：单个 prop（白名单外前端会忽略）\n$node-&gt;node($anyNode);                               // 挂载任意已构造好的节点\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"h-55\">9. 渲染链路（改后端即生效，无需构建前端）\u003c/h2>\n\u003cpre>\u003ccode>菜单 /custom-page/&lt;name&gt;\n  → GET /api/custom/page?name=&lt;name&gt;      (插件 CustomPageController)\n  → PageRegistry::find(name) 有 → {format:&#39;schema&#39;, schema:{…}}\n      | 无 → app/custom/pages/&lt;name&gt;.vue 有 → {format:&#39;vue&#39;, content, mtime}\n  → 前端 CustomPageHost 按 format 分派：\n      schema → 并发请求 dataApi → interpolateSchema 注入 → SchemaRenderer 递归渲染\n      vue    → dynamicSfc 运行时编译 SFC 渲染\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>渲染器三条特殊规则\u003c/strong>（\u003ccode>SchemaRenderer.vue\u003c/code>）：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>card\u003c/code> 的 \u003ccode>header\u003c/code> 不是 prop，是 EP 命名插槽 → 渲染器把 \u003ccode>props.header\u003c/code> 转成 header 插槽；\u003c/li>\n\u003cli>\u003ccode>collapse\u003c/code> 的展开状态（v-model）由渲染器 WeakMap 自托管，初始取 \u003ccode>props.activeNames\u003c/code>，页面无需写交互代码；\u003c/li>\n\u003cli>所有容器一律递归 children 到\u003cstrong>默认插槽\u003c/strong>，保证 \u003ccode>*-item\u003c/code> 是父容器的直接子 VNode（EP 结构要求）。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"h-56\">10. 扩展新组件（前后端各一步）\u003c/h2>\n\u003cp>以加一个「链接按钮」为例：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>后端\u003c/strong> \u003ccode>plugin/curd/app/schema/blocks/Button.php\u003c/code>：\u003ccode>class Button extends SchemaNode { __construct(){ $this-&gt;type=&#39;button&#39;; } public function text($v){ return $this-&gt;set(&#39;text&#39;,$v); } }\u003c/code>（并可在 \u003ccode>HasBlocks::button()\u003c/code> 加便捷入口）；\u003c/li>\n\u003cli>\u003cstrong>前端\u003c/strong> \u003ccode>componentRegistry.js\u003c/code> 登记一行：\u003ccode>button: { component: ElButton, props: [&#39;text&#39;,&#39;type&#39;,&#39;link&#39;, ...COMMON] }\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>渲染器零改动。当前已注册 type 全表 = 第 2.4~2.6 节列出的 20 个。\u003c/p>\n\u003cp>\u003cstrong>component 也可以指向自定义 Vue 组件\u003c/strong>（不限于 EP 组件）：\u003ccode>copy-text\u003c/code>、\u003ccode>box\u003c/code>、\u003ccode>line-chart-stat\u003c/code> 都是先例 ——\n\u003ccode>componentRegistry.js\u003c/code> 里 \u003ccode>&#39;copy-text&#39;: { component: CopyTextNode, props: [...] }\u003c/code>，\n\u003ccode>CopyTextNode.vue\u003c/code> 自己负责渲染与交互（渲染器仍然只按 \u003ccode>h(component, props, slots)\u003c/code> 调用，\nprops 依旧走白名单）。复制这类交互因此可以纯前端实现，后端 block 只负责摆位置与传值。\u003c/p>\n\u003cp>其中 \u003ccode>line-chart-stat\u003c/code> 还证明了\u003cstrong>图表也能内建\u003c/strong>：echarts 在节点组件内按需注册\n（\u003ccode>echarts/core\u003c/code> + LineChart/Grid/\u003cstrong>Tooltip\u003c/strong>/MarkPoint/MarkLine/Canvas，与 \u003ccode>views/dashboard\u003c/code> 共用同一份模块），\n所以加一个图表块不会引入全量 echarts（产物里 echarts 独立成 chunk，约 480 KB / gzip 160 KB）。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>按需引入下，未注册的组件会被静默忽略\u003c/strong>：\u003ccode>echarts.use([...])\u003c/code> 里少哪个，option 里写了\n对应配置也\u003cstrong>不会报错、只是没效果\u003c/strong>。典型就是 \u003ccode>line-chart-stat\u003c/code> 曾经漏注册 \u003ccode>TooltipComponent\u003c/code>\n—— \u003ccode>tooltip\u003c/code> 配了但鼠标悬停毫无反应。加图表/新特性时记得同步 \u003ccode>echarts.use([...])\u003c/code>\n（\u003c
