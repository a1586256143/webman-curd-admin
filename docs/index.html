<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 DSL 文档</title>
<style>
:root{
  --accent:#2563eb; --accent-soft:#eff6ff; --border:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --aside-w:300px; --header-h:56px; --code-bg:#0f172a; --code-fg:#e2e8f0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:#f6f7f9}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 顶栏 ===== */
.site-header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:16px;
  padding:0 20px;background:#fff;border-bottom:1px solid var(--border)}
.site-title{font-size:16px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.site-title .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.doc-count{font-size:12px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:2px 10px;white-space:nowrap}
.search-box{flex:1;max-width:380px;margin-left:auto;position:relative}
.search-box input{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 12px 0 34px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-box .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:13px;pointer-events:none}

/* ===== 主体布局 ===== */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}

/* ===== 左侧栏目 ===== */
.sidebar{width:var(--aside-w);flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));padding:12px 8px 40px}
.tree-empty{padding:16px 12px;color:#9ca3af;font-size:13px;display:none}
.doc-group{margin-bottom:10px}
.doc-title{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;color:var(--text);user-select:none}
.doc-title:hover{background:#f3f4f6}
.doc-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.doc-title .fname{margin-left:auto;font-size:11px;font-weight:400;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.doc-group.active .doc-title{background:var(--accent-soft);color:var(--accent)}
.tree{list-style:none;margin:2px 0 0;padding:0}
.tree li{margin:0}
.tree a{display:block;padding:5px 10px 5px 26px;border-radius:6px;color:#374151;font-size:13px;border-left:2px solid transparent;cursor:pointer}
.tree a:hover{background:#f3f4f6;text-decoration:none}
.tree a.active{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.tree ul{list-style:none;margin:0;padding:0}
.tree .lvl3 a{padding-left:44px;font-size:12.5px;color:#6b7280}
.tree .lvl3 a.active{color:var(--accent)}
.tree .lvl4 a{padding-left:62px;font-size:12px;color:#9ca3af}
.sidebar-foot{margin-top:16px;padding:10px 12px;font-size:11px;color:#c0c4cc;border-top:1px dashed #eee}

/* ===== 右侧内容 ===== */
.content{flex:1;min-width:0;padding:28px 40px 80px}
.doc-panel{display:none;max-width:1020px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:34px 44px 48px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.doc-panel.active{display:block}
.panel-meta{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid #f0f1f3;color:#9ca3af;font-size:12px;flex-wrap:wrap}
.panel-meta .chip{background:#f3f4f6;border-radius:6px;padding:2px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#6b7280}
.back-top{position:fixed;right:26px;bottom:30px;width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.35);display:none;z-index:60}
.back-top.show{display:block}

/* ===== 正文排版 ===== */
.doc-body h1{font-size:27px;margin:0 0 6px;line-height:1.4;letter-spacing:.2px}
.doc-body h2{font-size:20px;margin:38px 0 14px;padding:8px 0 8px 12px;border-left:4px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 70%);border-radius:0 8px 8px 0}
.doc-body h3{font-size:16px;margin:28px 0 10px;color:#111827;border-bottom:1px dashed #e5e7eb;padding-bottom:6px}
.doc-body h4{font-size:14.5px;margin:22px 0 8px;color:#374151}
.doc-body p{margin:10px 0}
.doc-body ul,.doc-body ol{margin:10px 0;padding-left:26px}
.doc-body li{margin:4px 0}
.doc-body strong{font-weight:700}
.doc-body a{word-break:break-all}
.doc-body blockquote{margin:14px 0;padding:10px 16px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:0 8px 8px 0;color:#78350f}
.doc-body blockquote p{margin:4px 0}
.doc-body hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.doc-body img{max-width:100%}
.doc-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:12.5px;background:#eef1f6;color:#be185d;padding:2px 6px;border-radius:5px}
.doc-body pre{background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 16px;overflow-x:auto;line-height:1.65;margin:14px 0}
.doc-body pre code{background:none;color:inherit;padding:0;font-size:12.8px}
.doc-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
.doc-body th,.doc-body td{border:1px solid #e5e7eb;padding:7px 12px;text-align:left;vertical-align:top}
.doc-body th{background:#f8fafc;font-weight:700;white-space:nowrap}
.doc-body tr:nth-child(even) td{background:#fafbfc}
.doc-body [id^="h-"]{scroll-margin-top:72px}

@media (max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;height:auto;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .content{padding:18px}
  .doc-panel{padding:20px 18px}
  .search-box{max-width:none}
}
</style>
</head>

    <span class="s-ico">&#128269;</span>

<script>window.__DOCS_DATA__ = [{"file":"插件安装升级与生产部署.md","title":"webman-curd-admin 插件：安装 · 升级 · 生产部署","mtime":"2026/9/20 14:04:41","headings":[{"depth":2,"text":"1. 架构与配置（单库模型，v1.1 起）","id":"h-2"},{"depth":2,"text":"2. 从包引入全新项目（composer require）","id":"h-3"},{"depth":2,"text":"3. Web 安装向导（新项目首选，/app/curd-installer）","id":"h-4"},{"depth":3,"text":"CLI 安装（向导的等价手动流程）","id":"h-5"},{"depth":2,"text":"4. 后台示例「测试管理」（my_test / MyTestController）","id":"h-6"},{"depth":2,"text":"5. 宿主内插件升级 / 随包同步","id":"h-7"},{"depth":2,"text":"6. 生产部署（supervisor + nginx + 备份）","id":"h-8"},{"depth":3,"text":"6.1 守护进程 supervisor","id":"h-9"},{"depth":3,"text":"6.2 Nginx 反代（SPA 与 API 同域，免 CORS）","id":"h-10"},{"depth":3,"text":"6.3 环境与密钥","id":"h-11"},{"depth":3,"text":"6.4 备份","id":"h-12"},{"depth":3,"text":"6.5 升级回滚","id":"h-13"},{"depth":2,"text":"7. 踩坑速查（安装/部署）","id":"h-14"}],"html":"\u003ch1 id=\"h-1\">webman-curd-admin 插件：安装 · 升级 · 生产部署\u003c/h1>\n\u003cblockquote>\n\u003cp>适用版本：2026-09-06（单库架构 + Web 安装向导自动生效，向导安装免手动重启）\u003c/p>\n\u003cp>关系说明：\u003ccode>plugin/curd\u003c/code> 与发布包 \u003ccode>amcolin/webman-curd-admin\u003c/code>（Gitee：\n\u003ccode>https://gitee.com/colingit/webman-curd-admin.git\u003c/code>）同源。本宿主是主开发场（嵌入版），\n对外新项目用 composer 包引入。本文同时覆盖「新项目从包引入」与「本宿主插件升级/上线」。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-2\">1. 架构与配置（单库模型，v1.1 起）\u003c/h2>\n\u003cp>\u003cstrong>数据库信息只写宿主 \u003ccode>.env\u003c/code> 的 5 个键\u003c/strong>：\u003ccode>DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD\u003c/code>。\n自动生成的 \u003ccode>config/database.php\u003c/code> 用 \u003ccode>env()\u003c/code> 读取它们（\u003ccode>src/Install.php\u003c/code> 内置模板）。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>强制单库\u003c/strong>：认证表（\u003ccode>admin_users / admin_tokens / roles / admin_role_user / role_permission / casbin_rule / curd_configs / menus\u003c/code>）与业务表\u003cstrong>放同一个库\u003c/strong>，已无\n\u003ccode>DB_BUSINESS_NAME\u003c/code>、无&quot;分库选项/同库勾选&quot;。\u003c/li>\n\u003cli>\u003ccode>mysql_business\u003c/code> 连接仍保留（兼容已写死 \u003ccode>$connection=&#39;mysql_business&#39;\u003c/code> 的模型），其\n\u003ccode>database\u003c/code> 与 \u003ccode>mysql\u003c/code> 相同（= \u003ccode>DB_NAME\u003c/code>）。\u003c/li>\n\u003cli>\u003cstrong>插件调参\u003c/strong>（\u003ccode>admin_connection / business_connection / page_base / admin_require_permission\u003c/code>）不再读 \u003ccode>CURD_*\u003c/code> 环境变量，统一写宿主 \u003ccode>config/curd-admin.php\u003c/code>\n顶层同名键（缺失时首次引入自动生成默认模板，不覆盖 .env 任何键）。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>本宿主现状（重要）\u003c/strong>：宿主根 \u003ccode>config/database.php\u003c/code> 是\u003cstrong>手工维护的分库版\u003c/strong>\n（\u003ccode>mysql\u003c/code> = \u003ccode>DB_NAME\u003c/code>，\u003ccode>mysql_business\u003c/code> = \u003ccode>DB_BUSINESS_NAME\u003c/code>），且业务模型基类\n\u003ccode>app/model/BaseModel\u003c/code> 固定 \u003ccode>$connection = &#39;mysql_business&#39;\u003c/code>。\u003cstrong>维持分库布局时\u003c/strong>\n\u003ccode>.env\u003c/code> 保留 \u003ccode>DB_BUSINESS_NAME\u003c/code> 即可，与新插件代码不冲突（插件只认 \u003ccode>admin_connection\u003c/code>/\n\u003ccode>business_connection\u003c/code> 两个连接名，两个连接都定义着）。仅当某个新环境想切单库时：\n去掉 \u003ccode>DB_BUSINESS_NAME\u003c/code> 键，并把 \u003ccode>config/database.php\u003c/code> 里 \u003ccode>mysql_business.database\u003c/code>\n改为 \u003ccode>env(&#39;DB_NAME&#39;)\u003c/code>（或直接使用自动生成模板）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-3\">2. 从包引入全新项目（composer require）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># ① 全新项目：先建 webman 骨架（已有项目跳过，直接 ②）\ncomposer create-project workerman/webman webman-clean-demo\ncd webman-clean-demo\n\n# ② 配置源（三选一）\ncomposer config repositories.curd path &quot;~/Public/www/company/webman-curd-admin&quot;   # 本地 path（包仓库开发期，改包即生效，路径换成你本包真实路径）\n#    或 VCS（上线走 tag 版本）：composer config repositories.curd vcs &quot;https://github.com/a1586256143/webman-curd-admin&quot;\n#    或公司 Satis：composer config repositories.curd composer https://satis.your-company.com\n\n# ③ 引入（require 自动完成：拉齐依赖 webman/database + webman/redis + casbin/casbin +\n#    vlucas/phpdotenv + webman/captcha；webman 官方插件机制自动拷贝 plugin/curd 到宿主；\n#    宿主缺 config/database.php 自动按 env() 模板生成；缺 config/curd-admin.php 自动生成调参模板）\ncomposer require amcolin/webman-curd-admin:dev-main --no-audit\n#   ⚠️ audit 红字（audit 硬编码访问 packagist.org，国内常不可达）仅尾部告警、exit 0；\n#   彻底消除：alias composer=&#39;&lt;包仓库&gt;/scripts/composer.sh&#39;（只对会触发 audit 的子命令加 --no-audit）\n\n# ⑤ PHP 扩展：登录图形验证码需要 ext-gd + ext-mbstring（缺失时 /api/auth/captcha 返回\n#    「验证码生成失败：Class &quot;Webman\\Captcha\\CaptchaBuilder&quot; not found」或 GD 相关报错）\nphp -m | grep -Ei &#39;^(gd|mbstring)$&#39;\n#    装不了/不想要验证码：宿主 config/curd-admin.php 里\n#    &#39;captcha_enabled&#39; =&gt; false 后 restart 即可（见《DSL-使用文档》§4.7）\n\n# ⑥ 验证\nls plugin/curd config/database.php config/curd-admin.php\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-4\">3. Web 安装向导（新项目首选，/app/curd-installer）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># ① 先启动服务（向导依赖服务在线；端口在 config/process.php 的 &#39;listen&#39;，默认 8787）\nphp start.php start\n\n# ② 浏览器打开\n#    http://host:port/app/curd-installer\n\n# ③ 安装后进入后台管理\n#    http://host:port/app/curd\n\u003c/code>\u003c/pre>\n\u003cp>表单（均为\u003cstrong>明文输入\u003c/strong>，便于核对）：\u003c/p>\n\u003cul>\n\u003cli>数据库连接：主机 / 端口 / \u003cstrong>库名\u003c/strong> / 账号 / 密码 —— 库不存在自动创建；\u003cstrong>强制单库\u003c/strong>\n（认证 + 业务同库，界面已注明，无分库选项）\u003c/li>\n\u003cli>管理员账号：登录名 / 密码 / 确认密码（自定义初始管理员，非固定 admin/admin123）\u003c/li>\n\u003c/ul>\n\u003cp>提交后自动完成：\u003c/p>\n\u003col>\n\u003cli>DB 信息\u003cstrong>按键合并\u003c/strong>写入宿主 \u003ccode>.env\u003c/code>（绝不覆盖其它键，并自动剔除遗留 \u003ccode>DB_BUSINESS_NAME\u003c/code>）；\u003c/li>\n\u003cli>子进程执行 \u003ccode>php plugin/curd/install.php\u003c/code>：自动建库 → 建核心表 + 后台示例表 \u003ccode>my_test\u003c/code> →\n种子（仅超级管理员角色 / 基础菜单 /「测试管理」菜单 / 管理员账号 / RSA 密钥）→ 页面实时进度；\u003c/li>\n\u003cli>\u003cstrong>免手动重启\u003c/strong>：安装成功即向 master 进程发 \u003ccode>SIGUSR1\u003c/code>（= workerman 平滑 reload），worker\n处理完当前请求后重启并重读 \u003ccode>.env\u003c/code>/config，新 \u003ccode>DB_*\u003c/code> 立即生效（约 2 秒后自动进入登录页）。\nreload 不可用的场景（Windows / 无 posix 扩展 / supervisor 托管等）页面自动回退提示\n\u003ccode>php start.php restart\u003c/code>，不会误导。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>安装标记\u003c/strong>：成功生成 \u003ccode>runtime/curd-installed.lock\u003c/code>，向导即失效（再次访问提示已安装）。\n\u003cstrong>重装\u003c/strong>：删除该锁 + 清空数据库后刷新向导页。\u003c/p>\n\u003ch3 id=\"h-5\">CLI 安装（向导的等价手动流程）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">php plugin/curd/install.php --admin-user=admin --admin-pass=&#39;你的密码&#39;\n#   可选：--progress-file=runtime/i.log（JSONL 进度）、--business-sql=路径（可多个/逗号分隔）\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-6\">4. 后台示例「测试管理」（my_test / MyTestController）\u003c/h2>\n\u003cp>登录后台左侧可见「测试管理」（\u003ccode>/my-test\u003c/code>）：\u003ccode>my_test\u003c/code> 表 + \u003ccode>MyTestController\u003c/code>（数组式\n\u003ccode>BaseCurdController\u003c/code> 写法），提供完整搜索/增删改查/导出，作为\u003cstrong>新控制器最小参考\u003c/strong>与\n\u003cstrong>链路自检\u003c/strong>（登录 → 菜单 → 配置接口 → 数据接口 → 库表全通）。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>全新项目\u003c/strong>：安装向导自动建表 + 补菜单 + 插 1 条示例数据，开箱即用。\u003c/li>\n\u003cli>\u003cstrong>本宿主等已运行项目\u003c/strong>：跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等）即可补齐\n\u003ccode>my_test\u003c/code> 表 +「测试管理」菜单；不想要示例就跳过，不影响安装结果。\u003c/li>\n\u003cli>\u003cstrong>删除\u003c/strong>：控制器 + \u003ccode>app/model/MyTest.php\u003c/code> + \u003ccode>bootstrap.php\u003c/code>「内置示例」注册段 +\nmenus「测试管理」行 + \u003ccode>my_test\u003c/code> 表（控制器头注释含完整清单）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-7\">5. 宿主内插件升级 / 随包同步\u003c/h2>\n\u003cp>本宿主是\u003cstrong>嵌入开发\u003c/strong>（plugin/curd 直接放宿主），升级 = 用包仓库代码覆盖，按需提交。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># ① 先查宿主 plugin/curd 有无本地改动（有则先备份/处理）\n&lt;包仓库&gt;/scripts/check-plugin-overrides.sh .\n\n# ② 备份 + 重拷（包仓库脚本，含 install-business 等宿主文件保护）\n&lt;包仓库&gt;/scripts/sync-plugin.sh\n#    或手工按第 6 节清单拷贝\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>同步清单（包 → 宿主 plugin/curd）\u003c/strong>：\u003ccode>api/Install.php\u003c/code>、\u003ccode>app/\u003c/code>（bootstrap /\ncontroller/InstallerController.php / MyTestController.php / model/MyTest.php）、\n\u003ccode>config/curd.php\u003c/code>、\u003ccode>config/route.php\u003c/code>、\u003ccode>env.example\u003c/code>、\u003ccode>install.php\u003c/code>、\u003ccode>install.sql\u003c/code>、\n\u003ccode>public/installer/\u003c/code>、\u003ccode>database.business.example.php\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>宿主专有文件，绝不能覆盖/删除\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/config/keys/\u003c/code>\u003c/td>\n\u003ctd>RSA 私钥（\u003ccode>.gitignore\u003c/code> 排除，换机需手动拷贝，丢失要重生成）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/install-business.sql\u003c/code>\u003c/td>\n\u003ctd>宿主真实业务建表 SQL（\u003ccode>--business-sql\u003c/code> 用它，128 行）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/public/assets/\u003c/code>\u003c/td>\n\u003ctd>宿主前端构建产物（\u003ccode>frontend/\u003c/code> 独立构建）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主根 \u003ccode>config/database.php\u003c/code> / \u003ccode>.env\u003c/code> / \u003ccode>app/\u003c/code>\u003c/td>\n\u003ctd>插件之外的宿主自有层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>宿主业务表建表：\u003ccode>php plugin/curd/install.php --business-sql=plugin/curd/install-business.sql\u003c/code>\n（幂等，\u003ccode>--SPLIT--\u003c/code> 分句，IF NOT EXISTS）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-8\">6. 生产部署（supervisor + nginx + 备份）\u003c/h2>\n\u003ch3 id=\"h-9\">6.1 守护进程 supervisor\u003c/h3>\n\u003cpre>\u003ccode class=\"language-ini\"># /etc/supervisor/conf.d/my-app.conf\n[program:my-app]\ncommand=php /var/www/my-app/start.php start\ndirectory=/var/www/my-app\nnumprocs=1\nautostart=true\nautorestart=true\nstartretries=3\nuser=www-data\nredirect_stderr=true\nstdout_logfile=/var/log/my-app/worker.log\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">supervisorctl reread &amp;&amp; supervisorctl update &amp;&amp; supervisorctl start my-app\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>不要裸跑 \u003ccode>php start.php start -d\u003c/code>。托管后整体重启用 \u003ccode>supervisorctl restart my-app\u003c/code>\n（手动 \u003ccode>php start.php restart\u003c/code> 会杀会话进程组）。插件 Web 向导的 \u003ccode>SIGUSR1\u003c/code> reload\n只平滑重启 worker、不杀 master，与 supervisor 托管兼容，可用作&quot;改配置即时生效&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-10\">6.2 Nginx 反代（SPA 与 API 同域，免 CORS）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-nginx\">server {\n    listen 80;\n    server_name admin.example.com;\n    root /var/www/my-app/public;\n\n    location / {\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n    location /index.php {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME $document_root/index.php;\n        fastcgi_pass 127.0.0.1:8787;   # 与 config/process.php &#39;listen&#39; 一致（webman 2.x 端口在此）\n    }\n    location /app/curd/ {              # 插件内置前端（SPA history 由 PageController 处理）\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-11\">6.3 环境与密钥\u003c/h3>\n\u003cul>\n\u003cli>开发 / 测试 / 生产各用独立数据库，\u003ccode>.env\u003c/code> 的 \u003ccode>DB_*\u003c/code> 按环境填写；\u003ccode>.env\u003c/code> 不进 git。\u003c/li>\n\u003cli>生产至少：\u003ccode>config/curd-admin.php\u003c/code> 开 \u003ccode>admin_require_permission =&gt; true\u003c/code>；登录后立即修改\n管理员密码；\u003ccode>config/keys/\u003c/code> 独立挂载、不进 git / 不进发布产物。\u003c/li>\n\u003cli>\u003cstrong>线上必设 \u003ccode>APP_DEBUG=false\u003c/code>\u003c/strong>（\u003ccode>plugin.curd.app.debug\u003c/code> 读它）：否则接口未捕获异常\n（SQL 报错等）会把堆栈/表结构直接抛给前端，既泄漏实现细节、又拿不到统一提示。\n设为 \u003ccode>false\u003c/code> 后 \u003ccode>/api\u003c/code> 异常统一返回 HTTP 500 \u003ccode>{&quot;code&quot;:500,&quot;msg&quot;:&quot;服务内部错误（编号 xxxxxxxx）&quot;}\u003c/code>，\n详情（异常类/消息/SQL/绑定/请求上下文/堆栈）写 \u003ccode>runtime/logs/webman.log\u003c/code>，\n\u003cstrong>用前端提示里的 8 位编号 grep 该日志即可定位原始异常\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>异常处理器（必做）\u003c/strong>：\u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向\n\u003ccode>\\plugin\\curd\\app\\exception\\CurdExceptionHandler::class\u003c/code>（插件路由靠插件自带的\n\u003ccode>plugin/curd/config/exception.php\u003c/code> 已开箱生效；宿主的 \u003ccode>/api\u003c/code> 控制器需要这一行）。\n⚠️ 只加 \u003ccode>&#39;@&#39;\u003c/code> 键无效：框架规则是「本 app 已有 \u003ccode>&#39;&#39;\u003c/code> 键 ⇒ 忽略 \u003ccode>&#39;@&#39;\u003c/code>」。\n⚠️ \u003cstrong>不要用中间件实现\u003c/strong>：webman 每层中间件内层已先 try/catch，外层拿不到异常（实测踩过）。\n宿主自己控制器的模式取宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>，与插件 debug 取\u003cstrong>交集\u003c/strong>（任一 false 即线上）。\u003c/li>\n\u003cli>\u003cstrong>全局中间件\u003c/strong>：\u003ccode>config/middleware.php\u003c/code> 的 \u003ccode>&#39;@&#39;\u003c/code> 组注册 \u003ccode>StaticFile\u003c/code> + \u003ccode>ApiCrypto\u003c/code>\n（加密关闭也保留，否则前端加密请求无人解；异常兜底不在中间件里做，见上一条）。\u003c/li>\n\u003cli>反代真实 IP：webman 取 \u003ccode>connection-&gt;getRemoteIp()\u003c/code>，依赖 Nginx 正确透传。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-12\">6.4 备份\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>频率\u003c/th>\n\u003cth>方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>认证库（admin_users / roles / menus / casbin_rule…）\u003c/td>\n\u003ctd>每日\u003c/td>\n\u003ctd>mysqldump 全量 + 保留 7 天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务库\u003c/td>\n\u003ctd>每日\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config/keys/\u003c/code>（RSA 私钥）\u003c/td>\n\u003ctd>生成即备份\u003c/td>\n\u003ctd>单独加密归档，切勿丢失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码 / 前端 dist\u003c/td>\n\u003ctd>每次发版\u003c/td>\n\u003ctd>git tag + CI 产物\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-13\">6.5 升级回滚\u003c/h3>\n\u003cp>升级前 \u003ccode>check-plugin-overrides.sh\u003c/code> 确认无本地改动；升级后跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>\n（幂等补种子/新表/菜单）。回滚：\u003ccode>git checkout &lt;上一版本 tag&gt;\u003c/code> 或 composer 锁版本重装。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-14\">7. 踩坑速查（安装/部署）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>向导完成后后台报 1045 Access denied\u003c/td>\n\u003ctd>老版本需手动 restart；v1.1 向导已自动 SIGUSR1 reload。若在 supervisor/Windows 场景页面会提示手动 \u003ccode>php start.php restart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向导页面显示&quot;系统已安装&quot;\u003c/td>\n\u003ctd>\u003ccode>runtime/curd-installed.lock\u003c/code> 存在；重装 = 删锁 + 清库刷新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Failed to audit installed packages\u003c/code> 红字\u003c/td>\n\u003ctd>audit 访问 packagist.org 被墙，exit 0 不影响安装；alias 到 \u003ccode>scripts/composer.sh\u003c/code> 消除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Class &quot;support\\Redis&quot; not found\u003c/code>\u003c/td>\n\u003ctd>缺 \u003ccode>webman/redis\u003c/code>：\u003ccode>composer require webman/redis\u003c/code>（包已 require，旧宿主补装）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>my_test /「测试管理」不出现\u003c/td>\n\u003ctd>老项目没跑过新 install；执行一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等补表补菜单）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改 PHP 类/配置后不生效\u003c/td>\n\u003ctd>webman 常驻内存：reload 重读 .env/config 与类文件需重启（向导场景已自动 reload）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口不是 8787\u003c/td>\n\u003ctd>webman 2.x 端口在 \u003ccode>config/process.php\u003c/code> 的 \u003ccode>listen\u003c/code>，改这里再重启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口提示「服务内部错误（编号 xxxxxxxx）」\u003c/td>\n\u003ctd>后端有未捕获异常（多为 SQL 报错 / 字段不存在）。\u003ccode>grep &lt;编号&gt; runtime/logs/webman.log\u003c/code> 直接看到异常类、SQL 与绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口只提示「Request failed with status code 500」\u003c/td>\n\u003ctd>该路由没走插件异常处理器：插件路由应自动生效（\u003ccode>plugin/curd/config/exception.php\u003c/code>），宿主自己的 \u003ccode>/api\u003c/code> 控制器需把 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向 \u003ccode>CurdExceptionHandler\u003c/code>（见 §6.3）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口直接返回堆栈 / 表结构\u003c/td>\n\u003ctd>模式还判定为「本地」：插件侧看 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code>，宿主自己控制器还要看宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>（两者取交集，任一为 false 即线上）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按编号 grep 日志只看到半条\u003c/td>\n\u003ctd>日志被 \u003ccode>trace_str\u003c/code> 的换行撑成多行（webman 默认 \u003ccode>allowInlineLineBreaks=true\u003c/code>）。已把换行收敛为 \u003ccode>|\u003c/code>、并把 \u003ccode>sql\u003c/code>/\u003ccode>bindings\u003c/code> 排在堆栈之前，一条异常恒为一行；用到的是旧版 \u003ccode>CurdExceptionHandler\u003c/code> 就重新同步一下插件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"file":"可插拔认证与权限开关.md","title":"可插拔认证与权限开关（v1.2.0）","mtime":"2026/9/19 20:35:52","headings":[{"depth":2,"text":"1. 配置总览","id":"h-16"},{"depth":2,"text":"2. 可插拔登录（auth_provider）","id":"h-17"},{"depth":3,"text":"2.1 原理","id":"h-18"},{"depth":3,"text":"2.2 接口方法","id":"h-19"},{"depth":3,"text":"2.3 身份数组约定（login / identity 返回形状）","id":"h-20"},{"depth":3,"text":"2.4 自定义示例：换一张表（my_users）","id":"h-21"},{"depth":3,"text":"2.5 接入步骤","id":"h-22"},{"depth":3,"text":"2.6 注意事项","id":"h-23"},{"depth":3,"text":"2.7 只加一层状态判定：auth_state_guard（v1.2.0 起）","id":"h-24"},{"depth":2,"text":"3. 权限总开关（permission_enabled）","id":"h-25"},{"depth":3,"text":"3.1 作用域","id":"h-26"},{"depth":3,"text":"3.2 配置方式","id":"h-27"},{"depth":3,"text":"3.3 关闭后行为","id":"h-28"},{"depth":3,"text":"3.4 安装器联动","id":"h-29"},{"depth":3,"text":"3.5 与 admin_require_permission 的关系","id":"h-30"},{"depth":2,"text":"4. 端到端验证示例","id":"h-31"},{"depth":2,"text":"5. 常见问题 / 排错","id":"h-32"}],"html":"\u003ch1 id=\"h-15\">可插拔认证与权限开关（v1.2.0）\u003c/h1>\n\u003cblockquote>\n\u003cp>适用版本：v1.1.1 起（插件 \u003ccode>plugin/curd\u003c/code>）；\u003ccode>auth_state_guard\u003c/code> 需 v1.2.0 起。\n本文面向「想换登录表 / 换校验方式」「想给账号叠加一条可用性判定」或「想一键关掉 RBAC 权限校验」的接入方。\u003c/p>\n\u003c/blockquote>\n\u003cp>本插件提供三个\u003cstrong>配置驱动\u003c/strong>的能力，统一在宿主 \u003ccode>config/curd-admin.php\u003c/code> 里开关，无需改动插件源码：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力\u003c/th>\n\u003cth>配置键\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>可插拔登录\u003c/td>\n\u003ctd>\u003ccode>auth_provider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DefaultAuthProvider::class\u003c/code>（原 \u003ccode>admin_users\u003c/code> 行为）\u003c/td>\n\u003ctd>替换登录校验逻辑：换表 / 换校验 / 对接外部账号体系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号状态判定\u003c/td>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&#39;&#39;\u003c/code>（不启用）\u003c/td>\n\u003ctd>在账号自身 \u003ccode>status\u003c/code> 之外叠加业务可用性判定，三个认证入口统一收口（见 §2.7）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限总开关\u003c/td>\n\u003ctd>\u003ccode>permission_enabled\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code> 时关闭整条 RBAC 校验，且不产生、不下发任何权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>设计红线：\u003cstrong>token 的签发与存储永远由插件统一处理\u003c/strong>。自定义登录方只负责「校验凭据」并返回「身份数组」，\n不碰 token、不碰 \u003ccode>admin_tokens\u003c/code> 的写入细节。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-16\">1. 配置总览\u003c/h2>\n\u003cp>宿主 \u003ccode>config/curd-admin.php\u003c/code>（首次 \u003ccode>composer require\u003c/code> 由 \u003ccode>src/Install.php\u003c/code> 自动生成；未生成可手动 \u003ccode>return [...]\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nreturn [\n    // 登录提供方（可插拔）：实现 AuthProviderInterface 的类名\n    &#39;auth_provider&#39; =&gt; \\plugin\\curd\\app\\auth\\DefaultAuthProvider::class,\n\n    // 账号状态判定（可选）：实现 AuthStateGuardInterface 的类名；留空 = 不启用\n    // &#39;auth_state_guard&#39; =&gt; \\app\\auth\\MyGuard::class,\n\n    // 权限总开关：true=走 RBAC；false=所有人放行（仅登录即可）\n    &#39;permission_enabled&#39; =&gt; true,\n\n    // （下方为其他既有配置，省略）\n    // &#39;admin_connection&#39; =&gt; &#39;mysql&#39;,\n    // &#39;business_connection&#39; =&gt; &#39;mysql_business&#39;,\n    // ...\n];\n\u003c/code>\u003c/pre>\n\u003cp>读取优先级（高 → 低）：宿主 \u003ccode>config/curd-admin.php\u003c/code> 顶层同名键 → 插件 \u003ccode>config/curd.php\u003c/code> 默认值。\n即：\u003cstrong>任何一项不写，都自动回退到插件默认值，向后兼容。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-17\">2. 可插拔登录（auth_provider）\u003c/h2>\n\u003ch3 id=\"h-18\">2.1 原理\u003c/h3>\n\u003cp>登录链路被抽象成一个契约 \u003ccode>plugin\\curd\\app\\auth\\AuthProviderInterface\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode>请求 → AuthController::login()\n        ↓ 调 $this-&gt;authProvider()-&gt;login($credentials)\n     你的 AuthProvider（或 DefaultAuthProvider）\n        ↓ 成功返回「身份数组」/ 失败返回 null\n     插件统一：签发 token + 写 admin_tokens + 组装响应\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>AuthController\u003c/code> / \u003ccode>AuthCheck\u003c/code> / \u003ccode>PermissionCheck\u003c/code> 通过共享 trait\n\u003ccode>plugin\\curd\\app\\auth\\AuthProviderAware\u003c/code> 拿到「当前生效的提供方」，保证判定逻辑只有一份：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// plugin/curd/app/auth/AuthProviderAware.php（节选）\nprotected function authProvider(): AuthProviderInterface\n{\n    $cls = config(&#39;plugin.curd.curd.auth_provider&#39;, DefaultAuthProvider::class);\n    if (is_string($cls) &amp;&amp; class_exists($cls)) {\n        $inst = new $cls();\n        if ($inst instanceof AuthProviderInterface) {\n            return $inst;\n        }\n    }\n    return new DefaultAuthProvider(); // 类名无效/未实现接口 → 回退默认\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-19\">2.2 接口方法\u003c/h3>\n\u003cp>实现 \u003ccode>plugin\\curd\\app\\auth\\AuthProviderInterface\u003c/code> 必须提供四个方法：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>签名\u003c/th>\n\u003cth>职责\u003c/th>\n\u003cth>返回 null 的含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>login\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>login(array $credentials): ?array\u003c/code>\u003c/td>\n\u003ctd>校验账号密码\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 凭据错误（插件统一回 401）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>identity\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>identity($id): ?array\u003c/code>\u003c/td>\n\u003ctd>按 user id 取完整身份（\u003ccode>/api/auth/me\u003c/code> 用）\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 用户不存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>resolveUser\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>resolveUser($id): ?object\u003c/code>\u003c/td>\n\u003ctd>按 user id 还原用户对象（\u003ccode>AuthCheck\u003c/code> 填充 \u003ccode>$request-&gt;user\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 用户不存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>logout\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>logout(Request $request): void\u003c/code>\u003c/td>\n\u003ctd>退出时回调（清外部会话等）\u003c/td>\n\u003ctd>无需返回值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-20\">2.3 身份数组约定（login / identity 返回形状）\u003c/h3>\n\u003cp>\u003ccode>login()\u003c/code> 与 \u003ccode>identity()\u003c/code> 返回的数组\u003cstrong>必须\u003c/strong>含以下键：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>必填\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>int | string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>会被写入 \u003ccode>admin_tokens.admin_user_id\u003c/code>；\u003ccode>resolveUser()\u003c/code> 入参必须与之对应（建议数值型）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>username\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>登录名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>name\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>展示名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\n\u003ctd>int\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> = 启用；非 \u003ccode>1\u003c/code> 由插件统一报 403「账号已被禁用」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>avatar\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>头像 URL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>email\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>邮箱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>roles\u003c/code>\u003c/td>\n\u003ctd>array\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>角色 slug 数组（如 \u003ccode>[&#39;editor&#39;]\u003c/code>），前端/业务自定义消费\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>permissions\u003c/code>\u003c/td>\n\u003ctd>array\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>权限项数组；\u003cstrong>建议留空\u003c/strong>——权限由插件/权限开关统一决定，不要在这里自己造权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>约定补充：\u003ccode>resolveUser()\u003c/code> 返回的对象须含属性 \u003ccode>id / username / name / status / avatar\u003c/code>，\n且 \u003ccode>status === 1\u003c/code> 才放行（否则 \u003ccode>AuthCheck\u003c/code> 报 403）。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-21\">2.4 自定义示例：换一张表（my_users）\u003c/h3>\n\u003cp>下面把登录从 \u003ccode>admin_users\u003c/code> 换成业务表 \u003ccode>my_users\u003c/code>，并改用明文密码校验：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\n// 宿主 app/auth/MyAuthProvider.php\nnamespace app\\auth;\n\nuse plugin\\curd\\app\\auth\\AuthProviderInterface;\nuse support\\Db;\nuse support\\Request;\n\nclass MyAuthProvider implements AuthProviderInterface\n{\n    public function login(array $c): ?array\n    {\n        $username = (string)($c[&#39;username&#39;] ?? &#39;&#39;);\n        $password = (string)($c[&#39;password&#39;] ?? &#39;&#39;);\n        if ($username === &#39;&#39; || $password === &#39;&#39;) {\n            return null;\n        }\n\n        $user = Db::table(&#39;my_users&#39;)-&gt;where(&#39;username&#39;, $username)-&gt;first();\n        // 换成你自己的校验逻辑：明文 / password_verify / LDAP / OAuth / 外部 API 均可\n        if (!$user || $user-&gt;password !== $password) {\n            return null;\n        }\n        if ((int)($user-&gt;status ?? 1) !== 1) {\n            return null; // 禁用 → 插件统一报 403\n        }\n\n        return [\n            &#39;id&#39;          =&gt; $user-&gt;id,                 // 会写进 admin_tokens.admin_user_id\n            &#39;username&#39;    =&gt; $user-&gt;username,\n            &#39;name&#39;        =&gt; $user-&gt;name,\n            &#39;status&#39;      =&gt; (int)$user-&gt;status,\n            &#39;avatar&#39;      =&gt; $user-&gt;avatar ?? &#39;&#39;,\n            &#39;email&#39;       =&gt; $user-&gt;email ?? &#39;&#39;,\n            &#39;roles&#39;       =&gt; [&#39;editor&#39;],                // 自定义角色 slug\n            &#39;permissions&#39; =&gt; [],                        // 交给插件/权限开关，勿自造\n        ];\n    }\n\n    public function identity($id): ?array\n    {\n        $user = Db::table(&#39;my_users&#39;)-&gt;where(&#39;id&#39;, $id)-&gt;first();\n        if (!$user) {\n            return null;\n        }\n        return [\n            &#39;id&#39;       =&gt; $user-&gt;id,\n            &#39;username&#39; =&gt; $user-&gt;username,\n            &#39;name&#39;     =&gt; $user-&gt;name,\n            &#39;status&#39;   =&gt; (int)$user-&gt;status,\n            &#39;avatar&#39;   =&gt; $user-&gt;avatar ?? &#39;&#39;,\n            &#39;email&#39;    =&gt; $user-&gt;email ?? &#39;&#39;,\n            &#39;roles&#39;    =&gt; [&#39;editor&#39;],\n            &#39;permissions&#39; =&gt; [],\n        ];\n    }\n\n    public function resolveUser($id): ?object\n    {\n        // 返回的对象须含 id/username/name/status/avatar\n        return Db::table(&#39;my_users&#39;)-&gt;where(&#39;id&#39;, $id)-&gt;first();\n    }\n\n    public function logout(Request $request): void\n    {\n        // 可在此清理外部会话（SSO/LDAP）；无需额外清理时留空\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-22\">2.5 接入步骤\u003c/h3>\n\u003col>\n\u003cli>在宿主 \u003ccode>app/auth/\u003c/code> 下写 \u003ccode>MyAuthProvider.php\u003c/code>（实现 \u003ccode>AuthProviderInterface\u003c/code>）。\u003c/li>\n\u003cli>在宿主 \u003ccode>config/curd-admin.php\u003c/code> 加一行指向它：\u003cpre>\u003ccode class=\"language-php\">&#39;auth_provider&#39; =&gt; \\app\\auth\\MyAuthProvider::class,\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003cli>\u003cstrong>重载 worker\u003c/strong>（配置是启动时加载的，改完要生效）：\u003cul>\n\u003cli>webman：\u003ccode>php start.php restart\u003c/code> 或向主进程发 \u003ccode>SIGUSR1\u003c/code> 平滑重载；\u003c/li>\n\u003cli>容器/supervisor 管理下重启对应进程。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>验证：\u003ccode>POST /api/auth/login\u003c/code> 用 \u003ccode>my_users\u003c/code> 里的账号登录，应返回 200 + token；\n再 \u003ccode>GET /api/auth/me\u003c/code>（带 \u003ccode>Authorization: Bearer &lt;token&gt;\u003c/code>）应正确还原该用户。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"h-23\">2.6 注意事项\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>login()\u003c/code> 的 \u003ccode>id\u003c/code> 与 \u003ccode>resolveUser()\u003c/code> 入参必须一致\u003c/strong>（都用同一列），否则登录成功但后续请求取不到用户。\u003c/li>\n\u003cli>不实现 \u003ccode>AuthProviderInterface\u003c/code> 或类名写错 → 自动回退 \u003ccode>DefaultAuthProvider\u003c/code>，不会报错，但登录仍是 \u003ccode>admin_users\u003c/code>。\u003c/li>\n\u003cli>token 永远由插件签发（随机 32 字节 hex，存 \u003ccode>admin_tokens\u003c/code>，7 天有效，多会话互不影响）；自定义方不要自己发 token。\u003c/li>\n\u003cli>\u003ccode>DefaultAuthProvider\u003c/code> 本身就内置为参考样例（见 \u003ccode>plugin/curd/app/auth/DefaultAuthProvider.php\u003c/code>），换表/换校验只需重写 \u003ccode>login() + identity() + resolveUser()\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-24\">2.7 只加一层状态判定：auth_state_guard（v1.2.0 起）\u003c/h3>\n\u003cp>如果你的需求\u003cstrong>不是换登录来源\u003c/strong>，而是「账号还是那个账号，但要额外判断它还能不能用」\n（关联的业务账户被关闭、合同到期、部门撤销、白名单…），\u003cstrong>不要\u003c/strong>用 \u003ccode>auth_provider\u003c/code> 去覆盖三个方法：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>login()\u003c/code> / \u003ccode>identity()\u003c/code> / \u003ccode>resolveUser()\u003c/code> \u003cstrong>三个入口\u003c/strong>都会产出「账号可用性」，都得覆盖；\u003c/li>\n\u003cli>三者数据形状不一致：前两个是\u003cstrong>身份数组\u003c/strong>，\u003ccode>resolveUser()\u003c/code> 是\u003cstrong>用户对象\u003c/strong> → 判定逻辑要写两份；\u003c/li>\n\u003cli>\u003cstrong>漏覆盖任一入口不会报错\u003c/strong>，只会造成「接口能访问，但 \u003ccode>/api/auth/me\u003c/code> 状态不对」这类静默不一致。\u003c/li>\n\u003c/ul>\n\u003cp>改用 \u003ccode>auth_state_guard\u003c/code>，判定只写一处：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php\n&#39;auth_state_guard&#39; =&gt; \\app\\auth\\MyGuard::class,\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">namespace app\\auth;\n\nuse plugin\\curd\\app\\auth\\AuthStateGuardInterface;\n\nclass MyGuard implements AuthStateGuardInterface\n{\n    /** $account 是规范化后的对象，固定含 id / username / name / status 四个属性 */\n    public function allowed(object $account): ?bool\n    {\n        // false = 按「已禁用」处理；true / null = 放行\n        try {\n            return myBusinessCheck($account-&gt;username) ? true : false;\n        } catch (\\Throwable $e) {\n            \\support\\Log::error(&#39;[auth] 状态校验失败（已放行）: &#39; . $e-&gt;getMessage());\n            return true;   // fail-open：业务库抖动时不要把人全拦在门外\n        }\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>判定结果\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code> → 登录报 \u003cstrong>403「账号已被禁用」\u003c/strong>；已登录会话的\u003cstrong>下一次请求\u003c/strong>同样 403（\u003ccode>AuthCheck\u003c/code> 每请求都会调，无缓存延迟）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收口位置\u003c/td>\n\u003ctd>\u003ccode>DefaultAuthProvider::applyStateGuard()\u003c/code>（身份数组）/ \u003ccode>resolveUser()\u003c/code>（用户对象），宿主不需要关心两种形状\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与 \u003ccode>auth_provider\u003c/code> 的关系\u003c/td>\n\u003ctd>\u003cstrong>正交、可同时用\u003c/strong>：前者决定「账号从哪来」，本钩子决定「它还能不能用」；自定义 provider 只要返回身份数组，钩子照样生效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未配置时\u003c/td>\n\u003ctd>完全跳过，行为与原来一致（纯 opt-in）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>类名写错\u003c/td>\n\u003ctd>静默跳过（\u003ccode>stateGuard()\u003c/code> 返回 \u003ccode>null\u003c/code>），不报错——排查先确认 \u003ccode>class_exists()\u003c/code> 与 \u003ccode>restart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-25\">3. 权限总开关（permission_enabled）\u003c/h2>\n\u003ch3 id=\"h-26\">3.1 作用域\u003c/h3>\n\u003cp>\u003ccode>permission_enabled\u003c/code> 控制\u003cstrong>整条 RBAC 链\u003c/strong>的开关：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>值\u003c/th>\n\u003cth>PermissionCheck 中间件\u003c/th>\n\u003cth>登录/me 响应\u003c/th>\n\u003cth>安装器（api/Install.php）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>true\u003c/code>（默认）\u003c/td>\n\u003ctd>走 casbin 校验，推导 \u003ccode>obj:act\u003c/code>\u003c/td>\n\u003ctd>下发真实 \u003ccode>permissions\u003c/code>\u003c/td>\n\u003ctd>写 \u003ccode>g/user→admin\u003c/code> + \u003ccode>p,admin,*,*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>直接放行（不再 403）\u003c/td>\n\u003ctd>\u003ccode>permissions=[]\u003c/code> 且响应带 \u003ccode>permission_enabled:false\u003c/code>\u003c/td>\n\u003ctd>不写任何 \u003ccode>casbin_rule\u003c/code>（不产生权限数据）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-27\">3.2 配置方式\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php\nreturn [\n    // ...\n    &#39;permission_enabled&#39; =&gt; false, // false = 所有人放行（仅登录即可），不写/true = 走 RBAC\n];\n\u003c/code>\u003c/pre>\n\u003cp>同样改完需\u003cstrong>重载 worker\u003c/strong> 生效。\u003c/p>\n\u003ch3 id=\"h-28\">3.3 关闭后行为\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>PermissionCheck\u003c/code> 顶部 \u003ccode>if (!$this-&gt;permissionEnabled()) return $handler($request);\u003c/code> —— 任何路径都直接放行，\n\u003ccode>{&quot;code&quot;:403,&quot;msg&quot;:&quot;没有权限操作...&quot;}\u003c/code> 不再出现。\u003c/li>\n\u003cli>登录与 \u003ccode>/api/auth/me\u003c/code> 返回的 \u003ccode>permissions\u003c/code> 为空数组，并附带 \u003ccode>permission_enabled: false\u003c/code> 字段，\n\u003cstrong>供前端判断\u003c/strong>（例如隐藏「无权限」提示、放开全部菜单）。\u003c/li>\n\u003cli>\u003cstrong>登录认证仍然生效\u003c/strong>：必须登录（带有效 token），只是不做权限分级。\u003c/li>\n\u003cli>想恢复 RBAC：把值改回 \u003ccode>true\u003c/code> 并重载即可，无需其他操作。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-29\">3.4 安装器联动\u003c/h3>\n\u003cp>\u003ccode>plugin/curd/api/Install.php\u003c/code> 在种子 admin 账号时，对 \u003ccode>casbin_rule\u003c/code> 的写入受开关保护：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 权限总开关关闭时不产生任何权限（g/admin、p,admin,*,* 均跳过）\nif ($this-&gt;permissionEnabled()) {\n    // 写 g&lt;userId,admin&gt; 与 p&lt;admin,*,*&gt;\n}\n\u003c/code>\u003c/pre>\n\u003cp>即：在 \u003ccode>permission_enabled=false\u003c/code> 状态下执行安装/升级，数据库里\u003cstrong>不会留下任何 casbin 策略\u003c/strong>，\n避免日后改回 \u003ccode>true\u003c/code> 时残留脏数据。\u003c/p>\n\u003ch3 id=\"h-30\">3.5 与 \u003ccode>admin_require_permission\u003c/code> 的关系\u003c/h3>\n\u003cp>两者正交，互不影响：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>permission_enabled\u003c/code>（\u003ccode>config/curd-admin.php\u003c/code>）：总开关，\u003cstrong>关掉 = 全部放行\u003c/strong>。\u003c/li>\n\u003cli>\u003ccode>admin_require_permission\u003c/code>（\u003ccode>.env\u003c/code> 的 \u003ccode>CURD_ADMIN_REQUIRE_PERMISSION\u003c/code>）：仅控制 \u003ccode>/api/admin/*\u003c/code>\n（用户/角色/个人中心）是否强制 RBAC 校验；默认 \u003ccode>false\u003c/code>（仅登录即可），新项目建议设 \u003ccode>true\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>permission_enabled=false\u003c/code> 时，\u003ccode>admin_require_permission\u003c/code> 无论设什么都不再生效（总开关已放行）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-31\">4. 端到端验证示例\u003c/h2>\n\u003cblockquote>\n\u003cp>注意：插件用 \u003cstrong>JSON body 的 \u003ccode>code\u003c/code> 字段\u003c/strong>表示业务状态，\u003cstrong>HTTP 状态码恒为 200\u003c/strong>。\n因此判断成败要看 body 里的 \u003ccode>code\u003c/code>（200=成功 / 401=未登录 / 403=无权限），而不是 \u003ccode>curl -w %{http_code}\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>① 默认 admin_users 登录（权限开）\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -s -X POST http://127.0.0.1:8787/api/auth/login \\\n  -H &#39;Content-Type: application/json&#39; \\\n  -d &#39;{&quot;username&quot;:&quot;admin&quot;,&quot;password&quot;:&quot;admin123&quot;}&#39;\n# → {&quot;code&quot;:200,&quot;data&quot;:{&quot;token&quot;:&quot;...&quot;,&quot;user&quot;:{...,&quot;permissions&quot;:[...]}}}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 自定义 my_users 表 bob 登录\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -s -X POST http://127.0.0.1:8787/api/auth/login \\\n  -H &#39;Content-Type: application/json&#39; \\\n  -d &#39;{&quot;username&quot;:&quot;bob&quot;,&quot;password&quot;:&quot;secret123&quot;}&#39;\n# → {&quot;code&quot;:200,&quot;data&quot;:{&quot;user&quot;:{&quot;username&quot;:&quot;bob&quot;,...}}}\ncurl -s http://127.0.0.1:8787/api/auth/me -H &quot;Authorization: Bearer &lt;bob的token&gt;&quot;\n# → bob 被正确还原（含 roles=editor）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 权限开 + 无角色用户访问受保护接口\u003c/strong> → \u003ccode>code=403\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -s http://127.0.0.1:8787/api/curd/tables -H &quot;Authorization: Bearer &lt;无角色用户的token&gt;&quot;\n# → {&quot;code&quot;:403,&quot;msg&quot;:&quot;没有权限操作:curd:tables&quot;}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>④ 权限关（permission_enabled=false） + 同一用户\u003c/strong> → 放行 + 无权限下发\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -s http://127.0.0.1:8787/api/curd/tables -H &quot;Authorization: Bearer &lt;同一token&gt;&quot;\n# → {&quot;code&quot;:200,...,&quot;permission_enabled&quot;:false,&quot;permissions&quot;:[]}\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-32\">5. 常见问题 / 排错\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>改了 \u003ccode>config/curd-admin.php\u003c/code> 没生效\u003c/strong>：配置是 worker 启动期加载，必须 \u003ccode>restart\u003c/code> 或 \u003ccode>SIGUSR1\u003c/code> 重载，热改文件不生效。\u003c/li>\n\u003cli>\u003cstrong>自定义登录方返回 null 却想给明确错误\u003c/strong>：\u003ccode>login()\u003c/code> 只能返回身份数组或 \u003ccode>null\u003c/code>；想区分「用户不存在」「密码错」可在 \u003ccode>null\u003c/code> 前用日志/监控区分，响应统一是 401。\u003c/li>\n\u003cli>\u003cstrong>登录成功但 \u003ccode>/api/auth/me\u003c/code> 报用户不存在\u003c/strong>：\u003ccode>login()\u003c/code> 的 \u003ccode>id\u003c/code> 与 \u003ccode>resolveUser($id)\u003c/code> 取数来源不一致，核对两边用的是同一张表同一列。\u003c/li>\n\u003cli>\u003cstrong>关掉权限后前端还显示无权限\u003c/strong>：前端需读取响应里的 \u003ccode>permission_enabled\u003c/code> 字段自行处理；插件只负责后端放行与字段透传。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>auth_provider\u003c/code> 写错类名\u003c/strong>：插件不会抛错，自动回退 \u003ccode>DefaultAuthProvider\u003c/code>（仍是 \u003ccode>admin_users\u003c/code> 登录），排查时先看配置类名是否真的被加载。\u003c/li>\n\u003c/ul>\n"},{"file":"DSL-使用文档.md","title":"webman-huafei-platform 后台 DSL 使用文档","mtime":"2026/9/19 20:35:52","headings":[{"depth":2,"text":"1. 分层与文件归属（先读这一段）","id":"h-34"},{"depth":2,"text":"2. Schema 页面 DSL（重点）","id":"h-35"},{"depth":3,"text":"2.1 一句话原理","id":"h-36"},{"depth":3,"text":"2.2 新建一个页面（三步）","id":"h-37"},{"depth":3,"text":"2.3 页面根 PageSchema","id":"h-38"},{"depth":3,"text":"2.4 布局块（可任意嵌套，大布局套小布局）","id":"h-39"},{"depth":3,"text":"2.5 容器块（能继续装子节点）","id":"h-40"},{"depth":3,"text":"2.6 展示块（叶子，靠 props 驱动）","id":"h-41"},{"depth":3,"text":"2.7 数据绑定：{{key.path}} 注入","id":"h-42"},{"depth":3,"text":"2.8 props 白名单与安全","id":"h-43"},{"depth":3,"text":"2.9 渲染链路（改后端即生效，无需构建前端）","id":"h-44"},{"depth":3,"text":"2.10 扩展新组件（前后端各一步）","id":"h-45"},{"depth":3,"text":"2.11 .vue 自定义页面（app/custom/pages/）—— 怎么用、怎么访问","id":"h-46"},{"depth":3,"text":"2.12 完整示例：做一个「我的信息」页（Api Key + 可用余额）","id":"h-47"},{"depth":2,"text":"3. CURD 业务页 DSL","id":"h-48"},{"depth":3,"text":"3.1 新增一个 CURD 页（五步）","id":"h-49"},{"depth":3,"text":"3.2 控制器骨架","id":"h-50"},{"depth":3,"text":"3.3 常用列 grid()->column($prop, $label)","id":"h-51"},{"depth":3,"text":"3.4 搜索 grid()->filter(callable)","id":"h-52"},{"depth":3,"text":"3.5 表单 grid()->form(callable)（新增+编辑共用）","id":"h-53"},{"depth":4,"text":"3.5.1 场景字段控制：if ($form->isCreate()) / if ($form->isEdit())","id":"h-54"},{"depth":3,"text":"3.6 自定义操作 Action（行级/批量/全局/弹窗）","id":"h-55"},{"depth":4,"text":"3.6.1 全局/批量按钮 + 表单弹窗（global()/batch() × form()）","id":"h-56"},{"depth":4,"text":"3.6.2 Excel 导入字段 $form->excel()（multipart 直传 + 自动解析）","id":"h-57"},{"depth":3,"text":"3.7 列表头汇总条 grid()->summary(callable)","id":"h-58"},{"depth":3,"text":"3.8 其它常用开关","id":"h-59"},{"depth":2,"text":"4. 菜单 / 权限 / 生效","id":"h-60"},{"depth":3,"text":"4.1 权限被拒时不泄露内部结构（安全约定）","id":"h-61"},{"depth":3,"text":"4.2 自定义登录（覆盖内置 login）","id":"h-62"},{"depth":4,"text":"叠加额外状态判定：auth_state_guard","id":"h-63"},{"depth":3,"text":"4.3 新建菜单「一键生成权限」","id":"h-64"},{"depth":3,"text":"4.4 菜单行内「快速创建权限」","id":"h-65"},{"depth":3,"text":"4.5 URL 里只能传「已注册模型名」，猜不到别的表","id":"h-66"},{"depth":3,"text":"4.6 默认落地页 home_page（登录后 / 刷新根路径打开哪一页）","id":"h-67"},{"depth":3,"text":"4.7 登录图形验证码（webman/captcha）与「记住账号」","id":"h-68"},{"depth":2,"text":"5. 踩坑速查","id":"h-69"}],"html":"\u003ch1 id=\"h-33\">webman-huafei-platform 后台 DSL 使用文档\u003c/h1>\n\u003cblockquote>\n\u003cp>适用版本：2026-09-19（Schema 页面引擎已迁入 plugin/curd 插件；插件自带「测试管理」后台示例\nmy_test / MyTestController——安装器把示例代码落位到宿主根 \u003ccode>app/controller/admin/api/MyTestController.php\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>app/model/MyTest.php\u003c/code>（源在包 \u003ccode>examples/\u003c/code>），安装时自动建表 + 幂等补菜单，可作为新控制器最小参考）\u003c/li>\n\u003c/ul>\n\u003cp>本次新增：\u003cstrong>§2.6 仪表盘组件 \u003ccode>box\u003c/code>（指标卡片）+ \u003ccode>line-chart-stat\u003c/code>（折线图统计卡，echarts 按需加载）\u003c/strong>、\n§2.11 \u003ccode>.vue\u003c/code> 自定义页面（\u003ccode>custom/pages\u003c/code> 怎么放、怎么访问、运行时白名单）、\n§4.1 权限被拒不泄露内部结构 + 服务端日志、§4.2 自定义登录覆盖（\u003ccode>login_handler\u003c/code> / \u003ccode>LoginIssuer\u003c/code>）、\n§4.3 新建菜单一键生成权限、§4.4 菜单行内快速创建权限。\u003c/p>\n\u003cp>本文面向「用 DSL 在话费平台后台造页面」的开发者。后端 DSL 分两类：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>DSL\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>形态\u003c/th>\n\u003cth>代码位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>CURD DSL\u003c/strong>\u003c/td>\n\u003ctd>列表管理页（表格/搜索/表单/自定义操作/导出/汇总条）\u003c/td>\n\u003ctd>\u003ccode>Grid/Form/Filter/Column/Action\u003c/code> 流式声明\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/dsl/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Schema 页面 DSL\u003c/strong>\u003c/td>\n\u003ctd>展示型页面（首页/看板，组件套组件 + 24 栏栅格 + 数据注入）\u003c/td>\n\u003ctd>\u003ccode>PageSchema + blocks\u003c/code> 编译成 JSON 组件树\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/app/schema/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-34\">1. 分层与文件归属（先读这一段）\u003c/h2>\n\u003cp>自研 CURD 插件 \u003ccode>plugin/curd\u003c/code> 提供\u003cstrong>通用引擎\u003c/strong>，业务项目（本项目 \u003ccode>webman-huafei-platform\u003c/code>）在 \u003cstrong>app 层\u003c/strong>消费它。两者严格分工：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>归属\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Schema 引擎（SchemaNode / PageSchema / PageRegistry / blocks 全部节点类）\u003c/td>\n\u003ctd>插件 \u003ccode>plugin/curd/app/schema/\u003c/code>\u003c/td>\n\u003ctd>命名空间 \u003ccode>plugin\\curd\\app\\schema\\*\u003c/code>，与业务无关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义页面分发控制器 \u003ccode>CustomPageController\u003c/code>（\u003ccode>.vue\u003c/code> + Schema 两种分发）\u003c/td>\n\u003ctd>插件 \u003ccode>plugin/curd/app/controller/CustomPageController.php\u003c/code>\u003c/td>\n\u003ctd>路由在插件 \u003ccode>plugin/curd/config/route.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema / .vue 页面 \u003cstrong>内容接口\u003c/strong> 路由 \u003ccode>GET /api/custom/pages\u003c/code>、\u003ccode>GET /api/custom/page\u003c/code>\u003c/td>\n\u003ctd>插件\u003c/td>\n\u003ctd>随插件自动加载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>业务 Schema 页面类\u003c/strong>（如首页 \u003ccode>HomePage\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/admin/api/HomePage.php\u003c/code>\u003c/td>\n\u003ctd>用户级文件，自己 \u003ccode>use\u003c/code> 插件 DSL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>数据接口\u003c/strong>（dataApi 指向的业务统计）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/admin/api/SchemaPageDataController.php\u003c/code>\u003c/td>\n\u003ctd>查业务表，属业务逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema 页面\u003cstrong>注册\u003c/strong>（\u003ccode>PageRegistry::register\u003c/code>）\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code> 顶部\u003c/td>\n\u003ctd>业务对插件扩展点的声明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 自定义页面文件\u003c/td>\n\u003ctd>业务 \u003ccode>app/custom/pages/*.vue\u003c/code>\u003c/td>\n\u003ctd>插件只读取分发，不存放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 业务控制器（Model + Grid）\u003c/td>\n\u003ctd>业务 \u003ccode>app/controller/admin/api/*Controller.php\u003c/code>\u003c/td>\n\u003ctd>extends \u003ccode>BaseAdminController\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CURD 路由注册 \u003ccode>RouteControllerRegistry::registerMany\u003c/code>\u003c/td>\n\u003ctd>业务 \u003ccode>config/route.php\u003c/code>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>页面访问入口约定\u003c/strong>（前端统一承载，菜单 path 填它）：\u003c/p>\n\u003cul>\n\u003cli>CURD 页：\u003ccode>/mobile-recharge-orders\u003c/code> 这类（即 registerMany 的 key）\u003c/li>\n\u003cli>Schema / .vue 自定义页：\u003ccode>/custom-page/&lt;页面名&gt;\u003c/code>（前端 catch-all 路由命中）\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-35\">2. Schema 页面 DSL（重点）\u003c/h2>\n\u003ch3 id=\"h-36\">2.1 一句话原理\u003c/h3>\n\u003cp>一个页面 = 后端 PHP DSL 流式声明的一棵\u003cstrong>组件树 JSON\u003c/strong>，前端 \u003ccode>SchemaRenderer\u003c/code> 递归把它渲染成真实 Element Plus 页面。树节点统一为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ &quot;type&quot;: &quot;card&quot;, &quot;props&quot;: { &quot;header&quot;: &quot;今日概览&quot; }, &quot;children&quot;: [ … ] }\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>type\u003c/code> 在\u003cstrong>前后端注册表\u003c/strong>里登记（后端 \u003ccode>plugin/curd/app/schema/blocks/\u003c/code> 的类，前端 \u003ccode>frontend/src/schema/componentRegistry.js\u003c/code>），\u003ccode>props\u003c/code> 走白名单透传。\u003cstrong>Schema 是纯数据、无脚本\u003c/strong>，比自定义 .vue 更可控。\u003c/p>\n\u003ch3 id=\"h-37\">2.2 新建一个页面（三步）\u003c/h3>\n\u003cp>\u003cstrong>① 写页面类\u003c/strong>（用户级文件放 \u003ccode>app/controller/admin/api/\u003c/code>，命名如 \u003ccode>XxxPage.php\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nnamespace app\\controller\\admin\\api;\n\nuse plugin\\curd\\app\\schema\\PageSchema;\nuse plugin\\curd\\app\\schema\\blocks\\Col;\nuse plugin\\curd\\app\\schema\\blocks\\Card;\nuse plugin\\curd\\app\\schema\\blocks\\Row;\n\nclass DashPage\n{\n    public static function schema(): PageSchema\n    {\n        $page = new PageSchema(&#39;概览看板&#39;);\n        $page-&gt;api(&#39;stats&#39;, &#39;/api/dash/stats&#39;);            // ① 数据接口（可多个）\n        $page-&gt;row(function (Row $row) {                   // ② 布局：24 栏栅格\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;今日&#39;, function (Card $card) {\n                    $card-&gt;statistic(&#39;充值额&#39;)-&gt;value(&#39;{{stats.amount}}&#39;)-&gt;prefix(&#39;¥&#39;);\n                });\n            });\n            $row-&gt;col(12, function (Col $col) {\n                $col-&gt;card(&#39;提示&#39;, function (Card $card) {\n                    $card-&gt;alert(&#39;正常&#39;, &#39;一切正常&#39;)-&gt;type(&#39;success&#39;)-&gt;closable(false);\n                });\n            });\n        });\n        return $page;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>② 注册\u003c/strong>（业务 \u003ccode>config/route.php\u003c/code> 顶部，一行）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">PageRegistry::register(&#39;dash&#39;, [\\app\\controller\\admin\\api\\DashPage::class, &#39;schema&#39;]);\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>③ 建菜单\u003c/strong>，\u003ccode>path\u003c/code> 填 \u003ccode>/custom-page/dash\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php webman make:permission --name 概览看板 --slug dash-page --type 1 --path /custom-page/dash --icon DataBoard --sort 3\n\u003c/code>\u003c/pre>\n\u003cp>改完 \u003ccode>php start.php restart\u003c/code>（新类 + 注册生效），刷新即可看到页面。\u003cstrong>已注册的参考实现\u003c/strong>：\u003ccode>app/controller/admin/api/HomePage.php\u003c/code>（首页，name=\u003ccode>home\u003c/code>）。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003ccode>.vue\u003c/code> 自定义页面是同一入口体系的另一形态：文件放 \u003ccode>app/custom/pages/demo.vue\u003c/code>，菜单 path \u003ccode>/custom-page/demo\u003c/code>，前端运行时编译渲染（复杂交互页用）。同名时 \u003cstrong>Schema 注册表优先\u003c/strong>于 .vue 文件。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-38\">2.3 页面根 PageSchema\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new PageSchema(?string $title)\u003c/code>\u003c/td>\n\u003ctd>页面根节点（type=\u003ccode>page\u003c/code>，不参与渲染，只承载 title/dataApi/body）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code>\u003c/td>\n\u003ctd>页面标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;api(string $key, string $url, string $method = &#39;get&#39;, array $params = [])\u003c/code>\u003c/td>\n\u003ctd>声明数据接口。渲染前前端并发请求，结果放进 \u003ccode>pageData[$key]\u003c/code>，供 \u003ccode>{{key.xxx}}\u003c/code> 注入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;row/col/card/collapse/timeline/descriptions/divider/alert/statistic/image/text/copyText/box/lineChartStat/node\u003c/code>\u003c/td>\n\u003ctd>顶层挂载（来自 \u003ccode>HasBlocks\u003c/code> trait，下面节点通用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;toArray()\u003c/code>\u003c/td>\n\u003ctd>输出 \u003ccode>{ title, dataApi, body }\u003c/code>，由 CustomPageController 下发\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-39\">2.4 布局块（可任意嵌套，大布局套小布局）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>透传 prop（白名单）\u003c/th>\n\u003cth>取值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Row\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;gutter(int)\u003c/code> \u003ccode>-&gt;justify(str)\u003c/code> \u003ccode>-&gt;align(str)\u003c/code>\u003c/td>\n\u003ctd>gutter/justify/align/wrap\u003c/td>\n\u003ctd>justify: start/end/center/space-around/space-between/space-evenly；align: top/middle/bottom\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Col\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;span(int 1-24)\u003c/code> \u003ccode>-&gt;offset(int)\u003c/code> \u003ccode>-&gt;moveRight(int)\u003c/code>(push) \u003ccode>-&gt;moveLeft(int)\u003c/code>(pull) \u003ccode>-&gt;responsive(&#39;md&#39;, 8)\u003c/code>\u003c/td>\n\u003ctd>span/offset/push/pull/xs/sm/md/lg/xl\u003c/td>\n\u003ctd>响应式断点同 el-col\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>子节点规则：\u003ccode>row\u003c/code> 装 \u003ccode>col\u003c/code>；\u003ccode>col\u003c/code> 纵向堆叠任意块。想缩进偏移用 \u003ccode>offset\u003c/code>，想调整顺序用 \u003ccode>moveRight/moveLeft\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-40\">2.5 容器块（能继续装子节点）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>子节点规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Card\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;header(string)\u003c/code>（渲染到 EP 卡片 header 插槽） \u003ccode>-&gt;shadow(&#39;always&#39;|&#39;hover&#39;|&#39;never&#39;)\u003c/code>\u003c/td>\n\u003ctd>children 进卡片正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Collapse\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;accordion(bool)\u003c/code> \u003ccode>-&gt;active(array $names)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(title, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>collapse-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CollapseItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(string)\u003c/code> \u003ccode>-&gt;name(string)\u003c/code> \u003ccode>-&gt;disabled(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children（可再嵌 row/card/描述…）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Timeline\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(ts, cb)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>timeline-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>TimelineItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;timestamp(string)\u003c/code> \u003ccode>-&gt;placement(&#39;top&#39;|&#39;bottom&#39;)\u003c/code> \u003ccode>-&gt;type(&#39;primary&#39;|&#39;success&#39;|&#39;warning&#39;|&#39;danger&#39;|&#39;info&#39;)\u003c/code> \u003ccode>-&gt;color(string)\u003c/code> \u003ccode>-&gt;hollow(bool)\u003c/code>\u003c/td>\n\u003ctd>内容放 children\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Descriptions\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;column(int)\u003c/code> \u003ccode>-&gt;border(bool)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;colon(bool)\u003c/code> \u003ccode>-&gt;size(&#39;large&#39;|&#39;default&#39;|&#39;small&#39;)\u003c/code>\u003c/td>\n\u003ctd>只能 \u003ccode>-&gt;item(label, content)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>descriptions-item\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>DescriptionsItem\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;span(int)\u003c/code> \u003ccode>-&gt;width(mixed)\u003c/code>\u003c/td>\n\u003ctd>值内容放 children；\u003ccode>item()\u003c/code> 传字符串自动转 Text 子节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Divider\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;content(string)\u003c/code>（中央文字） \u003ccode>-&gt;contentPosition(&#39;left&#39;|&#39;center&#39;|&#39;right&#39;)\u003c/code> \u003ccode>-&gt;direction(&#39;horizontal&#39;|&#39;vertical&#39;)\u003c/code> \u003ccode>-&gt;borderStyle(str)\u003c/code>\u003c/td>\n\u003ctd>中央文字用 \u003ccode>content()\u003c/code>，子节点作默认插槽\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>条目类（\u003ccode>*-item\u003c/code>）\u003cstrong>只能\u003c/strong>作为对应容器（collapse/timeline/descriptions）的直接子节点，不可隔层——渲染器用单组件 \u003ccode>h()\u003c/code> 递归保证它们是父容器的直接相邻 VNode。\u003c/p>\n\u003ch3 id=\"h-41\">2.6 展示块（叶子，靠 props 驱动）\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>type\u003c/th>\n\u003cth>类\u003c/th>\n\u003cth>便捷方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Alert\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;description(str)\u003c/code> \u003ccode>-&gt;type(&#39;success&#39;|&#39;info&#39;|&#39;warning&#39;|&#39;error&#39;)\u003c/code> \u003ccode>-&gt;closable(bool)\u003c/code> \u003ccode>-&gt;showIcon(bool)\u003c/code> \u003ccode>-&gt;center(bool)\u003c/code> \u003ccode>-&gt;effect(&#39;light&#39;|&#39;dark&#39;)\u003c/code>\u003c/td>\n\u003ctd>提示条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Statistic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;prefix(str)\u003c/code> \u003ccode>-&gt;suffix(str)\u003c/code> \u003ccode>-&gt;precision(int)\u003c/code> \u003ccode>-&gt;groupSeparator(str)\u003c/code> \u003ccode>-&gt;valueStyle(array)\u003c/code>\u003c/td>\n\u003ctd>数值卡；value 整串 \u003ccode>{{}}\u003c/code> 且为数字时自动转 number\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Box\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;value($v)\u003c/code> \u003ccode>-&gt;sub(str, $v=null)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;subValue($v)\u003c/code> \u003ccode>-&gt;icon(str)\u003c/code> \u003ccode>-&gt;color(str)\u003c/code> \u003ccode>-&gt;tag(str)\u003c/code> \u003ccode>-&gt;height(int=108)\u003c/code> \u003ccode>-&gt;group(bool=false)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>指标卡片\u003c/strong>：图标 + 大数字 + 副标题 + 右上角周期标记，仪表盘顶部并排四个的经典形态。\u003ccode>icon\u003c/code> 取 EP 图标名（\u003ccode>View\u003c/code>/\u003ccode>Money\u003c/code>/\u003ccode>User\u003c/code>/\u003ccode>Tickets\u003c/code>…，见前端 \u003ccode>utils/icons\u003c/code>）；\u003ccode>color\u003c/code> 取 \u003ccode>blue\u003c/code>/\u003ccode>green\u003c/code>/\u003ccode>red\u003c/code>/\u003ccode>orange\u003c/code>/\u003ccode>purple\u003c/code>/\u003ccode>cyan\u003c/code>，同时决定图标底色与标记配色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LineChartStat\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;title(str)\u003c/code> \u003ccode>-&gt;subTitle(str)\u003c/code> \u003ccode>-&gt;data(array|str)\u003c/code> \u003ccode>-&gt;categories(array|str)\u003c/code> \u003ccode>-&gt;seriesName(str=&#39;业绩&#39;)\u003c/code> \u003ccode>-&gt;color(str=&#39;#36cfc9&#39;)\u003c/code> \u003ccode>-&gt;height(int=350)\u003c/code> \u003ccode>-&gt;smooth(bool=true)\u003c/code> \u003ccode>-&gt;showMax(bool=true)\u003c/code> \u003ccode>-&gt;showAverage(bool=true)\u003c/code> \u003ccode>-&gt;areaGradient(bool=true)\u003c/code> \u003ccode>-&gt;unit(str)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>折线图统计卡\u003c/strong>：卡片标题 + 子标题 + 渐变面积折线图（峰值气泡 + 平均值虚线）。\u003ccode>data\u003c/code> 走 echarts 按需注册（不引入全量），\u003cstrong>取不到数据时显示「暂无数据」空态\u003c/strong>而非空图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Image\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;src(str)\u003c/code> \u003ccode>-&gt;fit(&#39;fill&#39;|&#39;contain&#39;|&#39;cover&#39;|&#39;none&#39;|&#39;scale-down&#39;)\u003c/code> \u003ccode>-&gt;alt(str)\u003c/code> \u003ccode>-&gt;lazy(bool)\u003c/code> \u003ccode>-&gt;previewSrcList(array)\u003c/code> \u003ccode>-&gt;previewTeleported(bool)\u003c/code>\u003c/td>\n\u003ctd>点击预览大图等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>copy-text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>CopyText\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code> \u003ccode>-&gt;label(str)\u003c/code> \u003ccode>-&gt;mono(bool=true)\u003c/code> \u003ccode>-&gt;mask(bool=false)\u003c/code> \u003ccode>-&gt;maskHead(int=4)\u003c/code> \u003ccode>-&gt;maskTail(int=4)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>可复制文本\u003c/strong>：等宽展示 + 一键复制按钮，用于 api_key / 密钥 / 回调地址等长串；\u003ccode>-&gt;mask(true)\u003c/code> 默认打码，配眼睛按钮切换明文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Text\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-&gt;value(str)\u003c/code>（也可 \u003ccode>new Text(&#39;内容&#39;)\u003c/code>）\u003c/td>\n\u003ctd>纯文本（渲染 span，非 EP 组件），说明文字用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>仪表盘组合示例\u003c/strong>（\u003ccode>box\u003c/code> 一排四个 + \u003ccode>line-chart-stat\u003c/code> 整行，即典型后台首页首屏）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 第一行：四个指标卡片\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;今日订单&#39;, &#39;{{stats.today_count}}&#39;)\n            -&gt;sub(&#39;今日成功&#39;, &#39;{{stats.today_success_count}}&#39;)\n            -&gt;icon(&#39;Tickets&#39;)-&gt;color(&#39;blue&#39;)-&gt;tag(&#39;日&#39;);\n    });\n    $row-&gt;col(6, function (Col $col) {\n        $col-&gt;box(&#39;本月金额&#39;, &#39;{{stats.month_amount}}&#39;)\n            -&gt;sub(&#39;本月成功单金额&#39;)\n            -&gt;icon(&#39;Money&#39;)-&gt;color(&#39;green&#39;)-&gt;tag(&#39;月&#39;);\n    });\n    // … 另两个同理（red / orange）\n});\n\n// 第二行：折线图统计卡（data / categories 均可直接传数组或占位符）\n$page-&gt;row(function (Row $row) {\n    $row-&gt;gutter(16);\n    $row-&gt;col(24, function (Col $col) {\n        $col-&gt;lineChartStat(&#39;订单趋势&#39;)\n            -&gt;subTitle(&#39;近 30 天成功单走势&#39;)\n            -&gt;data(&#39;{{stats.trend_counts}}&#39;)      // 数据接口返回数组 → 整串注入\n            -&gt;categories(&#39;{{stats.trend_days}}&#39;)\n            -&gt;seriesName(&#39;成功单&#39;)\n            -&gt;color(&#39;#36cfc9&#39;);\n    });\n});\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003ccode>data\u003c/code> 的两种写法：① \u003ccode>-&gt;data(&#39;{{stats.trend_counts}}&#39;)\u003c/code> 由 dataApi 注入（推荐）；\n② \u003ccode>-&gt;data([20, 25, 30, …])\u003c/code> 直接写静态数组（适合演示或常量数据）。\u003ccode>categories\u003c/code> 省略时自动用 \u003ccode>1..n\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-42\">2.7 数据绑定：\u003ccode>{{key.path}}\u003c/code> 注入\u003c/h3>\n\u003col>\n\u003cli>页面 \u003ccode>-&gt;api(&#39;stats&#39;, &#39;/api/xxx&#39;)\u003c/code> 声明数据源；数据接口就是一个普通控制器方法，返回统一响应 \u003ccode>{code, msg, data}\u003c/code>，渲染前前端并发请求并取 \u003cstrong>\u003ccode>data\u003c/code>\u003c/strong> 作为 \u003ccode>pageData[&#39;stats&#39;]\u003c/code>。\u003c/li>\n\u003cli>任一节点 props 的字符串里可用 \u003ccode>{{stats.today_amount}}\u003c/code> 占位：\u003cul>\n\u003cli>\u003cstrong>整串就是占位符\u003c/strong>（如 \u003ccode>value: &quot;{{stats.amount}}&quot;\u003c/code>）：数据是数字 → 注入数字（statistic 需要）；是对象/数组 → 原样注入；取不到 → \u003cstrong>保留原文\u003c/strong>（避免渲染出 undefined）；\u003c/li>\n\u003cli>占位符\u003cstrong>嵌在长文本\u003c/strong>里（如 \u003ccode>&quot;¥{{stats.amount}} 元&quot;\u003c/code>）→ 文本替换，取不到替换为空串。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>只做取值替换，不执行任何 JS\u003c/strong>。单个 dataApi 失败不阻塞整页（该键数据为空，占位保留便于定位）。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>参考数据接口：\u003ccode>SchemaPageDataController::home\u003c/code>（GET \u003ccode>/api/schema/home/stats\u003c/code>），返回 \u003ccode>today_amount / today_count / month_amount / pending_count / account_total / account_count / accounts[]\u003c/code>，与订单列表头部汇总条同口径。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-43\">2.8 props 白名单与安全\u003c/h3>\n\u003cp>后端 block 的 \u003ccode>-&gt;方法()\u003c/code> 本质是往 \u003ccode>props\u003c/code> 里塞键（\u003ccode>SchemaNode::set\u003c/code>）。\u003cstrong>前端渲染器只透传注册表白名单内的键\u003c/strong>（\u003ccode>componentRegistry.js\u003c/code>），其余一律丢弃——避免脏属性打到 EP 组件上、也避免任意数据注入造成意外行为。三个兜底入口：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$card-&gt;raw([&#39;bodyStyle&#39; =&gt; [&#39;padding&#39; =&gt; &#39;12px&#39;]]); // SchemaNode::raw：一次合并多个 props\n$img-&gt;set(&#39;initialIndex&#39;, 2);                        // SchemaNode::set：单个 prop（白名单外前端会忽略）\n$node-&gt;node($anyNode);                               // 挂载任意已构造好的节点\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-44\">2.9 渲染链路（改后端即生效，无需构建前端）\u003c/h3>\n\u003cpre>\u003ccode>菜单 /custom-page/&lt;name&gt;\n  → GET /api/custom/page?name=&lt;name&gt;      (插件 CustomPageController)\n  → PageRegistry::find(name) 有 → {format:&#39;schema&#39;, schema:{…}}\n      | 无 → app/custom/pages/&lt;name&gt;.vue 有 → {format:&#39;vue&#39;, content, mtime}\n  → 前端 CustomPageHost 按 format 分派：\n      schema → 并发请求 dataApi → interpolateSchema 注入 → SchemaRenderer 递归渲染\n      vue    → dynamicSfc 运行时编译 SFC 渲染\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>渲染器三条特殊规则\u003c/strong>（\u003ccode>SchemaRenderer.vue\u003c/code>）：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>card\u003c/code> 的 \u003ccode>header\u003c/code> 不是 prop，是 EP 命名插槽 → 渲染器把 \u003ccode>props.header\u003c/code> 转成 header 插槽；\u003c/li>\n\u003cli>\u003ccode>collapse\u003c/code> 的展开状态（v-model）由渲染器 WeakMap 自托管，初始取 \u003ccode>props.activeNames\u003c/code>，页面无需写交互代码；\u003c/li>\n\u003cli>所有容器一律递归 children 到\u003cstrong>默认插槽\u003c/strong>，保证 \u003ccode>*-item\u003c/code> 是父容器的直接子 VNode（EP 结构要求）。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"h-45\">2.10 扩展新组件（前后端各一步）\u003c/h3>\n\u003cp>以加一个「链接按钮」为例：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>后端\u003c/strong> \u003ccode>plugin/curd/app/schema/blocks/Button.php\u003c/code>：\u003ccode>class Button extends SchemaNode { __construct(){ $this-&gt;type=&#39;button&#39;; } public function text($v){ return $this-&gt;set(&#39;text&#39;,$v); } }\u003c/code>（并可在 \u003ccode>HasBlocks::button()\u003c/code> 加便捷入口）；\u003c/li>\n\u003cli>\u003cstrong>前端\u003c/strong> \u003ccode>componentRegistry.js\u003c/code> 登记一行：\u003ccode>button: { component: ElButton, props: [&#39;text&#39;,&#39;type&#39;,&#39;link&#39;, ...COMMON] }\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>渲染器零改动。当前已注册 type 全表 = 第 2.4~2.6 节列出的 20 个。\u003c/p>\n\u003cp>\u003cstrong>component 也可以指向自定义 Vue 组件\u003c/strong>（不限于 EP 组件）：\u003ccode>copy-text\u003c/code>、\u003ccode>box\u003c/code>、\u003ccode>line-chart-stat\u003c/code> 都是先例 ——\n\u003ccode>componentRegistry.js\u003c/code> 里 \u003ccode>&#39;copy-text&#39;: { component: CopyTextNode, props: [...] }\u003c/code>，\n\u003ccode>CopyTextNode.vue\u003c/code> 自己负责渲染与交互（渲染器仍然只按 \u003ccode>h(component, props, slots)\u003c/code> 调用，\nprops 依旧走白名单）。复制这类交互因此可以纯前端实现，后端 block 只负责摆位置与传值。\u003c/p>\n\u003cp>其中 \u003ccode>line-chart-stat\u003c/code> 还证明了\u003cstrong>图表也能内建\u003c/strong>：echarts 在节点组件内按需注册\n（\u003ccode>echarts/core\u003c/code> + LineChart/Grid/MarkPoint/MarkLine/Canvas，与 \u003ccode>views/dashboard\u003c/code> 共用同一份模块），\n所以加一个图表块不会引入全量 echarts（产物里 echarts 独立成 chunk，约 460 KB / gzip 155 KB）。\n真正需要「图表联动、多图 k 线、下钻筛选」这类交互时，仍建议走 \u003ccode>.vue\u003c/code> 页面。\u003c/p>\n\u003ch3 id=\"h-46\">2.11 \u003ccode>.vue\u003c/code> 自定义页面（\u003ccode>app/custom/pages/\u003c/code>）—— 怎么用、怎么访问\u003c/h3>\n\u003cp>Schema 只适合「纯展示」。一旦要写复杂交互（自定义表格逻辑、图表联动、多步表单、第三方组件），就用 \u003ccode>.vue\u003c/code> 页面：\u003c/p>\n\u003cp>\u003cstrong>① 放文件\u003c/strong>：\u003ccode>&lt;宿主根&gt;/app/custom/pages/&lt;name&gt;.vue\u003c/code>。\u003cstrong>文件名即页面名，无需注册\u003c/strong>；支持子目录（\u003ccode>sub/foo.vue\u003c/code> → name=\u003ccode>sub/foo\u003c/code>）。目录可用 \u003ccode>config/plugin/curd/curd.php\u003c/code> 的 \u003ccode>vue_pages_dir\u003c/code> 改。\u003c/p>\n\u003cp>\u003cstrong>② 建菜单\u003c/strong>：\u003ccode>path\u003c/code> 填 \u003ccode>/custom-page/&lt;name&gt;\u003c/code>（与 Schema 页同一个入口体系）。\u003c/p>\n\u003cp>\u003cstrong>③ 怎么访问\u003c/strong>（三种都行）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>途径\u003c/th>\n\u003cth>地址\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>后台点菜单\u003c/td>\n\u003ctd>前端 catch-all 路由命中 \u003ccode>/custom-page/&lt;name&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直接开 URL\u003c/td>\n\u003ctd>\u003ccode>http://&lt;宿主域名&gt;/app/curd/custom-page/&lt;name&gt;\u003c/code>（插件内置前端挂 \u003ccode>/app/curd/\u003c/code> 前缀，history 模式）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调试接口\u003c/td>\n\u003ctd>\u003ccode>GET /api/custom/page?name=&lt;name&gt;\u003c/code> → \u003ccode>{format:&#39;vue&#39;, content, mtime}\u003c/code>；\u003ccode>GET /api/custom/pages\u003c/code> 列全部页面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>运行时约束\u003c/strong>（内容由浏览器端 \u003ccode>@vue/compiler-sfc\u003c/code> 现场编译，绕开了 Vite，因此有白名单）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>结构\u003c/td>\n\u003ctd>\u003ccode>&lt;template&gt;\u003c/code> + \u003ccode>&lt;script setup&gt;\u003c/code>（或 \u003ccode>&lt;script&gt;\u003c/code>，\u003cstrong>二选一，不能同时写\u003c/strong>）+ \u003ccode>&lt;style&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可 import 的模块\u003c/td>\n\u003ctd>\u003cstrong>仅 3 个\u003c/strong>：\u003ccode>vue\u003c/code>、\u003ccode>element-plus\u003c/code>、\u003ccode>@element-plus/icons-vue\u003c/code>。其它任意 specifier（含相对路径 \u003ccode>./x.js\u003c/code>、\u003ccode>axios\u003c/code>、\u003ccode>lodash\u003c/code>）编译期直接报「不支持导入模块」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>发请求\u003c/td>\n\u003ctd>\u003ccode>const request = inject(&#39;request&#39;)\u003c/code> 拿统一加密请求服务（自动带 token + RSA/AES 信封，签名同 axios：\u003ccode>request.get/post\u003c/code>）；\u003ccode>inject(&#39;router&#39;)\u003c/code> / \u003ccode>inject(&#39;route&#39;)\u003c/code> 同理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组件\u003c/td>\n\u003ctd>\u003ccode>element-plus\u003c/code> 全量注册到应用，模板里 \u003ccode>&lt;el-xxx&gt;\u003c/code> 直接写，\u003cstrong>不用 import 注册\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>样式\u003c/td>\n\u003ctd>\u003cstrong>只支持纯 CSS\u003c/strong>（\u003ccode>lang=&quot;scss&quot;\u003c/code> 会报错）；\u003ccode>&lt;style scoped&gt;\u003c/code> 的 scoped 语义降级为\u003cstrong>全局注入\u003c/strong>（不做属性转写）→ 页面 class 请带唯一前缀防串样式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效\u003c/td>\n\u003ctd>改 \u003ccode>.vue\u003c/code> 文件\u003cstrong>不用重新构建前端\u003c/strong>，刷新页面即取最新（后端按 \u003ccode>mtime\u003c/code> 下发内容）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>参考实现：\u003ccode>app/custom/pages/demo.vue\u003c/code>（计数器 + \u003ccode>inject(&#39;request&#39;)\u003c/code> 调 \u003ccode>/api/config/site\u003c/code> + el-table）。\u003c/p>\n\u003cp>\u003cstrong>两条路线怎么选\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Schema 页面\u003c/th>\n\u003cth>\u003ccode>.vue\u003c/code> 页面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>写在哪\u003c/td>\n\u003ctd>后端 PHP（\u003ccode>app/controller/admin/api/*Page.php\u003c/code>）\u003c/td>\n\u003ctd>前端文件（\u003ccode>app/custom/pages/*.vue\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能力\u003c/td>\n\u003ctd>组件树 + 24 栏栅格 + \u003ccode>{{key.path}}\u003c/code> 数据注入，\u003cstrong>无脚本\u003c/strong>\u003c/td>\n\u003ctd>完整 Vue 3：响应式/异步/循环/自定义逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁维护\u003c/td>\n\u003ctd>后端自己能加页面，零前端资产\u003c/td>\n\u003ctd>前端同学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>安全边界\u003c/td>\n\u003ctd>props 白名单，最可控\u003c/td>\n\u003ctd>能跑任意页面逻辑（仍是登录后可访问）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>同名时 \u003cstrong>Schema 注册表优先\u003c/strong> 于同名 \u003ccode>.vue\u003c/code> 文件。\u003c/p>\n\u003ch3 id=\"h-47\">2.12 完整示例：做一个「我的信息」页（Api Key + 可用余额）\u003c/h3>\n\u003cp>需求：任何账号登录后只看到\u003cstrong>自己\u003c/strong>的 Api Key 与可用余额。\u003cstrong>全程只写后端 PHP，前端零改动。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>① 页面类\u003c/strong> \u003ccode>&lt;宿主&gt;/app/controller/admin/api/MyInfoPage.php\u003c/code>\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">class MyInfoPage\n{\n    public static function schema(): PageSchema\n    {\n        $page = new PageSchema(&#39;我的信息&#39;);\n        $page-&gt;api(&#39;info&#39;, &#39;/api/schema/my-info&#39;);        // 数据接口见 ②\n\n        $page-&gt;row(function (Row $row) {                  // 24 栏栅格\n            $row-&gt;gutter(16);\n            $row-&gt;col(8, function (Col $col) {            // 左：余额\n                $col-&gt;card(&#39;可用余额&#39;, function (Card $card) {\n                    $card-&gt;statistic(&#39;当前可用余额&#39;)\n                        -&gt;value(&#39;{{info.amount}}&#39;)-&gt;prefix(&#39;¥&#39;)-&gt;precision(2);\n                    $card-&gt;divider();\n                    $card-&gt;descriptions(function (Descriptions $d) {\n                        $d-&gt;column(1);\n                        $d-&gt;item(&#39;登录账号&#39;, &#39;{{info.username}}&#39;);\n                        $d-&gt;item(&#39;关联账户&#39;, &#39;{{info.account}}&#39;);\n                    });\n                });\n            });\n            $row-&gt;col(16, function (Col $col) {           // 右：账户资料\n                $col-&gt;card(&#39;账户资料&#39;, function (Card $c
