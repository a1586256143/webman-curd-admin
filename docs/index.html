必须一致\u003c/strong>（都用同一列），否则登录成功但后续请求取不到用户。\u003c/li>\n\u003cli>不实现 \u003ccode>AuthProviderInterface\u003c/code> 或类名写错 → 自动回退 \u003ccode>DefaultAuthProvider\u003c/code>，不会报错，但登录仍是 \u003ccode>admin_users\u003c/code>。\u003c/li>\n\u003cli>token 永远由插件签发（随机 32 字节 hex，存 \u003ccode>admin_tokens\u003c/code>，7 天有效，多会话互不影响）；自定义方不要自己发 token。\u003c/li>\n\u003cli>\u003ccode>DefaultAuthProvider\u003c/code> 本身就内置为参考样例（见 \u003ccode>plugin/curd/app/auth/DefaultAuthProvider.php\u003c/code>），换表/换校验只需重写 \u003ccode>login() + identity() + resolveUser()\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-140\">2.7 只加一层状态判定：\u003ccode>auth_state_guard\u003c/code>\u003c/h3>\n\u003cp>如果你的需求\u003cstrong>不是换登录来源\u003c/strong>，而是「账号还是那个账号，但要额外判断它还能不能用」\n（关联的业务账户被关闭、合同到期、部门撤销、白名单…），\u003cstrong>不要\u003c/strong>用 \u003ccode>auth_provider\u003c/code> 去覆盖三个方法：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>login()\u003c/code> / \u003ccode>identity()\u003c/code> / \u003ccode>resolveUser()\u003c/code> \u003cstrong>三个入口\u003c/strong>都会产出「账号可用性」，都得覆盖；\u003c/li>\n\u003cli>三者数据形状不一致：前两个是\u003cstrong>身份数组\u003c/strong>，\u003ccode>resolveUser()\u003c/code> 是\u003cstrong>用户对象\u003c/strong> → 判定逻辑要写两份；\u003c/li>\n\u003cli>\u003cstrong>漏覆盖任一入口不会报错\u003c/strong>，只会造成「接口能访问，但 \u003ccode>/api/auth/me\u003c/code> 状态不对」这类静默不一致。\u003c/li>\n\u003c/ul>\n\u003cp>改用 \u003ccode>auth_state_guard\u003c/code>，判定只写一处：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php\n&#39;auth_state_guard&#39; =&gt; \\app\\auth\\MyGuard::class,\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">namespace app\\auth;\n\nuse plugin\\curd\\app\\auth\\AuthStateGuardInterface;\n\nclass MyGuard implements AuthStateGuardInterface\n{\n    /** $account 是规范化后的对象，固定含 id / username / name / status 四个属性 */\n    public function allowed(object $account): ?bool\n    {\n        // false = 按「已禁用」处理；true / null = 放行\n        try {\n            return myBusinessCheck($account-&gt;username) ? true : false;\n        } catch (\\Throwable $e) {\n            \\support\\Log::error(&#39;[auth] 状态校验失败（已放行）: &#39; . $e-&gt;getMessage());\n            return true;   // fail-open：业务库抖动时不要把人全拦在门外\n        }\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>判定结果\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code> → 登录报 \u003cstrong>403「账号已被禁用」\u003c/strong>；已登录会话的\u003cstrong>下一次请求\u003c/strong>同样 403（\u003ccode>AuthCheck\u003c/code> 每请求都会调，无缓存延迟）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收口位置\u003c/td>\n\u003ctd>\u003ccode>DefaultAuthProvider::applyStateGuard()\u003c/code>（身份数组）/ \u003ccode>resolveUser()\u003c/code>（用户对象），宿主不需要关心两种形状\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与 \u003ccode>auth_provider\u003c/code> 的关系\u003c/td>\n\u003ctd>\u003cstrong>正交、可同时用\u003c/strong>：前者决定「账号从哪来」，本钩子决定「它还能不能用」；自定义 provider 只要返回身份数组，钩子照样生效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未配置时\u003c/td>\n\u003ctd>完全跳过，行为与原来一致（纯 opt-in）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>类名写错\u003c/td>\n\u003ctd>静默跳过（\u003ccode>stateGuard()\u003c/code> 返回 \u003ccode>null\u003c/code>），不报错——排查先确认 \u003ccode>class_exists()\u003c/code> 与 \u003ccode>restart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-141\">3. 接管整个登录接口：\u003ccode>login_handler\u003c/code>\u003c/h2>\n\u003cp>三种力度，按需选：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>配置项\u003c/th>\n\u003cth>改什么\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>① 只换凭据校验\u003c/td>\n\u003ctd>\u003ccode>auth_provider\u003c/code>\u003c/td>\n\u003ctd>校验逻辑（换表 / 换算法 / 对接外部账号）\u003c/td>\n\u003ctd>仍是「用户名密码 → 内置响应结构」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>② 连响应一起接管\u003c/td>\n\u003ctd>\u003ccode>login_handler\u003c/code>\u003c/td>\n\u003ctd>整个 \u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>要加风控 / 单点登录 / 额外返回字段（\u003cstrong>验证码插件已内置\u003c/strong>，见 §4，无需自己写；且校验发生在委派之前，自定义类不必再实现）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>③ 自己注册路由\u003c/td>\n\u003ctd>宿主 \u003ccode>config/route.php\u003c/code> 注册 \u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>路由 + 逻辑\u003c/td>\n\u003ctd>登录协议与内置完全不同（插件检测到路由已被注册即跳过自带那条）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>④ 叠加状态判定\u003c/td>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code>\u003c/td>\n\u003ctd>不改登录流程，只加一层「账号还能不能用」的业务判定\u003c/td>\n\u003ctd>关联业务账户被关闭 / 合同到期 / 白名单（\u003cstrong>正交，可与 ①②③ 同时用\u003c/strong>，见下）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>②最常用，写法（token 体系仍与插件一致）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/plugin/curd/curd.php\n&#39;login_handler&#39; =&gt; \\app\\admin\\MyLogin::class,\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">namespace app\\admin;\n\nuse support\\Request;\nuse plugin\\curd\\app\\auth\\LoginIssuer;\n\nclass MyLogin\n{\n    /** 与内置 login() 同签名：收 Request，返 Response */\n    public function login(Request $request)\n    {\n        $username = (string)$request-&gt;post(&#39;username&#39;);\n        // …你自己的校验：验证码、风控、外部单点接口…\n        if (!$ok) {\n            return json([&#39;code&#39; =&gt; 401, &#39;msg&#39; =&gt; &#39;自定义登录：用户名或密码错误&#39;]);\n        }\n\n        // 签发 token + 拼标准响应（前端拿到的结构完全不变）\n        return json(LoginIssuer::issue([\n            &#39;id&#39; =&gt; $uid, &#39;username&#39; =&gt; $username, &#39;name&#39; =&gt; $name, &#39;status&#39; =&gt; 1,\n        ]));\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>要点：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>login_handler\u003c/code> 默认 \u003ccode>&#39;&#39;\u003c/code> → 走内置逻辑；\u003cstrong>类名写错/类不存在时也自动回退内置\u003c/strong>（排查先看类名是否真的被加载，注意 webman 常驻内存要 \u003ccode>restart\u003c/code>）；\u003c/li>\n\u003cli>\u003ccode>LoginIssuer::issue($identity, $ttl = 604800)\u003c/code> 负责写 \u003ccode>admin_tokens\u003c/code> 表并返回 \u003ccode>{code,msg,data:{token,...}}\u003c/code>，\u003cstrong>与内置登录完全同构\u003c/strong> → \u003ccode>AuthCheck\u003c/code>、\u003ccode>/api/auth/me\u003c/code>、前端拦截器都不用改；\u003c/li>\n\u003cli>只要 token 字符串（自己拼响应）用 \u003ccode>LoginIssuer::issueToken($identity, $ttl)\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h-142\">4. 登录图形验证码与「记住账号」\u003c/h2>\n\u003cp>登录页默认带图形验证码，开箱即用，\u003cstrong>无需改前端\u003c/strong>（前端产物已内置）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">composer require webman/captcha      # 宿主安装一次即可（ext-gd / ext-mbstring 必装）\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php（唯一配置文件，写同名顶层键即可）\n&#39;captcha_enabled&#39; =&gt; true,   // false = 登录页完全不显示验证码，登录接口也不再校验\n&#39;captcha_ttl&#39;     =&gt; 300,    // 有效期（秒）\n&#39;captcha_length&#39;  =&gt; 4,      // 位数（3~6，越界回落 4）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>接口契约\u003c/strong>（前端已实现，自建页面时可直接复用）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接口\u003c/th>\n\u003cth>请求\u003c/th>\n\u003cth>响应\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>GET /api/auth/captcha\u003c/code>\u003c/td>\n\u003ctd>无（免鉴权）\u003c/td>\n\u003ctd>\u003ccode>{&quot;code&quot;:200,&quot;data&quot;:{&quot;key&quot;:&quot;&lt;32位hex&gt;&quot;,&quot;image&quot;:&quot;data:image/jpeg;base64,...&quot;}}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/auth/login\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>{username, password, captcha_key, captcha_code}\u003c/code>\u003c/td>\n\u003ctd>验证码不过：\u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;验证码错误&quot;,&quot;data&quot;:{&quot;captcha&quot;:true}}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关键点\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>存哪\u003c/td>\n\u003ctd>Redis \u003ccode>curd_captcha:{key}\u003c/code> = 验证码明文（小写），TTL = \u003ccode>captcha_ttl\u003c/code>。\u003cstrong>不用 session\u003c/strong>（插件是 Bearer token 架构，不依赖 cookie，跨域开发也不用 credentials）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次性\u003c/td>\n\u003ctd>\u003ccode>Captcha::verify()\u003c/code> \u003cstrong>无论对错都删 key\u003c/strong>，杜绝「同一张图反复试探」。所以登录失败后前端会\u003cstrong>自动换一张新图\u003c/strong>（\u003ccode>loadCaptcha()\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大小写\u003c/td>\n\u003ctd>不敏感（两边都 \u003ccode>strtolower\u003c/code>）；字符集已剔除易混的 \u003ccode>i / l / o / 0 / 1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验位置\u003c/td>\n\u003ctd>在 \u003ccode>AuthController::login()\u003c/code> 的\u003cstrong>最前面\u003c/strong>，早于 \u003ccode>login_handler\u003c/code> 委派 → 自定义登录类\u003cstrong>不用自己实现验证码\u003c/strong>；确实不需要就在 \u003ccode>login_handler\u003c/code> 里关掉 \u003ccode>captcha_enabled\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端显隐\u003c/td>\n\u003ctd>由 \u003ccode>/api/config/site\u003c/code> 的 \u003ccode>captcha_enabled\u003c/code>（布尔）下发；为 \u003ccode>false\u003c/code> 时输入框与图片整块不渲染。\u003cstrong>配置请求失败时前端兜底\u003c/strong>：先不显示，一旦后端返回含「验证码」的错误 → 自动展开并拉图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点图刷新\u003c/td>\n\u003ctd>点验证码图片即换一张（\u003ccode>loadCaptcha()\u003c/code>），同时清空已输入内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关掉/应急\u003c/td>\n\u003ctd>\u003ccode>captcha_enabled =&gt; false\u003c/code> + \u003ccode>restart\u003c/code>。\u003cstrong>Redis 不可用时登录会被拒\u003c/strong>（验证码服务暂不可用）→ 这就是应急开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效方式\u003c/td>\n\u003ctd>改配置 → \u003ccode>php start.php restart\u003c/code>；\u003cstrong>前端不用重建\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>「记住账号」\u003c/strong>：登录成功后把用户名写进 \u003ccode>localStorage.admin_login_username\u003c/code>（见前端 \u003ccode>utils/remember.js\u003c/code>），\n下次打开登录页自动回填，并把光标落在密码框。\u003cstrong>只记账号不记密码\u003c/strong>；换账号登录会覆盖；退出登录\u003cstrong>不清除\u003c/strong>（否则就失去意义）。\n想彻底忘掉：清浏览器数据，或在 \u003ccode>src/views/login/index.vue\u003c/code> 里调 \u003ccode>clearRememberedUsername()\u003c/code>。\u003c/p>\n\u003cblockquote>\n\u003cp>注意：\u003ccode>localStorage\u003c/code> 按**源（协议+域名+端口）**隔离。\u003ccode>127.0.0.1:18082\u003c/code> 与 \u003ccode>127.0.0.1:8787\u003c/code> 是两个源，\n验证时别把「另一个端口没回填」当成 bug。\u003c/p>\n\u003cp>若宿主自己实现了 \u003ccode>login_handler\u003c/code> 且\u003cstrong>不希望\u003c/strong>有验证码：把 \u003ccode>captcha_enabled\u003c/code> 设为 \u003ccode>false\u003c/code>，\n否则因为校验在委派之前，所有登录都会先被验证码拦下（表现为「明明密码对，一直提示验证码错误」）。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-143\">5. 端到端验证示例\u003c/h2>\n\u003cblockquote>\n\u003cp>注意：插件用 \u003cstrong>JSON body 的 \u003ccode>code\u003c/code> 字段\u003c/strong>表示业务状态，\u003cstrong>HTTP 状态码恒为 200\u003c/strong>。\n因此判断成败要看 body 里的 \u003ccode>code\u003c/code>（200=成功 / 401=未登录 / 403=无权限），而不是 \u003ccode>curl -w %{http_code}\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>① 默认 admin_users 登录（权限开）\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -s -X POST http://127.0.0.1:8787/api/auth/login \\\n  -H &#39;Content-Type: application/json&#39; \\\n  -d &#39;{&quot;username&quot;:&quot;admin&quot;,&quot;password&quot;:&quot;admin123&quot;}&#39;\n\u003c/code>\u003c/pre>\n"},{"file":"14-接口加密与异常兜底.md","title":"接口加密与异常兜底","section":"guide","sectionName":"使用指南","mtime":"2026/9/20 22:06:31","headings":[{"depth":2,"text":"1. 接口加密（RSA + AES 信封）","id":"h-145"},{"depth":3,"text":"1.1 默认状态与开关语义","id":"h-146"},{"depth":3,"text":"1.2 怎么开启（推荐用构建脚本）","id":"h-147"},{"depth":3,"text":"1.3 ⚠️ 公钥是每个宿主一份的","id":"h-148"},{"depth":3,"text":"1.4 前后端必须一致","id":"h-149"},{"depth":3,"text":"1.5 豁免清单（无需配置，始终明文）","id":"h-150"},{"depth":2,"text":"2. 接口异常兜底","id":"h-151"},{"depth":3,"text":"2.1 为什么是异常处理器，不是中间件","id":"h-152"},{"depth":3,"text":"2.2 生效范围","id":"h-153"},{"depth":3,"text":"2.3 两档模式","id":"h-154"},{"depth":3,"text":"2.4 日志刻意做成「一条异常一行」","id":"h-155"},{"depth":3,"text":"2.5 前端提示里的编号 = 报障凭据","id":"h-156"}],"allHeadings":[{"depth":1,"text":"接口加密与异常兜底","id":"h-144"},{"depth":2,"text":"1. 接口加密（RSA + AES 信封）","id":"h-145"},{"depth":3,"text":"1.1 默认状态与开关语义","id":"h-146"},{"depth":3,"text":"1.2 怎么开启（推荐用构建脚本）","id":"h-147"},{"depth":3,"text":"1.3 ⚠️ 公钥是每个宿主一份的","id":"h-148"},{"depth":3,"text":"1.4 前后端必须一致","id":"h-149"},{"depth":3,"text":"1.5 豁免清单（无需配置，始终明文）","id":"h-150"},{"depth":2,"text":"2. 接口异常兜底","id":"h-151"},{"depth":3,"text":"2.1 为什么是异常处理器，不是中间件","id":"h-152"},{"depth":3,"text":"2.2 生效范围","id":"h-153"},{"depth":3,"text":"2.3 两档模式","id":"h-154"},{"depth":3,"text":"2.4 日志刻意做成「一条异常一行」","id":"h-155"},{"depth":3,"text":"2.5 前端提示里的编号 = 报障凭据","id":"h-156"}],"html":"\u003ch1 id=\"h-144\">接口加密与异常兜底\u003c/h1>\n\u003cp>两个「线上必备」的可选项：\u003cstrong>请求体加密\u003c/strong>（防明文抓包 / 篡改）与\u003cstrong>未捕获异常统一兜底\u003c/strong>\n（防堆栈泄漏，同时给用户一个可报障的编号）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-145\">1. 接口加密（RSA + AES 信封）\u003c/h2>\n\u003ch3 id=\"h-146\">1.1 默认状态与开关语义\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>默认关闭\u003c/strong>：内置前端以 \u003ccode>VITE_API_ENCRYPT=false\u003c/code> 构建，明文直连；后端对明文请求自动透传。\u003c/li>\n\u003cli>\u003cstrong>开启开关是显式的\u003c/strong>：只有 \u003ccode>VITE_API_ENCRYPT=true\u003c/code> 才开；不配置 = 明文。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>刻意\u003cstrong>不用\u003c/strong>「非 \u003ccode>false\u003c/code> 即开」：那样一旦忘记传变量，前端就会拿内嵌的默认公钥去加密，\n而它与任何宿主的私钥都不匹配 → 所有 \u003ccode>/api\u003c/code> 返回 400。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-147\">1.2 怎么开启（推荐用构建脚本）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">cd &lt;插件仓库&gt;\nVITE_API_ENCRYPT=true \\\nCURD_PUBLIC_DIR=&lt;宿主&gt;/plugin/curd/public \\\n  bash scripts/build-frontend.sh &lt;前端源码目录&gt;\n\u003c/code>\u003c/pre>\n\u003cp>脚本行为：\u003c/p>\n\u003cul>\n\u003cli>读 \u003ccode>CURD_PUBLIC_DIR/../config/keys/api_rsa_public.pem\u003c/code>（\u003cstrong>目标宿主自己的公钥\u003c/strong>）；\u003c/li>\n\u003cli>回灌前\u003cstrong>校验产物里真的带上了这把公钥\u003c/strong>，对不上直接报错不落盘；\u003c/li>\n\u003cli>不传 \u003ccode>CURD_PUBLIC_DIR\u003c/code> 则回灌插件自带 \u003ccode>public/\u003c/code>（即对外默认产物，\u003cstrong>明文版\u003c/strong>）。\u003c/li>\n\u003c/ul>\n\u003cp>不用脚本时（手动给构建传参）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">VITE_API_ENCRYPT=true \\\nVITE_API_RSA_PUBLIC_KEY=&quot;&lt;api_rsa_public.pem 的内容；换行可写字面 \\n&gt;&quot; \\\n  npm run build\n\u003c/code>\u003c/pre>\n\u003cp>两者都是\u003cstrong>构建期内联\u003c/strong>，改完必须重新构建才生效。\u003c/p>\n\u003ch3 id=\"h-148\">1.3 ⚠️ 公钥是每个宿主一份的\u003c/h3>\n\u003cp>\u003ccode>install.php\u003c/code> 会在 \u003ccode>config/keys/api_rsa_public.pem\u003c/code> 生成该宿主专属的公钥。\n用\u003cstrong>别的宿主的公钥\u003c/strong>（或 \u003ccode>src/utils/apiCrypto.js\u003c/code> 里内嵌的开发默认值）→\n后端私钥解不开信封 → \u003cstrong>所有 \u003ccode>/api\u003c/code> 返回 400「请求解密失败」\u003c/strong>。\u003c/p>\n\u003cp>排查口径：入口 JS 里搜 \u003ccode>X-Encrypt-Data\u003c/code> 字符串，出现在产物里即为加密版。\n换宿主要重新构建，别把 A 宿主的产物拷到 B 宿主。\u003c/p>\n\u003ch3 id=\"h-149\">1.4 前后端必须一致\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>端\u003c/th>\n\u003cth>开关\u003c/th>\n\u003cth>默认\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>前端\u003c/td>\n\u003ctd>\u003ccode>VITE_API_ENCRYPT\u003c/code>（构建期内联）\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>（明文）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端\u003c/td>\n\u003ctd>\u003ccode>API_ENCRYPT\u003c/code>（\u003ccode>.env\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>（能解密）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>后端默认 \u003ccode>true\u003c/code>，是「能解就解、明文透传」，所以\u003cstrong>前端不开也能跑\u003c/strong>；\n反过来前端开了而后端 \u003ccode>API_ENCRYPT=false\u003c/code>，才会 400。\u003c/p>\n\u003ch3 id=\"h-150\">1.5 豁免清单（无需配置，始终明文）\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>OPTIONS\u003c/code> 预检请求；\u003c/li>\n\u003cli>非 \u003ccode>/api\u003c/code> 路径（页面、静态资源）；\u003c/li>\n\u003cli>\u003ccode>multipart\u003c/code> 上传（\u003ccode>FormData\u003c/code>）；\u003c/li>\n\u003cli>非 JSON 响应（CSV 导出等文件流）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-151\">2. 接口异常兜底\u003c/h2>\n\u003cp>SQL 报错、类型错误等\u003cstrong>未捕获异常\u003c/strong>的统一出口，由插件自带的\n\u003ccode>plugin\\curd\\app\\exception\\CurdExceptionHandler\u003c/code> 负责。\u003c/p>\n\u003ch3 id=\"h-152\">2.1 为什么是异常处理器，不是中间件\u003c/h3>\n\u003cp>webman 的中间件链在\u003cstrong>每一层内层都先 \u003ccode>try/catch\u003c/code> 再转 Response\u003c/strong>，外层中间件\n\u003cstrong>永远捕获不到\u003c/strong>控制器 / 路由中间件抛出的异常。所以兜底只能做成异常处理器（实测踩过）。\u003c/p>\n\u003ch3 id=\"h-153\">2.2 生效范围\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围\u003c/th>\n\u003cth>怎么生效\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>插件路由\u003c/strong>（\u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/curd/*\u003c/code>、\u003ccode>/api/admin/*\u003c/code>、\u003ccode>/api/menu/*\u003c/code> …）\u003c/td>\n\u003ctd>\u003cstrong>开箱生效\u003c/strong>：插件自带 \u003ccode>plugin/curd/config/exception.php\u003c/code>，框架按 \u003ccode>plugin.curd.exception\u003c/code> 读取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>宿主自己的 \u003ccode>/api\u003c/code> 控制器\u003c/strong>\u003c/td>\n\u003ctd>把宿主 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向插件处理器（见下）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode class=\"language-php\">// config/exception.php\nreturn [\n    &#39;&#39; =&gt; \\plugin\\curd\\app\\exception\\CurdExceptionHandler::class,\n];\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>⚠️ 只加 \u003ccode>&#39;@&#39;\u003c/code> 键\u003cstrong>无效\u003c/strong> —— 框架规则是「本 app 配置里已有 \u003ccode>&#39;&#39;\u003c/code> 键 ⇒ 忽略 \u003ccode>&#39;@&#39;\u003c/code>」，\n而 webman 骨架默认自带 \u003ccode>&#39;&#39; =&gt; support\\exception\\Handler::class\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>只兜 \u003ccode>/api\u003c/code>；非 \u003ccode>/api\u003c/code> 请求任何模式下都沿用框架默认错误页 / 调试页。\u003c/p>\n\u003ch3 id=\"h-154\">2.3 两档模式\u003c/h3>\n\u003cp>由 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code> 决定（\u003ccode>plugin.curd.app.debug\u003c/code> 读它）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>true\u003c/code>（默认，\u003cstrong>本地\u003c/strong>）\u003c/td>\n\u003ctd>异常信息\u003cstrong>原样暴露\u003c/strong>：JSON 请求返回真实 msg + traces，其余返回调试页 —— 当场可查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>false\u003c/code>（\u003cstrong>线上\u003c/strong>）\u003c/td>\n\u003ctd>\u003ccode>/api\u003c/code> 返回 \u003cstrong>HTTP 500\u003c/strong> \u003ccode>{&quot;code&quot;:500,&quot;msg&quot;:&quot;服务内部错误（编号 xxxxxxxx）&quot;}\u003c/code>；异常类 / 消息 / \u003cstrong>SQL + 绑定\u003c/strong> / 请求上下文 / 堆栈写 \u003ccode>runtime/logs/webman.log\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>宿主自己控制器的模式取宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>，与插件 debug \u003cstrong>取交集\u003c/strong>\n（任一为 \u003ccode>false\u003c/code> 即按线上处理），线上记得两边都关；\u003c/li>\n\u003cli>响应刻意用 \u003cstrong>HTTP 500\u003c/strong> 而非 200：便于 Nginx / 监控按 5xx 告警；前端已能解密并展示\n非 2xx 的加密错误响应（\u003ccode>request.js\u003c/code> 的 error 分支）；\u003c/li>\n\u003cli>提示文案可改：\u003ccode>config/curd-admin.php\u003c/code> 或插件 \u003ccode>config/curd.php\u003c/code> 的 \u003ccode>error_message\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-155\">2.4 日志刻意做成「一条异常一行」\u003c/h3>\n\u003cp>\u003ccode>trace_str\u003c/code> 里的换行已收敛成 \u003ccode>|\u003c/code>，且 \u003ccode>sql\u003c/code> / \u003ccode>bindings\u003c/code> 等关键字段排在堆栈\u003cstrong>之前\u003c/strong>。\n原因是 webman 默认日志格式器开了 \u003ccode>allowInlineLineBreaks\u003c/code>，多行堆栈会把后面的字段顶到\n几十行开外，\u003ccode>grep &lt;编号&gt;\u003c/code> 就只能看到第一行。收敛后可放心用 \u003ccode>grep\u003c/code> / \u003ccode>jq\u003c/code> / 采集器解析。\u003c/p>\n\u003cblockquote>\n\u003cp>若你 \u003ccode>grep &lt;编号&gt;\u003c/code> 只看到半条，说明用的是旧版 \u003ccode>CurdExceptionHandler\u003c/code>，重新同步一次插件。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-156\">2.5 前端提示里的编号 = 报障凭据\u003c/h3>\n\u003cpre>\u003ccode>服务内部错误（编号 a1b2c3d4）\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">grep a1b2c3d4 runtime/logs/webman.log\n\u003c/code>\u003c/pre>\n\u003cp>即可看到异常类、消息、SQL 与绑定。这与 \u003ccode>PermissionCheck\u003c/code> 的 403 编号是\u003cstrong>同一套排查方式\u003c/strong>：\n403 只给编号（不泄露权限结构），\u003ccode>reason\u003c/code> 写日志，同样用编号 grep。\u003c/p>\n"},{"file":"15-升级与生产部署.md","title":"升级 · 部署 · 发布","section":"guide","sectionName":"使用指南","mtime":"2026/10/18 08:07:04","headings":[{"depth":2,"text":"1. 升级安全（覆盖同步，宿主密钥除外）","id":"h-158"},{"depth":3,"text":"1.1 覆盖边界：composer update 到底动哪些文件","id":"h-159"},{"depth":2,"text":"2. 同步清单：哪些文件属于宿主、不能覆盖","id":"h-160"},{"depth":2,"text":"3. 卸载","id":"h-161"},{"depth":2,"text":"4. 生产部署","id":"h-162"},{"depth":3,"text":"4.1 守护进程（supervisor）","id":"h-163"},{"depth":3,"text":"4.2 Nginx 反代（SPA 与 API 同域，免 CORS）","id":"h-164"},{"depth":3,"text":"4.3 环境与密钥（上线检查单）","id":"h-165"},{"depth":3,"text":"4.4 备份","id":"h-166"},{"depth":3,"text":"4.5 升级与回滚","id":"h-167"},{"depth":2,"text":"5. 发布（zip / GitHub Release）","id":"h-168"},{"depth":2,"text":"6. 与本项目 webman-huafei-platform 的关系","id":"h-169"},{"depth":2,"text":"7. 文档站构建与发布","id":"h-170"},{"depth":3,"text":"7.1 重新构建","id":"h-171"},{"depth":3,"text":"7.2 写作约定","id":"h-172"},{"depth":3,"text":"7.3 三种分发方式","id":"h-173"},{"depth":2,"text":"8. 仓库结构（开发者向）","id":"h-174"}],"allHeadings":[{"depth":1,"text":"升级 · 部署 · 发布","id":"h-157"},{"depth":2,"text":"1. 升级安全（覆盖同步，宿主密钥除外）","id":"h-158"},{"depth":3,"text":"1.1 覆盖边界：composer update 到底动哪些文件","id":"h-159"},{"depth":2,"text":"2. 同步清单：哪些文件属于宿主、不能覆盖","id":"h-160"},{"depth":2,"text":"3. 卸载","id":"h-161"},{"depth":2,"text":"4. 生产部署","id":"h-162"},{"depth":3,"text":"4.1 守护进程（supervisor）","id":"h-163"},{"depth":3,"text":"4.2 Nginx 反代（SPA 与 API 同域，免 CORS）","id":"h-164"},{"depth":3,"text":"4.3 环境与密钥（上线检查单）","id":"h-165"},{"depth":3,"text":"4.4 备份","id":"h-166"},{"depth":3,"text":"4.5 升级与回滚","id":"h-167"},{"depth":2,"text":"5. 发布（zip / GitHub Release）","id":"h-168"},{"depth":2,"text":"6. 与本项目 webman-huafei-platform 的关系","id":"h-169"},{"depth":2,"text":"7. 文档站构建与发布","id":"h-170"},{"depth":3,"text":"7.1 重新构建","id":"h-171"},{"depth":3,"text":"7.2 写作约定","id":"h-172"},{"depth":3,"text":"7.3 三种分发方式","id":"h-173"},{"depth":2,"text":"8. 仓库结构（开发者向）","id":"h-174"}],"html":"\u003ch1 id=\"h-157\">升级 · 部署 · 发布\u003c/h1>\n\u003cp>升级为什么不会自动生效、怎么把新版插件同步进宿主、上线部署要配什么、怎么打发布包。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-158\">1. 升级安全（覆盖同步，宿主密钥除外）\u003c/h2>\n\u003cp>安装器策略（2026-10-15 起）：宿主已存在 \u003ccode>plugin/curd\u003c/code> 时，\u003ccode>composer update\u003c/code> /\n首次 \u003ccode>composer require\u003c/code> 会\u003cstrong>整目录删除后从包内重新整体拷贝（覆盖同步）\u003c/strong>，顺便清掉\n包内已移除的陈旧文件。唯一保留的是宿主自有的 \u003ccode>plugin/curd/config/keys/*.pem\u003c/code>\n（RSA 加密密钥对，覆盖会静默破坏接口加解密，故不删也不被包内版本覆盖）。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ 副作用：\u003cstrong>宿主 \u003ccode>plugin/curd\u003c/code> 下的本地改动会被覆盖抹掉\u003c/strong>（密钥除外）。\n想保留改动，先 \u003ccode>git stash\u003c/code> / 提交 / 迁回插件配置化，再升级。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-159\">1.1 覆盖边界：\u003ccode>composer update\u003c/code> 到底动哪些文件\u003c/h3>\n\u003cp>触发链路是 composer 的 \u003ccode>post-package-update\u003c/code> → \u003ccode>support\\Plugin::install\u003c/code> →\n\u003ccode>Amcolin\\WebmanCurdAdmin\\Install::install()\u003c/code>（\u003ccode>src/Install.php\u003c/code>）。逐项边界：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件 / 目录\u003c/th>\n\u003cth>会被动吗\u003c/th>\n\u003cth>条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>vendor/amcolin/webman-curd-admin/**\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>会\u003c/strong>\u003c/td>\n\u003ctd>composer 的本职，装的就是它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/**\u003c/code>（除 \u003ccode>config/keys/\u003c/code>）\u003c/td>\n\u003ctd>\u003cstrong>会（覆盖）\u003c/strong>\u003c/td>\n\u003ctd>已存在即整目录删除后重拷；包内已删的文件也会从宿主清掉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/config/keys/*.pem\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>不动（保留宿主版）\u003c/strong>\u003c/td>\n\u003ctd>宿主已有密钥文件 → 删目录时保留、拷包时排除，不碰宿主密钥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主 \u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>不动\u003c/strong>\u003c/td>\n\u003ctd>已存在即 \u003ccode>return\u003c/code>，只在\u003cstrong>缺失\u003c/strong>时才生成模板\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主 \u003ccode>config/database.php\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>会\u003c/strong>（但先备份）\u003c/td>\n\u003ctd>唯一例外：仅当内容仍含 \u003ccode>your_database\u003c/code> / \u003ccode>your_username\u003c/code>（webman 占位模板）→ 先备份成 \u003ccode>database.php.webman-db.bak\u003c/code> 再替换；已是自定义配置则不动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>app/controller/admin/api/MyTestController.php\u003c/code>、\u003ccode>app/model/MyTest.php\u003c/code>\u003c/td>\n\u003ctd>只在\u003cstrong>缺失\u003c/strong>时新生成\u003c/td>\n\u003ctd>已存在（含你自己改过的）→ 跳过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.env\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>不动\u003c/strong>\u003c/td>\n\u003ctd>安装器完全不碰 env\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>一句话：\u003cstrong>装好之后，配置不会被 \u003ccode>composer update\u003c/code> 覆盖\u003c/strong>。唯一会写的是还停留在 webman\n占位模板的 \u003ccode>config/database.php\u003c/code>，而且\u003cstrong>先备份后替换\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>⚠️ 升级后 \u003ccode>plugin/curd\u003c/code> 已是覆盖后的新版（看它即可）；\u003ccode>vendor/\u003c/code> 里是包本体。\n想比对宿主与包的差异，用 \u003ccode>git diff\u003c/code> 或 \u003ccode>scripts/check-plugin-overrides.sh\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003cp>要把新版插件文件同步到宿主，走这两步：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\"># ① 升级前先检查宿主 plugin/curd 有无本地改动（0=无改动，1=发现改动）\n./scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\n\n# ② 确认无本地改动（或已备份）后整体重拷\nbash scripts/sync-plugin.sh\n#    = 备份 plugin/curd → plugin/curd.bak-&lt;时间戳&gt;，再从 vendor 整体重拷\n#    宿主 config/curd-admin.php 与 config/database.php 已存在，不会被覆盖\n\u003c/code>\u003c/pre>\n\u003cp>发现改动时：先 \u003ccode>git stash\u003c/code> / 提交 / 把改动\u003cstrong>迁回插件配置化\u003c/strong>，再升级。\u003c/p>\n\u003cblockquote>\n\u003cp>只改了内置前端的话，用 \u003ccode>scripts/build-frontend.sh\u003c/code> 重建 dist 即可，\n不必动 \u003ccode>plugin/curd\u003c/code> 源码。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>升级后建议再跑一次幂等安装\u003c/strong>，补齐新表 / 新种子 / 新菜单：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">php plugin/curd/install.php      # 幂等：已存在的全 SKIP\nphp plugin/curd/migrate.php      # 如有增量迁移文件\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2 id=\"h-160\">2. 同步清单：哪些文件属于宿主、不能覆盖\u003c/h2>\n\u003cp>\u003ccode>sync-plugin.sh\u003c/code> 会整体重拷 \u003ccode>plugin/curd\u003c/code>，但下列内容属于\u003cstrong>宿主专有\u003c/strong>，\n绝不能覆盖或删除（手工同步时逐条核对）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件 / 目录\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/config/keys/\u003c/code>\u003c/td>\n\u003ctd>RSA 私钥（覆盖安装时\u003cstrong>自动保留\u003c/strong>宿主版，不会被重拷覆盖；换机需手动拷贝，丢失要重生成）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/install-business.sql\u003c/code>\u003c/td>\n\u003ctd>宿主真实业务建表 SQL（\u003ccode>--business-sql\u003c/code> 用它）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/public/assets/\u003c/code>\u003c/td>\n\u003ctd>宿主自己的前端构建产物（若是自行构建的版本）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>plugin/curd/migrations/\u003c/code>\u003c/td>\n\u003ctd>宿主的增量迁移文件（\u003ccode>V{n}__*.sql\u003c/code>）—— 同步时不要删除 / 覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主根 \u003ccode>config/curd-admin.php\u003c/code>、\u003ccode>config/database.php\u003c/code>、\u003ccode>.env\u003c/code>、\u003ccode>app/\u003c/code>\u003c/td>\n\u003ctd>插件之外的宿主自有层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>顺带一提，包 → 宿主需要同步的核心条目是：\u003ccode>api/Install.php\u003c/code>、\u003ccode>app/\u003c/code>、\n\u003ccode>config/*.php\u003c/code>、\u003ccode>env.example\u003c/code>、\u003ccode>install.php\u003c/code>、\u003ccode>install.sql\u003c/code>、\u003ccode>migrate.php\u003c/code>、\u003ccode>public/\u003c/code>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-161\">3. 卸载\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">composer remove amcolin/webman-curd-admin\n# 卸载钩子 support\\Plugin::uninstall → Install::uninstall() 会自动删除宿主 plugin/curd\nphp start.php restart\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>前提：宿主 composer.json 已挂载 \u003ccode>post-package-uninstall\u003c/code> → \u003ccode>support\\\\Plugin::uninstall\u003c/code>\n（webman 骨架默认有；huafei / clean-demo 均已配置）。删除后接口加解密 / 后台随之失效，需 restart 生效。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>config/curd-admin.php\u003c/code>、示例控制器 / 模型等宿主侧产物\u003cstrong>不随插件删除\u003c/strong>（避免误删你的\n业务代码），需自行决定是否清理。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-162\">4. 生产部署\u003c/h2>\n\u003ch3 id=\"h-163\">4.1 守护进程（supervisor）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-ini\"># /etc/supervisor/conf.d/my-app.conf\n[program:my-app]\ncommand=php /var/www/my-app/start.php start\ndirectory=/var/www/my-app\nnumprocs=1\nautostart=true\nautorestart=true\nstartretries=3\nuser=www-data\nredirect_stderr=true\nstdout_logfile=/var/log/my-app/worker.log\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-bash\">supervisorctl reread &amp;&amp; supervisorctl update &amp;&amp; supervisorctl start my-app\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>不要裸跑 \u003ccode>php start.php start -d\u003c/code>。托管后整体重启用 \u003ccode>supervisorctl restart my-app\u003c/code>\n（手动 \u003ccode>php start.php restart\u003c/code> 会杀会话进程组）。插件的 \u003ccode>SIGUSR1\u003c/code> 平滑 reload 只重启\nworker、不杀 master，与 supervisor 托管兼容，仍可用于「改配置即时生效」。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-164\">4.2 Nginx 反代（SPA 与 API 同域，免 CORS）\u003c/h3>\n\u003cpre>\u003ccode class=\"language-nginx\">server {\n    listen 80;\n    server_name admin.example.com;\n    root /var/www/my-app/public;\n\n    location / {\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n    location /index.php {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME $document_root/index.php;\n        fastcgi_pass 127.0.0.1:8787;   # 与 config/process.php 的 &#39;listen&#39; 一致\n    }\n    location /app/curd/ {              # 插件内置前端（SPA history 由 PageController 处理）\n        try_files $uri $uri/ /index.php?$query_string;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>webman 侧取真实客户端 IP 用 \u003ccode>connection-&gt;getRemoteIp()\u003c/code>，依赖 Nginx 正确透传。\u003c/p>\n\u003ch3 id=\"h-165\">4.3 环境与密钥（上线检查单）\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>.env\u003c/code> 设 \u003ccode>APP_DEBUG=false\u003c/code>\u003c/strong> —— 否则接口未捕获异常会把堆栈 / 表结构直接抛给前端，\n既泄漏实现细节、又拿不到统一提示；\u003cstrong>同时它会关掉配置生成器\u003c/strong>（见下一条）；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>确认配置生成器已关闭\u003c/strong>：\u003ccode>APP_DEBUG=false\u003c/code> 即默认关闭（菜单隐藏 + 路由拦截 + 接口 403）；\n想更保险可在 \u003ccode>config/curd-admin.php\u003c/code> 显式写 \u003ccode>&#39;generator_enabled&#39; =&gt; false\u003c/code>。\n详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考 §4.5\u003c/a>；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键\u003c/strong>指向\n\u003ccode>\\plugin\\curd\\app\\exception\\CurdExceptionHandler::class\u003c/code>（宿主自己的 \u003ccode>/api\u003c/code> 控制器才覆盖到；\n插件路由靠插件自带配置已生效）；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>\u003ccode>config/middleware.php\u003c/code> 的 \u003ccode>&#39;@&#39;\u003c/code> 组\u003c/strong>注册 \u003ccode>StaticFile\u003c/code> + \u003ccode>ApiCrypto\u003c/code>\n（加密关闭也保留，否则前端加密请求无人解）；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>config/curd-admin.php\u003c/code> 开 \u003ccode>admin_require_permission =&gt; true\u003c/code>；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 登录后立即修改初始管理员密码；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>config/keys/\u003c/code> 独立挂载、不进 git / 不进发布产物；\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 开发 / 测试 / 生产各用独立数据库，\u003ccode>.env\u003c/code> 不进 git。\u003c/li>\n\u003c/ul>\n\u003cp>细节见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"8\">接口加密与异常兜底\u003c/a> 与 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>。\u003c/p>\n\u003ch3 id=\"h-166\">4.4 备份\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>频率\u003c/th>\n\u003cth>方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>数据库（认证表 + 业务表同库）\u003c/td>\n\u003ctd>每日\u003c/td>\n\u003ctd>\u003ccode>mysqldump\u003c/code> 全量 + 保留 7 天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>config/keys/\u003c/code>（RSA 私钥）\u003c/td>\n\u003ctd>\u003cstrong>生成即备份\u003c/strong>\u003c/td>\n\u003ctd>单独加密归档，切勿丢失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码 / 前端 dist\u003c/td>\n\u003ctd>每次发版\u003c/td>\n\u003ctd>git tag + CI 产物\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>RSA 私钥丢失不影响登录，只影响已加密的接口。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-167\">4.5 升级与回滚\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 升级前确认无本地改动\n./scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\nbash scripts/sync-plugin.sh          # 自带备份 plugin/curd.bak-&lt;时间戳&gt;\nphp plugin/curd/install.php          # 幂等补表 / 补种子 / 补菜单\n\u003c/code>\u003c/pre>\n\u003cp>回滚 = 恢复 \u003ccode>plugin/curd.bak-*\u003c/code> 后 reload；或 \u003ccode>git checkout &lt;上一版本 tag&gt;\u003c/code> /\ncomposer 锁版本重装。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-168\">5. 发布（zip / GitHub Release）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># 本地打 zip（排除 keys / install-business.sql / release-zip.sh 自身）\n./scripts/release-zip.sh 1.1.0\n# → dist/webman-curd-admin-v1.1.0.zip（约 1.1M，解压即用）\n\n# 发布到 GitHub\ngit tag v1.1.0 &amp;&amp; git push origin v1.1.0\n# → .github/workflows/release.yml 自动跑：\n#   composer validate --strict → 全量 php -l → 前端 dist 完整性校验\n#   → 关键文件存在性校验 → release-zip.sh → GitHub Release 附 zip\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>CI 不跑 npm\u003c/strong>：内置前端由开发者本地 \u003ccode>scripts/build-frontend.sh\u003c/code> 构建后提交 dist，\nCI 只校验产物完整性（\u003ccode>index.html\u003c/code> + \u003ccode>assets/\u003c/code> + 文件数 &gt; 10）。\u003c/p>\n\u003cp>zip 包内容 = \u003ccode>composer.json\u003c/code> + \u003ccode>README.md\u003c/code> + \u003ccode>INSTALL.md\u003c/code> + \u003ccode>docs/\u003c/code> +\n\u003ccode>plugin/curd/\u003c/code> + \u003ccode>scripts/\u003c/code>；\u003ccode>config/keys/\u003c/code>、\u003ccode>install-business.sql\u003c/code> 不进包。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-169\">6. 与本项目 webman-huafei-platform 的关系\u003c/h2>\n\u003cp>本包由 \u003ccode>webman-huafei-platform/plugin/curd\u003c/code> 发布而来，演进分三阶段：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>做了什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>M1\u003c/strong> 自包含下沉\u003c/td>\n\u003ctd>middleware / rbac / model / helpers / \u003ccode>casbin.conf\u003c/code> 全部内置，插件不再依赖宿主 \u003ccode>app\\middleware\u003c/code>、\u003ccode>app\\rbac\u003c/code>、\u003ccode>app\\functions.php\u003c/code>、\u003ccode>app\\model\\CurdConfigs\u003c/code>；宿主业务代码零改动、行为不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>M2\u003c/strong> 开箱即用\u003c/td>\n\u003ctd>\u003ccode>install.sql\u003c/code> + \u003ccode>api/Install.php\u003c/code> + \u003ccode>install.php\u003c/code> 一键建表 / 种子 / 密钥；前端 dist 内置 \u003ccode>public/\u003c/code>，\u003ccode>/app/curd/\u003c/code> 直接打开完整后台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>M3\u003c/strong> 管理面内置\u003c/td>\n\u003ctd>用户 / 角色 / 个人中心下沉进插件并注册路由（宿主同名路由优先，零行为变化）；新增 \u003ccode>admin_require_permission\u003c/code> 收紧开关；路由注册改走 \u003ccode>curd_route()\u003c/code> 冲突检测（修掉「重复注册抛 Route conflict」的崩溃点）；在全新空 webman 项目上完成端到端验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>M5 宿主旧副本下线\u003c/strong>：宿主侧的 \u003ccode>app/middleware/*\u003c/code>、\u003ccode>app/rbac/*\u003c/code>、\u003ccode>app/functions.php\u003c/code>\n已切到插件内置版并删除（\u003ccode>StaticFile.php\u003c/code> 是宿主自有，保留）。\u003c/p>\n\u003cblockquote>\n\u003cp>宿主开发期两条命令：\n\u003ccode>scripts/release.sh\u003c/code> 把宿主侧改动回灌到包；\u003ccode>scripts/build-frontend.sh\u003c/code> 重建内置前端。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>huafei 宿主的 composer 现状\u003c/strong>：\u003ccode>composer.json\u003c/code> 的 \u003ccode>repositories\u003c/code> 已清空，包也不在\npackagist 上，依赖只存在于 \u003ccode>composer.lock\u003c/code>（\u003ccode>dev-main\u003c/code>，指向 GitHub 的 zipball）。\n所以在这个宿主里跑 \u003ccode>composer update\u003c/code>（无论全量还是指定本包）会直接报：\u003c/p>\n\u003cpre>\u003ccode>Root composer.json requires amcolin/webman-curd-admin dev-main, found\namcolin/webman-curd-admin[dev-main] in the lock file but not in remote repositories\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>composer install\u003c/code>（按 lock 装）仍可用。换句话说，\u003cstrong>在 huafei 上 \u003ccode>composer update\u003c/code>\n根本走不到安装器那一步\u003c/strong> —— 连 \u003ccode>vendor/\u003c/code> 都不会变；要升级 \u003ccode>plugin/curd\u003c/code> 只能走\n\u003ccode>scripts/sync-plugin.sh\u003c/code>。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-170\">7. 文档站构建与发布\u003c/h2>\n\u003cp>文档源就是仓库 \u003ccode>docs/\u003c/code> 下的 \u003ccode>*.md\u003c/code>，\u003ccode>docs/index.html\u003c/code> 是由它们生成的\u003cstrong>自包含单页\u003c/strong>\n（CSS / JS / 内容全内嵌，无网络依赖，双击即可打开）。\u003c/p>\n\u003ch3 id=\"h-171\">7.1 重新构建\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">cd docs\nnode tools/build_docs.cjs\n# docs 扫描: 15 篇\n#   - 00-总览与导航.md | webman-curd-admin · 总览与导航 | 8 节\n#   ...\n# 输出: docs/index.html (3xx.x KB)\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>脚本依赖 \u003ccode>marked\u003c/code>。若提示 \u003ccode>Cannot find module &#39;marked&#39;\u003c/code>，把 \u003ccode>NODE_PATH\u003c/code> 指向已装\nmarked 的 node_modules 目录再跑：\n\u003ccode>NODE_PATH=/path/to/node_modules node tools/build_docs.cjs\u003c/code>\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-172\">7.2 写作约定\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>约定\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>文件名\u003c/td>\n\u003ctd>\u003ccode>NN-主题.md\u003c/code>，\u003cstrong>编号决定顺序\u003c/strong>；分区按编号段：\u003ccode>00–09\u003c/code> 入门与指南、\u003ccode>10–19\u003c/code> 使用指南、\u003ccode>20–29\u003c/code> API 参考\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标题\u003c/td>\n\u003ctd>每篇第一个 \u003ccode>H1\u003c/code> 是文档标题（左侧栏目显示它），\u003ccode>H2/H3\u003c/code> 自动生成嵌套目录树\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>互链\u003c/td>\n\u003ctd>\u003ccode>[标题](NN-主题.md)\u003c/code> 或 \u003ccode>[标题](NN-主题.md#小节锚点)\u003c/code>；文档站会接管为「切面板 + 定位小节」，GitHub 上是普通文件链接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码块\u003c/td>\n\u003ctd>用 \u003ccode>```php\u003c/code> / \u003ccode>```bash\u003c/code> 标注语言；文档站自动加「复制」按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增文档\u003c/td>\n\u003ctd>丢进 \u003ccode>docs/\u003c/code> 重跑脚本即并入左侧栏目，无需改代码（除非要开新分区，改 \u003ccode>build_docs.cjs\u003c/code> 的 \u003ccode>SECTIONS\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-173\">7.3 三种分发方式\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本地 / 离线\u003c/td>\n\u003ctd>直接双击 \u003ccode>docs/index.html\u003c/code>，零依赖、无需服务器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>随发布包\u003c/td>\n\u003ctd>\u003ccode>scripts/release-zip.sh\u003c/code> 已把 \u003ccode>docs/\u003c/code> 与 \u003ccode>INSTALL.md\u003c/code> 打进 zip（排除 \u003ccode>_legacy/\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在线站点\u003c/td>\n\u003ctd>仓库 → Actions → \u003cstrong>docs-pages\u003c/strong> → Run workflow，把 \u003ccode>docs/\u003c/code> 发到 GitHub Pages（需先在 Settings → Pages 把 Source 设为 &quot;GitHub Actions&quot;；私有仓库需 Pro/Team/Enterprise 才允许 Pages）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003ccode>docs/.nojekyll\u003c/code> 是给 GitHub Pages 用的，避免下划线开头的目录被 Jekyll 忽略。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-174\">8. 仓库结构（开发者向）\u003c/h2>\n\u003cpre>\u003ccode>webman-curd-admin/\n├── composer.json              # 包定义（name: amcolin/webman-curd-admin）\n├── README.md                  # 仓库门面（特性 / 60 秒上手 / 文档索引）\n├── INSTALL.md                 # 安装说明（随发布包分发）\n├── docs/                      # 文档站（见 §7）\n│   ├── index.html             # 自包含单页文档站\n│   ├── 00..23-*.md            # 各篇文档源\n│   └── tools/build_docs.cjs   # md → index.html 构建脚本\n├── plugin/curd/               # ★ 应用插件源码（自包含，不依赖宿主 app 层）\n│   ├── app/\n│   │   ├── controller/        # Auth / Menu / Curd / CustomPage / Upload / Options / Page\n│   │   │   ├── PageController.php      # 内置前端静态托管 + SPA history fallback\n│   │   │   └── base/                   # BaseCurdController + concerns/ + DynamicCurdController\n│   │   ├── dsl/               # Grid / Form / Field / Column / Filter / Action\n│   │   ├── schema/            # PageSchema / PageRegistry / SchemaNode / blocks/*\n│   │   ├── middleware/        # Cors / AuthCheck / PermissionCheck / ApiCrypto\n│   │   ├── exception/         # CurdExceptionHandler（/api 未捕获异常兜底）\n│   │   ├── rbac/              # casbin Rbac + DatabaseAdapter\n│   │   ├── model/             # CurdConfigs / BaseModel\n│   │   ├── CurdDb.php         # 库连接助手（admin_connection / business_connection）\n│   │   ├── ModelRegistry.php  # 宿主模型扫描登记\n│   │   ├── RouteControllerRegistry.php\n│   │   └── bootstrap.php      # 初始化引导（模型 / 控制器扫描等）\n│   ├── api/Install.php        # 安装器（建表 / 种子 / RSA 密钥）\n│   ├── config/                # app.php / route.php / autoload.php / crypto.php / curd.php / casbin.conf\n│   ├── install.sql            # 核心表 DDL + my_test 示例表段\n│   ├── install.php            # CLI 引导：php plugin/curd/install.php\n│   ├── migrate.php            # 增量 migration 引导\n│   ├── migrations/            # V{版本}__{描述}.sql\n│   ├── env.example            # 传统 .env 方式的键清单\n│   └── public/                # ★ 内置前端构建产物（vite base=/app/curd/）\n├── examples/                  # 后台 CURD 示例（MyTestController + MyTest）\n├── scripts/                   # composer.sh / release.sh / build-frontend.sh / release-zip.sh\n│                              # sync-plugin.sh / check-plugin-overrides.sh\n└── src/Install.php            # composer 安装器（拷贝 plugin/curd + 落位 examples + 生成 config）\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>宿主侧只有两处是本插件相关的：\u003ccode>{项目}/plugin/curd/\u003c/code> 与 \u003ccode>{项目}/config/curd-admin.php\u003c/code>。\n其它都是插件自带、随包升级整体替换的。\u003c/p>\n\u003c/blockquote>\n"},{"file":"16-排错速查与FAQ.md","title":"排错速查与 FAQ","section":"guide","sectionName":"使用指南","mtime":"2026/10/19 17:26:27","headings":[{"depth":2,"text":"1. 安装 / 初始化","id":"h-176"},{"depth":2,"text":"2. 启动 / 运行","id":"h-177"},{"depth":2,"text":"3. 菜单 / 权限","id":"h-178"},{"depth":2,"text":"4. 页面 / DSL","id":"h-179"},{"depth":2,"text":"5. 认证 / 登录","id":"h-180"},{"depth":2,"text":"6. 接口加密","id":"h-181"},{"depth":2,"text":"7. 异常兜底 / 日志","id":"h-182"},{"depth":2,"text":"8. 升级 / 部署","id":"h-183"},{"depth":2,"text":"9. FAQ","id":"h-184"},{"depth":3,"text":"为什么配置写在 config/curd-admin.php 而不是 .env？","id":"h-185"},{"depth":3,"text":"为什么还保留 mysql_business 连接（默认指向同一个库）？","id":"h-186"},{"depth":3,"text":"composer audit 红字能彻底消除吗？","id":"h-187"},{"depth":3,"text":"插件的路由前缀和命名空间是什么？","id":"h-188"},{"depth":3,"text":"composer update 会把我改好的配置覆盖掉吗？","id":"h-189"},{"depth":2,"text":"10. 命令行（make:curd）","id":"h-190"}],"allHeadings":[{"depth":1,"text":"排错速查与 FAQ","id":"h-175"},{"depth":2,"text":"1. 安装 / 初始化","id":"h-176"},{"depth":2,"text":"2. 启动 / 运行","id":"h-177"},{"depth":2,"text":"3. 菜单 / 权限","id":"h-178"},{"depth":2,"text":"4. 页面 / DSL","id":"h-179"},{"depth":2,"text":"5. 认证 / 登录","id":"h-180"},{"depth":2,"text":"6. 接口加密","id":"h-181"},{"depth":2,"text":"7. 异常兜底 / 日志","id":"h-182"},{"depth":2,"text":"8. 升级 / 部署","id":"h-183"},{"depth":2,"text":"9. FAQ","id":"h-184"},{"depth":3,"text":"为什么配置写在 config/curd-admin.php 而不是 .env？","id":"h-185"},{"depth":3,"text":"为什么还保留 mysql_business 连接（默认指向同一个库）？","id":"h-186"},{"depth":3,"text":"composer audit 红字能彻底消除吗？","id":"h-187"},{"depth":3,"text":"插件的路由前缀和命名空间是什么？","id":"h-188"},{"depth":3,"text":"composer update 会把我改好的配置覆盖掉吗？","id":"h-189"},{"depth":2,"text":"10. 命令行（make:curd）","id":"h-190"}],"html":"\u003ch1 id=\"h-175\">排错速查与 FAQ\u003c/h1>\n\u003cp>按现象查。\u003cstrong>第一条永远是\u003c/strong>：配置和 PHP 改动都需要 \u003ccode>restart\u003c/code>（webman 常驻内存，热改不生效）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-176\">1. 安装 / 初始化\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>装完 \u003ccode>plugin/curd\u003c/code> 不存在\u003c/td>\n\u003ctd>自动拷贝未触发（宿主 \u003ccode>composer.json\u003c/code> 缺 \u003ccode>post-package-install\u003c/code> scripts 或 \u003ccode>support/Plugin.php\u003c/code>）。补 scripts 后 \u003ccode>composer dump-autoload &amp;&amp; composer update amcolin/webman-curd-admin\u003c/code>；或直接 \u003ccode>cp -r vendor/amcolin/webman-curd-admin/plugin/curd plugin/curd\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Failed to audit installed packages\u003c/code> 红字\u003c/td>\n\u003ctd>audit 硬编码访问 \u003ccode>packagist.org\u003c/code> 被墙，\u003cstrong>\u003ccode>exit 0\u003c/code>、不影响安装\u003c/strong>。用包内 wrapper 消除：\u003ccode>alias composer=&#39;&lt;包目录&gt;/scripts/composer.sh&#39;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向导页面显示「系统已安装」\u003c/td>\n\u003ctd>\u003ccode>runtime/curd-installed.lock\u003c/code> 存在。重装 = 删锁 + 清库后刷新向导页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/curd/config?route_path=/my-test\u003c/code> 返回 404「配置不存在」\u003c/td>\n\u003ctd>没跑安装向导 / \u003ccode>install.php\u003c/code>，\u003ccode>curd_configs\u003c/code> 种子未插。执行初始化流程，或在后台「配置生成器」手动生成该页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/auth/captcha\u003c/code> 返回「验证码生成失败：Class &quot;Webman\\Captcha...&quot; not found」\u003c/td>\n\u003ctd>宿主缺 \u003ccode>webman/captcha\u003c/code>（包已 require，旧宿主补装）或缺 \u003ccode>ext-gd\u003c/code> / \u003ccode>ext-mbstring\u003c/code>。不想要验证码：\u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报 \u003ccode>Class &quot;support\\Redis&quot; not found\u003c/code>\u003c/td>\n\u003ctd>缺 \u003ccode>webman/redis\u003c/code>：\u003ccode>composer require webman/redis\u003c/code>。（包已 require；Redis 不可用时 Auth / RBAC / AuthCheck / AdminController 已 \u003ccode>try/catch\u003c/code> 降级直查 DB，不影响登录鉴权）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「测试管理」菜单 / \u003ccode>my_test\u003c/code> 表不出现\u003c/td>\n\u003ctd>老项目没跑过新版 install。执行一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等，补表 + 补菜单）；不想要示例就跳过，不影响安装结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务表没建出来\u003c/td>\n\u003ctd>\u003ccode>--business-sql\u003c/code> 没传（默认只装认证面 8 张表），或路径不是相对宿主根。多文件可重复传或逗号分隔\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>装完登录报 \u003ccode>1045 Access denied\u003c/code>\u003c/td>\n\u003ctd>Web 向导场景已\u003cstrong>自动 \u003ccode>SIGUSR1\u003c/code> 平滑 reload\u003c/strong>，一般不会出现；Windows / supervisor 等\u003cstrong>信号不可用\u003c/strong>环境按页面提示手动 \u003ccode>php start.php restart\u003c/code>（worker 配置在启动期固化）。CLI 安装后同样重启一次\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-177\">2. 启动 / 运行\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>改 PHP 类 / 常量 / 配置后不生效\u003c/td>\n\u003ctd>webman 常驻内存：reload 不重读类文件，改 PHP 要 \u003ccode>restart\u003c/code>（改 \u003ccode>.env\u003c/code> / config 可用 \u003ccode>SIGUSR1\u003c/code> 平滑 reload）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端口不是 8787\u003c/td>\n\u003ctd>webman 2.x 端口在 \u003ccode>config/process.php\u003c/code> 的 \u003ccode>listen\u003c/code>，改这里再重启\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后台页面 404 / 静态资源 404\u003c/td>\n\u003ctd>/app/curd/\u003ccode>没被正确反代（Nginx 见 [升级 · 部署 · 发布](15-升级与生产部署.md)），或\u003c/code>page_base\u003ccode>与前端\u003c/code>VITE_BASE_PATH` 不一致（两者必须相同，改完要重建前端）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SPA 深链（\u003ccode>/app/curd/dashboard\u003c/code>）404\u003c/td>\n\u003ctd>反代没把未知路径回退到 \u003ccode>index.php\u003c/code>（\u003ccode>PageController\u003c/code> 只负责把请求交给 \u003ccode>index.html\u003c/code>，前面得有 try_files 兜住）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换了端口打开登录页，账号没自动回填\u003c/td>\n\u003ctd>\u003ccode>localStorage\u003c/code> 按\u003cstrong>源\u003c/strong>隔离（\u003ccode>127.0.0.1:18082\u003c/code> ≠ \u003ccode>127.0.0.1:8787\u003c/code>），属正常现象\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-178\">3. 菜单 / 权限\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>「配置生成器」菜单不见了 / 直连被弹回首页 / 接口 403「配置生成器已关闭（当前为生产模式）」\u003c/td>\n\u003ctd>\u003cstrong>预期行为\u003c/strong>：\u003ccode>generator_enabled\u003c/code> 未配置时跟随 \u003ccode>APP_DEBUG\u003c/code>，生产（\u003ccode>false\u003c/code>）自动关闭。开发期要用就 \u003ccode>APP_DEBUG=true\u003c/code>，或显式 \u003ccode>&#39;generator_enabled&#39; =&gt; true\u003c/code> 后 \u003ccode>restart\u003c/code>。详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考 §4.5\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 只看到「编号」看不到原因\u003c/td>\n\u003ctd>\u003cstrong>设计如此\u003c/strong>（不泄露权限结构）。拿编号 grep \u003ccode>runtime/logs/webman-*.log\u003c/code> 看 \u003ccode>reason\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>403 日志里 \u003ccode>reason=unresolved-permission\u003c/code>\u003c/td>\n\u003ctd>不是没权限，是\u003cstrong>路径推导不出 \u003ccode>obj:act\u003c/code>\u003c/strong>：控制器没进 \u003ccode>RouteControllerRegistry\u003c/code>，或菜单 \u003ccode>path\u003c/code> 与注册 key 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>勾了「一键生成权限」却没生成\u003c/td>\n\u003ctd>\u003ccode>path\u003c/code> 不是已注册的 CURD 页 → 推导不出 \u003ccode>curd.{Model}\u003c/code>。接口响应 \u003ccode>data.warning\u003c/code> 会提示，手填「权限标识」后重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「快速创建权限」报重名 400\u003c/td>\n\u003ctd>该 \u003ccode>permission\u003c/code> 已存在（含之前一键生成过的）。换个后缀名，或去菜单树里找已有节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/api/admin/*\u003c/code> 对新角色一律 403\u003c/td>\n\u003ctd>开了 \u003ccode>admin_require_permission\u003c/code>。\u003ccode>admin\u003c/code> 角色有 \u003ccode>p,admin,*,*\u003c/code> 不受影响；其余角色需在「角色管理」勾选，或写 \u003ccode>casbin_rule\u003c/code>：\u003ccode>INSERT INTO casbin_rule (ptype,v0,v1,v2) VALUES (&#39;p&#39;,&#39;yunying&#39;,&#39;admin&#39;,&#39;users&#39;);\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关掉权限后前端还显示无权限\u003c/td>\n\u003ctd>前端要读响应里的 \u003ccode>permission_enabled\u003c/code> 字段自行处理；插件只负责后端放行与字段透传\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后仍进 \u003ccode>/dashboard\u003c/code>（没走配置的 \u003ccode>home_page\u003c/code>）\u003c/td>\n\u003ctd>按顺序查：①\u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>home_page\u003c/code> 改了但没 \u003ccode>restart\u003c/code>；②前端是旧产物（登录跳转在前端，需重新构建部署）；③浏览器里是\u003cstrong>旧书签 / 历史\u003c/strong>（\u003ccode>login?redirect=...\u003c/code> 这类旧值已被忽略）；④从侧边栏点了「首页」菜单（那是菜单数据，与 \u003ccode>home_page\u003c/code> 无关）；⑤\u003ccode>localStorage.admin_home_page\u003c/code> 是旧值且 \u003ccode>/api/config/site\u003c/code> 请求失败（看 Network）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录后落点跟「上次被拦住的那一页」不一致\u003c/td>\n\u003ctd>\u003cstrong>刻意如此\u003c/strong>：登录一律跳 \u003ccode>home_page\u003c/code>，不再回跳原页（\u003ccode>?redirect=\u003c/code> 已彻底不参与）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-179\">4. 页面 / DSL\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新 Schema 页面 404\u003c/td>\n\u003ctd>\u003ccode>PageRegistry::register\u003c/code> 没写（或没 \u003ccode>restart\u003c/code>）；页面名与 \u003ccode>name\u003c/code> 不一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>props 不生效\u003c/td>\n\u003ctd>键不在前端注册表白名单 → 被丢弃。查 \u003ccode>componentRegistry.js\u003c/code> 对应 type 的 props\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面显示 \u003ccode>[未注册节点: xxx]\u003c/code>\u003c/td>\n\u003ctd>type 拼错，或前端漏登记\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>collapse 不展开 / 展开错乱\u003c/td>\n\u003ctd>展开态由渲染器托管：用 \u003ccode>-&gt;active([...])\u003c/code> 设初始 name，item 需有 \u003ccode>-&gt;name()\u003c/code> 才能精确命中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>*-item\u003c/code> 没显示\u003c/td>\n\u003ctd>条目必须\u003cstrong>直接\u003c/strong>挂在对应容器 children，不能夹在中间组件里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>statistic\u003c/code> 显示 NaN / 空\u003c/td>\n\u003ctd>整串占位取不到值时\u003cstrong>保留原文\u003c/strong>；确认数据接口返回数字、key 路径写对（\u003ccode>{{stats.amount}}\u003c/code> 是 \u003ccode>data.amount\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>box\u003c/code> 图标不显示（空白方块）\u003c/td>\n\u003ctd>\u003ccode>-&gt;icon(&#39;xxx&#39;)\u003c/code> 必须是 EP 图标名（\u003ccode>View\u003c/code> / \u003ccode>Money\u003c/code> / \u003ccode>User\u003c/code>…）；写错时 \u003ccode>getIconComponent\u003c/code> 回退 \u003ccode>Monitor\u003c/code>，连图标位都空则查 \u003ccode>utils/icons\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 显示「暂无数据」\u003c/td>\n\u003ctd>\u003ccode>data\u003c/code> 取不到值（占位符未替换 / JSON 解析失败 / 数组里全是非数字）→ 走空态。查 dataApi 是否返回\u003cstrong>数组\u003c/strong>、key 路径是否写对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>line-chart-stat\u003c/code> 折线贴底 / 全 0\u003c/td>\n\u003ctd>数据本身全 0（如订单表为空），不是 bug；用 \u003ccode>-&gt;data([...])\u003c/code> 静态数组可快速自查渲染\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表宽度不随侧边栏折叠变化\u003c/td>\n\u003ctd>节点组件用 \u003ccode>ResizeObserver\u003c/code> 监听容器，正常会自动重绘；若嵌在 \u003ccode>display:none\u003c/code> 的 tab 里初始化，切回时会重绘一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Action 按钮不出现\u003c/td>\n\u003ctd>\u003ccode>-&gt;show(fn)\u003c/code> 返回了 false；或 \u003ccode>-&gt;batch(true)\u003c/code> 的按钮在批量工具栏（需勾选行）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点按钮报「Action xxx 未实现 handle」\u003c/td>\n\u003ctd>链式 \u003ccode>$grid-&gt;action(...)\u003c/code> 应回退到控制器 \u003ccode>action{Name}()\u003c/code>。①控制器方法名没对上（\u003ccode>batch-on\u003c/code> → \u003ccode>actionBatchOn\u003c/code>）；②插件 \u003ccode>CurdActionsTrait\u003c/code> 是旧版（用 \u003ccode>method_exists\u003c/code> 判断，恒为 true）—— 升级插件后 \u003ccode>restart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面报「不支持导入模块 xxx」\u003c/td>\n\u003ctd>运行时编译只放行 \u003ccode>vue\u003c/code> / \u003ccode>element-plus\u003c/code> / \u003ccode>@element-plus/icons-vue\u003c/code>；发请求改用 \u003ccode>inject(&#39;request&#39;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>.vue\u003c/code> 页面 \u003ccode>&lt;style lang=&quot;scss&quot;&gt;\u003c/code> 报错\u003c/td>\n\u003ctd>浏览器端无预处理器，只能用纯 CSS（\u003ccode>scoped\u003c/code> 也会降级为全局，class 加唯一前缀）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导出报「本次将导出 N 条，超过单次导出上限 M 条」\u003c/td>\n\u003ctd>\u003ccode>export_max_rows\u003c/code> 限制（默认 100000）。调大该键，或缩小筛选范围；前端把超限当\u003cstrong>错误提示\u003c/strong>而不是下载文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Filter::dateRange(...)-&gt;default(...)\u003c/code> 配了但搜索框是空的\u003c/td>\n\u003ctd>①前端产物是旧的（默认值由前端写入搜索框，\u003cstrong>必须重建部署前端\u003c/strong>）；②\u003ccode>default\u003c/code> 写在 \u003ccode>$filter-&gt;between(...)\u003c/code> 之后又链了别的会改类型的调用，确认最终 \u003ccode>type\u003c/code> 是 \u003ccode>daterange\u003c/code>/\u003ccode>datetimerange\u003c/code>/\u003ccode>date\u003c/code>（其它类型原样透传，不报错）；③区间给了单个\u003cstrong>具体日期\u003c/strong>时两端同值（不是「该日期至今」），要「至今」用相对表达式（\u003ccode>&#39;-7d&#39;\u003c/code>）或显式 \u003ccode>[$start, &#39;today&#39;]\u003c/code>。核对接口返回：\u003ccode>GET /api/curd/config?route_path=/xxx\u003c/code> 里 \u003ccode>search[].default\u003c/code> 应是\u003cstrong>已求值的具体日期\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点式字段（\u003ccode>config.api_url\u003c/code>）编辑不回显 / 列表为空\u003c/td>\n\u003ctd>①展开范围 = grid 点式列 ∪ 表单点式字段 ∪ \u003cstrong>详情里显式声明的点式字段\u003c/strong> ∪ 动态配置点式 prop，确认字段在任一处的 prop 带 \u003ccode>.\u003c/code> 且\u003cstrong>根字段名一致\u003c/strong>（\u003ccode>config\u003c/code> vs \u003ccode>configs\u003c/code> 不互通）；②根字段存的不是合法 JSON（手写数据时注意引号）；③前端产物旧（字面键写入是前端行为，改后端也要重建前端）。点式对\u003cstrong>任意字段类型\u003c/strong>都成立（select/switch/datetime…），与类型无关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JSON 组件（\u003ccode>$form-&gt;json()\u003c/code>）保存后是 \u003ccode>[object Object]\u003c/code> 或行没回显\u003c/td>\n\u003ctd>①前端产物旧（\u003ccode>serializeJsonRows\u003c/code> 序列化 + \u003ccode>parseJsonValueToRows\u003c/code> 回显都在前端）；②库里该列被存成了双层编码字符串（\u003ccode>&quot;{\\&quot;a\\&quot;:1}&quot;\u003c/code>）——查是否自定义钩子又 \u003ccode>json_encode\u003c/code> 了一次；③编辑回显单行原文 = 库里值不是合法 JSON，被当纯文本保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点式字段合并后其它子键丢了\u003c/td>\n\u003ctd>合并基础值优先级 = 请求显式根字段 &gt; 编辑读库现值 &gt; 空数组；编辑时没带 \u003ccode>id\u003c/code> 对应的行数据（如自定义入口绕过 \u003ccode>update()\u003c/code>）会拿不到现值。确认走的是插件 \u003ccode>add()/update()\u003c/code> 主链路\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点式字段（\u003ccode>config.xxx\u003c/code>）\u003cstrong>明明有值\u003c/strong>仍提示「不能为空」、提交被卡住\u003c/td>\n\u003ctd>两类原因：①前端产物旧（取值一致性靠前端「字面键 + 嵌套路径」双写，改后端也要重建部署前端）；②\u003cstrong>给校验规则多挂了键（最常见是 async-validator 的 \u003ccode>transform\u003c/code>）\u003c/strong> —— EP 只剥掉 \u003ccode>trigger\u003c/code>，async-validator 只在「剥掉 \u003ccode>message\u003c/code> 后\u003cstrong>恰好只剩 \u003ccode>required\u003c/code>\u003c/strong>」时才用 required 校验器，\u003cstrong>多一个键就退回 \u003ccode>validators[&#39;string&#39;]\u003c/code>\u003c/strong> → 数字/布尔值被判「不是字符串」→ 报错文案仍用规则的 \u003ccode>message\u003c/code> → 看着就是「不能为空」（这解释了为什么\u003cstrong>字符串字段正常、数字/开关/下拉字段必错\u003c/strong>）。最小复现：\u003ccode>{required:true,message:&#39;M&#39;}\u003c/code> → PASS；\u003ccode>{required:true,message:&#39;M&#39;,transform:()=&gt;30}\u003c/code> → FAIL；显式 \u003ccode>type:&#39;number&#39;\u003c/code> → PASS。\u003cstrong>修法：规则只保留 \u003ccode>{required,message,trigger}\u003c/code>\u003c/strong>，取值一致性交给前端 \u003ccode>setFieldValue()\u003c/code> 双写 + \u003ccode>initFormData()/handleEdit()\u003c/code> 末尾 \u003ccode>syncDotNested()\u003c/code> 镜像（lodash \u003ccode>get(formData,&#39;config.x&#39;)\u003c/code> 命中字面键即取到真值）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查看详情里看不到表单里的字段（点式 \u003ccode>config.xxx\u003c/code> 也一样）\u003c/td>\n\u003ctd>详情默认 = \u003cstrong>列表列 ∪ 表单字段\u003c/strong>（按 \u003ccode>prop\u003c/code> 去重，列在前），所以表单里声明的字段本该出现。仍看不到时：①该字段是「仅新增」字段（\u003ccode>modeOnly === &#39;add&#39;\u003c/code>，如创建时的密码）或标了 \u003ccode>hidden\u003c/code> —— 设计上不进详情；②控制器\u003cstrong>显式调用过 \u003ccode>$grid-&gt;setDetail([...])\u003c/code>\u003c/strong>，此时以显式声明为准、不再并入表单字段，把缺的字段补进 \u003ccode>setDetail()\u003c/code> 即可；③前端产物旧。详情是只读视图：\u003ccode>switch\u003c/code> 显示「开/关」文字、\u003ccode>select\u003c/code>/\u003ccode>radio\u003c/code> 显示选项文案、\u003ccode>image\u003c/code>/\u003ccode>date\u003c/code>/\u003ccode>datetime\u003c/code> 保留专用单元格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图片字段选不了 gif/webp，或提示「只允许上传 jpg / jpeg / png」\u003c/td>\n\u003ctd>预期行为：\u003ccode>image\u003c/code> 字段只收 jpg/jpeg/png（前端 \u003ccode>accept\u003c/code> + 上传前硬校验，服务端 \u003ccode>/api/upload/image\u003c/code> 按真实 MIME 复核）。需要其它格式请改用通用 \u003ccode>file\u003c/code> 字段（\u003ccode>/api/upload\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报 \u003ccode>Undefined array key &quot;locale&quot;\u003c/code>（Translation.php）\u003c/td>\n\u003ctd>插件请求按 \u003ccode>request()-&gt;plugin\u003c/code> 读 \u003ccode>config(&#39;plugin.curd.translation&#39;)\u003c/code>，宿主缺该配置会因空数组缺 \u003ccode>locale\u003c/code> 报错。插件已内置 \u003ccode>plugin/curd/config/translation.php\u003c/code>（两段 path：先插件内置 \u003ccode>resource/translations\u003c/code>、后宿主同名文件），升级插件后 \u003ccode>restart\u003c/code> 一次即可；宿主\u003cstrong>无需\u003c/strong>自己写翻译配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Call to undefined function xxx\\__()\u003c/code>\u003c/td>\n\u003ctd>宿主的 \u003ccode>plugin/curd/app/functions.php\u003c/code> 是旧版（缺 \u003ccode>__()\u003c/code> 别名）。重新同步插件 \u003ccode>app/\u003c/code> 目录后 \u003ccode>restart\u003c/code>；\u003ccode>__()\u003c/code> 定义见 \u003ccode>plugin/curd/app/functions.php\u003c/code>（= \u003ccode>trans($id, [], &#39;fields&#39;)\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>__()\u003c/code> 返回的是英文原句\u003c/td>\n\u003ctd>①该 key 未收录：在宿主 \u003ccode>resource/translations/zh_CN/fields.php\u003c/code> 补一行（宿主 key 优先于插件内置）；②key 收录了但仍英文：确认 locale 是 \u003ccode>zh_CN\u003c/code>（插件 \u003ccode>config/translation.php\u003c/code> 的 \u003ccode>locale\u003c/code>，默认取宿主 \u003ccode>translation.locale\u003c/code>）；③确认走的是插件请求路径（\u003ccode>request()-&gt;plugin === &#39;curd&#39;\u003c/code>，CLI 下无请求上下文时 \u003ccode>__()\u003c/code> 兜底返回原句，属预期）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>行内 \u003ccode>-&gt;select()\u003c/code> / \u003ccode>-&gt;copy()\u003c/code> 不生效\u003c/td>\n\u003ctd>①前端产物旧：copy 单元格与 select 行内提交由前端渲染，\u003cstrong>必须重建部署前端\u003c/strong>（\u003ccode>scripts/build-frontend.sh\u003c/code>）；②\u003ccode>-&gt;select()\u003c/code> 的 options 传关联数组 \u003ccode>[值=&gt;文案]\u003c/code> 或二维 \u003ccode>[[&#39;value&#39;=&gt;…,&#39;label&#39;=&gt;…]]\u003c/code>，传错结构时无选项；③copy 列优先级高于 display/tag 等其它单元格渲染，确认不是被更高优先级形态盖住（copy 本身就应盖住它们）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>display()\u003c/code> 里的 \u003ccode>&lt;el-tag&gt;\u003c/code> 没有样式（只剩文字）\u003c/td>\n\u003ctd>\u003ccode>v-html\u003c/code> 是\u003cstrong>原样塞 innerHTML\u003c/strong>，Vue 不会把 \u003ccode>&lt;el-tag&gt;\u003c/code> 编译成组件 → 它只是浏览器的未知标签，Element Plus 的样式挂在 \u003ccode>.el-tag\u003c/code> \u003cstrong>类名\u003c/strong>上。三种写法：①内联样式最稳（见下）；②\u003ccode>&lt;span class=&quot;el-tag el-tag--info&quot;&gt;池&lt;/span&gt;\u003c/code>（需该页已加载 el-tag 的样式分包）；③让框架渲染真组件：\u003ccode>-&gt;map()\u003c/code> + \u003ccode>-&gt;label()\u003c/code>（文案由字典决定，不能拼接额外数据时用不了）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>display()\u003c/code> 返回的 HTML 被当成源码显示\u003c/td>\n\u003ctd>①\u003cstrong>闭包返回 HTML 默认会自动检测\u003c/strong>（\u003ccode>display_auto_html\u003c/code>，返回值含真实标签即按 HTML 渲染）——若仍显示源码，先确认前端产物是新的（需 \u003ccode>display_html_{prop}\u003c/code> 支持）；②显式 \u003ccode>-&gt;html(false)\u003c/code> 或宿主 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>&#39;display_auto_html&#39; =&gt; false\u003c/code> 会关闭自动检测，此时必须 \u003ccode>-&gt;html()\u003c/code>；③字符串形式 \u003ccode>-&gt;display(&#39;&lt;b&gt;{name}&lt;/b&gt;&#39;)\u003c/code> 始终自动 HTML；④\u003ccode>{prop}\u003c/code> 取当前行字段、\u003ccode>{value}\u003c/code> 取该列原始值，占位符写错会留空\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>help()\u003c/code> 里的 \u003ccode>@click=&quot;hello()&quot;\u003c/code> 点了没反应\u003c/td>\n\u003ctd>①\u003ccode>hello\u003c/code> 必须\u003cstrong>全局可访问\u003c/strong>：在 \u003ccode>setCustomJs()\u003c/code> 里用顶层 \u003ccode>function hello(){}\u003c/code> / \u003ccode>var\u003c/code> / \u003ccode>window.hello = …\u003c/code>（\u003ccode>const\u003c/code>/\u003ccode>let\u003c/code> 在顶层也算全局，但代码变更后重新注入可能报重复声明）；②customJs 内容变了才会重新注入，确认保存后刷新页面；③前端产物旧（事件委托是新逻辑）；④修饰符写在\u003cstrong>属性名\u003c/strong>上（\u003ccode>@click.stop=&quot;fn()&quot;\u003c/code>），不是值里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>curd is not defined\u003c/code> / \u003ccode>window.curd\u003c/code> 取不到\u003c/td>\n\u003ctd>①前端产物旧（\u003ccode>window.curd\u003c/code> 由新前端注入）；②该页面没有配置 \u003ccode>customJs\u003c/code> 时不会构建 API，给页面加 \u003ccode>$grid-&gt;setCustomJs(&#39;…&#39;)\u003c/code> 即可；③旧名 \u003ccode>window.__curd\u003c/code> 仍兼容\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-180\">5. 认证 / 登录\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>自定义登录没生效\u003c/td>\n\u003ctd>\u003ccode>login_handler\u003c/code> / \u003ccode>auth_provider\u003c/code> 类名写错会\u003cstrong>静默回退内置\u003c/strong>；改完需 \u003ccode>restart\u003c/code>，并确认类能被自动加载（PSR-4 路径 / 命名空间）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义登录返回 null 却想给明确错误\u003c/td>\n\u003ctd>\u003ccode>login()\u003c/code> 只能返回身份数组或 \u003ccode>null\u003c/code>；想区分「用户不存在」「密码错」可在 \u003ccode>null\u003c/code> 前用日志 / 监控区分，响应统一是 401\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录成功但 \u003ccode>/api/auth/me\u003c/code> 报用户不存在\u003c/td>\n\u003ctd>\u003ccode>login()\u003c/code> 的 \u003ccode>id\u003c/code> 与 \u003ccode>resolveUser($id)\u003c/code> 取数来源不一致，核对两边用的是同一张表同一列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自己实现 \u003ccode>auth_provider\u003c/code> 加状态判定，结果「能访问接口但 \u003ccode>/me\u003c/code> 状态不对」\u003c/td>\n\u003ctd>覆盖时漏了三个入口之一（\u003ccode>login\u003c/code> / \u003ccode>identity\u003c/code> / \u003ccode>resolveUser\u003c/code>），\u003cstrong>漏了不报错\u003c/strong>。改用 \u003ccode>auth_state_guard\u003c/code> 收口到一处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>auth_state_guard\u003c/code> 配了却不生效\u003c/td>\n\u003ctd>①类名写错 / 类不存在 → \u003ccode>stateGuard()\u003c/code> 返回 \u003ccode>null\u003c/code> 静默跳过；②没 \u003ccode>restart\u003c/code>（配置在启动期读取）；③配的是 \u003ccode>auth_provider\u003c/code> 而非 \u003ccode>auth_state_guard\u003c/code>。排查：\u003ccode>php -r &quot;var_dump(class_exists(&#39;\\\\\\\\app\\\\\\\\auth\\\\\\\\MyGuard&#39;));&quot;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>登录一直提示「验证码错误」「请输入验证码」\u003c/td>\n\u003ctd>①宿主要求验证码但自定义登录页没送 \u003ccode>captcha_key\u003c/code> / \u003ccode>captcha_code\u003c/code>（不想用就 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启）；②前端产物是旧的（不含验证码字段）→ 重新构建部署；③\u003ccode>/api/auth/captcha\u003c/code> 报 500（缺 \u003ccode>webman/captcha\u003c/code> 或 \u003ccode>ext-gd\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码位置只有一行「点击获取」，没有图片\u003c/td>\n\u003ctd>\u003ccode>/api/auth/captcha\u003c/code> 没返回有效 key，看响应 \u003ccode>msg\u003c/code>：ext-gd 未装 / 字体缺失 / Redis 不可用；点那一行可重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证码输入框整块不显示（后端却仍要验证码）\u003c/td>\n\u003ctd>\u003ccode>captcha_enabled=false\u003c/code> 已生效，或 \u003ccode>/api/config/site\u003c/code> 请求失败（前端兜底不显示）。后端返回的错误里带 \u003ccode>data.captcha=true\u003c/code>，前端会\u003cstrong>自动展开并拉图\u003c/strong>，重试一次即可\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全员都登不进去，且验证码一直失败\u003c/td>\n\u003ctd>Redis 挂了（验证码明文存 Redis，一次性）。应急把 \u003ccode>&#39;captcha_enabled&#39; =&gt; false\u003c/code> 后重启放行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>账号能登录，但过一会儿请求全 403「账号已被禁用」\u003c/td>\n\u003ctd>配了 \u003ccode>auth_state_guard\u003c/code>，其业务判定返回了 \u003ccode>false\u003c/code>（\u003ccode>AuthCheck\u003c/code> 每请求都调，实时生效、无缓存）。查 \u003ccode>PlatformStatusGuard\u003c/code> 之类的实现与业务库状态；注意钩子内要做 \u003cstrong>fail-open\u003c/strong>（异常时放行 + 记日志）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-181\">6. 接口加密\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>所有 \u003ccode>/api\u003c/code> 返回 400「请求解密失败」\u003c/td>\n\u003ctd>前端产物用的公钥与宿主私钥不匹配。\u003cstrong>公钥每宿主一份\u003c/strong>（\u003ccode>config/keys/api_rsa_public.pem\u003c/code>），别把 A 宿主的产物拷到 B 宿主；用 \u003ccode>build-frontend.sh\u003c/code> 重开（它会校验产物里真的带上了目标宿主的公钥）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>「我明明没开加密，怎么要解密」\u003c/td>\n\u003ctd>开关是\u003cstrong>显式\u003c/strong>的：只有 \u003ccode>VITE_API_ENCRYPT=true\u003c/code> 才开。若产物里搜得到 \u003ccode>X-Encrypt-Data\u003c/code>，说明这批 dist 是加密版构建的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改了 \u003ccode>VITE_API_ENCRYPT\u003c/code> 没反应\u003c/td>\n\u003ctd>该变量是\u003cstrong>构建期内联\u003c/strong>，不是运行期配置，改完必须重新 \u003ccode>npm run build\u003c/code> 并部署产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动构建时换行写不对\u003c/td>\n\u003ctd>\u003ccode>VITE_API_RSA_PUBLIC_KEY\u003c/code> 里的换行要写成字面 \u003ccode>\\n\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上传 / 导出也想加密\u003c/td>\n\u003ctd>不需要，也不会加密：\u003ccode>multipart\u003c/code> 上传、非 JSON 响应（CSV 导出）、\u003ccode>OPTIONS\u003c/code> 预检、非 \u003ccode>/api\u003c/code> 路径\u003cstrong>始终明文\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-182\">7. 异常兜底 / 日志\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>线上接口提示「服务内部错误（编号 xxxxxxxx）」\u003c/td>\n\u003ctd>后端有未捕获异常（多为 SQL 报错 / 字段不存在）。\u003ccode>grep &lt;编号&gt; runtime/logs/webman.log\u003c/code> 直接看到异常类、SQL 与绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口只提示「Request failed with status code 500」，没有编号\u003c/td>\n\u003ctd>该路由\u003cstrong>没走\u003c/strong>插件异常处理器。插件路由应自动生效（\u003ccode>plugin/curd/config/exception.php\u003c/code>）；宿主自己的 \u003ccode>/api\u003c/code> 控制器需把 \u003ccode>config/exception.php\u003c/code> 的 \u003ccode>&#39;&#39;\u003c/code> 键指向 \u003ccode>CurdExceptionHandler\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线上接口直接返回堆栈 / 表结构\u003c/td>\n\u003ctd>模式还判定为「本地」：插件侧看 \u003ccode>.env\u003c/code> 的 \u003ccode>APP_DEBUG\u003c/code>，宿主自己控制器还要看宿主 \u003ccode>config/app.php\u003c/code> 的 \u003ccode>debug\u003c/code>（两者\u003cstrong>取交集\u003c/strong>，任一为 \u003ccode>false\u003c/code> 即线上）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按编号 grep 日志只看到半条\u003c/td>\n\u003ctd>日志被 \u003ccode>trace_str\u003c/code> 的换行撑成多行（webman 默认 \u003ccode>allowInlineLineBreaks=true\u003c/code>）。新版已把换行收敛为 \u003ccode>|\u003c/code>、并把 \u003ccode>sql\u003c/code> / \u003ccode>bindings\u003c/code> 排在堆栈之前，一条异常恒为一行；用到旧版 \u003ccode>CurdExceptionHandler\u003c/code> 就重新同步一次插件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想在中间件里统一捕获接口异常\u003c/td>\n\u003ctd>\u003cstrong>做不到\u003c/strong>：webman 的中间件链每层内层都先 try/catch 再转 Response，外层拿不到控制器异常。只能用异常处理器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-183\">8. 升级 / 部署\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>composer update\u003c/code> 后宿主 \u003ccode>plugin/curd\u003c/code> 没变\u003c/td>\n\u003ctd>\u003cstrong>预期行为\u003c/strong>：安装器只在目录不存在时拷贝（保护本地改动）。要同步新版文件用 \u003ccode>scripts/sync-plugin.sh\u003c/code>（先备份再重拷）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不确定宿主侧有没有本地改动\u003c/td>\n\u003ctd>升级前跑 \u003ccode>scripts/check-plugin-overrides.sh &lt;宿主项目根&gt;\u003c/code>：\u003ccode>0\u003c/code> = 无改动，\u003ccode>1\u003c/code> = 发现改动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>升级后新表 / 新菜单缺失\u003c/td>\n\u003ctd>升级后跑一次 \u003ccode>php plugin/curd/install.php\u003c/code>（幂等补种子）与 \u003ccode>php plugin/curd/migrate.php\u003c/code>（增量迁移）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Route conflict\u003c/code> 异常\u003c/td>\n\u003ctd>老版本插件没用冲突检测。现版本统一走 \u003ccode>curd_route()\u003c/code>：注册前检测同 method + path，已注册则跳过、保留宿主实现。宿主自注册过 \u003ccode>/api/admin/*\u003c/code> 等不受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与宿主路由冲突怎么办\u003c/td>\n\u003ctd>同上 —— \u003cstrong>宿主优先\u003c/strong>，插件让位。存量项目装插件行为不变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件自带 config 覆盖了 \u003ccode>config/plugin/curd/curd.php\u003c/code>\u003c/td>\n\u003ctd>正常：插件以「根目录应用插件」分发，webman 配置加载顺序是 \u003ccode>config/\u003c/code> 先、\u003ccode>plugin/*/config\u003c/code> 后。调参请写宿主根 \u003ccode>config/curd-admin.php\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"h-184\">9. FAQ\u003c/h2>\n\u003ch3 id=\"h-185\">为什么配置写在 \u003ccode>config/curd-admin.php\u003c/code> 而不是 \u003ccode>.env\u003c/code>？\u003c/h3>\n\u003cp>插件自带 config 会覆盖 \u003ccode>config/plugin/curd/curd.php\u003c/code>；宿主根 \u003ccode>config/curd-admin.php\u003c/code>\n由安装器生成、\u003cstrong>顶层同名键覆盖内置默认\u003c/strong>，是唯一推荐调参入口。\n数据库连接仍走 \u003ccode>.env\u003c/code> 的 \u003ccode>DB_*\u003c/code> 键。\u003c/p>\n\u003cblockquote>\n\u003cp>注意：\u003ccode>CURD_*\u003c/code> 环境变量已\u003cstrong>全部移除\u003c/strong>，\u003ccode>config/curd.php\u003c/code> 与 \u003ccode>config/admin.php\u003c/code>\n也已\u003cstrong>不再读取\u003c/strong>（2026-09-19 合并）。改这两个地方一律无效果。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-186\">为什么还保留 \u003ccode>mysql_business\u003c/code> 连接（默认指向同一个库）？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>历史原因\u003c/strong>：插件按「认证库 / 业务库」分离设计，\u003ccode>business_connection=mysql_business\u003c/code>\n是默认的业务模型 CURD 连接名。改这一处会动大量业务代码、破坏向后兼容。\u003c/li>\n\u003cli>\u003cstrong>单库模式\u003c/strong>（默认）：\u003ccode>mysql_business.database\u003c/code> 回退到认证库名 → 两个连接\u003cstrong>指向同一库\u003c/strong>，零开销。\u003c/li>\n\u003cli>\u003cstrong>想分库\u003c/strong>：在 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>database.business_db\u003c/code> 填不同库名。\u003c/li>\n\u003cli>\u003cstrong>不要它\u003c/strong>：删掉 \u003ccode>config/database.php\u003c/code> 里 \u003ccode>&#39;mysql_business&#39; =&gt; [...]\u003c/code> 整块，\n业务代码里的 \u003ccode>Db::connection(&#39;mysql_business&#39;)\u003c/code> 改成 \u003ccode>mysql\u003c/code>，或在模型里\n\u003ccode>protected $connection = &#39;mysql&#39;;\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-187\">\u003ccode>composer audit\u003c/code> 红字能彻底消除吗？\u003c/h3>\n\u003cp>包内无法彻底消除（composer 没有全局 config 关闭 audit），但提供\u003cstrong>零侵入 wrapper\u003c/strong>。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>原理\u003c/strong>：\u003ccode>composer require/update\u003c/code> 末尾会跑 \u003ccode>composer audit\u003c/code>，硬编码访问 \u003ccode>packagist.org\u003c/code>\n的 \u003ccode>security-advisories\u003c/code> 端点（不走国内镜像）；不可达时就报红字，但命令本身 \u003ccode>exit 0\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>根治\u003c/strong>：让 \u003ccode>packagist.org\u003c/code> 可达（全局代理或 hosts）。\u003c/li>\n\u003cli>\u003cstrong>包内方案\u003c/strong>：\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-bash\">./scripts/composer.sh update                          # 临时用一次\necho &quot;alias composer=&#39;$(pwd)/scripts/composer.sh&#39;&quot; &gt;&gt; ~/.zshrc &amp;&amp; source ~/.zshrc   # 永久\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-188\">插件的路由前缀和命名空间是什么？\u003c/h3>\n\u003cul>\n\u003cli>后端 API \u003ccode>/api/*\u003c/code>、内置前端 \u003ccode>/app/curd/*\u003c/code>；\u003c/li>\n\u003cli>命名空间 \u003ccode>plugin\\curd\\app\\*\u003c/code>；配置读取 \u003ccode>config(&#39;plugin.curd.*&#39;)\u003c/code>；\u003c/li>\n\u003cli>表 \u003ccode>curd_configs\u003c/code>（页面 DSL 配置）、\u003ccode>admin_users\u003c/code>、\u003ccode>admin_tokens\u003c/code>、\u003ccode>roles\u003c/code>、\n\u003ccode>admin_role_user\u003c/code>、\u003ccode>role_permission\u003c/code>、\u003ccode>casbin_rule\u003c/code>、\u003ccode>menus\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-189\">\u003ccode>composer update\u003c/code> 会把我改好的配置覆盖掉吗？\u003c/h3>\n\u003cp>\u003cstrong>会覆盖代码，但保留密钥。\u003c/strong> 自 2026-10-15 起，\u003ccode>plugin/curd\u003c/code> 已存在时 \u003ccode>composer update\u003c/code> 会\u003cstrong>整目录删除后从包内重拷（覆盖同步）\u003c/strong>，宿主在 \u003ccode>plugin/curd\u003c/code> 下的本地改动会被抹掉；唯一保留的是 \u003ccode>plugin/curd/config/keys/*.pem\u003c/code> 加密密钥（删目录时保留、拷包时排除）。\n宿主 \u003ccode>config/curd-admin.php\u003c/code> 仍是「已存在即 return」不覆盖；示例控制器 / 模型已存在也跳过。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-190\">10. 命令行（\u003ccode>make:curd\u003c/code>）\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>原因 / 解法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>php webman list\u003c/code> 里\u003cstrong>没有\u003c/strong> \u003ccode>make:curd\u003c/code>\u003c/td>\n\u003ctd>插件版本 &lt; 2026-10-19，且 \u003ccode>plugin/curd\u003c/code> 是\u003cstrong>软链\u003c/strong>挂载（composer path 仓库开发）。升级到本版即可（插件已内置显式注册）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>出现的是\u003cstrong>英文描述\u003c/strong>的旧版（\u003ccode>Generate a CURD controller for a table\u003c/code>）\u003c/td>\n\u003ctd>宿主 \u003ccode>app/command/\u003c/code> 里还留着早期拷贝的命令，且插件的没注册上（同上）。删掉宿主那份，或升级插件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>make:crud\u003c/code> 报「已经存在」/ 生成的代码风格不对\u003c/td>\n\u003ctd>\u003cstrong>别混用\u003c/strong>：\u003ccode>make:crud\u003c/code> 是 \u003ccode>webman/console\u003c/code> 自带的通用生成器（Model + Controller + Validator），与本插件无关；本插件是 \u003ccode>make:curd\u003c/code>（u 在前）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>为什么软链会吃掉命令\u003c/strong>（原理，出问题时好排查）：\u003c/p>\n\u003cp>\u003ccode>webman/console\u003c/code> 的 \u003ccode>Command::installCommands()\u003c/code> 用 \u003ccode>getRealPath()\u003c/code> 拿真实路径，再做字符串前缀裁剪拼类名：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$relativePath = str_replace(str_replace(&#39;/&#39;, &#39;\\\\&#39;, $path . &#39;\\\\&#39;), &#39;&#39;, str_replace(&#39;/&#39;, &#39;\\\\&#39;, $file-&gt;getRealPath()));\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>plugin/curd\u003c/code> 是软链时 \u003ccode>getRealPath()\u003c/code> 解析到软链目标（如 \u003ccode>../../company/webman-curd-admin/plugin/curd\u003c/code>），\n前缀对不上 → 拼出的类名是乱的 → \u003ccode>class_exists\u003c/code> 失败后\u003cstrong>静默 \u003ccode>continue\u003c/code>\u003c/strong>（不报错，所以毫无线索）。\u003c/p>\n\u003cp>\u003cstrong>解法\u003c/strong>：插件在 \u003ccode>plugin/curd/config/app.php\u003c/code> 里显式声明了 \u003ccode>command\u003c/code>，走\n\u003ccode>Command::createCommandInstance()\u003c/code> 直接按类名反射，不经过路径拼接，天然免疫软链：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&#39;command&#39; =&gt; [\n    \\plugin\\curd\\app\\command\\MakeCurdCommand::class,\n],\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>老版本宿主想临时救急：在宿主新建 \u003ccode>config/plugin/curd/app.php\u003c/code>，内容为\n\u003ccode>return [&#39;enable&#39; =&gt; true, &#39;command&#39; =&gt; [\\plugin\\curd\\app\\command\\MakeCurdCommand::class]];\u003c/code>\n—— 效果相同（插件内置后就不需要了，两边同名注册时后者覆盖前者，无副作用）。\u003c/p>\n\u003c/blockquote>\n\u003cp>唯一的例外是宿主 \u003ccode>config/database.php\u003c/code>：如果它还是 webman 的\u003cstrong>占位模板\u003c/strong>\n（内容里有 \u003ccode>your_database\u003c/code> / \u003ccode>your_username\u003c/code>），会被备份成 \u003ccode>database.php.webman-db.bak\u003c/code>\n后用 env 驱动的模板替换。已经改成自定义配置的则不动。\u003c/p>\n\u003cp>完整边界表见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"9\">升级 · 部署 · 发布\u003c/a> §1.1。\u003c/p>\n\u003cp>代价是硬币的另一面：\u003cstrong>\u003ccode>composer update\u003c/code> 也不会把新版同步进 \u003ccode>plugin/curd\u003c/code>\u003c/strong> ——\n升级要另外跑 \u003ccode>scripts/sync-plugin.sh\u003c/code>，确认版本看的是 \u003ccode>plugin/curd\u003c/code>，而不是 \u003ccode>vendor/\u003c/code>。\u003c/p>\n"},{"file":"20-API-Grid.md","title":"API · Grid 方法大全","section":"api","sectionName":"API 参考","mtime":"2026/10/19 17:42:18","headings":[{"depth":2,"text":"0. 速查表","id":"h-192"},{"depth":2,"text":"1. 构造与标题","id":"h-193"},{"depth":2,"text":"2. 列 column()","id":"h-194"},{"depth":2,"text":"3. 搜索 filter()","id":"h-195"},{"depth":2,"text":"4. 表单 form() / addForm() / editForm()","id":"h-196"},{"depth":3,"text":"4.1 表单选项卡 / 分步","id":"h-197"},{"depth":3,"text":"4.2 提交二次确认","id":"h-198"},{"depth":3,"text":"4.3 场景字段（新增/编辑各显示一部分）","id":"h-199"},{"depth":2,"text":"5. 查看详情 setDetail()","id":"h-200"},{"depth":2,"text":"6. 操作按钮 action()","id":"h-201"},{"depth":2,"text":"7. 汇总条 summary()","id":"h-202"},{"depth":2,"text":"8. 行样式与校验","id":"h-203"},{"depth":2,"text":"9. 能力开关","id":"h-204"},{"depth":2,"text":"10. 自定义 CSS / JS","id":"h-205"},{"depth":2,"text":"11. 其它","id":"h-206"},{"depth":2,"text":"12. 一个完整可运行示例","id":"h-207"}],"allHeadings":[{"depth":1,"text":"API · Grid 方法大全","id":"h-191"},{"depth":2,"text":"0. 速查表","id":"h-192"},{"depth":2,"text":"1. 构造与标题","id":"h-193"},{"depth":2,"text":"2. 列 column()","id":"h-194"},{"depth":2,"text":"3. 搜索 filter()","id":"h-195"},{"depth":2,"text":"4. 表单 form() / addForm() / editForm()","id":"h-196"},{"depth":3,"text":"4.1 表单选项卡 / 分步","id":"h-197"},{"depth":3,"text":"4.2 提交二次确认","id":"h-198"},{"depth":3,"text":"4.3 场景字段（新增/编辑各显示一部分）","id":"h-199"},{"depth":2,"text":"5. 查看详情 setDetail()","id":"h-200"},{"depth":2,"text":"6. 操作按钮 action()","id":"h-201"},{"depth":2,"text":"7. 汇总条 summary()","id":"h-202"},{"depth":2,"text":"8. 行样式与校验","id":"h-203"},{"depth":2,"text":"9. 能力开关","id":"h-204"},{"depth":2,"text":"10. 自定义 CSS / JS","id":"h-205"},{"depth":2,"text":"11. 其它","id":"h-206"},{"depth":2,"text":"12. 一个完整可运行示例","id":"h-207"}],"html":"\u003ch1 id=\"h-191\">API · Grid 方法大全\u003c/h1>\n\u003cblockquote>\n\u003cp>\u003ccode>Grid\u003c/code> 是 CURD 页面的根对象：列、搜索、表单、详情、操作、汇总、样式与能力开关都挂在它上面。\n所有方法都返回 \u003ccode>$grid\u003c/code>（或子对象），支持链式调用。\n代码位置 \u003ccode>plugin/curd/app/dsl/Grid.php\u003c/code>；列方法见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"
