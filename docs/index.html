徽标）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;display(fn() =&gt; …)\u003c/code>\u003c/td>\n\u003ctd>自定义渲染：回调内 \u003ccode>$this\u003c/code> 即当前行，可访问 \u003ccode>$this-&gt;status\u003c/code> 等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;display(&#39;&lt;b&gt;{name}&lt;/b&gt;&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>字符串模板 = HTML\u003c/strong>：直接按 HTML 渲染（v-html）；\u003ccode>{prop}\u003c/code> 取当前行字段、\u003ccode>{value}\u003c/code> 取该列原始值，如 \u003ccode>&lt;a href=&quot;/u/{id}&quot;&gt;{name}&lt;/a&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;display(fn($v) =&gt; &#39;&lt;i&gt;&#39;.$v.&#39;&lt;/i&gt;&#39;)\u003c/code>\u003c/td>\n\u003ctd>闭包返回 HTML：\u003cstrong>默认自动检测\u003c/strong>（返回值含真实标签就按 HTML 渲染）；\u003ccode>-&gt;html()\u003c/code> 强制 HTML、\u003ccode>-&gt;html(false)\u003c/code> 强制文本（详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\" data-doc-anchor=\"h-211\">Column §3\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;prefix(&#39;￥&#39;)\u003c/code>\u003c/td>\n\u003ctd>前缀文案（金额）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;datetime()\u003c/code> / \u003ccode>-&gt;date()\u003c/code>\u003c/td>\n\u003ctd>时间格式化显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;image(int $w, int $h)\u003c/code> / \u003ccode>-&gt;staticHost()\u003c/code> / \u003ccode>-&gt;open(&#39;_blank&#39;)\u003c/code>\u003c/td>\n\u003ctd>图片列 / 静态资源 host / 点击新窗口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;href(...)\u003c/code> / \u003ccode>-&gt;href(callable)\u003c/code>\u003c/td>\n\u003ctd>单元格链接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;switch()\u003c/code>\u003c/td>\n\u003ctd>行内开关\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>column(&#39;config.api_url&#39;, &#39;接口地址&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>点式列\u003c/strong>：根字段是 JSON 文本时自动解码取子键；\u003ccode>-&gt;map()/-&gt;datetime()\u003c/code> 等列方法全部可用（见 §5.2）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>column(&#39;user.name&#39;, &#39;用户&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>点式列走关联\u003c/strong>：\u003ccode>user\u003c/code> 不是真实字段时当作关联关系（\u003ccode>belongsTo/hasOne\u003c/code>），自动 \u003ccode>with(&#39;user&#39;)\u003c/code> 预加载；\u003cstrong>字段优先，字段没有才走关联\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;modal(&#39;标题&#39;, $content)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>点击弹窗\u003c/strong>：内容服务端逐行生成，支持 \u003ccode>Table/Card/Html\u003c/code> 组件、闭包、类名、HTML 模板（见 §3.1）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;expand($content, &#39;标题&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>整行展开\u003c/strong>：点行任意位置展开/收起，内容通栏显示（无行首箭头）；写法同 \u003ccode>modal\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;remote($table, $valueKey=&#39;id&#39;, $labelKey=&#39;name&#39;)\u003c/code>\u003c/td>\n\u003ctd>关联表翻译（跨库由统一接口代替时自行 display）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;limit(int)\u003c/code>（截断）、\u003ccode>-&gt;hidden()\u003c/code>（默认隐藏可配置显示）、\u003ccode>-&gt;sortable()\u003c/code>\u003c/td>\n\u003ctd>其它\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;copy()\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>可复制列\u003c/strong>：单元格带复制按钮，一键复制该列文本（复制的是 \u003ccode>display()\u003c/code> 之后的最终展示值；与 tag/switch/image 等共存时 copy 优先）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;select([1=&gt;&#39;安卓&#39;,2=&gt;&#39;iOS&#39;])\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>行内下拉编辑\u003c/strong>（\u003ccode>= editable(&#39;select&#39;, …)\u003c/code> 的便捷写法）：参数为 \u003ccode>[值 =&gt; 文案]\u003c/code> 关联数组，或 \u003ccode>[[&#39;value&#39;=&gt;1,&#39;label&#39;=&gt;&#39;安卓&#39;],…]\u003c/code> 二维列表，两种写法等价；选中即提交保存，字段自动加入可写字段白名单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-&gt;editable($type=&#39;input&#39;, $options)\u003c/code>\u003c/td>\n\u003ctd>单元格编辑（\u003ccode>select\u003c/code> 的底层方法）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-99\">3.1 点击弹窗 / 行内展开（\u003ccode>modal()\u003c/code> / \u003ccode>expand()\u003c/code>）\u003c/h3>\n\u003cp>列值旁挂一个交互，内容由\u003cstrong>服务端逐行生成\u003c/strong>（随列表接口返回，前端零代码）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">use plugin\\curd\\app\\dsl\\component\\Card;\nuse plugin\\curd\\app\\dsl\\component\\Table;\n\n// 行内展开：点一下展开，再点收起\n$grid-&gt;column(&#39;money&#39;, &#39;明细&#39;)-&gt;expand(function ($value, $row) {\n    return new Table([&#39;xxx&#39; =&gt; &#39;标题&#39;], [[&#39;xxx&#39; =&gt; &#39;111&#39;], [&#39;xxx&#39; =&gt; &#39;1222&#39;]]);\n});\n\n// 弹窗：标题 + 内容\n$grid-&gt;column(&#39;order_no&#39;, &#39;订单号&#39;)-&gt;modal(&#39;订单详情&#39;, function ($value, $row) {\n    return new Card([&#39;订单号&#39; =&gt; $value, &#39;金额&#39; =&gt; $row-&gt;amount], &#39;基本信息&#39;);\n});\n\n// 类名写法：实例化后调 render($row)\n$grid-&gt;column(&#39;id&#39;, &#39;ID&#39;)-&gt;modal(&#39;详情&#39;, OrderDetailModal::class);\n\u003c/code>\u003c/pre>\n\u003cp>内置组件：\u003ccode>new Table(列, 行, 选项)\u003c/code>、\u003ccode>new Card([&#39;标签&#39; =&gt; &#39;值&#39;], &#39;标题&#39;)\u003c/code>、\u003ccode>new Html(&#39;&lt;b&gt;..&lt;/b&gt;&#39;)\u003c/code>。\n内容也可以直接给 HTML 模板字符串（\u003ccode>&#39;&lt;b&gt;{order_no}&lt;/b&gt;&#39;\u003c/code>，\u003ccode>{prop}\u003c/code> 取行字段、\u003ccode>{value}\u003c/code> 取本列值）。\u003c/p>\n\u003cp>优先级：\u003ccode>modal\u003c/code> &gt; \u003ccode>expand\u003c/code> &gt; \u003ccode>copy\u003c/code> &gt; \u003ccode>display\u003c/code> &gt; 其它类型。详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"12\">Column §9\u003c/a>。\u003c/p>\n\u003ch2 id=\"h-100\">4. 搜索 \u003ccode>grid()-&gt;filter(callable)\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    $filter-&gt;like(&#39;remark&#39;, &#39;备注&#39;);                       // 模糊\n    $filter-&gt;equal(&#39;mobile&#39;, &#39;手机号&#39;);                    // 精确\n    $filter-&gt;select(&#39;status&#39;, &#39;状态&#39;)-&gt;options(self::STATUS); // 下拉\n    $filter-&gt;dateRange(&#39;created_at&#39;, &#39;创建时间&#39;);          // 日期区间\n    $filter-&gt;between(&#39;money&#39;, &#39;充值金额&#39;);                 // 数值区间\n    $filter-&gt;where(function ($q, $v) { … }, &#39;自定义&#39;, &#39;prop&#39;); // 任意条件（prop 传空为只读标签项）\n});\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-101\">4.1 搜索项默认值 \u003ccode>-&gt;default()\u003c/code>\u003c/h3>\n\u003cp>给搜索项配默认值，\u003cstrong>首屏加载就带上它\u003c/strong>（搜索框已填好），点「重置」回到默认值而不是清空：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;filter(function (Filter $filter) {\n    // 日期区间：相对表达式在输出配置时按「当前时间」求值\n    $filter-&gt;dateRange(&#39;created_at&#39;, &#39;创建时间&#39;)-&gt;default(&#39;-7d&#39;);            // 近 7 天（7 天前 ~ 今天）\n    $filter-&gt;dateRange(&#39;created_at&#39;, &#39;创建时间&#39;)-&gt;default([&#39;month&#39;, &#39;today&#39;]); // 本月 1 号 ~ 今天\n    $filter-&gt;dateRange(&#39;created_at&#39;, &#39;创建时间&#39;)-&gt;default([&#39;2026-01-01&#39;, &#39;2026-01-31&#39;]); // 固定区间\n    $filter-&gt;between(&#39;updated_at&#39;, &#39;更新时间&#39;)-&gt;datetime()-&gt;default([&#39;-1d&#39;, &#39;now&#39;]);\n    // 其它类型：原样\n    $filter-&gt;select(&#39;status&#39;, &#39;状态&#39;)-&gt;options(self::STATUS)-&gt;default(1);\n    $filter-&gt;singleDate(&#39;begin_time&#39;, &#39;开始时间&#39;)-&gt;default(&#39;today&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003cp>区间类（\u003ccode>daterange\u003c/code> / \u003ccode>datetimerange\u003c/code>）取值规则：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>[&#39;-7d&#39;, &#39;today&#39;]\u003c/code>\u003c/td>\n\u003ctd>两端各自求值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>[&#39;-3d&#39;, null]\u003c/code>（另一端给 \u003ccode>null\u003c/code> / \u003ccode>&#39;&#39;\u003c/code>）\u003c/td>\n\u003ctd>缺失端补「现在」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&#39;-7d&#39;\u003c/code>（单个\u003cstrong>相对表达式\u003c/strong>）\u003c/td>\n\u003ctd>起点 = 表达式，终点 = 现在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&#39;2026-01-01&#39;\u003c/code>（单个\u003cstrong>具体日期\u003c/strong>）\u003c/td>\n\u003ctd>两端同值（就是那一天）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>日期字符串支持相对写法（输出配置时按当前时间展开）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>today\u003c/code> / \u003ccode>now\u003c/code>\u003c/td>\n\u003ctd>此刻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>yesterday\u003c/code>\u003c/td>\n\u003ctd>昨天\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>week\u003c/code> / \u003ccode>month\u003c/code> / \u003ccode>year\u003c/code>\u003c/td>\n\u003ctd>本周一 / 本月 1 号 / 本年 1 月 1 号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&#39;-7d&#39;\u003c/code> \u003ccode>&#39;+3days&#39;\u003c/code> \u003ccode>&#39;-2weeks&#39;\u003c/code> \u003ccode>&#39;+1month&#39;\u003c/code> \u003ccode>&#39;-1year&#39;\u003c/code>\u003c/td>\n\u003ctd>相对偏移（\u003ccode>±N\u003c/code> + \u003ccode>d/day(s)/w/week(s)/month(s)/year(s)\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&#39;2026-01-01&#39;\u003c/code> / \u003ccode>&#39;2026-01-01 08:00:00&#39;\u003c/code>\u003c/td>\n\u003ctd>原样透传\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cul>\n\u003cli>前端协议字段是 \u003ccode>default\u003c/code>（\u003ccode>defaultValue\u003c/code> 为等价别名），由 \u003ccode>GenericCurd\u003c/code> 在挂载时写入 \u003ccode>searchForm\u003c/code>，\n所以\u003cstrong>首次列表请求就带默认值\u003c/strong>；\u003ccode>default\u003c/code> 只影响首屏与「重置」，用户改动后不会被覆盖。\u003c/li>\n\u003cli>配置里输出的是\u003cstrong>求值后的具体日期\u003c/strong>（页面每次加载重新计算），因此「近 7 天」永远跟着当天走。\u003c/li>\n\u003cli>\u003ccode>-&gt;where(...)\u003c/code> 自定义条件同样支持 \u003ccode>-&gt;default(&#39;x&#39;)\u003c/code>：默认值会填进输入框并参与首次查询（闭包按有值执行）。\u003c/li>\n\u003cli>前端硬编码 config（不走 DSL）时，直接在 \u003ccode>search\u003c/code> 项上写 \u003ccode>default\u003c/code> / \u003ccode>defaultValue\u003c/code> 即可。\u003c/li>\n\u003c/ul>\n\u003c/blockquote>\n\u003ch2 id=\"h-102\">5. 表单 \u003ccode>grid()-&gt;form(callable)\u003c/code>（新增+编辑共用）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;mobile&#39;, &#39;手机号&#39;)-&gt;required()-&gt;rules(&#39;required|regex:/^\\d+$/|min:11&#39;);\n    $form-&gt;select(&#39;platform&#39;, &#39;充值平台&#39;)-&gt;options(self::PLATFORM)-&gt;default(2);\n    $form-&gt;number(&#39;money&#39;, &#39;充值金额&#39;)-&gt;default(0)-&gt;min(0);\n    $form-&gt;textarea(&#39;remark&#39;, &#39;备注&#39;);\n    $form-&gt;datetime(&#39;created_at&#39;, &#39;时间&#39;);\n    $form-&gt;switch(&#39;new_system&#39;, &#39;新系统&#39;);\n    $form-&gt;remote(&#39;business_id&#39;, &#39;业务&#39;, &#39;a_businesses&#39;, &#39;id&#39;, &#39;name&#39;); // 远程下拉\n});\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>字段通用链式（\u003ccode>Field\u003c/code>）\u003c/strong>：\u003ccode>required / placeholder / help / default / addDefault / editDefault / disabled / addDisabled / editDisabled / hidden / addHidden / addOnly / editOnly / options(map) / multiple / filterable / span / full / row / rules / min / max / step / config(extra)\u003c/code>；\n动态显隐 \u003ccode>-&gt;when(父值, cb)\u003c/code> / \u003ccode>-&gt;addVisibleWhen([...])\u003c/code>。\n\u003ccode>addOnly()\u003c/code> = 仅新增场景、\u003ccode>editOnly()\u003c/code> = 仅编辑场景（也可用 \u003ccode>if ($form-&gt;isCreate())\u003c/code> 包裹，见 §5.1，更好读）。\u003c/p>\n\u003cp>\u003cstrong>表单级\u003c/strong>：\u003ccode>$form-&gt;columns(int)\u003c/code> 栅格列数、\u003ccode>$form-&gt;width/height\u003c/code>、\u003ccode>confirm\u003c/code>、\u003ccode>isCreate()\u003c/code> / \u003ccode>isEdit()\u003c/code>；\n\u003ccode>Grid::addForm / editForm\u003c/code> 拆分新增/编辑差异、\u003ccode>setFormTabs / setFormSteps\u003c/code> 分 Tab/分步；\n\u003ccode>$form-&gt;labelWidth(int)\u003c/code> 标签宽（默认 100）、\u003ccode>labelPosition(&#39;right&#39;|&#39;left&#39;|&#39;top&#39;)\u003c/code>、\n\u003ccode>contentWidth(string)\u003c/code> 内容区整体最大宽度（元素区 ≈ contentWidth − labelWidth，不设则撑满弹窗）。\u003c/p>\n\u003ch3 id=\"h-103\">5.1 场景字段控制：\u003ccode>if ($form-&gt;isCreate())\u003c/code> / \u003ccode>if ($form-&gt;isEdit())\u003c/code>\u003c/h3>\n\u003cp>\u003cstrong>推荐写法\u003c/strong>：把字段注册包在 \u003ccode>if\u003c/code> 里，按场景条件注册。\u003cstrong>场景块内声明的字段自动变成「仅该场景」\u003c/strong>（等价于在字段上挂 \u003ccode>-&gt;addOnly()\u003c/code> / \u003ccode>-&gt;editOnly()\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;account&#39;, &#39;账户&#39;)-&gt;required();   // 块外：两个场景都有\n    $form-&gt;text(&#39;name&#39;, &#39;名称&#39;)-&gt;required();\n\n    if ($form-&gt;isCreate()) {\n        $form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;required(); // 仅新增弹窗\n    }\n    if ($form-&gt;isEdit()) {\n        $form-&gt;text(&#39;amount&#39;, &#39;金额&#39;)-&gt;required();   // 仅编辑弹窗\n    }\n});\n\u003c/code>\u003c/pre>\n\u003cp>效果：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>弹窗\u003c/th>\n\u003cth>渲染 / 提交的字段\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新增\u003c/td>\n\u003ctd>account、name、password\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑\u003c/td>\n\u003ctd>account、name、amount\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>块外字段两个场景共用，\u003cstrong>不需要任何白名单\u003c/strong>（以后加字段也不会「漏字段」—— 白名单写法最常踩的坑）。\u003c/li>\n\u003cli>前端不渲染 / 不回显 / 不提交；后端 \u003ccode>add()/update()\u003c/code> 按同一份配置剔除，校验规则同步收敛。\u003c/li>\n\u003cli>\u003ccode>if / else\u003c/code> 同样支持（\u003ccode>else\u003c/code> 块里的字段自动成为另一场景专属）。\u003c/li>\n\u003cli>未指定场景时（如 \u003ccode>Action::form()\u003c/code> 的行级弹窗只有一份表单）两个判断都返回 \u003ccode>true\u003c/code>，两段都注册。\u003c/li>\n\u003cli>回调里\u003cstrong>没用\u003c/strong>场景判断时只执行一次，行为与开销与以前一致。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>兼容旧写法（场景白名单）\u003c/strong>：\u003ccode>isCreate(...)\u003c/code> / \u003ccode>isEdit(...)\u003c/code> 传字段名时仍是白名单语义 —— 该场景\u003cstrong>只\u003c/strong>保留列出的字段，支持可变参数、数组、回调动态控制：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;mobile&#39;, &#39;手机号&#39;);\n    $form-&gt;text(&#39;price&#39;, &#39;价格&#39;);\n    $form-&gt;hidden(&#39;uid&#39;, &#39;UID&#39;);\n\n    $form-&gt;isCreate(&#39;mobile&#39;);                 // 创建时：仅展示/提交 mobile（price 不存在）\n    $form-&gt;isEdit(&#39;mobile&#39;, &#39;price&#39;);          // 编辑时：展示/提交 mobile + price\n    // $form-&gt;isCreate([&#39;mobile&#39;]);            // 数组写法等价\n    // $form-&gt;isCreate(fn($ctx) =&gt; [&#39;mobile&#39;]);// 回调动态控制，$ctx = [&#39;mode&#39; =&gt; &#39;create&#39;|&#39;edit&#39;]\n});\n\u003c/code>\u003c/pre>\n\u003cp>未声明的场景不限制（全部字段可用）；不传字段时按 \u003ccode>if\u003c/code> 判断语义（返回 \u003ccode>true/false\u003c/code>）。\u003c/p>\n\u003cp>\u003cstrong>严格提交（前端 + 后端双端生效）：\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>场景专属字段 + 白名单外字段即提交范围\u003c/strong>：不渲染、不初始化、不提交；恶意客户端多提交，后端保存前同样剔除，校验规则同步剔除（不会因被剔除的 required 字段报错）。\u003c/li>\n\u003cli>\u003cstrong>disabled 不提交\u003c/strong>：\u003ccode>-&gt;disabled()\u003c/code> / \u003ccode>-&gt;addDisabled()\u003c/code> / \u003ccode>-&gt;editDisabled()\u003c/code> 生效的场景中，字段 UI 禁用且\u003cstrong>不参与提交\u003c/strong>，杜绝「前端禁用、抓包改值」绕过。\u003c/li>\n\u003cli>\u003cstrong>例外\u003c/strong>：\u003ccode>$form-&gt;hidden(&#39;prop&#39;, ...)\u003c/code> 声明的隐藏提交字段始终随表单提交；但它若声明在场景块内，仍只在所属场景提交。\u003c/li>\n\u003cli>条件字段（\u003ccode>-&gt;when()\u003c/code>）要在受限场景使用，应把字段名写进白名单（或用 \u003ccode>if\u003c/code> 包裹）；可见性仍由父字段值在前端实时控制。\u003c/li>\n\u003cli>数组写法的继承式控制器（\u003ccode>formFields()\u003c/code> 数组）可在返回的 config 里自带 \u003ccode>sceneShow: {create: [...], edit: [...]}\u003c/code>，前端同样生效。\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>⚠️ \u003cstrong>三种写法的区别，别搞混\u003c/strong>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需求\u003c/th>\n\u003cth>正确写法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>按场景条件注册字段（\u003cstrong>推荐\u003c/strong>）\u003c/td>\n\u003ctd>\u003ccode>if ($form-&gt;isCreate()) { $form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;required(); }\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Form 级判断\u003c/strong>：块内字段自动「仅该场景」，块外字段共用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某场景\u003cstrong>只\u003c/strong>要这几个字段\u003c/td>\n\u003ctd>\u003ccode>$form-&gt;isCreate(&#39;a&#39;, &#39;b&#39;)\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Form 级白名单\u003c/strong>：列出的才展示/提交，没列的一律不展示不提交（\u003cstrong>列多了反而漏字段\u003c/strong>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>某一个字段\u003c/strong>只在新增 / 只在编辑出现\u003c/td>\n\u003ctd>\u003ccode>$form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;addOnly()\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>字段级\u003c/strong>：\u003ccode>addOnly()\u003c/code> = 仅新增，\u003ccode>editOnly()\u003c/code> = 仅编辑（与 \u003ccode>if\u003c/code> 写法等价，适合不想改结构的场景）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>常见误写：\u003ccode>$form-&gt;text(&#39;password&#39;, &#39;密码&#39;)-&gt;isCreate()\u003c/code> —— \u003ccode>isCreate()/isEdit()\u003c/code> 只存在于 \u003cstrong>Form\u003c/strong> 上，\n挂在 Field 上会抛 \u003ccode>Call to undefined method plugin\\curd\\app\\dsl\\Field::isCreate()\u003c/code>。\n另外白名单语义下「编辑时不含 password」不能写 \u003ccode>$form-&gt;isEdit(&#39;password&#39;)\u003c/code>（那等于编辑只剩 password）。\u003c/p>\n\u003c/blockquote>\n\u003cp>前端行为见 \u003ccode>GenericCurd/index.vue\u003c/code> 的 \u003ccode>resolveFieldForMode\u003c/code>（场景专属字段靠 \u003ccode>modeOnly\u003c/code>）/ \u003ccode>allFormFields\u003c/code>（白名单过滤 \u003ccode>sceneShow\u003c/code>）/ \u003ccode>sanitizeFormData\u003c/code>；后端见 \u003ccode>CurdActionsTrait\u003c/code> 的 \u003ccode>fieldWritableInMode / writableFields / filterWritableFields\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-104\">5.2 点式字段：读写 JSON 列里的子键（\u003ccode>config.api_url\u003c/code>）\u003c/h3>\n\u003cp>表单字段名带 \u003ccode>.\u003c/code> 时，按「根字段是 JSON 列」读写：\u003cstrong>取数\u003c/strong>解根字段 JSON 取子键，\u003cstrong>保存\u003c/strong>合并回根字段以 JSON 存库。典型场景是一张表上用一列 \u003ccode>config\u003c/code>（text/json）存一组配置，而不必拆几十个列。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;config.api_url&#39;, &#39;接口地址&#39;);   // 列表列同样支持点式（根字段自动解码）\n\n$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;name&#39;, &#39;名称&#39;)-&gt;required();\n    $form-&gt;text(&#39;config.api_url&#39;, &#39;接口地址&#39;)-&gt;required()-&gt;placeholder(&#39;https://api.example.com&#39;);\n    $form-&gt;text(&#39;config.api_token&#39;, &#39;接口令牌&#39;);\n    $form-&gt;number(&#39;config.timeout&#39;, &#39;超时(秒)&#39;)-&gt;min(1)-&gt;max(600);\n});\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>点式写法对任意字段方法都成立\u003c/strong>（\u003ccode>text\u003c/code> / \u003ccode>textarea\u003c/code> / \u003ccode>number\u003c/code> / \u003ccode>select\u003c/code> / \u003ccode>radio\u003c/code> / \u003ccode>switch\u003c/code> / \u003ccode>date\u003c/code> / \u003ccode>datetime\u003c/code> / \u003ccode>tags\u003c/code> / \u003ccode>remote\u003c/code> / \u003ccode>password\u003c/code> ……）——点式只改「prop 的名字」，与字段类型无关，各类型的取值/回显/校验规则完全保持原行为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;select(&#39;config.platform&#39;, &#39;接入平台&#39;)-&gt;options([1 =&gt; &#39;微信&#39;, 2 =&gt; &#39;支付宝&#39;, 3 =&gt; &#39;银联&#39;])-&gt;default(2);\n$form-&gt;switch(&#39;config.enabled&#39;, &#39;启用开关&#39;);                 // 布尔值入库\n$form-&gt;datetime(&#39;config.sync_at&#39;, &#39;同步时间&#39;);               // &#39;Y-m-d H:i:s&#39; 字符串入库\n$form-&gt;tags(&#39;config.scopes&#39;, &#39;权限范围&#39;);                    // 数组入库（JSON 数组）\n\u003c/code>\u003c/pre>\n\u003cp>列方法同理：\u003ccode>$grid-&gt;column(&#39;config.platform&#39;, &#39;接入平台&#39;)-&gt;map([...])\u003c/code>、\u003ccode>-&gt;datetime()\u003c/code>、\u003ccode>-&gt;switch()\u003c/code> 等全部可用。\u003c/p>\n\u003cp>行为细则：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>环节\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>列表 / 回显\u003c/td>\n\u003ctd>后端把根字段（\u003ccode>config\u003c/code>）JSON 解码后，写字面键 \u003ccode>config.api_url\u003c/code> 的扁平值；前端 el-table 与表单都能按字面 key 取到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增\u003c/td>\n\u003ctd>只提交了点式字段时，以「编辑读库现值 → 空数组」为基础值合并，未提交的子键原样保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编辑\u003c/td>\n\u003ctd>同上：合并而非覆盖，\u003cstrong>没出现在表单里的子键不会丢\u003c/strong>；显式提交空串 = 真的写空值（清空语义）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验\u003c/td>\n\u003ctd>前端\u003cstrong>同时\u003c/strong>写字面键与嵌套路径（\u003ccode>setFieldValue\u003c/code> 双写 + \u003ccode>initFormData\u003c/code>/\u003ccode>handleEdit\u003c/code> 末尾 \u003ccode>syncDotNested\u003c/code> 镜像），el-form-item 取值 (\u003ccode>lodash.get(formData,&#39;config.x&#39;)\u003c/code>) 天然命中字面键，\u003ccode>required\u003c/code> 等规则正常生效。⚠️ \u003cstrong>不要给校验规则挂 async-validator 的 \u003ccode>transform\u003c/code>\u003c/strong>：4.2.5 下带 \u003ccode>transform\u003c/code> 的规则会让 \u003ccode>required\u003c/code> 误报「不能为空」，即便字段有值（详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"10\" data-doc-anchor=\"h-179\">16 排错 §4\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导出\u003c/td>\n\u003ctd>导出值按路径从行数据取，与列表展示一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>前端提交的就是\u003cstrong>字面键\u003c/strong>（\u003ccode>formData[&#39;config.api_url&#39;]\u003c/code>，JS 对象键允许带点）；合并、解码全在后端（\u003ccode>CurdActionsTrait::mergeDotFields\u003c/code> / \u003ccode>CurdListTrait::expandDotColumns\u003c/code>）。\u003c/li>\n\u003cli>根字段建议在表里建成 \u003ccode>text\u003c/code>（或 json）列；模型上有 \u003ccode>json\u003c/code>/\u003ccode>array\u003c/code> cast 时合并结果交回数组由 Eloquent 编码，否则后端 \u003ccode>json_encode(..., JSON_UNESCAPED_UNICODE)\u003c/code>。\u003c/li>\n\u003cli>路径中的\u003cstrong>数字段\u003c/strong>（如 \u003ccode>config.list.0\u003c/code>）按数组下标处理，保证 JSON 输出是数组而非 \u003ccode>{&quot;0&quot;:...}\u003c/code>；各字段类型的值按前端原样入库（\u003ccode>switch\u003c/code> 存布尔、\u003ccode>datetime\u003c/code> 存字符串、\u003ccode>select\u003c/code> 存选项 value）。\u003c/li>\n\u003cli>\u003cstrong>展开范围\u003c/strong>：grid 点式列 ∪ 表单点式字段（add/edit）∪ 详情里显式声明的点式字段 ∪ 动态配置（curd_configs）里的点式 prop —— 任一处声明过，列表 / 编辑 / 详情都能取到值。\u003c/li>\n\u003cli>搜索（\u003ccode>$filter\u003c/code>）\u003cstrong>不\u003c/strong>支持点式：JSON 列内的子键检索请用 \u003ccode>-&gt;where()\u003c/code> 自定义闭包。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-105\">5.3 JSON 组件：\u003ccode>$form-&gt;json()\u003c/code> 键值对编辑器\u003c/h3>\n\u003cp>新增 \u003ccode>json\u003c/code> 表单组件：用户自由增删键值对，保存时生成 JSON 字符串存入数据库（列类型 text/json）。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;name&#39;, &#39;名称&#39;)-&gt;required();\n    $form-&gt;json(&#39;extra&#39;, &#39;扩展配置&#39;)-&gt;help(&#39;键值对形式保存到 extra 列（JSON），值按字符串存储&#39;);\n});\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>前端是行式编辑器（键 / 值 / 删除 + 「+ 添加一项」），空键行不提交；\u003cstrong>空结果提交 \u003ccode>&#39;{}&#39;\u003c/code>\u003c/strong>（显式清空，区别于「不提交该字段」）。\u003c/li>\n\u003cli>编辑回显：字符串值 \u003ccode>JSON.parse\u003c/code> 成行；解析失败时保留原文作为单行值（不丢数据）。\u003c/li>\n\u003cli>与点式字段同表单互不干扰：JSON 组件提交的是\u003cstrong>根字段\u003c/strong>（\u003ccode>extra\u003c/code>），点式字段提交的是\u003cstrong>字面键\u003c/strong>（\u003ccode>config.api_url\u003c/code>），后端先合并点式再走各自落库逻辑。\u003c/li>\n\u003cli>值一律按字符串存储；需要数字/布尔请在业务端消费时转换（或改用点式字段 + \u003ccode>number\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-106\">5.4 查看详情（\u003ccode>$grid-&gt;setDetail()\u003c/code>）：默认「列表列 ∪ 表单字段」\u003c/h3>\n\u003cp>行操作里的「查看」打开只读详情弹窗（按钮由 \u003ccode>options([&#39;view&#39; =&gt; true])\u003c/code> 控制，默认开）。\u003c/p>\n\u003cp>\u003cstrong>不写任何配置时，详情字段 = 列表列 ∪ 表单字段\u003c/strong>（按 \u003ccode>prop\u003c/code> 去重，列在前）——所以表单里声明的点式字段（\u003ccode>config.api_url\u003c/code> / \u003ccode>config.timeout\u003c/code> …）在详情里同样可见，不会出现「表单能编辑、详情看不到」。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;form(function (Form $form) {\n    $form-&gt;text(&#39;config.api_url&#39;, &#39;接口地址&#39;);\n    $form-&gt;switch(&#39;config.enabled&#39;, &#39;启用开关&#39;);\n});\n\n// 想自定义字段顺序 / 分组时再声明；一旦声明就以此为准，不再并入表单字段\n$grid-&gt;setDetail([\n    [&#39;group&#39; =&gt; &#39;基础信息&#39;, &#39;fields&#39; =&gt; [\n        [&#39;prop&#39; =&gt; &#39;name&#39;, &#39;label&#39; =&gt; &#39;名称&#39;],\n        [&#39;prop&#39; =&gt; &#39;config.api_url&#39;, &#39;label&#39; =&gt; &#39;接口地址&#39;],\n    ]],\n    [&#39;group&#39; =&gt; &#39;运行配置&#39;, &#39;fields&#39; =&gt; [\n        [&#39;prop&#39; =&gt; &#39;config.timeout&#39;, &#39;label&#39; =&gt; &#39;超时(秒)&#39;],\n        [&#39;prop&#39; =&gt; &#39;config.enabled&#39;, &#39;label&#39; =&gt; &#39;启用开关&#39;],\n    ]],\n]);\n\u003c/code>\u003c/pre>\n\u003cp>要点：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>默认字段\u003c/td>\n\u003ctd>列表列（\u003ccode>showInView !== false\u003c/code>）在前，表单字段在后；跳过 \u003ccode>hidden\u003c/code> 字段与「仅新增」字段（\u003ccode>modeOnly === &#39;add&#39;\u003c/code>，如创建时才填的密码）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点式字段\u003c/td>\n\u003ctd>与列表同机制：后端把根字段解 JSON 后写字面键扁平值，详情直接读 \u003ccode>row[&#39;config.api_url&#39;]\u003c/code>；\u003cstrong>显式 \u003ccode>setDetail()\u003c/code> 里声明的点式 prop 也会纳入展开清单\u003c/strong>，不会取不到值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只读渲染\u003c/td>\n\u003ctd>复用列表单元格渲染器，但转成只读形态：\u003ccode>switch\u003c/code> → 「开 / 关」文字（不再渲染可点开关）；\u003ccode>select\u003c/code> / \u003ccode>radio\u003c/code> 的 \u003ccode>options\u003c/code> 自动转 \u003ccode>map\u003c/code> → 显示文案而非裸值；\u003ccode>image\u003c/code> / \u003ccode>date\u003c/code> / \u003ccode>datetime\u003c/code> 保留专用单元格（缩略图 / 日期格式化）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭详情\u003c/td>\n\u003ctd>\u003ccode>options([&#39;view&#39; =&gt; false])\u003c/code>（旧写法用 \u003ccode>features\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧数组写法\u003c/td>\n\u003ctd>同一个 \u003ccode>detail()\u003c/code> 方法返回字段数组（不分组），语义与 Grid DSL 一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"h-107\">6. 自定义操作 Action（行级/批量/全局/弹窗）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;addAction(new MrOrderRetryAction());          // 行级（默认）\n$grid-&gt;addAction(new MrOrderBatchRetryAction());     // 批量：Action 内 -&gt;batch(true)\n// $grid-&gt;addAction(…-&gt;global(true))                 // 全局按钮：工具栏右侧\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>不建 Action 类时的三个快捷方法\u003c/strong>（逻辑写在控制器里，够用且最省事）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 行级按钮 → 控制器 actionAudit(Request $request)\n$grid-&gt;action(&#39;audit&#39;, &#39;审核&#39;)-&gt;icon(&#39;Check&#39;)-&gt;confirm(&#39;确定审核该记录？&#39;)-&gt;handler(&#39;audit&#39;);\n\n// 批量按钮（勾选行后可用）＝ action($name,$label)-&gt;batch(true)\n$grid-&gt;batAction(&#39;batch-on&#39;, &#39;批量上架&#39;)-&gt;icon(&#39;Top&#39;);\n// 控制器 actionBatchOn(Request $request) 里读 $request-&gt;post(&#39;ids&#39;)\n\n// 全局 Excel 导入按钮 ＝ action($name,$label)-&gt;icon(&#39;Upload&#39;)-&gt;type(&#39;warning&#39;)\n//                            -&gt;global(true)-&gt;form(fn($f) =&gt; $f-&gt;excel(&#39;file&#39;,&#39;Excel 文件&#39;))\n$grid-&gt;importAction();                          // 默认 name=import / label=导入\n$grid-&gt;importAction(&#39;import&#39;, &#39;导入订单&#39;);        // 也可自定义\n// 控制器 actionImport(Request $request) 里读 $this-&gt;excelRows(&#39;file&#39;)\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>-&gt;handler(&#39;audit&#39;)\u003c/code> 表示「不实现 Action 子类，交给控制器的 \u003ccode>actionAudit()\u003c/code>」；方法名由按钮名推导\n（\u003ccode>batch-on\u003c/code> → \u003ccode>actionBatchOn\u003c/code>）。\u003cstrong>只在 Action 子类自己实现了 \u003ccode>handle()\u003c/code> 时才走子类\u003c/strong>，\n链式 \u003ccode>action()\u003c/code> 一律回退到控制器方法（否则会抛「Action xxx 未实现 handle」）。\u003c/p>\n\u003cp>用 \u003ccode>make:curd --action / --bat-action / --import-action\u003c/code> 可以连按钮配置和这三个方法骨架一起生成，\n见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-60\">快速开始 §6\u003c/a>。\u003c/p>\n\u003cp>Action 类（放 \u003ccode>app/controller/admin/api/actions/\u003c/code>）用 \u003ccode>init()\u003c/code> 声明外观、\u003ccode>handle()\u003c/code> 写业务：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">class MrOrderQueryStatusAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;query-status&#39;)-&gt;label(&#39;查询充值状态&#39;)-&gt;type(&#39;primary&#39;)\n            -&gt;confirm(&#39;确定要查询吗？将实时请求充值平台接口&#39;)\n            -&gt;show(function ($row) {                    // 按行控制是否显示\n                return in_array((int)$row-&gt;status, [MobileRechargeOrder::STATUS_DOING, MobileRechargeOrder::STATUS_FAILED], true);\n            });\n    }\n\n    public function handle(Request $request)\n    {\n        $row = $this-&gt;model();                          // 框架注入的当前行模型（行级 action）\n        if (!$row) return $this-&gt;error(&#39;订单不存在&#39;, 404);\n        // …… 业务逻辑（调平台 SDK 等）……\n        return $this-&gt;ok(&#39;操作成功&#39;);                   // 成功/失败统一用基类辅助方法返回\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>外观链式方法：\u003ccode>name/label/icon/type/confirm/form/modal/jump/api(url,method)/handler/params/field/show/successMsg/dialogTitle/dialogWidth/inline/batch/global/roles/permission\u003c/code>。\u003ccode>batch(true)\u003c/code> 的按钮出现在批量工具栏（需勾选行），handle 内取勾选的 id：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 批量 action 的 handle（勾选的 id 在请求里）\npublic function handle(Request $request)\n{\n    $ids = $request-&gt;post(&#39;ids&#39;, []);\n    $models = MobileRechargeOrder::query()-&gt;whereIn(&#39;id&#39;, $ids)-&gt;get();\n    // …… 逐条处理 ……\n    return $this-&gt;ok(&#39;批量重试成功，处理条数&#39; . $count);\n}\n\u003c/code>\u003c/pre>\n\u003cp>要点：\u003ccode>$this-&gt;model()\u003c/code> 是框架按请求 id 注入的\u003cstrong>当前行\u003c/strong>模型（未命中为 null），行级用；批量用 \u003ccode>$request-&gt;post(&#39;ids&#39;)\u003c/code>；\u003ccode>$this-&gt;row(&#39;字段&#39;)\u003c/code> 只在 \u003ccode>init()\u003c/code> 的闭包（show 等）里取当前渲染行数据；基类 \u003ccode>handle()\u003c/code> 未覆盖时会回退到控制器上的 \u003ccode>action{Name}(Request $request)\u003c/code>。\u003c/p>\n\u003ch3 id=\"h-108\">6.1 全局/批量按钮 + 表单弹窗（\u003ccode>global()/batch()\u003c/code> × \u003ccode>form()\u003c/code>）\u003c/h3>\n\u003cp>行级、批量、全局按钮都支持 \u003ccode>-&gt;form(fn($form){...})\u003c/code> 弹窗表单：点击按钮 → 弹出任意 Form DSL 字段的弹窗 → 用户填写/选文件 → 点确认 → 请求进 \u003ccode>handle(Request $request)\u003c/code>，表单值在 \u003ccode>$request-&gt;post()\u003c/code> 里。典型场景：列表工具栏「导入」按钮，点开弹窗选 Excel 文件，确认后处理。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// ① 全局导入按钮（工具栏，与新增/导出同级）\n$grid-&gt;addAction(new ImportOrdersAction());\n\nclass ImportOrdersAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;import&#39;)-&gt;label(&#39;导入订单&#39;)-&gt;icon(&#39;Upload&#39;)-&gt;type(&#39;primary&#39;)\n            -&gt;global(true)                                   // 工具栏全局按钮；批量按钮则用 -&gt;batch(true)\n            -&gt;dialogTitle(&#39;导入订单&#39;)\n            -&gt;dialogWidth(&#39;520px&#39;)\n            -&gt;form(function ($form) {                        // 弹窗内任意 Form DSL 字段\n                $form-&gt;file(&#39;import_file&#39;, &#39;选择文件&#39;)\n                    -&gt;rules(&#39;required&#39;);                     // 必填校验复用表单规则\n                $form-&gt;switch(&#39;skip_exists&#39;, &#39;跳过已存在&#39;);\n            });\n    }\n\n    public function handle(Request $request)\n    {\n        $file = $request-&gt;post(&#39;import_file&#39;);   // 已通过 /api/upload 上传后的文件相对路径\n        $skipExists = (bool)$request-&gt;post(&#39;skip_exists&#39;);\n        // 全局按钮附带当前搜索条件：$request-&gt;post(&#39;query&#39;, [])\n        // 批量按钮附带勾选主键：$request-&gt;post(&#39;ids&#39;, [])\n        // …… 解析文件、逐行入库 ……\n        return $this-&gt;ok(&#39;导入成功，共处理 &#39; . $count . &#39; 条&#39;);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>行为说明：\u003c/p>\n\u003cul>\n\u003cli>表单字段支持全部 Form DSL 能力（file/image/remote/when/isCreate 等）；文件类字段先走 \u003ccode>/api/upload\u003c/code> 上传拿到路径，\u003ccode>handle\u003c/code> 里拿到的就是路径字符串。\u003c/li>\n\u003cli>\u003cstrong>图片 \u003ccode>image\u003c/code> 字段只收 jpg / jpeg / png\u003c/strong>：前端选择器 \u003ccode>accept=&quot;.jpg,.jpeg,.png&quot;\u003c/code> + 上传前按扩展名/MIME 硬校验，服务端 \u003ccode>/api/upload/image\u003c/code> 也按真实 MIME 只放行 jpeg/png（gif/webp/bmp 会被拒）。需要别的格式请改用通用 \u003ccode>file\u003c/code> 字段（\u003ccode>/api/upload\u003c/code>，仅限 5MB 内不限类型）。\u003c/li>\n\u003cli>\u003ccode>global(true)\u003c/code> 提交时自动附带 \u003ccode>{ query: 当前搜索条件 }\u003c/code>；\u003ccode>batch(true)\u003c/code> 自动附带 \u003ccode>{ ids: 勾选主键 }\u003c/code>；行级自动附带 \u003ccode>{ id: 当前行主键 }\u003c/code>（\u003ccode>-&gt;field()\u003c/code> 可改字段名）。\u003c/li>\n\u003cli>无 \u003ccode>-&gt;api()\u003c/code> 时自动路由到 \u003ccode>/api/curd/model/{model}/action/{name}\u003c/code>；弹窗提交失败（接口返回错误）时弹窗保持打开，便于修改后重试。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-109\">6.2 Excel 导入字段 \u003ccode>$form-&gt;excel()\u003c/code>（multipart 直传 + 自动解析）\u003c/h3>\n\u003cp>Excel 导入推荐用专用 \u003ccode>excel\u003c/code> 字段：\u003cstrong>不走 \u003ccode>/api/upload\u003c/code>\u003c/strong>，本地选文件后以 multipart 表单把二进制直接提交到 action 接口，服务端自动解析，\u003ccode>handle\u003c/code> 里直接拿解析好的数据行。\u003c/p>\n\u003cblockquote>\n\u003cp>只要「导入」这一个按钮时不用建 Action 类：\u003ccode>$grid-&gt;importAction()\u003c/code> 一行即可（见 §6 快捷方法），\n逻辑写在控制器 \u003ccode>actionImport()\u003c/code> 里。\u003c/p>\n\u003c/blockquote>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;addAction(new ImportOrdersAction());\n\nclass ImportOrdersAction extends Action\n{\n    protected function init()\n    {\n        $this-&gt;name(&#39;import&#39;)-&gt;label(&#39;导入订单&#39;)-&gt;global(true)\n            -&gt;form(fn($form) =&gt; $form-&gt;excel(&#39;import_file&#39;, &#39;选择文件&#39;)      // 默认 accept .xlsx/.csv，必选\n                                     -&gt;options([&#39;maxRows&#39; =&gt; 10000, &#39;sheet&#39; =&gt; 1])\n            );\n    }\n\n    public function handle(Request $request)\n    {\n        $rows = $this-&gt;excelRows(&#39;import_file&#39;);  // 首行作表头：[[&#39;手机号&#39; =&gt; &#39;138...&#39;, &#39;金额&#39; =&gt; &#39;10&#39;], ...]\n        $info = $this-&gt;excelInfo(&#39;import_file&#39;);  // [&#39;count&#39; =&gt; 2, &#39;file_name&#39; =&gt; &#39;xx.xlsx&#39;, &#39;sheets&#39; =&gt; 1]\n        // …… 逐行业务处理 ……\n        return $this-&gt;ok(&#39;导入成功，共解析 &#39; . $info[&#39;count&#39;] . &#39; 行&#39;);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>excel($prop, $label, $options)\u003c/code> 的 \u003ccode>$options\u003c/code>：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>required\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>前端必选校验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>accept\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.xlsx,.csv\u003c/code>\u003c/td>\n\u003ctd>可选文件格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>maxRows\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>5000\u003c/code>\u003c/td>\n\u003ctd>最大解析行数（不含表头，超出抛异常）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sheet\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>解析第几个工作表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>解析规则\u003c/strong>（内置轻量解析器 \u003ccode>ExcelParser\u003c/code>，零 composer 依赖，需 PHP \u003ccode>zip\u003c/code> + \u003ccode>SimpleXML\u003c/code> 扩展）：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>.xlsx\u003c/code>：Office Open XML，覆盖 sharedStrings / inlineStr / 数字 / 公式结果字符串；\u003ccode>.csv\u003c/code>：自动识别 UTF-8 BOM 与 GBK 编码\u003c/li>\n\u003cli>首行为表头（空表头自动用 A/B/C 兜底），每行输出为 \u003ccode>[&#39;表头&#39; =&gt; 值]\u003c/code> 关联数组，整行为空自动跳过\u003c/li>\n\u003cli>日期单元格读出的是 Excel 序列数字（如 \u003ccode>45210.5\u003c/code>），需要日期请用文本格式存储或业务侧自行换算\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>取用方式（双写法同一 API）\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>Action 类写法：\u003ccode>handle()\u003c/code> 内 \u003ccode>$this-&gt;excelRows(&#39;prop&#39;)\u003c/code> / \u003ccode>$this-&gt;excelInfo(&#39;prop&#39;)\u003c/code>\u003c/li>\n\u003cli>数组式继承控制器（\u003ccode>actions(): array\u003c/code> 里写 \u003ccode>&#39;type&#39; =&gt; &#39;excel&#39;\u003c/code> 字段）：\u003ccode>actionXxx()\u003c/code> 内同样 \u003ccode>$this-&gt;excelRows(&#39;prop&#39;)\u003c/code> / \u003ccode>$this-&gt;excelInfo(&#39;prop&#39;)\u003c/code>（trait 提供）\u003c/li>\n\u003cli>未上传文件时 \u003ccode>excelRows()\u003c/code> 返回空数组，业务自行判断报错\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"h-110\">7. 列表头汇总条 \u003ccode>grid()-&gt;summary(callable)\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;summary(function ($query) {\n    $q = clone $query;                                  // $query = 当前筛选后的列表查询，随筛选自动刷新\n    $money = (float)(clone $q)-&gt;where(&#39;status&#39;, 2)-&gt;sum(&#39;money&#39;);\n    return &#39;&lt;span&gt;成功单合计：&lt;b&gt;￥&#39; . number_format($money, 2) . &#39;&lt;/b&gt;&lt;/span&gt;&#39;; // 返回 HTML\n});\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"h-111\">8. 其它常用开关（含导出）\u003c/h2>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;disableCreate() / disableEdit() / disableDelete() / disableView()\n     / disableExport() / disableBatchDelete();      // 按需关能力\n$grid-&gt;setDialogWidth(&#39;700px&#39;);                     // 弹窗宽\n$grid-&gt;setCustomCss($css) / setCustomJs($js);       // 页面注入 css/js\n$grid-&gt;setRowStyle(fn($row) =&gt; [...]) / setRowClass(...); // 行样式\n$grid-&gt;setRules([...]);                             // 提交前校验（参考后端 rules 格式）\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>导出\u003c/strong>：工具栏「导出」下拉（当前页 / 当前选择 / 全部）为框架同步导出，随当前筛选条件导出 CSV，无需额外配置（不实现异步导出任务）。\u003c/p>\n\u003cp>\u003cstrong>导出哪几列\u003c/strong>（只收窄、不放宽，最终列 = 三者交集，顺序始终按 grid 定义）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>口径\u003c/th>\n\u003cth>写法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>跟随用户列设置（默认）\u003c/td>\n\u003ctd>无需配置\u003c/td>\n\u003ctd>前端把「列配置」当前勾选的 prop 以 \u003ccode>_columns=prop1,prop2\u003c/code> 随导出请求下发，后端取交集。\u003ccode>-&gt;hidden()\u003c/code> 列默认不在勾选集合里，\u003cstrong>所以不再进 CSV\u003c/strong>；用户手动在「列配置」里勾上，它就跟着导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定白名单（逐页硬约束）\u003c/td>\n\u003ctd>控制器里 \u003ccode>protected function exportColumns(): array { return [&#39;id&#39;,&#39;money&#39;,&#39;channel&#39;]; }\u003c/code>\u003c/td>\n\u003ctd>开发者口径，优先级最高；与用户勾选取交集，未勾选的不会出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不做限制\u003c/td>\n\u003ctd>以上都不涉及\u003c/td>\n\u003ctd>接口直连（不带 \u003ccode>_columns\u003c/code>）或参数解析为空时按 grid 全列导出（含 \u003ccode>hidden\u003c/code>），保持历史行为\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>无 grid 配置的动态 CURD 页会回退到「表字段」，该回退路径同样受 \u003ccode>_columns\u003c/code> 约束。\u003c/p>\n\u003cp>\u003cstrong>导出文件名\u003c/strong>：默认 \u003ccode>{页面标题}_{YmdHis}.csv\u003c/code>，标题与 \u003ccode>/api/curd/config\u003c/code> 的 \u003ccode>data.title\u003c/code> 同源\n（控制器 \u003ccode>$title\u003c/code> → 落库 \u003ccode>curd_configs.title\u003c/code> → 表名兜底）。响应同时给 \u003ccode>filename\u003c/code>（ASCII 兜底，\n中文剥空后退回表名）与 \u003ccode>filename*\u003c/code>（UTF-8，现代浏览器优先）两个头，前端 blob 下载名按同一规则拼。\u003c/p>\n\u003cp>\u003cstrong>单次导出上限\u003c/strong>：\u003ccode>export_max_rows\u003c/code>（默认 \u003ccode>100000\u003c/code>，\u003ccode>&lt;= 0\u003c/code> 不限制），超过\u003cstrong>直接报错\u003c/strong>不做静默截断：\n\u003ccode>{&quot;code&quot;:400,&quot;msg&quot;:&quot;本次将导出 N 条，超过单次导出上限 M 条…&quot;}\u003c/code>。按实际命中条数校验\n（当前页 \u003ccode>min(总数, size)\u003c/code> / 选中条数 / 筛选后总数）；前端嗅探响应类型，拿到 JSON 就当错误提示而非下载。\n配置项见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>。\u003c/p>\n\u003ch2 id=\"h-112\">9. 字段标题国际化 \u003ccode>__()\u003c/code>（symfony/translation）\u003c/h2>\n\u003cp>字段标题统一走翻译函数 \u003ccode>__()\u003c/code>（\u003ccode>trans($id, [], &#39;fields&#39;)\u003c/code> 的别名），key 写英文短语，中文在语言文件里维护：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;column(&#39;created_at&#39;, __(&#39;Created at&#39;));   // 显示「创建时间」\n$grid-&gt;column(&#39;id&#39;, __(&#39;ID&#39;));                   // 显示「ID」\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>别名\u003c/td>\n\u003ctd>\u003ccode>__($id, $replace = [], $locale = null)\u003c/code> ≡ \u003ccode>trans($id, $replace, &#39;fields&#39;, $locale)\u003c/code>（\u003ccode>plugin/curd/app/functions.php\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>domain\u003c/td>\n\u003ctd>固定 \u003ccode>fields\u003c/code>（即语言文件名 \u003ccode>fields.php\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>插件内置\u003c/td>\n\u003ctd>\u003ccode>plugin/curd/resource/translations/zh_CN/fields.php\u003c/code> —— 常用英文短语→中文（\u003ccode>&#39;Created at&#39; =&gt; &#39;创建时间&#39;\u003c/code> 等），安装时由 \u003ccode>Install::ensureTranslations()\u003c/code> 复制到宿主（已存在不覆盖）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主覆盖/补充\u003c/td>\n\u003ctd>\u003ccode>resource/translations/zh_CN/fields.php\u003c/code>（宿主根），同名 key 优先于插件内置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加载顺序\u003c/td>\n\u003ctd>插件 \u003ccode>config/translation.php\u003c/code> 配两段 path：先插件内置、后宿主，宿主缺 key 自动落到插件默认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未命中\u003c/td>\n\u003ctd>原样返回英文短语（如 \u003ccode>&#39;Created at&#39;\u003c/code>），不会报错、不会打崩页面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成器\u003c/td>\n\u003ctd>\u003ccode>make:curd\u003c/code> 生成的控制器标题已统一 \u003ccode>__()\u003c/code>（\u003ccode>created_at\u003c/code> → \u003ccode>__(&#39;Created at&#39;)\u003c/code>），见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"2\" data-doc-anchor=\"h-60\">快速开始 §6\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>注意：\u003ccode>__()\u003c/code> 依赖「当前请求所属插件」= curd 的翻译配置（webman 按 \u003ccode>request()-&gt;plugin\u003c/code> 取\n\u003ccode>config(&#39;plugin.curd.translation&#39;)\u003c/code>）。宿主如果没有该配置文件，插件请求会因缺 \u003ccode>locale\u003c/code> 报错——\n插件已内置 \u003ccode>plugin/curd/config/translation.php\u003c/code>，无需宿主再配。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"h-113\">10. 自定义 JS \u003ccode>setCustomJs()\u003c/code> 与公共 API \u003ccode>window.curd\u003c/code>\u003c/h2>\n\u003cp>页面级注入一段 JS，用来写本页专属逻辑；\u003cstrong>不需要再重复实现\u003c/strong>取表单、弹窗、请求这些常见操作。\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$grid-&gt;setCustomJs(&lt;&lt;&lt;&#39;JS&#39;\nfunction hello() {\n  curd.message.success(&#39;hello&#39;)\n}\nJS);\n$grid-&gt;setCustomCss(&#39;.my-tip { color: #e6a23c; }&#39;);\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-114\">10.1 执行方式（为什么 help 里的 \u003ccode>@click\u003c/code> 能调到函数）\u003c/h3>\n\u003cp>customJs 以\u003cstrong>经典 \u003ccode>&lt;script&gt;\u003c/code>\u003c/strong> 注入（不是包在函数里），因此：\u003c/p>\n\u003cul>\n\u003cli>顶层 \u003ccode>function hello(){}\u003c/code> / \u003ccode>var x\u003c/code> 会挂到\u003cstrong>全局\u003c/strong>，\u003ccode>help()\u003c/code> 里的 \u003ccode>@click=&quot;hello()&quot;\u003c/code> 可直接调用；\u003c/li>\n\u003cli>也可以显式 \u003ccode>window.hello = () =&gt; {}\u003c/code>；\u003c/li>\n\u003cli>只在该段代码\u003cstrong>内容变化\u003c/strong>时重新注入，避免 \u003ccode>const\u003c/code> 重复声明报错（建议用 \u003ccode>function\u003c/code> / \u003ccode>var\u003c/code> / \u003ccode>window.x=\u003c/code>）；\u003c/li>\n\u003cli>注入前会先挂好 \u003ccode>window.curd\u003c/code>，脚本里可直接用。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-115\">10.2 \u003ccode>help()\u003c/code> 里写事件\u003c/h3>\n\u003cp>\u003ccode>Field::help()\u003c/code> 的内容用 \u003ccode>v-html\u003c/code> 渲染，\u003cstrong>不会被 Vue 编译\u003c/strong>，所以 \u003ccode>@click\u003c/code> 由前端事件委托执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">$form-&gt;text(&#39;config.api_token&#39;, __(&#39;Api token&#39;))\n    -&gt;help(&#39;留空沿用旧值 · &lt;span @click=&quot;fillDemoToken()&quot; style=&quot;cursor:pointer;color:var(--el-color-primary)&quot;&gt;填入示例&lt;/span&gt;&#39;);\n\u003c/code>\u003c/pre>\n\u003cp>支持的写法：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>@click=&quot;fn()&quot;\u003c/code> / \u003ccode>@click=&quot;fn($event)&quot;\u003c/code>\u003c/td>\n\u003ctd>调全局函数，\u003ccode>$event\u003c/code> 为原生事件；\u003ccode>this\u003c/code> 为被点元素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@click.stop\u003c/code> / \u003ccode>.prevent\u003c/code> / \u003ccode>.self\u003c/code> / \u003ccode>.once\u003c/code>\u003c/td>\n\u003ctd>常用修饰符均支持（写在属性名上，与 Vue 一致）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>v-on:click=&quot;fn()&quot;\u003c/code>\u003c/td>\n\u003ctd>等价写法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>onclick=&quot;fn()&quot;\u003c/code>\u003c/td>\n\u003ctd>原生内联事件，同样可用（全局函数已存在）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;span class=&quot;content-click&quot;&gt;文本&lt;/span&gt;\u003c/code>\u003c/td>\n\u003ctd>原有能力：点击把文本回填到当前字段\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-116\">10.3 公共 API \u003ccode>window.curd\u003c/code>\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分组\u003c/th>\n\u003cth>方法 / 属性\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>状态（只读）\u003c/td>\n\u003ctd>\u003ccode>curd.config\u003c/code>、\u003ccode>curd.loading\u003c/code>、\u003ccode>curd.tableData\u003c/code>、\u003ccode>curd.pagination\u003c/code>、\u003ccode>curd.searchForm\u003c/code>、\u003ccode>curd.selectedRows\u003c/code>、\u003ccode>curd.dialogVisible\u003c/code>、\u003ccode>curd.dialogMode\u003c/code>、\u003ccode>curd.formData\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表单\u003c/td>\n\u003ctd>\u003ccode>getFormData()\u003c/code>（深拷贝）、\u003ccode>setFormData(patch)\u003c/code>、\u003ccode>resetForm()\u003c/code>、\u003ccode>validateForm()\u003c/code>、\u003ccode>submitForm()\u003c/code>、\u003ccode>getFormRef()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>弹窗\u003c/td>\n\u003ctd>\u003ccode>openAdd()\u003c/code>、\u003ccode>openEdit(row)\u003c/code>、\u003ccode>openView(row)\u003c/code>、\u003ccode>closeDialog()\u003c/code>、\u003ccode>closeView()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列表\u003c/td>\n\u003ctd>\u003ccode>refresh()\u003c/code> / \u003ccode>reload()\u003c/code>、\u003ccode>search(patch?)\u003c/code>、\u003ccode>resetSearch()\u003c/code>、\u003ccode>getSelection()\u003c/code>、\u003ccode>clearSelection()\u003c/code>、\u003ccode>toggleRowSelection(row, selected)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提示\u003c/td>\n\u003ctd>\u003ccode>curd.message.success/error/warning/info(msg)\u003c/code>、\u003ccode>curd.confirm(msg, title?)\u003c/code>、\u003ccode>curd.alert(...)\u003c/code>、\u003ccode>curd.prompt(...)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求\u003c/td>\n\u003ctd>\u003ccode>curd.get(url, params)\u003c/code>、\u003ccode>curd.post(url, data)\u003c/code>、\u003ccode>curd.put(url, data)\u003c/code>、\u003ccode>curd.del(url, params)\u003c/code>、\u003ccode>curd.request\u003c/code>（原实例）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具\u003c/td>\n\u003ctd>\u003ccode>curd.openUrl(url)\u003c/code>、\u003ccode>curd.copyText(text)\u003c/code>、\u003ccode>curd.$nextTick(fn)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>请求走\u003cstrong>与内部同一套 axios 实例\u003c/strong>：自动带 token、走接口加密、统一错误提示，无需自己处理。\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">// 例：表单里改一个值 + 提示\ncurd.setFormData({ &#39;config.api_token&#39;: &#39;demo-&#39; + Date.now() })\ncurd.message.success(&#39;已填入&#39;)\n\n// 例：确认后调接口并刷新列表\nconst ok = await curd.confirm(&#39;确定同步吗？&#39;).catch(() =&gt; false)\nif (ok) {\n  await curd.post(&#39;/api/curd/model/MyTest/sync&#39;, { id: curd.getFormData().id })\n  curd.refresh()\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>兼容：旧名 \u003ccode>window.__curd\u003c/code> 仍然可用（与 \u003ccode>window.curd\u003c/code> 是同一个对象）；旧版的 \u003ccode>__curd.loadData/handleAdd/handleSearch/handleReset\u003c/code> 也已保留为 \u003ccode>curd.refresh/openAdd/search/resetSearch\u003c/code> 的等价方法。\u003c/p>\n\u003c/blockquote>\n"},{"file":"12-菜单与权限.md","title":"菜单 · 权限 · 页面入口","section":"guide","sectionName":"使用指南","mtime":"2026/10/18 08:06:55","headings":[{"depth":2,"text":"1. 菜单与页面入口","id":"h-118"},{"depth":2,"text":"2. 权限被拒不泄露内部结构（安全约定）","id":"h-119"},{"depth":2,"text":"3. 新建菜单「一键生成权限」","id":"h-120"},{"depth":2,"text":"4. 菜单行内「快速创建权限」","id":"h-121"},{"depth":2,"text":"5. URL 里只能传「已注册模型名」，猜不到别的表","id":"h-122"},{"depth":2,"text":"6. 默认落地页 home_page（登录后 / 刷新根路径打开哪一页）","id":"h-123"},{"depth":2,"text":"7. 权限总开关 permission_enabled（一键关掉 RBAC）","id":"h-124"},{"depth":3,"text":"7.1 作用域","id":"h-125"},{"depth":3,"text":"7.2 配置方式","id":"h-126"},{"depth":3,"text":"7.3 关闭后行为","id":"h-127"},{"depth":3,"text":"7.4 安装器联动","id":"h-128"},{"depth":3,"text":"7.5 与 admin_require_permission 的关系","id":"h-129"},{"depth":2,"text":"8. 权限收紧：admin_require_permission（新项目建议开启）","id":"h-130"}],"allHeadings":[{"depth":1,"text":"菜单 · 权限 · 页面入口","id":"h-117"},{"depth":2,"text":"1. 菜单与页面入口","id":"h-118"},{"depth":2,"text":"2. 权限被拒不泄露内部结构（安全约定）","id":"h-119"},{"depth":2,"text":"3. 新建菜单「一键生成权限」","id":"h-120"},{"depth":2,"text":"4. 菜单行内「快速创建权限」","id":"h-121"},{"depth":2,"text":"5. URL 里只能传「已注册模型名」，猜不到别的表","id":"h-122"},{"depth":2,"text":"6. 默认落地页 home_page（登录后 / 刷新根路径打开哪一页）","id":"h-123"},{"depth":2,"text":"7. 权限总开关 permission_enabled（一键关掉 RBAC）","id":"h-124"},{"depth":3,"text":"7.1 作用域","id":"h-125"},{"depth":3,"text":"7.2 配置方式","id":"h-126"},{"depth":3,"text":"7.3 关闭后行为","id":"h-127"},{"depth":3,"text":"7.4 安装器联动","id":"h-128"},{"depth":3,"text":"7.5 与 admin_require_permission 的关系","id":"h-129"},{"depth":2,"text":"8. 权限收紧：admin_require_permission（新项目建议开启）","id":"h-130"}],"html":"\u003ch1 id=\"h-117\">菜单 · 权限 · 页面入口\u003c/h1>\n\u003cblockquote>\n\u003cp>菜单怎么建、path 填什么、权限怎么生成与校验、被拒时为什么不告诉你原因、登录后落到哪一页、\n以及两个权限开关（\u003ccode>permission_enabled\u003c/code> / \u003ccode>admin_require_permission\u003c/code>）的确切差别。\n登录 / 换登录方式见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"7\">认证与登录\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-118\">1. 菜单与页面入口\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>建菜单的两条路\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>后台界面\u003c/strong>（通用，推荐）：登录 → 「菜单管理」→ 新增，填 \u003ccode>title / path / icon / sort / type\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>命令行\u003c/strong>（宿主自带该命令时）：\u003ccode>php webman make:permission --name 页面名 --slug 唯一slug --type 1 --path &lt;path&gt; --icon &lt;el-icon名&gt; --sort n\u003c/code>，\n\u003ccode>--type 1\u003c/code> = 菜单页 / \u003ccode>2\u003c/code> = 容器 / \u003ccode>3\u003c/code> = 操作权限。⚠️ \u003ccode>make:permission\u003c/code> \u003cstrong>不在插件包里\u003c/strong>，\n是宿主侧命令（如 \u003ccode>webman-huafei-platform\u003c/code> 的 \u003ccode>app/command/MakePermissionCommand.php\u003c/code>）；\n你的宿主没有它就直接用后台界面，效果一致。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>path 取值\u003c/strong>：CURD 页 = registerMany key（\u003ccode>/mobile-recharge-orders\u003c/code>）；Schema/.vue 页 = \u003ccode>/custom-page/&lt;name&gt;\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>内置工具页\u003c/strong>：「配置生成器」\u003ccode>/curd-generator\u003c/code> 是安装时种进 \u003ccode>menus\u003c/code> 的固定菜单项（id=6，\u003ccode>permission\u003c/code> 为空）；\n生产环境（\u003ccode>generator_enabled=false\u003c/code>，默认跟随 \u003ccode>APP_DEBUG\u003c/code>）前端按 path 把它从菜单里过滤掉、\n直连被守卫拦回首页、后端接口 403，\u003cstrong>不需要你手动删菜单\u003c/strong>。详见 \u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考 §4.5\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>鉴权中间件\u003c/strong>：CURD 与 custom 路由都挂在统一 \u003ccode>CorsMiddleware + AuthCheck + PermissionCheck\u003c/code> 上。白名单段（仅需登录、不校验权限节点）：\u003ccode>/api/auth/\u003c/code>、\u003ccode>/api/menu\u003c/code>、\u003ccode>/api/curd/config\u003c/code>、\u003ccode>/api/admin/\u003c/code>、\u003ccode>/api/custom/\u003c/code>、\u003ccode>/api/schema/\u003c/code>（业务 Schema 数据接口段，白名单在 \u003ccode>app/middleware/PermissionCheck.php\u003c/code>）。\u003c/li>\n\u003cli>\u003cstrong>接口加密\u003c/strong>：请求/响应默认走 RSA+AES 信封（\u003ccode>ApiCrypto\u003c/code> 全局中间件，\u003ccode>X-Encrypt-Data\u003c/code> / \u003ccode>{data:...}\u003c/code>），前端 \u003ccode>request\u003c/code> 拦截器透明处理——\u003cstrong>DSL 层无感知\u003c/strong>。数据接口直接返回 \u003ccode>json([&#39;code&#39;=&gt;200,&#39;msg&#39;=&gt;&#39;ok&#39;,&#39;data&#39;=&gt;...])\u003c/code> 即可。\u003c/li>\n\u003cli>\u003cstrong>生效方式\u003c/strong>：\u003cul>\n\u003cli>新增/修改 PHP 类、路由、注册 → \u003ccode>php start.php restart\u003c/code>（改 config 与常驻内存类需重启；纯路由/页面内容 reload 亦可）；\u003c/li>\n\u003cli>Schema 页面类改内容、\u003ccode>.vue\u003c/code> 文件改内容 → 仅后端改文件，\u003cstrong>前端无需重新构建\u003c/strong>（协议运行时拉取）；\u003c/li>\n\u003cli>前端组件注册表/渲染器改动 → 走前端 dev（9528）或重新 \u003ccode>npm run build\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-119\">2. 权限被拒不泄露内部结构（安全约定）\u003c/h2>\n\u003cp>\u003ccode>PermissionCheck\u003c/code> 命中拒绝后\u003cstrong>统一只回一句\u003c/strong>，不回显 obj / act / 路径 / 需要哪个权限节点，避免给探测者画出权限地图：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{ &quot;code&quot;: 403, &quot;msg&quot;: &quot;没有权限操作，请联系管理员（编号 1739601a）&quot; }\n\u003c/code>\u003c/pre>\n\u003cp>细节全部写服务端日志（webman 原生 \u003ccode>support\\Log\u003c/code> → \u003ccode>runtime/logs/webman-YYYY-MM-DD.log\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode>[curd] 权限校验未通过 {...}\n  reason: rbac-denied            # 有权限节点但不匹配\n  user_id: 39  username: xxx\n  method: POST  path: /api/curd/model/HfGoods/add\n  need_perm: curd.HfGoods.add:*  ip: 1.2.3.4  trace: 1739601a\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>reason=unresolved-permission\u003c/code> 表示路径没能推导出 \u003ccode>obj:act\u003c/code>（控制器没注册进 \u003ccode>RouteControllerRegistry\u003c/code> / path 与注册 key 不一致）——那是\u003cstrong>配置问题\u003c/strong>，不是用户没权限。排查时拿页面上显示的「编号」去日志里 grep 即可。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-120\">3. 新建菜单「一键生成权限」\u003c/h2>\n\u003cp>后台「菜单管理 → 新增」里勾 \u003cstrong>「同时生成操作权限（一键生成）」\u003c/strong>，会在该菜单下批量创建 type=3 权限节点（不出现在侧边栏），省掉逐条手点。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>生成哪些\u003c/strong>：\u003ccode>list 列表 / add 新增 / update 编辑 / delete 删除 / batch-delete 批量删除 / export 导出\u003c/code>，可勾选子集；\u003c/li>\n\u003cli>\u003cstrong>前缀怎么来\u003c/strong>：① 表单里的「权限标识」 → ② 按 \u003ccode>path\u003c/code> 自动推导 \u003ccode>curd.{Model}\u003c/code>（选完 path 前端会实时预览「将生成的权限」）；\u003c/li>\n\u003cli>\u003cstrong>推导不出来\u003c/strong>（path 不是注册过的 CURD 页）→ \u003cstrong>不生成\u003c/strong>，接口返回 \u003ccode>warning\u003c/code> 提示手填权限标识后重试；\u003c/li>\n\u003cli>\u003cstrong>接口\u003c/strong>：\u003ccode>POST /api/menu\u003c/code>（\u003ccode>add\u003c/code> / \u003ccode>update\u003c/code> 都支持），额外字段 \u003ccode>gen_permissions=1\u003c/code>、\u003ccode>permission_ops=list,add,update\u003c/code>（不传 = 全部）；\u003c/li>\n\u003cli>\u003cstrong>幂等\u003c/strong>：已存在的 permission 直接跳过 → 老菜单可以「编辑时再勾一次」补生成；\u003c/li>\n\u003cli>\u003cstrong>预览接口\u003c/strong>：\u003ccode>GET /api/menu/permission/suggest?path=/hf-goods\u003c/code> → \u003ccode>{base:&#39;curd.HfGoods&#39;, ops:[{op,title,permission}]}\u003c/code>；\n行内快速创建传 \u003ccode>?parent_id=&lt;菜单id&gt;\u003c/code>，走的是与写入\u003cstrong>同一套\u003c/strong>前缀推导，保证「预览 = 实际写入」。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-121\">4. 菜单行内「快速创建权限」\u003c/h2>\n\u003cp>菜单/容器行末尾的 🔑 按钮（type=3 行不显示）：\u003cstrong>只输权限名\u003c/strong>就能建一个 type=3 权限节点，比走「新增菜单」快得多。\u003c/p>\n\u003cul>\n\u003cli>弹窗填「权限名」（如 \u003ccode>审核\u003c/code>、\u003ccode>audit\u003c/code>），可选「标识后缀」（留空按权限名生成：ASCII 转小写连字符、中文原样保留），并实时预览最终 \u003ccode>permission\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>前缀自动取\u003c/strong>：父菜单自身的 \u003ccode>permission\u003c/code>（如 \u003ccode>curd.HfGoods\u003c/code>）→ 否则取父菜单已有子权限的公共前缀 → 否则按父菜单 path 推导（预览值由 \u003ccode>GET /api/menu/permission/suggest?parent_id=\u003c/code> 下发，与写入规则一致）；\u003c/li>\n\u003cli>\u003cstrong>重名\u003c/strong>返回 400：\u003ccode>权限标识已存在：curd.HfGoods.audit\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>接口\u003c/strong>：\u003ccode>POST /api/menu/permission/quick\u003c/code>，参数 \u003ccode>parent_id\u003c/code>（必填，不能是 type=3 节点）、\u003ccode>name\u003c/code>（必填）、\u003ccode>slug\u003c/code>（可选）。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2 id=\"h-122\">5. URL 里只能传「已注册模型名」，猜不到别的表\u003c/h2>\n\u003cp>\u003ccode>/api/curd/model/{X}\u003c/code> 的 \u003ccode>{X}\u003c/code> \u003cstrong>不是表名\u003c/strong>，是 \u003ccode>ModelRegistry\u003c/code> 里的模型短类名（如 \u003ccode>HfGoods\u003c/code> → \u003ccode>app\\model\\HfGoods\u003c/code>，表名写在模型类里）。\n换个名字试探别的表的路子被三层堵死：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>传什么\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>已注册模型名（\u003ccode>HfAccoountWater\u003c/code>）\u003c/td>\n\u003ctd>200，正常返回（权限不足则 403）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>app/model 下\u003cstrong>存在\u003c/strong>的模型类（扫描/注册过，如 \u003ccode>AdminUser\u003c/code>）\u003c/td>\n\u003ctd>可解析，\u003cstrong>这是设计内\u003c/strong>；能不能出数据看权限（管理员 200 / 业务账号 403）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务库真实存在、但没有模型类也没登记的表（\u003ccode>admin_roles\u003c/code>、\u003ccode>hf_accoount_waters\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>{&quot;code&quot;:404,&quot;msg&quot;:&quot;模型 xxx 未注册&quot;}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>纯手写的名字（\u003ccode>NotExistThing\u003c/code>）\u003c/td>\n\u003ctd>同上 404\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>传表名\u003c/strong>（\u003ccode>admin_roles\u003c/code>）\u003c/td>\n\u003ctd>同上 404（表名一律不认）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>控制点在 \u003ccode>ModelRegistry::$allowDynamicResolve\u003c/code>（\u003cstrong>默认 false\u003c/strong>，收紧口径）：关着时只有\n①注册表里的模型 ②\u003ccode>app/model\u003c/code> 下真实存在的模型类 ③\u003ccode>dynamicAllowedTables\u003c/code>（启动时从 \u003ccode>curd_configs\u003c/code> 已登记的表灌入）能被解析；\n开了才会对未登记的表做「模型名 → 表名」反推 + eval 生成类。也就是说：\n\u003cstrong>页面能访问哪张表，取决于开发者建了多少模型/配了多少条 \u003ccode>curd_configs\u003c/code>，与数据库里有什么表无关。\u003c/strong>\u003c/p>\n\u003cp>即便模型名猜对了，仍要过 \u003ccode>PermissionCheck\u003c/code> 的 \u003ccode>curd.{模型}.{动作}\u003c/code> 校验（见 4.1），权限不足只回一句\n\u003ccode>{&quot;code&quot;:403,&quot;msg&quot;:&quot;没有权限操作，请联系管理员（编号 xxxxxx）&quot;}\u003c/code>。实测（huafei）：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>请求（账号 guangzhouzeqin，非 admin）\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>HfGoods\u003c/code> / \u003ccode>HfAccoountWater\u003c/code>（已授权）\u003c/td>\n\u003ctd>200，且\u003cstrong>按账号维度隔离\u003c/strong>（\u003ccode>account_id\u003c/code> 过滤，返回 0 条也正常）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AdminUser\u003c/code> / \u003ccode>AdminMenu\u003c/code> / \u003ccode>HfPlatformAccount\u003c/code>（未授权）\u003c/td>\n\u003ctd>403 一句带过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无 token\u003c/td>\n\u003ctd>401 未登录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>注意\u003c/strong>：\u003ccode>app/model\u003c/code> 下被扫描注册的模型都是「可访问的候选」，能不能进看权限。像 \u003ccode>AdminUser\u003c/code> 这类表\n管理员有 \u003ccode>p,admin,*,*\u003c/code> 全通权限，列表会\u003cstrong>原样带出 \u003ccode>password\u003c/code> 哈希\u003c/strong>——如果不想暴露，应在模型 \u003ccode>$hidden\u003c/code>\n里加 \u003ccode>password\u003c/code>，或在 \u003ccode>PermissionCheck\u003c/code> 侧不给普通角色该模型的权限。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-123\">6. 默认落地页 \u003ccode>home_page\u003c/code>（登录后 / 刷新根路径打开哪一页）\u003c/h2>\n\u003cp>后台根路径（\u003ccode>/app/curd/\u003c/code>、\u003ccode>/app/curd/?...\u003c/code>）以及\u003cstrong>每次登录成功\u003c/strong>，打开的页面都由宿主配置唯一决定（\u003ccode>?redirect=\u003c/code> 不参与，见下方口径表）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// config/curd-admin.php\n&#39;home_page&#39; =&gt; &#39;/custom-page/home&#39;,   // 相对路径，不带 /app/curd 前缀\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>取值来源（优先级）\u003c/td>\n\u003ctd>宿主 \u003ccode>config/curd-admin.php\u003c/code> 的 \u003ccode>home_page\u003c/code> → 同文件 \u003ccode>site.home_page\u003c/code> → 插件 \u003ccode>config/curd.php\u003c/code> 的 \u003ccode>home_page\u003c/code> → \u003ccode>/dashboard\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写法\u003c/td>\n\u003ctd>\u003ccode>/custom-page/home\u003c/code>、\u003ccode>custom-page/home\u003c/code> 都行（自动补前导斜杠、折叠重复斜杠）；也支持写完整 \u003ccode>http(s)://...\u003c/code>，此时前端整页跳转\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生效方式\u003c/td>\n\u003ctd>前端每次启动拉 \u003ccode>/api/config/site\u003c/code>（含 \u003ccode>home_page\u003c/code>），\u003cstrong>改配置 + \u003ccode>restart\u003c/code> 即可，无需重新构建前端\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面不存在时\u003c/td>\n\u003ctd>不阻断：该路径由通配路由交给 \u003ccode>CustomPageHost\u003c/code>，页面缺失时显示「页面加载失败」而不是白屏；配置项本身也不会回退成别的页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>与菜单/权限的关系\u003c/td>\n\u003ctd>\u003cstrong>只决定打开哪个页面\u003c/strong>，不要求用户菜单里有这一项；菜单里没有也能直接打开（这正是「哪怕菜单里没有也要打开默认页」的用法）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端缓存\u003c/td>\n\u003ctd>落地页会存一份 \u003ccode>localStorage.admin_home_page\u003c/code>，冷启动（刷新时接口还没回来）也能落对页；接口成功返回后会覆盖/清理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>也会影响这些地方（都用同一个 \u003ccode>getHomePath()\u003c/code>）：已登录访问 \u003ccode>/login\u003c/code>、标签栏「关闭所有 / 关闭最后一个标签」时的兜底跳转。\u003c/p>\n\u003cblockquote>\n\u003cp>顺带修掉一个老问题：前端 \u003ccode>utils/site.js\u003c/code> 原先按\u003cstrong>同名键\u003c/strong>拷贝后端字段，而后端是 \u003ccode>logo_type\u003c/code>、前端是 \u003ccode>logoType\u003c/code>，\n导致 \u003ccode>config/curd-admin.php\u003c/code> 里配 \u003ccode>logo_type\u003c/code> 一直不生效（永远按默认 icon 渲染）。现在加了 snake→camel 映射（\u003ccode>logo_type → logoType\u003c/code>、\u003ccode>home_page → homePage\u003c/code>）。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>唯一口径（v1.12.0 起）：登录成功一律打开 \u003ccode>home_page\u003c/code>，\u003ccode>?redirect=\u003c/code> 彻底不参与。\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>登录成功（无论从哪来）\u003c/td>\n\u003ctd>\u003ccode>router.push(home_page)\u003c/code>，\u003cstrong>完全不看\u003c/strong> \u003ccode>?redirect=\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未登录访问根路径 \u003ccode>/app/curd/\u003c/code>\u003c/td>\n\u003ctd>落到 \u003ccode>/app/curd/login\u003c/code>（\u003cstrong>不带任何参数\u003c/strong>）；登录后按当时配置的 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未登录访问子页 \u003ccode>/app/curd/hf-goods\u003c/code>\u003c/td>\n\u003ctd>同样落到 \u003ccode>/app/curd/login\u003c/code>（不再记录「原页」）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>token 失效（401 拦截）\u003c/td>\n\u003ctd>清 token 后跳 \u003ccode>/app/curd/login\u003c/code>（不带参数）；重新登录落 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已登录访问 \u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>回落 \u003ccode>home_page\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动敲 \u003ccode>/app/curd/dashboard\u003c/code> 等具体页\u003c/td>\n\u003ctd>照常直达，不受影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>为什么砍掉 \u003ccode>?redirect=\u003c/code>：把「要去的页」写进 URL，它就会长期存活在书签/浏览器历史里。\n之后把 \u003ccode>home_page\u003c/code> 从 \u003ccode>/custom-page/home\u003c/code> 改成 \u003ccode>/dashboard\u003c/code>，旧 URL 仍按旧值跳 —— 表现成「改了配置没生效」，\n排查成本极高（真实踩过）。代价是\u003cstrong>登录过期后重新登录会落到 \u003ccode>home_page\u003c/code>，而不是被打断的那一页\u003c/strong>，这是刻意的取舍。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>另外两点必须知道\u003c/strong>：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>未登录访问根路径不会带参数\u003c/strong>：根路径分支先 \u003ccode>await ensureSiteConfig()\u003c/code>（\u003ccode>/api/config/site\u003c/code> 免鉴权），\n未登录直接 \u003ccode>next({ path: &#39;/login&#39;, replace: true })\u003c/code>，登录后按「那一刻」的配置算落地页。\u003c/li>\n\u003cli>\u003cstrong>侧边栏「首页」菜单与 \u003ccode>home_page\u003c/code> 无关。\u003c/strong> 那是菜单表里的数据（huafei 里 \u003ccode>menus.id=1\u003c/code>，\u003ccode>path=/dashboard\u003c/code>），\n点它永远去 \u003ccode>/dashboard\u003c/code>。要让侧边栏「首页」也指向自定义页，改菜单那一行的 \u003ccode>path\u003c/code> 即可（纯数据改动，不用动代码）。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2 id=\"h-124\">7. 权限总开关 \u003ccode>permission_enabled\u003c/code>（一键关掉 RBAC）\u003c/h2>\n\u003ch3 id=\"h-125\">7.1 作用域\u003c/h3>\n\u003cp>\u003ccode>permission_enabled\u003c/code> 控制\u003cstrong>整条 RBAC 链\u003c/strong>的开关：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>值\u003c/th>\n\u003cth>PermissionCheck 中间件\u003c/th>\n\u003cth>登录/me 响应\u003c/th>\n\u003cth>安装器（api/Install.php）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>true\u003c/code>（默认）\u003c/td>\n\u003ctd>走 casbin 校验，推导 \u003ccode>obj:act\u003c/code>\u003c/td>\n\u003ctd>下发真实 \u003ccode>permissions\u003c/code>\u003c/td>\n\u003ctd>写 \u003ccode>g/user→admin\u003c/code> + \u003ccode>p,admin,*,*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>直接放行（不再 403）\u003c/td>\n\u003ctd>\u003ccode>permissions=[]\u003c/code> 且响应带 \u003ccode>permission_enabled:false\u003c/code>\u003c/td>\n\u003ctd>不写任何 \u003ccode>casbin_rule\u003c/code>（不产生权限数据）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-126\">7.2 配置方式\u003c/h3>\n\u003cpre>\u003ccode class=\"language-php\">// 宿主 config/curd-admin.php\nreturn [\n    // ...\n    &#39;permission_enabled&#39; =&gt; false, // false = 所有人放行（仅登录即可），不写/true = 走 RBAC\n];\n\u003c/code>\u003c/pre>\n\u003cp>同样改完需\u003cstrong>重载 worker\u003c/strong> 生效。\u003c/p>\n\u003ch3 id=\"h-127\">7.3 关闭后行为\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>PermissionCheck\u003c/code> 顶部 \u003ccode>if (!$this-&gt;permissionEnabled()) return $handler($request);\u003c/code> —— 任何路径都直接放行，\n\u003ccode>{&quot;code&quot;:403,&quot;msg&quot;:&quot;没有权限操作...&quot;}\u003c/code> 不再出现。\u003c/li>\n\u003cli>登录与 \u003ccode>/api/auth/me\u003c/code> 返回的 \u003ccode>permissions\u003c/code> 为空数组，并附带 \u003ccode>permission_enabled: false\u003c/code> 字段，\n\u003cstrong>供前端判断\u003c/strong>（例如隐藏「无权限」提示、放开全部菜单）。\u003c/li>\n\u003cli>\u003cstrong>登录认证仍然生效\u003c/strong>：必须登录（带有效 token），只是不做权限分级。\u003c/li>\n\u003cli>想恢复 RBAC：把值改回 \u003ccode>true\u003c/code> 并重载即可，无需其他操作。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"h-128\">7.4 安装器联动\u003c/h3>\n\u003cp>\u003ccode>plugin/curd/api/Install.php\u003c/code> 在种子 admin 账号时，对 \u003ccode>casbin_rule\u003c/code> 的写入受开关保护：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// 权限总开关关闭时不产生任何权限（g/admin、p,admin,*,* 均跳过）\nif ($this-&gt;permissionEnabled()) {\n    // 写 g&lt;userId,admin&gt; 与 p&lt;admin,*,*&gt;\n}\n\u003c/code>\u003c/pre>\n\u003cp>即：在 \u003ccode>permission_enabled=false\u003c/code> 状态下执行安装/升级，数据库里\u003cstrong>不会留下任何 casbin 策略\u003c/strong>，\n避免日后改回 \u003ccode>true\u003c/code> 时残留脏数据。\u003c/p>\n\u003ch3 id=\"h-129\">7.5 与 \u003ccode>admin_require_permission\u003c/code> 的关系\u003c/h3>\n\u003cp>两者正交，互不影响：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>permission_enabled\u003c/code>（\u003ccode>config/curd-admin.php\u003c/code>）：总开关，\u003cstrong>关掉 = 全部放行\u003c/strong>。\u003c/li>\n\u003cli>\u003ccode>admin_require_permission\u003c/code>（\u003ccode>.env\u003c/code> 的 \u003ccode>CURD_ADMIN_REQUIRE_PERMISSION\u003c/code>）：仅控制 \u003ccode>/api/admin/*\u003c/code>\n（用户/角色/个人中心）是否强制 RBAC 校验；默认 \u003ccode>false\u003c/code>（仅登录即可），新项目建议设 \u003ccode>true\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>permission_enabled=false\u003c/code> 时，\u003ccode>admin_require_permission\u003c/code> 无论设什么都不再生效（总开关已放行）。\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-130\">8. 权限收紧：\u003ccode>admin_require_permission\u003c/code>（新项目建议开启）\u003c/h2>\n\u003cp>\u003ccode>/api/admin/*\u003c/code>（用户增删改、角色授权）默认\u003cstrong>仅要求登录\u003c/strong>即可访问（与历史行为一致）。\n新项目可在 \u003ccode>.env\u003c/code> 加一行收紧：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">CURD_ADMIN_REQUIRE_PERMISSION = true\n\u003c/code>\u003c/pre>\n\u003cp>开启后 \u003ccode>/api/admin/*\u003c/code> 走 casbin 校验，权限标识由路径推导\n（\u003ccode>/api/admin/users\u003c/code> → \u003ccode>obj=admin\u003c/code>、\u003ccode>act=users\u003c/code>）：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>admin\u003c/code> 角色有 \u003ccode>p,admin,*,*\u003c/code> 通配策略 → 不受影响\u003c/li>\n\u003cli>其余角色默认 403（响应体 \u003ccode>{&quot;code&quot;:403,...}\u003c/code>，HTTP 仍 200，与项目既有风格一致）\u003c/li>\n\u003cli>授权方式：在「角色管理」勾选，或直接写 casbin_rule\n\u003ccode>INSERT INTO casbin_rule (ptype,v0,v1,v2) VALUES (&#39;p&#39;,&#39;yunying&#39;,&#39;admin&#39;,&#39;users&#39;);\u003c/code>\u003c/li>\n\u003cli>\u003ccode>/api/auth/*\u003c/code>、\u003ccode>/api/menu\u003c/code>、\u003ccode>/api/curd/config\u003c/code>、\u003ccode>/api/custom/*\u003c/code> 仍在白名单（仅登录）\u003c/li>\n\u003c/ul>\n"},{"file":"13-认证与登录.md","title":"认证与登录","section":"guide","sectionName":"使用指南","mtime":"2026/10/18 07:35:34","headings":[{"depth":2,"text":"1. 配置总览","id":"h-132"},{"depth":2,"text":"2. 换登录来源：auth_provider","id":"h-133"},{"depth":3,"text":"2.1 原理","id":"h-134"},{"depth":3,"text":"2.2 接口方法","id":"h-135"},{"depth":3,"text":"2.3 身份数组约定（login / identity 返回形状）","id":"h-136"},{"depth":3,"text":"2.4 自定义示例：换一张表（my_users）","id":"h-137"},{"depth":3,"text":"2.5 接入步骤","id":"h-138"},{"depth":3,"text":"2.6 注意事项","id":"h-139"},{"depth":3,"text":"2.7 只加一层状态判定：auth_state_guard","id":"h-140"},{"depth":2,"text":"3. 接管整个登录接口：login_handler","id":"h-141"},{"depth":2,"text":"4. 登录图形验证码与「记住账号」","id":"h-142"},{"depth":2,"text":"5. 端到端验证示例","id":"h-143"}],"allHeadings":[{"depth":1,"text":"认证与登录","id":"h-131"},{"depth":2,"text":"1. 配置总览","id":"h-132"},{"depth":2,"text":"2. 换登录来源：auth_provider","id":"h-133"},{"depth":3,"text":"2.1 原理","id":"h-134"},{"depth":3,"text":"2.2 接口方法","id":"h-135"},{"depth":3,"text":"2.3 身份数组约定（login / identity 返回形状）","id":"h-136"},{"depth":3,"text":"2.4 自定义示例：换一张表（my_users）","id":"h-137"},{"depth":3,"text":"2.5 接入步骤","id":"h-138"},{"depth":3,"text":"2.6 注意事项","id":"h-139"},{"depth":3,"text":"2.7 只加一层状态判定：auth_state_guard","id":"h-140"},{"depth":2,"text":"3. 接管整个登录接口：login_handler","id":"h-141"},{"depth":2,"text":"4. 登录图形验证码与「记住账号」","id":"h-142"},{"depth":2,"text":"5. 端到端验证示例","id":"h-143"}],"html":"\u003ch1 id=\"h-131\">认证与登录\u003c/h1>\n\u003cblockquote>\n\u003cp>三种不同力度的自定义登录（\u003ccode>auth_provider\u003c/code> / \u003ccode>login_handler\u003c/code> / 自己注册路由）、\n叠加一层账号可用性判定（\u003ccode>auth_state_guard\u003c/code>）、登录图形验证码与「记住账号」。\n权限与菜单见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"6\">菜单与权限\u003c/a>；配置键的完整清单见\u003ca href=\"#\" class=\"doc-link\" data-doc-jump=\"3\">配置参考\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"h-132\">1. 配置总览\u003c/h2>\n\u003cp>宿主 \u003ccode>config/curd-admin.php\u003c/code>（首次 \u003ccode>composer require\u003c/code> 由 \u003ccode>src/Install.php\u003c/code> 自动生成；未生成可手动 \u003ccode>return [...]\u003c/code>）：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\nreturn [\n    // 登录提供方（可插拔）：实现 AuthProviderInterface 的类名\n    &#39;auth_provider&#39; =&gt; \\plugin\\curd\\app\\auth\\DefaultAuthProvider::class,\n\n    // 账号状态判定（可选）：实现 AuthStateGuardInterface 的类名；留空 = 不启用\n    // &#39;auth_state_guard&#39; =&gt; \\app\\auth\\MyGuard::class,\n\n    // 权限总开关：true=走 RBAC；false=所有人放行（仅登录即可）\n    &#39;permission_enabled&#39; =&gt; true,\n\n    // （下方为其他既有配置，省略）\n    // &#39;admin_connection&#39; =&gt; &#39;mysql&#39;,\n    // &#39;business_connection&#39; =&gt; &#39;mysql_business&#39;,\n    // ...\n];\n\u003c/code>\u003c/pre>\n\u003cp>读取优先级（高 → 低）：宿主 \u003ccode>config/curd-admin.php\u003c/code> 顶层同名键 → 插件 \u003ccode>config/curd.php\u003c/code> 默认值。\n即：\u003cstrong>任何一项不写，都自动回退到插件默认值，向后兼容。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch2 id=\"h-133\">2. 换登录来源：\u003ccode>auth_provider\u003c/code>\u003c/h2>\n\u003ch3 id=\"h-134\">2.1 原理\u003c/h3>\n\u003cp>登录链路被抽象成一个契约 \u003ccode>plugin\\curd\\app\\auth\\AuthProviderInterface\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode>请求 → AuthController::login()\n        ↓ 调 $this-&gt;authProvider()-&gt;login($credentials)\n     你的 AuthProvider（或 DefaultAuthProvider）\n        ↓ 成功返回「身份数组」/ 失败返回 null\n     插件统一：签发 token + 写 admin_tokens + 组装响应\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>AuthController\u003c/code> / \u003ccode>AuthCheck\u003c/code> / \u003ccode>PermissionCheck\u003c/code> 通过共享 trait\n\u003ccode>plugin\\curd\\app\\auth\\AuthProviderAware\u003c/code> 拿到「当前生效的提供方」，保证判定逻辑只有一份：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">// plugin/curd/app/auth/AuthProviderAware.php（节选）\nprotected function authProvider(): AuthProviderInterface\n{\n    $cls = config(&#39;plugin.curd.curd.auth_provider&#39;, DefaultAuthProvider::class);\n    if (is_string($cls) &amp;&amp; class_exists($cls)) {\n        $inst = new $cls();\n        if ($inst instanceof AuthProviderInterface) {\n            return $inst;\n        }\n    }\n    return new DefaultAuthProvider(); // 类名无效/未实现接口 → 回退默认\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-135\">2.2 接口方法\u003c/h3>\n\u003cp>实现 \u003ccode>plugin\\curd\\app\\auth\\AuthProviderInterface\u003c/code> 必须提供四个方法：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>签名\u003c/th>\n\u003cth>职责\u003c/th>\n\u003cth>返回 null 的含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>login\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>login(array $credentials): ?array\u003c/code>\u003c/td>\n\u003ctd>校验账号密码\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 凭据错误（插件统一回 401）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>identity\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>identity($id): ?array\u003c/code>\u003c/td>\n\u003ctd>按 user id 取完整身份（\u003ccode>/api/auth/me\u003c/code> 用）\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 用户不存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>resolveUser\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>resolveUser($id): ?object\u003c/code>\u003c/td>\n\u003ctd>按 user id 还原用户对象（\u003ccode>AuthCheck\u003c/code> 填充 \u003ccode>$request-&gt;user\u003c/code>）\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> = 用户不存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>logout\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>logout(Request $request): void\u003c/code>\u003c/td>\n\u003ctd>退出时回调（清外部会话等）\u003c/td>\n\u003ctd>无需返回值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"h-136\">2.3 身份数组约定（login / identity 返回形状）\u003c/h3>\n\u003cp>\u003ccode>login()\u003c/code> 与 \u003ccode>identity()\u003c/code> 返回的数组\u003cstrong>必须\u003c/strong>含以下键：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>键\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>必填\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>int | string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>会被写入 \u003ccode>admin_tokens.admin_user_id\u003c/code>；\u003ccode>resolveUser()\u003c/code> 入参必须与之对应（建议数值型）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>username\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>登录名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>name\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>展示名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\n\u003ctd>int\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> = 启用；非 \u003ccode>1\u003c/code> 由插件统一报 403「账号已被禁用」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>avatar\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>头像 URL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>email\u003c/code>\u003c/td>\n\u003ctd>string\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>邮箱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>roles\u003c/code>\u003c/td>\n\u003ctd>array\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>角色 slug 数组（如 \u003ccode>[&#39;editor&#39;]\u003c/code>），前端/业务自定义消费\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>permissions\u003c/code>\u003c/td>\n\u003ctd>array\u003c/td>\n\u003ctd>⬜\u003c/td>\n\u003ctd>权限项数组；\u003cstrong>建议留空\u003c/strong>——权限由插件/权限开关统一决定，不要在这里自己造权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>约定补充：\u003ccode>resolveUser()\u003c/code> 返回的对象须含属性 \u003ccode>id / username / name / status / avatar\u003c/code>，\n且 \u003ccode>status === 1\u003c/code> 才放行（否则 \u003ccode>AuthCheck\u003c/code> 报 403）。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"h-137\">2.4 自定义示例：换一张表（my_users）\u003c/h3>\n\u003cp>下面把登录从 \u003ccode>admin_users\u003c/code> 换成业务表 \u003ccode>my_users\u003c/code>，并改用明文密码校验：\u003c/p>\n\u003cpre>\u003ccode class=\"language-php\">&lt;?php\n// 宿主 app/auth/MyAuthProvider.php\nnamespace app\\auth;\n\nuse plugin\\curd\\app\\auth\\AuthProviderInterface;\nuse support\\Db;\nuse support\\Request;\n\nclass MyAuthProvider implements AuthProviderInterface\n{\n    public function login(array $c): ?array\n    {\n        $username = (string)($c[&#39;username&#39;] ?? &#39;&#39;);\n        $password = (string)($c[&#39;password&#39;] ?? &#39;&#39;);\n        if ($username === &#39;&#39; || $password === &#39;&#39;) {\n            return null;\n        }\n\n        $user = Db::table(&#39;my_users&#39;)-&gt;where(&#39;username&#39;, $username)-&gt;first();\n        // 换成你自己的校验逻辑：明文 / password_verify / LDAP / OAuth / 外部 API 均可\n        if (!$user || $user-&gt;password !== $password) {\n            return null;\n        }\n        if ((int)($user-&gt;status ?? 1) !== 1) {\n            return null; // 禁用 → 插件统一报 403\n        }\n\n        return [\n            &#39;id&#39;          =&gt; $user-&gt;id,                 // 会写进 admin_tokens.admin_user_id\n            &#39;username&#39;    =&gt; $user-&gt;username,\n            &#39;name&#39;        =&gt; $user-&gt;name,\n            &#39;status&#39;      =&gt; (int)$user-&gt;status,\n            &#39;avatar&#39;      =&gt; $user-&gt;avatar ?? &#39;&#39;,\n            &#39;email&#39;       =&gt; $user-&gt;email ?? &#39;&#39;,\n            &#39;roles&#39;       =&gt; [&#39;editor&#39;],                // 自定义角色 slug\n            &#39;permissions&#39; =&gt; [],                        // 交给插件/权限开关，勿自造\n        ];\n    }\n\n    public function identity($id): ?array\n    {\n        $user = Db::table(&#39;my_users&#39;)-&gt;where(&#39;id&#39;, $id)-&gt;first();\n        if (!$user) {\n            return null;\n        }\n        return [\n            &#39;id&#39;       =&gt; $user-&gt;id,\n            &#39;username&#39; =&gt; $user-&gt;username,\n            &#39;name&#39;     =&gt; $user-&gt;name,\n            &#39;status&#39;   =&gt; (int)$user-&gt;status,\n            &#39;avatar&#39;   =&gt; $user-&gt;avatar ?? &#39;&#39;,\n            &#39;email&#39;    =&gt; $user-&gt;email ?? &#39;&#39;,\n            &#39;roles&#39;    =&gt; [&#39;editor&#39;],\n            &#39;permissions&#39; =&gt; [],\n        ];\n    }\n\n    public function resolveUser($id): ?object\n    {\n        // 返回的对象须含 id/username/name/status/avatar\n        return Db::table(&#39;my_users&#39;)-&gt;where(&#39;id&#39;, $id)-&gt;first();\n    }\n\n    public function logout(Request $request): void\n    {\n        // 可在此清理外部会话（SSO/LDAP）；无需额外清理时留空\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"h-138\">2.5 接入步骤\u003c/h3>\n\u003col>\n\u003cli>在宿主 \u003ccode>app/auth/\u003c/code> 下写 \u003ccode>MyAuthProvider.php\u003c/code>（实现 \u003ccode>AuthProviderInterface\u003c/code>）。\u003c/li>\n\u003cli>在宿主 \u003ccode>config/curd-admin.php\u003c/code> 加一行指向它：\u003cpre>\u003ccode class=\"language-php\">&#39;auth_provider&#39; =&gt; \\app\\auth\\MyAuthProvider::class,\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003cli>\u003cstrong>重载 worker\u003c/strong>（配置是启动时加载的，改完要生效）：\u003cul>\n\u003cli>webman：\u003ccode>php start.php restart\u003c/code> 或向主进程发 \u003ccode>SIGUSR1\u003c/code> 平滑重载；\u003c/li>\n\u003cli>容器/supervisor 管理下重启对应进程。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>验证：\u003ccode>POST /api/auth/login\u003c/code> 用 \u003ccode>my_users\u003c/code> 里的账号登录，应返回 200 + token；\n再 \u003ccode>GET /api/auth/me\u003c/code>（带 \u003ccode>Authorization: Bearer &lt;token&gt;\u003c/code>）应正确还原该用户。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"h-139\">2.6 注意事项\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>login()\u003c/code> 的 \u003ccode>id\u003c/code> 与 \u003ccode>resolveUser()\u003c/code> 入参
