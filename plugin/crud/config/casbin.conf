# casbin RBAC 模型配置
# 权限模型:角色 -> 权限(资源:操作)
# 校验规则:admin 用户拥有全部权限(用 g 超级角色)
# keyMatch: 支持 * 通配符(r.obj == p.obj, p.obj='*' 匹配任意)

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && keyMatch(r.act, p.act)
